# Aplica as migrations e a carga da BKM no banco do Supabase, numa transação só (tudo ou nada).
# Até o primeiro uso, o banco é o próprio BKM_Desenvolvimento_Imobiliario (CLAUDE.md, Ambientes › Banco):
# só os esquemas app e fluxo, nunca o public. Recusa rodar se o esquema app já existe.
#
# Precisa do segredo SUPABASE_DB_URL no repositório (Settings › Secrets and variables › Actions):
# a cadeia de conexão do Supabase (botão Connect › Session pooler), com a senha do banco.
# Dispara pelo botão "Run workflow" (quando o arquivo estiver na main) ou por um push cuja
# mensagem de commit tenha [aplicar-banco].
name: Banco no Supabase
on:
  workflow_dispatch:
  push:

jobs:
  aplicar:
    name: Aplicar migrations e carga
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aplicar-banco]')
    runs-on: ubuntu-24.04
    env:
      DB: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o segredo e o banco
        run: |
          test -n "$DB" || { echo "::error::Falta o segredo SUPABASE_DB_URL"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          existe=$(psql "$DB" -tAc "select count(*) from pg_namespace where nspname in ('app','fluxo')")
          echo "esquemas app/fluxo já existentes: $existe"
          test "$existe" = "0" || { echo "::error::O esquema app ou fluxo já existe; para recriar, apague antes (só com o ok do Moisés)."; exit 1; }
      - name: Aplicar (uma transação)
        run: |
          args=()
          for f in supabase/migrations/*.sql; do args+=(-f "$f"); done
          psql "$DB" -v ON_ERROR_STOP=1 --single-transaction -q "${args[@]}" -f supabase/carga/bkm.sql
      - name: Conferir
        run: |
          psql "$DB" -c "select (select count(*) from pg_tables where schemaname = 'app') as tabelas_app,
                               (select count(*) from pg_tables where schemaname = 'fluxo') as tabelas_fluxo,
                               (select count(*) from app.equipe_prevista) as equipe_prevista,
                               (select string_agg(dominio, ', ') from app.empresa_dominios) as dominios,
                               (select count(*) from cron.job) as rotinas"
