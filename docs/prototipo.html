<title>BKM Terrenos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Nothing+You+Could+Do&display=swap">
<style>
/* Layout: Google-style app shell. Top bar with search, left nav rail (bottom bar on phones), white work surfaces on a cool blue-grey ground. BKM navy + brand blue. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#edf1f7; --surface-3:#e1e7f0; --line:#dce2eb;
  --ink:#15203a; --ink-2:#525d75; --ink-3:#848fa5;
  --navy:#1d2e5c; --accent:#0094fe; --accent-ink:#0a6cc9; --accent-soft:#e1f0ff; --btn:#0a7de3; --on-accent:#ffffff;
  --good:#1a8248; --good-soft:#e2f3e8; --warn:#9c5700; --warn-soft:#fcefd9; --crit:#c5302a; --crit-soft:#fbe7e5;
  --av1:#deafa1; --av2:#ccd3a7; --av3:#cececc; --av4:#e8eed2; --av-ink:#1d2e5c;
  --scrim:rgba(13,20,38,.45);
  --shadow:0 1px 2px rgba(21,32,58,.06),0 2px 8px rgba(21,32,58,.07);
  --shadow-2:0 2px 6px rgba(21,32,58,.10),0 10px 28px rgba(21,32,58,.12);
  --font:"Aptos","Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Nothing You Could Do","Segoe Script",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1423; --surface:#141c2f; --surface-2:#1a2440; --surface-3:#243051; --line:#27334f;
  --ink:#e7ecf6; --ink-2:#a2adc3; --ink-3:#6d7994;
  --navy:#cdd8f3; --accent:#2fa7ff; --accent-ink:#72bfff; --accent-soft:#12304f; --btn:#2fa7ff; --on-accent:#05203c;
  --good:#53c58a; --good-soft:#12301f; --warn:#f0a54a; --warn-soft:#33240c; --crit:#ff8077; --crit-soft:#3a1818;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1423; --surface:#141c2f; --surface-2:#1a2440; --surface-3:#243051; --line:#27334f;
  --ink:#e7ecf6; --ink-2:#a2adc3; --ink-3:#6d7994;
  --navy:#cdd8f3; --accent:#2fa7ff; --accent-ink:#72bfff; --accent-soft:#12304f; --btn:#2fa7ff; --on-accent:#05203c;
  --good:#53c58a; --good-soft:#12301f; --warn:#f0a54a; --warn-soft:#33240c; --crit:#ff8077; --crit-soft:#3a1818;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500}
h1{font-size:24px;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
.hand{font-family:var(--hand);font-weight:400;color:var(--accent-ink);font-size:1.15em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{height:64px;display:flex;align-items:center;gap:16px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:none;background:none;border:0;padding:0;color:var(--ink)}
.brand svg{width:30px;height:30px}
.wordmark{font-weight:700;font-size:23px;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.wordmark .k{background:linear-gradient(180deg,#19c2ff,#0f5fd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sep{width:1px;height:22px;background:var(--line)}
.brand-prod{font-size:18px;color:var(--ink-2)}
.search{flex:1;max-width:620px;margin-left:28px;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;background:var(--surface-2);border-radius:24px;border:1px solid transparent;color:var(--ink-2)}
.search:focus-within{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;font-size:15px;color:var(--ink)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-pill{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:12px;white-space:nowrap;font-weight:500}
.seg{display:flex;background:var(--surface-2);border-radius:20px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:16px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--av-ink);flex:none;border:0;padding:0}
.avatar.sm{width:24px;height:24px;font-size:10px}

/* shell */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 64px);padding-block:16px;padding-right:12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.compose{display:inline-flex;align-items:center;gap:12px;height:54px;padding:0 22px 0 18px;border-radius:16px;border:0;background:var(--accent-soft);color:var(--ink);font-weight:600;font-size:14px;margin-bottom:12px;align-self:flex-start;transition:box-shadow .15s}
.compose:hover{box-shadow:var(--shadow)}
.compose .ic{color:var(--accent-ink)}
.nav-item{display:flex;align-items:center;gap:14px;height:44px;padding:0 16px;border-radius:22px;border:0;background:none;width:100%;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item .cnt{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums}
.nav-item .cnt.alert{color:var(--crit);font-weight:700}
.side-foot{margin-top:auto;padding:12px 16px;font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:500;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.main{padding-block:24px 56px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;border:0;background:none;color:var(--ink-2);font-size:12px;font-weight:500}
.bnav .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.bnav button[aria-current="page"]{color:var(--ink);font-weight:600}
.bnav button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent-ink)}
.bnav .badge{position:absolute;top:2px;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:var(--surface);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.fab{display:none;position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:var(--shadow-2);align-items:center;gap:10px}
.fab .ic{color:var(--accent-ink)}

/* page scaffolding */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h .sub{margin-top:4px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 0}
.card-b{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-6040{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 18px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--accent-ink);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:disabled{background:var(--surface-3);border-color:var(--surface-3);color:var(--ink-3);cursor:not-allowed;filter:none}
.btn.text{border-color:transparent;background:transparent}
.btn.text:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.blue{background:var(--accent-soft);color:var(--accent-ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.fchip:hover{background:var(--surface-2)}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.fchip .n{font-variant-numeric:tabular-nums;opacity:.8}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.kpi:hover{box-shadow:var(--shadow)}
.kpi .v{font-size:30px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:132px minmax(0,1fr) 28px;align-items:center;gap:12px;border:0;background:none;padding:2px 0;text-align:left}
.frow .fl{font-size:13px;color:var(--ink-2)}
.frow .ft{height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.frow .fb{height:100%;background:var(--accent);border-radius:6px;opacity:.85;min-width:4px}
.frow.won .fb{background:var(--good)}
.frow .fn{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.funnel-foot{margin-top:12px;font-size:13px;color:var(--ink-2);display:flex;gap:16px;flex-wrap:wrap}

/* lists */
.alist{display:flex;flex-direction:column}
.aitem{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.aitem:first-child{border-top:0}
.aitem:hover{background:var(--surface-2)}
.aitem .ai{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.ai.crit{background:var(--crit-soft);color:var(--crit)} .ai.warn{background:var(--warn-soft);color:var(--warn)} .ai.blue{background:var(--accent-soft);color:var(--accent-ink)} .ai.good{background:var(--good-soft);color:var(--good)}
.aitem .at{font-weight:500} .aitem .as{font-size:13px;color:var(--ink-2)}
.aitem .when{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:8px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}

/* table-like rows */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tr{display:grid;grid-template-columns:76px minmax(0,2.2fr) 92px 78px 112px 150px 34px;align-items:center;gap:16px;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.tr:first-child{border-top:0}
button.tr:hover{background:var(--surface-2)}
.tr.th{font-size:12px;color:var(--ink-3);font-weight:500;padding-block:10px;background:var(--surface)}
.tr .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t2{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .r{text-align:right}
.tr .meta-sm{display:none}
.tr.docs{grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 120px 110px 70px}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;align-items:flex-start}
.col{flex:0 0 268px;background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 2px;font-weight:600;font-size:13px}
.col-h .n{color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.kcard:hover{box-shadow:var(--shadow)}
.kcard .kt{font-weight:600}
.kcard .ks{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .kr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.kcard .flags{display:flex;gap:4px;align-items:center}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600}
.flag.crit{color:var(--crit)} .flag.warn{color:var(--warn)}
.col-empty{font-size:12px;color:var(--ink-3);padding:8px;text-align:center}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;margin:-6px 0 12px -10px;height:36px;padding:0 12px 0 8px;border-radius:18px;border:0;background:none;color:var(--ink-2);font-weight:500}
.back:hover{background:var(--surface-2)}
.eyebrow{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:500;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.dhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.dhead h1{font-size:26px}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stepper{list-style:none;margin:0;padding:16px;display:flex;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;flex:1 0 auto}
.step:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--line);min-width:14px;margin:0 8px}
.step.done::after{background:var(--accent)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.done .dot{background:var(--accent);color:var(--on-accent)}
.cur .dot{background:var(--surface);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.sl{font-size:13px;color:var(--ink-3);white-space:nowrap}
.cur .sl{color:var(--ink);font-weight:600}
.done .sl{color:var(--ink-2)}
.adv{border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.adv .req{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 320px}
.adv .req .rt{font-weight:600;font-size:13px}
.adv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.adv li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.adv li .ic{margin-top:1px}
.adv .ok{color:var(--good)} .adv .no{color:var(--crit)}
.adv .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px}
.banner.crit{background:var(--crit-soft)} .banner.warn{background:var(--warn-soft)} .banner.good{background:var(--good-soft)} .banner.blue{background:var(--accent-soft)}
.banner .bt{font-weight:600}
.banner .ic{margin-top:1px}
.banner.crit .ic{color:var(--crit)} .banner.warn .ic{color:var(--warn)} .banner.good .ic{color:var(--good)} .banner.blue .ic{color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin:20px 0 16px}
.tab{padding:12px 14px;border:0;background:none;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:4px 4px 0 0;display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tab .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;margin:0}
dl.kv dt{color:var(--ink-2);font-size:13px}
dl.kv dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;min-width:0}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metric .ml{font-size:12px;color:var(--ink-2)}
.metric .mv{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.vsbar{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.vsbar .track{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.vsbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.vsbar .fill.over{background:var(--warn)}
.vsbar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.vsbar .lg{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}

.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:18px;height:18px;accent-color:var(--btn);flex:none}
.task .tt{flex:1;min-width:0}
.task.done .tt .t1{text-decoration:line-through;color:var(--ink-3)}
.task .tm{font-size:12px;color:var(--ink-2)}
.task .tm.late{color:var(--crit);font-weight:600}

.prop{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;padding:16px;border-top:1px solid var(--line);align-items:start}
.prop:first-child{border-top:0}
.prop .pv{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;color:var(--ink-2);font-size:13px}
.prop.nos .pv{background:var(--accent-soft);color:var(--accent-ink)}
.prop .pval{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.prop .pmeta{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.prop .pcond{font-size:13px;margin-top:6px}
.prop .pside{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.chk-group{padding:4px 0}

/* completude: campos que importam para decidir a compra */
function completude(t){
  const c=[
    ['Endereço completo',!!(t.logradouro&&t.numero&&t.bairro),'cadastro','loc'],
    ['Zona',!!t.zona,'cadastro','loc'],
    ['Ponto no mapa',t.lat!=null,'cadastro','loc'],
    ['Área adotada',areaAdotada(t)!=null,'cadastro','areas'],
    ['Testada',t.testada!=null,'cadastro','areas'],
    ['Topografia',t.topografia!=='nao_informado','cadastro','fis'],
    ['Ocupação',t.ocupacao!=='nao_informado','cadastro','fis'],
    ['Matrícula',t.mats.length>0,'cadastro','mats'],
    ['Inscrição e IPTU',t.insc.length>0,'cadastro','insc'],
    ['Proprietário',t.pessoas.some(p=>p.papel==='proprietario'),'cadastro','pessoas'],
    ['Zoneamento',!!analiseVig(t),'urbanismo',null],
    ['Infraestrutura',infraNV(t)===0,'urbanismo',null],
    ['Valor pedido',!!ofertaRef(t)?.valor,'comercial',null],
    ['Temperatura',!!t.neg?.temp,'comercial',null]];
  const ok=c.filter(x=>x[1]).length;
  return {pct:Math.round(ok/c.length*100),faltam:c.filter(x=>!x[1])};
}

function secaoConfr(t){
  const tot=t.confr.reduce((a,c)=>a+(c.m||0),0);
  return `<section class="sec" id="sec-confr"><div class="sec-h"><h2>Confrontações</h2><span class="faint" style="font-size:13px">${t.confr.length?`${t.confr.length} segmentos · perímetro ${num(tot,2)} m`:''}</span></div><div class="sec-b">
    ${t.confr.length?`<div class="tblwrap"><table class="mini-tbl"><thead><tr><th>#</th><th>Segmento</th><th class="r">Comprimento</th><th>Confronta com</th><th></th></tr></thead><tbody>${t.confr.map((c,i)=>`<tr><td class="faint">${i+1}</td><td>${OPT.confr[c.tipo]}</td><td class="r">${num(c.m,2)} m</td><td>${esc(c.conf||'—')}</td><td class="r"><button class="btn sm text danger" data-a="del-confr" data-i="${i}">Remover</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Para terrenos irregulares ou com várias frentes: um segmento por linha, na ordem do perímetro.</div>'}
    <form class="inline-form" data-form="confr"><div class="field" style="flex:0 1 160px"><label for="cf-t">Segmento</label><select id="cf-t" name="tipo">${Object.entries(OPT.confr).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
    <div class="field" style="flex:0 1 120px"><label for="cf-m">Comprimento (m)</label><input id="cf-m" name="m" inputmode="decimal" required></div><div class="field grow"><label for="cf-c">Confronta com</label><input id="cf-c" name="conf" placeholder="Rua, lote vizinho, matrícula"></div><button class="btn sm">${ic('add',16)}Adicionar</button></form></div></section>`;
}
function secaoPessoas(t){
  return `<section class="sec" id="sec-pessoas"><div class="sec-h"><h2>Proprietários e contatos</h2></div><div class="sec-b">
    ${t.pessoas.length?`<div class="tblwrap"><table class="mini-tbl"><thead><tr><th>Nome</th><th>Vínculo</th><th class="r">Participação</th><th>Telefone</th><th></th></tr></thead><tbody>${t.pessoas.map((p,i)=>`<tr><td>${esc(p.nome)} <span class="faint" style="font-size:12px">${p.tipo}</span></td><td>${OPT.papel[p.papel]}</td><td class="r">${p.pct!=null?num(p.pct,2)+'%':'—'}</td><td>${esc(p.tel||'—')}</td><td class="r"><button class="btn sm text danger" data-a="del-pes" data-i="${i}">Remover</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Ninguém vinculado.</div>'}
    <form class="inline-form" data-form="pessoa"><div class="field grow"><label for="p-n">Nome ou razão social</label><input id="p-n" name="nome" required></div><div class="field" style="flex:0 1 120px"><label for="p-t">Tipo</label><select id="p-t" name="tipo"><option value="PF">PF</option><option value="PJ">PJ</option></select></div>
    <div class="field"><label for="p-p">Vínculo</label><select id="p-p" name="papel">${Object.entries(OPT.papel).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div><div class="field" style="flex:0 1 110px"><label for="p-pc">% (prop.)</label><input id="p-pc" name="pct" inputmode="decimal"></div>
    <div class="field"><label for="p-tel">Telefone</label><input id="p-tel" name="tel"></div><button class="btn sm">${ic('add',16)}Adicionar</button></form></div></section>`;
}

/* ===================== abas da ficha ===================== */
function abaCadastro(t){
  return `<div class="stack">${secaoGenerica(t,'ident')}${secaoGenerica(t,'loc')}${secaoAreas(t)}${secaoConfr(t)}${secaoGenerica(t,'fis')}${secaoMats(t)}${secaoInsc(t)}${secaoPessoas(t)}</div>`;
}
function condicoes(t){
  const o=ofertaRef(t),ad=areaAdotada(t),cp=corrPrincipal(t);
  if(UI.edit==='cond'&&o)return `<section class="sec"><form data-form="cond"><div class="sec-h"><h2>Condições pedidas</h2><span class="faint" style="font-size:12px">editando a oferta de ${fd(o.data)}</span></div><div class="sec-b"><div class="editgrid">
    <div class="field"><label for="c-v">Valor pedido (R$)</label><input id="c-v" name="valor" inputmode="decimal" value="${o.valor==null?'':num(o.valor)}"></div>
    <div class="field"><label for="c-f">Forma de pagamento pedida</label>${optSel('forma',OPT.forma,o.forma).replace('id="f-forma"','id="c-f"')}</div>
    <div class="field"><label for="c-c">Corretor</label><select id="c-c" name="cid"><option value="">Sem corretor</option>${S.corretores.map(c=>`<option value="${c.id}" ${c.id===o.cid?'selected':''}>${esc(c.nome)} · ${esc(c.imob)}</option>`).join('')}</select></div>
    <div class="field"><label for="c-val">Validade da oferta</label><input id="c-val" name="validade" type="date" value="${esc(o.validade||'')}"></div>
    <div class="field full"><label for="c-o">Observação sobre a forma de pagamento</label><textarea id="c-o" name="obsPag">${esc(o.obsPag)}</textarea></div>
    <div class="field full"><label for="c-a">Aceita permuta</label><textarea id="c-a" name="aceita" placeholder="Como o vendedor encara a permuta e em que condições">${esc(o.aceita)}</textarea></div></div></div>
    <div class="sec-f"><button type="button" class="btn text" data-a="cancel-edit">Cancelar</button><button class="btn primary">Salvar</button></div></form></section>`;
  return `<section class="sec" id="sec-cond"><div class="sec-h"><h2>${ic('money',18)}Condições pedidas</h2><div style="display:flex;gap:8px;align-items:center">${t.ofertas.length>1?`<button class="btn text sm" data-a="tab" data-t="comercial">${t.ofertas.length} ofertas</button>`:''}${o?`<button class="btn text sm" data-a="edit" data-s="cond">${ic('edit',16)}Editar</button>`:`<button class="btn sm" data-a="nova-oferta">${ic('add',16)}Registrar oferta</button>`}</div></div>
    <div class="sec-b">${o?`<div class="cond">
      <div><div class="lbl">Valor pedido</div><div class="big">${o.valor?mi(o.valor):'<span class="faint" style="font-size:15px">Não informado</span>'}</div></div>
      <div><div class="lbl">Por m² (área adotada)</div><div class="big">${o.valor&&ad?brl(o.valor/ad):'<span class="faint" style="font-size:15px">—</span>'}</div></div>
      <div><div class="lbl">Forma de pagamento pedida</div><div class="big" style="font-size:17px">${o.forma?OPT.forma[o.forma]:'<span class="faint" style="font-size:15px">Não informada</span>'}</div></div>
      <div><div class="lbl">Corretor principal</div><div class="big" style="font-size:17px">${cp?esc(cp.nome):'<span class="faint" style="font-size:15px">—</span>'}</div>${cp?`<div class="faint" style="font-size:12px">${esc(cp.imob)}</div>`:''}</div></div>
      <div class="grid2" style="margin-top:14px"><div><div class="lbl muted" style="font-size:12px">Aceita permuta</div><div class="txt">${o.aceita?esc(o.aceita):'<span class="faint">Não informado</span>'}</div></div>
      <div><div class="lbl muted" style="font-size:12px">Observação sobre o pagamento</div><div class="txt">${o.obsPag?esc(o.obsPag):'<span class="faint">Não informado</span>'}</div></div></div>`
    :'<div class="muted">Nenhuma oferta registrada. Registre o que o vendedor pede para abrir a negociação.</div>'}</div></section>`;
}
function abaComercial(t){
  const ref=ofertaRef(t);
  return `<div class="stack">${condicoes(t)}
  <section class="sec"><div class="sec-h"><h2>Ofertas recebidas</h2><button class="btn sm" data-a="nova-oferta">${ic('add',16)}Registrar oferta</button></div><div class="sec-b">
  ${t.ofertas.length?`<div class="tblwrap"><table class="mini-tbl"><thead><tr><th>Data</th><th>Corretor</th><th class="r">Valor pedido</th><th>Forma</th><th>Status</th><th></th></tr></thead><tbody>
  ${t.ofertas.slice().sort((a,b)=>a.data.localeCompare(b.data)).map((o,i)=>{const c=corretor(o.cid);return `<tr><td>${fd(o.data)}${i===0&&t.ofertas.length>1?'<div class="tag-ref" style="color:var(--ink-2)">primeira</div>':''}</td><td>${c?esc(c.nome)+`<div class="faint" style="font-size:12px">${esc(c.imob)}</div>`:'Direto'}</td><td class="r">${brl(o.valor)}</td><td>${o.forma?OPT.forma[o.forma]:'—'}</td><td>${o.status}</td>
  <td class="r">${o===ref?'<span class="tag-ref">referência</span>':t.neg?`<button class="btn sm text" data-a="ofref" data-o="${o.id}">Usar como referência</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="muted">Nenhuma oferta.</div>'}
  <div class="hint" style="margin-top:8px">Cada oferta guarda o que aquele corretor apresentou. A ficha mostra a oferta de referência da negociação.</div></div></section>
  <section class="sec"><div class="sec-h"><h2>Corretores do terreno</h2></div><div class="sec-b">
  ${t.corretores.length?t.corretores.map(x=>{const c=corretor(x.cid);return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0"><button class="star ${x.principal?'on':''}" data-a="principal" data-c="${x.cid}" aria-label="Marcar ${esc(c.nome)} como principal" title="${x.principal?'Principal':'Marcar como principal'}">★</button><span><b>${esc(c.nome)}</b> <span class="muted" style="font-size:13px">· ${esc(c.imob)} · CRECI ${esc(c.creci)}</span></span>${x.principal?'<span class="chip blue">Principal</span>':''}</div>`}).join(''):'<div class="muted">Entram automaticamente quando apresentam uma oferta.</div>'}</div></section></div>`;
}
function abaNegociacao(t){
  const n=t.neg;
  if(!n)return `<section class="sec"><div class="sec-b"><div class="empty">Sem negociação aberta. Ela abre quando a primeira oferta é registrada.<br><button class="btn primary sm" style="margin-top:12px" data-a="nova-oferta">${ic('add',16)}Registrar oferta</button></div></div></section>`;
  const v=n.viab,ad=areaAdotada(t);
  const chain=t.propostas.slice().reverse();
  const form=UI.propForm?`<section class="sec"><form data-form="prop"><div class="sec-h"><h2>Nova proposta · v${t.propostas.length+1}</h2></div><div class="sec-b"><div class="editgrid">
    <div class="field"><label for="pp-o">Origem</label><select id="pp-o" name="origem"><option value="bkm">BKM</option><option value="vendedor">Vendedor</option></select></div>
    <div class="field"><label for="pp-v">Valor total (R$)</label><input id="pp-v" name="valor" inputmode="decimal" required></div>
    <div class="field"><label for="pp-f">Forma de pagamento</label><select id="pp-f" name="forma">${Object.entries(OPT.forma).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
    <div class="field"><label for="pp-s">Status</label><select id="pp-s" name="status"><option value="apresentada">Apresentada</option><option value="em_analise">Em análise</option><option value="rascunho">Rascunho</option></select></div>
    <div class="field"><label for="pp-d">Apresentada em</label><input id="pp-d" name="data" type="date" value="${HOJE}"></div>
    <div class="field"><label for="pp-val">Validade</label><input id="pp-val" name="validade" type="date" value="${addD(HOJE,15)}"></div>
    <div class="field full"><label for="pp-c">Condições de pagamento</label><textarea id="pp-c" name="cond" placeholder="Entrada, parcelas, permuta, torna, condição suspensiva"></textarea></div>
    <div class="field full" id="pp-warn"></div></div>
    <div class="hint">${t.propostas.length?`Responde à v${t.propostas.length}. Se vier do outro lado, a v${t.propostas.length} vira Recusada; se vier do mesmo lado, vira Substituída.`:'Primeira proposta da negociação.'}</div></div>
    <div class="sec-f"><button type="button" class="btn text" data-a="prop-form">Cancelar</button><button class="btn primary">Registrar</button></div></form></section>`:'';
  return `<div class="stack">
  <section class="sec"><div class="sec-h"><h2>Viabilidade</h2></div><div class="sec-b">${v?`<div class="metrics"><div class="metric"><div class="ml">VGV</div><div class="mv">${mi(v.vgv)}</div></div><div class="metric"><div class="ml">Margem</div><div class="mv">${num(v.margem,1)}%</div></div><div class="metric"><div class="ml">Preço máximo do terreno</div><div class="mv">${mi(v.pmax)}</div></div></div>
    <div class="faint" style="font-size:12px;margin-top:10px">${esc(v.nome)} · ${fd(v.em)}${ad?` · ${brl(v.pmax/ad)}/m² sobre a área adotada`:''}</div>`
    :`<div class="banner blue">${ic('link')}<div style="flex:1"><div class="bt">Sem estudo vinculado</div><div>Rode a viabilidade no BKM e vincule aqui para ter o preço máximo.</div>${negAtiva(t)?`<button class="btn sm" style="margin-top:10px" data-a="viab">${ic('link',16)}Vincular estudo</button>`:''}</div></div>`}</div></section>
  <section class="sec"><div class="sec-h"><h2>Propostas e contrapropostas</h2>${negAtiva(t)&&!UI.propForm?`<button class="btn primary sm" data-a="prop-form">${ic('add',16)}Nova proposta</button>`:''}</div><div class="sec-b">
  ${form}
  ${chain.length?`<div class="chain" style="margin-top:${UI.propForm?16:0}px">${chain.map((p,i)=>{const over=v&&p.valor>v.pmax;return `<div class="pnode ${p.origem}"><span class="pd">v${p.v}</span><div class="pc">
    <div class="ph"><span><span class="pv">${brl(p.valor)}</span> <span class="muted" style="font-size:13px">· ${p.origem==='bkm'?'BKM':'Vendedor'}${p.v>1?` responde à v${p.v-1}`:''}</span></span>
    <span style="display:flex;gap:6px;flex-wrap:wrap">${i===0&&negAtiva(t)?`<select aria-label="Status da proposta" data-ch="prop-status" class="chip" style="border:0;height:26px;cursor:pointer">${Object.entries(OPT.statusProp).filter(([k])=>k!=='substituida').map(([k,l])=>`<option value="${k}" ${k===p.status?'selected':''}>${l}</option>`).join('')}</select>`:statusPropChip(p.status)}${over&&p.origem==='bkm'?`<span class="chip warn">${mi(p.valor-v.pmax)} acima do máximo</span>`:''}</span></div>
    <div class="pm">${OPT.forma[p.forma]} · apresentada ${fd(p.data)}${p.validade?` · válida até ${fd(p.validade)}`:''}</div>${p.cond?`<div class="pt">${esc(p.cond)}</div>`:''}</div></div>`}).join('')}</div>`:'<div class="muted">Nenhuma proposta ainda.</div>'}</div></section></div>`;
}
function abaTarefas(t){
  const lista=t.tarefas.slice().sort((a,b)=>{const fa=['concluida','cancelada'].includes(a.status),fb=['concluida','cancelada'].includes(b.status);return fa-fb||a.prazo.localeCompare(b.prazo)});
  return `<div class="stack"><section class="sec"><div class="sec-h"><h2>Próximos passos</h2><span class="faint" style="font-size:13px">${abertas(t).length} abertas · ${atrasadas(t).length} atrasadas</span></div><div class="sec-b" style="padding-top:4px">
  ${lista.map(k=>{const late=!['concluida','cancelada'].includes(k.status)&&k.prazo<HOJE;return `<div class="task" style="align-items:flex-start;padding:12px 0">
    <span style="flex:none;margin-top:2px">${av(k.resp,'sm')}</span>
    <span class="tt"><div class="t1" style="${k.status==='concluida'||k.status==='cancelada'?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(k.titulo)} ${k.prio==='alta'?'<span class="chip warn" style="height:20px">Alta</span>':''}</div>
    ${k.desc?`<div class="muted" style="font-size:13px">${esc(k.desc)}</div>`:''}<div class="tm ${late?'late':''}">${esc(k.resp)} · ${late?'atrasada desde ':'prazo '}${fd(k.prazo)}</div>
    ${k.status==='concluida'?`<input aria-label="Resultado" data-ch="tar-res" data-k="${k.id}" value="${esc(k.resultado)}" placeholder="O que foi feito ou obtido" style="margin-top:6px;width:100%;height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--surface)">`:''}</span>
    <select aria-label="Status" data-ch="tar-st" data-k="${k.id}" style="height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 6px;flex:none">${Object.entries(OPT.statusTar).map(([s,l])=>`<option value="${s}" ${s===k.status?'selected':''}>${l}</option>`).join('')}</select></div>`}).join('')||'<div class="muted">Nenhuma tarefa.</div>'}
  <form class="inline-form" data-form="tarefa"><div class="field grow"><label for="tk-t">Nova tarefa</label><input id="tk-t" name="titulo" required placeholder="Ex.: cobrar contraproposta do proprietário"></div>
  <div class="field"><label for="tk-p">Prazo</label><input id="tk-p" name="prazo" type="date" value="${addD(HOJE,7)}" required></div>
  <div class="field"><label for="tk-r">Responsável</label><select id="tk-r" name="resp">${USERS.map(u=>`<option ${u===t.resp?'selected':''}>${u}</option>`).join('')}</select></div>
  <div class="field" style="flex:0 1 110px"><label for="tk-pr">Prioridade</label><select id="tk-pr" name="prio"><option value="media">Média</option><option value="alta">Alta</option><option value="baixa">Baixa</option></select></div>
  <div class="field full" style="flex-basis:100%"><label for="tk-d">Descrição</label><input id="tk-d" name="desc"></div><button class="btn sm">${ic('add',16)}Adicionar</button></form>
  <div class="hint" style="margin-top:8px">"Atrasada" é calculada: prazo vencido e status em aberto. Ninguém precisa marcar.</div></div></section></div>`;
}
function abaUrbanismo(t){
  const a=analiseVig(t),hist=t.analises.filter(x=>x.status==='substituida');
  const lim=(st,v,suf)=>st==='sem_limite'?'<span class="chip good">Sem limite</span>':st==='limitado'?`${num(v,2)}${suf}`:'<span class="faint">Não informado</span>';
  const novo=UI.edit==='analise'?`<form data-form="analise" style="margin-top:12px"><div class="editgrid"><div class="field"><label for="an-d">Data da verificação</label><input id="an-d" name="data" type="date" value="${HOJE}"></div><div class="field"><label for="an-f">Fonte</label><input id="an-f" name="fonte" placeholder="GeoSampa, certidão de uso do solo..." required></div></div>
    ${[0,1,2].map(i=>`<div class="editgrid" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)"><div class="field"><label for="z${i}">Zoneamento ${i+1}${i?' (opcional)':''}</label><select id="z${i}" name="sigla${i}" ${i?'':'required'}><option value="">—</option>${ZONEAMENTOS.map(z=>`<option>${z}</option>`).join('')}</select></div>
    <div class="field"><label for="za${i}">Área abrangida (m²)</label><input id="za${i}" name="area${i}" inputmode="decimal"></div>
    ${[['gm','Gabarito (m)'],['gp','Gabarito (pavimentos)'],['ca','CA máximo']].map(([k,l])=>`<div class="field"><label for="${k}s${i}">${l}</label><span style="display:flex;gap:6px"><select id="${k}s${i}" name="${k}S${i}" style="flex:1 1 55%">${Object.entries(OPT.limite).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select><input aria-label="${l}: valor" name="${k}V${i}" inputmode="decimal" placeholder="valor" style="flex:1 1 45%"></span></div>`).join('')}</div>`).join('')}
    <div class="hint" style="margin-top:8px">Cada parâmetro é não informado, limitado (com valor) ou sem limite identificado. Zero nunca significa "sem limite".</div>
    <div class="sec-f" style="padding:12px 0 0"><button type="button" class="btn text" data-a="cancel-edit">Cancelar</button><button class="btn primary">Registrar análise</button></div></form>`:'';
  return `<div class="stack"><section class="sec"><div class="sec-h"><h2>Análise urbanística</h2>${UI.edit!=='analise'?`<button class="btn sm" data-a="edit" data-s="analise">${ic('add',16)}${a?'Nova análise':'Registrar análise'}</button>`:''}</div><div class="sec-b">
  ${a?`<div class="muted" style="font-size:13px;margin-bottom:10px">Vigente · verificada em ${fd(a.data)} · fonte: ${esc(a.fonte)}</div>
  <div class="tblwrap"><table class="mini-tbl"><thead><tr><th>Zoneamento</th><th class="r">Área abrangida</th><th>Gabarito (m)</th><th>Gabarito (pav.)</th><th>CA máximo</th><th>Restrições</th></tr></thead><tbody>${a.zonas.map(z=>`<tr><td><b>${esc(z.sigla)}</b></td><td class="r">${m2(z.area)}</td><td>${lim(z.gmS,z.gabM,' m')}</td><td>${lim(z.gpS,z.gabPav,' pav.')}</td><td>${lim(z.caS,z.ca,'')}</td><td class="muted">${esc(z.obs||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Nenhuma análise. Zoneamento, gabarito e CA ficam ligados à análise e à porção do terreno, com fonte e data.</div>'}
  ${novo}
  ${hist.length?`<details class="details" style="margin-top:12px"><summary>${hist.length} análise${hist.length>1?'s':''} anterior${hist.length>1?'es':''}</summary>${hist.map(h=>`<div class="muted" style="font-size:13px;padding:4px 0">${fd(h.data)} · ${esc(h.fonte)} · ${h.zonas.map(z=>`${z.sigla} CA ${num(z.ca,2)}`).join(', ')}</div>`).join('')}</details>`:''}
  </div></section>
  <section class="sec"><div class="sec-h"><h2>Infraestrutura na porta</h2><span class="faint" style="font-size:13px">${infraNV(t)} não verificados</span></div><div style="padding-bottom:6px">
  ${INFRA.map(([k,l])=>{const r=t.infra[k]||{d:'nao_verificado'};return `<div class="infra"><span>${l}</span><span class="seg3" role="group" aria-label="${l}">${[['nao_verificado','Não verificado','nv'],['sim','Sim','sim'],['nao','Não','nao']].map(([v,lb,c])=>`<button type="button" class="${c}" aria-pressed="${r.d===v}" data-a="infra" data-k="${k}" data-v="${v}">${lb}</button>`).join('')}</span>
  <span class="meta">${r.d!=='nao_verificado'?`${fd(r.data)} · <input aria-label="Fonte da verificação de ${l}" data-ch="infra-fonte" data-k="${k}" value="${esc(r.fonte)}" style="border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:12px;color:var(--ink-2);width:60%">`:''}</span></div>`}).join('')}</div>

/* ===================== avanço ===================== */
function checkAdv(t){
  const n=t.neg,i=SIDX(n.etapa),next=STAGES[i+1];const r={next,items:[],ok:true,forcar:false};
  if(!next||n.status!=='ativo')return null;
  if(n.etapa==='viabilidade')r.items.push({ok:!!n.viab,txt:n.viab?'Estudo vinculado':'Vincular um estudo de viabilidade',fix:n.viab?null:['viab','Vincular']});
  if(n.etapa==='diligencia')t.dilig.filter(d=>d.sit==='impeditiva').forEach(d=>r.items.push({ok:false,txt:'Diligência impeditiva: '+d.titulo,fix:['tab:documentos','Ver diligências']}));
  if(n.etapa==='diligencia')CHECK_DIL.filter(c=>c[1]).forEach(([k])=>{const st=docSt(t.docs.find(d=>d.tipo===k));r.items.push({ok:st==='validado',txt:TIPOS_DOC[k][0]+(st==='validado'?' validado':st==='pendente'?': não enviado':st==='recebido'?': aguardando validação':': '+st),fix:st==='validado'?null:['tab:documentos','Ver documentos']})});
  if(n.etapa==='proposta'){const lp=lastProp(t);r.items.push({ok:lp?.status==='aceita',txt:lp?.status==='aceita'?'Proposta aceita':'Ter a última proposta aceita',fix:lp?.status==='aceita'?null:['tab:negociacao','Ver propostas']})}
  if(next[0]==='contrato'||next[0]==='ganha')r.items.push({ok:UI.role==='Gestor',txt:UI.role==='Gestor'?'Aprovação de gestor':'Somente gestores aprovam a compra',gate:true});
  const b=r.items.filter(x=>!x.ok);r.ok=!b.length;r.forcar=!r.ok&&UI.role==='Gestor'&&b.every(x=>!x.gate);return r;
}
function painelNeg(t){
  const n=t.neg;if(!n)return '';
  if(n.status==='perdida')return `<div class="banner crit">${ic('block')}<div><div class="bt">Negociação perdida em ${SN(n.etapa)} · ${esc(n.motivo)}</div><div>${esc(n.detalhe||'')}</div></div></div>`;
  if(n.status==='suspensa')return `<div class="banner warn" style="justify-content:space-between;flex-wrap:wrap"><span style="display:flex;gap:12px">${ic('pause')}<span><b>Suspensa em ${SN(n.etapa)} até ${fd(n.retomar)}</b></span></span><button class="btn sm" data-a="retomar">Retomar</button></div>`;
  const idx=SIDX(n.etapa),r=checkAdv(t);
  return `<section class="sec"><ol class="stepper" aria-label="Etapas">${STAGES.map((s,i)=>{const st=i<idx||n.status==='ganha'?'done':i===idx?'cur':'fut';return `<li class="step ${st}"><span class="dot">${st==='done'?ic('check',14):i+1}</span><span class="sl">${s[1]}</span></li>`}).join('')}</ol>
  ${r?`<div class="adv"><div class="req"><div class="rt">${r.items.length?'Para avançar para '+r.next[1]:'Próxima etapa: '+r.next[1]}</div>${r.items.length?`<ul>${r.items.map(x=>`<li><span class="${x.ok?'ok':'no'}">${ic(x.ok?'check':'close',16)}</span><span>${esc(x.txt)}${x.fix?` · <button class="linkbtn" data-a="${x.fix[0].startsWith('tab:')?'tab':x.fix[0]}" ${x.fix[0].startsWith('tab:')?`data-t="${x.fix[0].slice(4)}"`:''}>${x.fix[1]}</button>`:''}</span></li>`).join('')}</ul>`:'<div class="muted" style="font-size:13px">Sem requisitos.</div>'}</div>
  <div class="acts"><button class="btn text" data-a="suspender">${ic('pause',18)}Suspender</button><button class="btn text danger" data-a="perder">${ic('block',18)}Perdida</button>${r.forcar?'<button class="btn" data-a="forcar">Avançar mesmo assim</button>':''}<button class="btn primary" data-a="avancar" ${r.ok?'':'disabled'}>${ic('fwd',18)}Avançar para ${r.next[1]}</button></div></div>`
  :n.status==='ganha'?`<div class="adv"><div class="banner good" style="flex:1">${ic('check')}<div><b>Negociação ganha.</b> Aprovação, incorporação e financiamento Caixa vão se ligar a este terreno.</div></div></div>`:''}</section>`;
}

  $('#side').innerHTML=`<button class="compose" data-a="novo">${ic('add',24)}Novo terreno</button>`+NAV.map(([r,l,i])=>`<button class="nav-item" data-a="nav" data-r="${r}" ${cur===r?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('')+`<div class="side-foot"><span>Protótipo · dados de exemplo</span><button class="linkbtn" data-a="reset">Restaurar dados de exemplo</button></div>`;
  $('#bnav').innerHTML=NAV.map(([r,l,i])=>`<button data-a="nav" data-r="${r}" ${cur===r?'aria-current="page"':''}><span class="pill">${ic(i,22)}</span>${l}</button>`).join('');
  document.body.classList.toggle('ro',UI.role==='Leitura');
  $('#role').innerHTML=['Gestor','Analista','Leitura'].map(r=>`<button data-a="role" data-v="${r}" aria-pressed="${UI.role===r}">${r}</button>`).join('');
  $('#main').innerHTML=({inicio:pgInicio,terrenos:pgTerrenos,negociacoes:pgNeg,terreno:pgFicha})[UI.route]();
  renderModal();
}

function dedupe(){
  const f=$('#f-novo');if(!f)return;const mat=digits(f.mat.value),sql=digits(f.sql.value),log=f.logradouro.value.trim().toLowerCase(),nr=f.numero.value.trim().toLowerCase();
  let hit=null,msg='',cert='';
  for(const t of S.terrenos){
    const m=mat.length>=3&&t.mats.find(x=>digits(x.num)===mat);
    if(m){hit=t;cert=m.cri===f.cri.value?'certa':'provavel';msg=`Mesma matrícula ${m.num}${m.cri===f.cri.value?' no '+m.cri:' em outro cartório ('+m.cri+')'}`;break}
    if(sql.length>=6&&t.insc.some(i=>digits(i.sql)===sql)){hit=t;cert='certa';msg='Mesma inscrição municipal';break}
    if(log.length>=4&&(t.logradouro||'').toLowerCase()===log&&(!nr||!t.numero||t.numero.toLowerCase()===nr)){hit=t;cert='possivel';msg='Mesmo endereço'}
  }
  const box=$('#dedupe'),btn=$('#btn-novo');f.dataset.dup=hit&&cert==='certa'?hit.id:'';
  if(!hit){box.innerHTML='<div class="hint">Nenhum terreno parecido. Será criado um cadastro novo.</div>';btn.textContent='Cadastrar terreno';return}
  box.innerHTML=`<div class="banner ${cert==='certa'?'blue':'warn'}">${ic(cert==='certa'?'link':'warn')}<div style="flex:1"><div class="bt">${cert==='certa'?'Este terreno já está cadastrado':'Possível duplicidade'}: ${hit.codigo} · ${esc(hit.nome)}</div><div>${esc(msg)}. ${cert==='certa'?'Se houver oferta, ela será registrada nesse terreno.':'Confira antes de salvar.'}</div><button type="button" class="btn sm" style="margin-top:8px" data-a="abrir" data-id="${hit.id}">Abrir ficha existente</button></div></div>`;
  btn.textContent=cert==='certa'?'Registrar no terreno existente':'Cadastrar mesmo assim';
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a)return;const A=a.dataset.a;const t=UI.route==='terreno'?T(UI.id):null;
  if(A==='scrim'){if(e.target===a){UI.modal=null;renderModal()}return}

    case 'nav':go(a.dataset.r);break;
    case 'abrir':go('terreno',{id:a.dataset.id,tab:a.dataset.tab||'cadastro',from:a.dataset.from||(UI.route==='terreno'?UI.from:UI.route==='inicio'?'inicio':'terrenos')});break;
    case 'tab':UI.tab=a.dataset.t;UI.edit=null;UI.propForm=false;render();document.querySelector('.tabs')?.scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'ir':UI.tab=a.dataset.t;UI.edit=a.dataset.s&&SECOES[a.dataset.s]||a.dataset.s==='areas'?a.dataset.s:null;render();setTimeout(()=>{const s=a.dataset.s&&document.getElementById('sec-'+a.dataset.s);(s||document.querySelector('.tabs'))?.scrollIntoView({behavior:'smooth',block:'start'})},20);break;
    case 'fT':UI.fT=a.dataset.v;render();break;

    case 'novo':UI.modal='novo';renderModal();break;
    case 'nova-oferta':UI.modal='oferta';renderModal();break;
    case 'close':UI.modal=null;renderModal();break;
    case 'edit':UI.edit=a.dataset.s;render();setTimeout(()=>document.getElementById('sec-'+a.dataset.s)?.querySelector('input,select,textarea')?.focus(),20);break;
    case 'cancel-edit':UI.edit=null;render();break;
    case 'temp':{const v=Number(a.dataset.v)||null,antes=t.neg.temp;t.neg.temp=v;log(t,`Temperatura ${antes||'—'} → ${v||'—'}`);save();render();toast(v?`Temperatura ${v} · ${TEMP[v]}.`:'Temperatura removida.');break}

    case 'del-mat':t.mats.splice(Number(a.dataset.i),1);save();render();break;
    case 'del-pes':t.pessoas.splice(Number(a.dataset.i),1);save();render();break;
    case 'del-confr':t.confr.splice(Number(a.dataset.i),1);save();render();break;
    case 'infra':{const k=a.dataset.k,v=a.dataset.v;t.infra[k]=v==='nao_verificado'?{d:v}:{d:v,data:HOJE,fonte:t.infra[k]?.fonte||'Visita ao local'};save();render();break}
    case 'prop-form':UI.propForm=!UI.propForm;render();break;
    case 'avancar':case 'do-forcar':{const r=checkAdv(t);t.neg.etapa=r.next[0];t.neg.desde=HOJE;if(r.next[0]==='ganha')t.neg.status='ganha';log(t,`Avançou para ${r.next[1]}`);save();render();toast(`Movida para ${r.next[1]}.`);break}
    case 'forcar':UI.modal='forcar';renderModal();break;
    case 'perder':UI.modal='perder';renderModal();break;
    case 'suspender':UI.modal='suspender';renderModal();break;
    case 'viab':UI.modal='viab';renderModal();break;
    case 'retomar':t.neg.status='ativo';log(t,'Negociação retomada');save();render();break;
    case 'doc-ok':{const d=t.docs.find(x=>x.tipo===a.dataset.k);d.status='validado';log(t,`${TIPOS_DOC[d.tipo][0]} validado`);save();render();break}
    case 'upload':UI.upload=a.dataset.k;$('#file-in').value='';$('#file-in').click();break;
  }
});

    case 'analise':{let erro=null;const zonas=[0,1,2].map(i=>{if(!F['sigla'+i])return null;const par=k=>{const st=F[k+'S'+i],v=lerNum(F[k+'V'+i]);if(st==='limitado'&&!(v>0))erro=`Informe o valor de ${k==='ca'?'CA':'gabarito'} limitado em ${F['sigla'+i]}.`;return [st,st==='limitado'?v:null]};
        const [gmS,gabM]=par('gm'),[gpS,gabPav]=par('gp'),[caS,ca]=par('ca');return {sigla:F['sigla'+i],area:lerNum(F['area'+i]),gmS,gabM,gpS,gabPav,caS,ca,obs:''}}).filter(Boolean);
      if(erro){toast(erro,true);return}
      t.analises.forEach(a=>{if(a.status==='vigente')a.status='substituida'});t.analises.push({id:uid(),data:F.data,fonte:F.fonte,status:'vigente',zonas});UI.edit=null;log(t,'Nova análise urbanística: '+zonas.map(z=>z.sigla).join(' + '));save();render();toast('Análise registrada. A anterior foi preservada.');break}
    case 'novo':{const dup=f.dataset.dup;let alvo;
      if(!F.logradouro.trim()&&!F.bairro.trim()&&!dup){toast('Informe ao menos logradouro ou bairro.',true);return}
      if(dup){alvo=T(dup)}else{S.seqT++;alvo={...seedVazio(),codigo:'TER-'+String(S.seqT).padStart(6,'0'),nome:F.nome,logradouro:F.logradouro.trim(),numero:F.numero.trim(),bairro:F.bairro.trim(),zona:F.zona||null,resp:F.resp,origem:F.origem,dataIdent:HOJE,
        mats:F.mat?[{num:F.mat,cri:F.cri,area:null,data:null}]:[],insc:F.sql?[{sql:F.sql,area:null,valores:[]}]:[]};alvo.hist=[{em:HOJE,user:me(),txt:'Terreno cadastrado'}];S.terrenos.push(alvo)}
      const val=lerNum(F.valor);
      if(val||F.cid){const o={id:uid(),cid:F.cid||null,data:HOJE,valor:val,forma:F.forma||null,obsPag:F.obsPag,aceita:F.aceita,status:'ativa'};alvo.ofertas.push(o);
        if(o.cid&&!alvo.corretores.some(x=>x.cid===o.cid))alvo.corretores.push({cid:o.cid,principal:!alvo.corretores.some(x=>x.principal)});
        if(!alvo.neg||!['ativo','suspensa'].includes(alvo.neg.status)){alvo.neg={codigo:'NEG-'+String(Math.floor(Math.random()*900)+100).padStart(5,'0'),etapa:'recebida',status:'ativo',desde:HOJE,temp:Number(F.temp)||null,ofRef:o.id,viab:null};log(alvo,'Negociação aberta')}
        else log(alvo,'Nova oferta registrada')}
      UI.modal=null;save();go('terreno',{id:alvo.id,tab:dup?'comercial':'cadastro',from:'terrenos'});toast(dup?'Oferta registrada no terreno existente.':`${alvo.codigo} cadastrado. Complete a ficha quando puder.`);break}
    case 'oferta':{const o={id:uid(),cid:F.cid||null,data:HOJE,valor:lerNum(F.valor),forma:F.forma||null,obsPag:F.obsPag,aceita:F.aceita,validade:F.validade||null,status:'ativa'};t.ofertas.push(o);
      if(o.cid&&!t.corretores.some(x=>x.cid===o.cid))t.corretores.push({cid:o.cid,principal:!t.corretores.some(x=>x.principal)});
      if(!t.neg||!['ativo','suspensa'].includes(t.neg.status)){t.neg={codigo:'NEG-'+String(Math.floor(Math.random()*900)+100).padStart(5,'0'),etapa:'recebida',status:'ativo',desde:HOJE,temp:null,ofRef:o.id,viab:null};log(t,'Negociação aberta')}else log(t,`Nova oferta: ${mi(o.valor)}`);
      UI.modal=null;save();render();toast('Oferta registrada.');break}
    case 'perder':Object.assign(t.neg,{status:'perdida',motivo:F.motivo,detalhe:F.detalhe});log(t,'Perdida: '+F.motivo);UI.modal=null;save();render();break;
    case 'suspender':Object.assign(t.neg,{status:'suspensa',retomar:F.retomar});log(t,'Suspensa até '+fd(F.retomar));UI.modal=null;save();render();break;
    case 'forcar':{const r=checkAdv(t);t.neg.etapa=r.next[0];t.neg.desde=HOJE;log(t,`Avançou para ${r.next[1]} sem requisitos: ${F.j}`);UI.modal=null;save();render();break}
    case 'viab':t.neg.viab={nome:F.nome,vgv:lerNum(F.vgv),margem:lerNum(F.margem),pmax:lerNum(F.pmax),em:HOJE};log(t,'Estudo vinculado');UI.modal=null;save();render();break;
  }
});
function seedVazio(){return {id:uid(),situacao:'ativo',prioridade:null,descricao:'',url:'',obs:'',cep:'',complemento:'',referencia:'',lat:null,lng:null,precisao:'nao_informada',aDoc:null,aCad:null,aLev:null,aEst:null,fonteArea:null,testada:null,topografia:'nao_informado',desnivel:null,posicao:'nao_informado',formato:'nao_informado',ocupacao:'nao_informado',uso:'',aConst:null,aDemolir:null,demolicao:'nao_avaliada',obsFis:'',eixo:null,mats:[],insc:[],confr:[],dilig:[],pessoas:[],corretores:[],infra:{},analises:[],ofertas:[],neg:null,propostas:[],tarefas:[],docs:[],hist:[]}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}});
render();
})();
</script>
