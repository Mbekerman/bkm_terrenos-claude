<title>BKM Terrenos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Nothing+You+Could+Do&display=swap">
<style>
/* Layout: Google-style app shell. Top bar with search, left nav rail (bottom bar on phones), white work surfaces on a cool blue-grey ground. BKM navy + brand blue. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#edf1f7; --surface-3:#e1e7f0; --line:#dce2eb;
  --ink:#15203a; --ink-2:#525d75; --ink-3:#848fa5;
  --navy:#1d2e5c; --accent:#0094fe; --accent-ink:#0a6cc9; --accent-soft:#e1f0ff; --btn:#0a7de3; --on-accent:#ffffff;
  --good:#1a8248; --good-soft:#e2f3e8; --warn:#9c5700; --warn-soft:#fcefd9; --crit:#c5302a; --crit-soft:#fbe7e5;
  --av1:#deafa1; --av2:#ccd3a7; --av3:#cececc; --av4:#e8eed2; --av-ink:#1d2e5c;
  --scrim:rgba(13,20,38,.45);
  --shadow:0 1px 2px rgba(21,32,58,.06),0 2px 8px rgba(21,32,58,.07);
  --shadow-2:0 2px 6px rgba(21,32,58,.10),0 10px 28px rgba(21,32,58,.12);
  --font:"Aptos","Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Nothing You Could Do","Segoe Script",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1423; --surface:#141c2f; --surface-2:#1a2440; --surface-3:#243051; --line:#27334f;
  --ink:#e7ecf6; --ink-2:#a2adc3; --ink-3:#6d7994;
  --navy:#cdd8f3; --accent:#2fa7ff; --accent-ink:#72bfff; --accent-soft:#12304f; --btn:#2fa7ff; --on-accent:#05203c;
  --good:#53c58a; --good-soft:#12301f; --warn:#f0a54a; --warn-soft:#33240c; --crit:#ff8077; --crit-soft:#3a1818;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1423; --surface:#141c2f; --surface-2:#1a2440; --surface-3:#243051; --line:#27334f;
  --ink:#e7ecf6; --ink-2:#a2adc3; --ink-3:#6d7994;
  --navy:#cdd8f3; --accent:#2fa7ff; --accent-ink:#72bfff; --accent-soft:#12304f; --btn:#2fa7ff; --on-accent:#05203c;
  --good:#53c58a; --good-soft:#12301f; --warn:#f0a54a; --warn-soft:#33240c; --crit:#ff8077; --crit-soft:#3a1818;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500}
h1{font-size:24px;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
.hand{font-family:var(--hand);font-weight:400;color:var(--accent-ink);font-size:1.15em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{height:64px;display:flex;align-items:center;gap:16px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:none;background:none;border:0;padding:0;color:var(--ink)}
.brand svg{width:30px;height:30px}
.wordmark{font-weight:700;font-size:23px;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.wordmark .k{background:linear-gradient(180deg,#19c2ff,#0f5fd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sep{width:1px;height:22px;background:var(--line)}
.brand-prod{font-size:18px;color:var(--ink-2)}
.search{flex:1;max-width:620px;margin-left:28px;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;background:var(--surface-2);border-radius:24px;border:1px solid transparent;color:var(--ink-2)}
.search:focus-within{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;font-size:15px;color:var(--ink)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-pill{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:12px;white-space:nowrap;font-weight:500}
.seg{display:flex;background:var(--surface-2);border-radius:20px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:16px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--av-ink);flex:none;border:0;padding:0}
.avatar.sm{width:24px;height:24px;font-size:10px}

/* shell */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 64px);padding-block:16px;padding-right:12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.compose{display:inline-flex;align-items:center;gap:12px;height:54px;padding:0 22px 0 18px;border-radius:16px;border:0;background:var(--accent-soft);color:var(--ink);font-weight:600;font-size:14px;margin-bottom:12px;align-self:flex-start;transition:box-shadow .15s}
.compose:hover{box-shadow:var(--shadow)}
.compose .ic{color:var(--accent-ink)}
.nav-item{display:flex;align-items:center;gap:14px;height:44px;padding:0 16px;border-radius:22px;border:0;background:none;width:100%;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item .cnt{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums}
.nav-item .cnt.alert{color:var(--crit);font-weight:700}
.side-foot{margin-top:auto;padding:12px 16px;font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:500;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.main{padding-block:24px 56px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;border:0;background:none;color:var(--ink-2);font-size:12px;font-weight:500}
.bnav .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.bnav button[aria-current="page"]{color:var(--ink);font-weight:600}
.bnav button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent-ink)}
.bnav .badge{position:absolute;top:2px;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:var(--surface);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.fab{display:none;position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:var(--shadow-2);align-items:center;gap:10px}
.fab .ic{color:var(--accent-ink)}

/* page scaffolding */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h .sub{margin-top:4px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 0}
.card-b{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-6040{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 18px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--accent-ink);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:disabled{background:var(--surface-3);border-color:var(--surface-3);color:var(--ink-3);cursor:not-allowed;filter:none}
.btn.text{border-color:transparent;background:transparent}
.btn.text:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.blue{background:var(--accent-soft);color:var(--accent-ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.fchip:hover{background:var(--surface-2)}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.fchip .n{font-variant-numeric:tabular-nums;opacity:.8}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.kpi:hover{box-shadow:var(--shadow)}
.kpi .v{font-size:30px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:132px minmax(0,1fr) 28px;align-items:center;gap:12px;border:0;background:none;padding:2px 0;text-align:left}
.frow .fl{font-size:13px;color:var(--ink-2)}
.frow .ft{height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.frow .fb{height:100%;background:var(--accent);border-radius:6px;opacity:.85;min-width:4px}
.frow.won .fb{background:var(--good)}
.frow .fn{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.funnel-foot{margin-top:12px;font-size:13px;color:var(--ink-2);display:flex;gap:16px;flex-wrap:wrap}

/* lists */
.alist{display:flex;flex-direction:column}
.aitem{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.aitem:first-child{border-top:0}
.aitem:hover{background:var(--surface-2)}
.aitem .ai{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.ai.crit{background:var(--crit-soft);color:var(--crit)} .ai.warn{background:var(--warn-soft);color:var(--warn)} .ai.blue{background:var(--accent-soft);color:var(--accent-ink)} .ai.good{background:var(--good-soft);color:var(--good)}
.aitem .at{font-weight:500} .aitem .as{font-size:13px;color:var(--ink-2)}
.aitem .when{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:8px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}

/* table-like rows */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tr{display:grid;grid-template-columns:76px minmax(0,2.2fr) 92px 78px 112px 150px 34px;align-items:center;gap:16px;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.tr:first-child{border-top:0}
button.tr:hover{background:var(--surface-2)}
.tr.th{font-size:12px;color:var(--ink-3);font-weight:500;padding-block:10px;background:var(--surface)}
.tr .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t2{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .r{text-align:right}
.tr .meta-sm{display:none}
.tr.docs{grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 120px 110px 70px}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;align-items:flex-start}
.col{flex:0 0 268px;background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 2px;font-weight:600;font-size:13px}
.col-h .n{color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.kcard:hover{box-shadow:var(--shadow)}
.kcard .kt{font-weight:600}
.kcard .ks{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .kr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.kcard .flags{display:flex;gap:4px;align-items:center}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600}
.flag.crit{color:var(--crit)} .flag.warn{color:var(--warn)}
.col-empty{font-size:12px;color:var(--ink-3);padding:8px;text-align:center}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;margin:-6px 0 12px -10px;height:36px;padding:0 12px 0 8px;border-radius:18px;border:0;background:none;color:var(--ink-2);font-weight:500}
.back:hover{background:var(--surface-2)}
.eyebrow{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:500;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.dhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.dhead h1{font-size:26px}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stepper{list-style:none;margin:0;padding:16px;display:flex;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;flex:1 0 auto}
.step:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--line);min-width:14px;margin:0 8px}
.step.done::after{background:var(--accent)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.done .dot{background:var(--accent);color:var(--on-accent)}
.cur .dot{background:var(--surface);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.sl{font-size:13px;color:var(--ink-3);white-space:nowrap}
.cur .sl{color:var(--ink);font-weight:600}
.done .sl{color:var(--ink-2)}
.adv{border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.adv .req{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 320px}
.adv .req .rt{font-weight:600;font-size:13px}
.adv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.adv li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.adv li .ic{margin-top:1px}
.adv .ok{color:var(--good)} .adv .no{color:var(--crit)}
.adv .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px}
.banner.crit{background:var(--crit-soft)} .banner.warn{background:var(--warn-soft)} .banner.good{background:var(--good-soft)} .banner.blue{background:var(--accent-soft)}
.banner .bt{font-weight:600}
.banner .ic{margin-top:1px}
.banner.crit .ic{color:var(--crit)} .banner.warn .ic{color:var(--warn)} .banner.good .ic{color:var(--good)} .banner.blue .ic{color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin:20px 0 16px}
.tab{padding:12px 14px;border:0;background:none;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:4px 4px 0 0;display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tab .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;margin:0}
dl.kv dt{color:var(--ink-2);font-size:13px}
dl.kv dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;min-width:0}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metric .ml{font-size:12px;color:var(--ink-2)}
.metric .mv{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.vsbar{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.vsbar .track{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.vsbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.vsbar .fill.over{background:var(--warn)}
.vsbar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.vsbar .lg{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}

.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:18px;height:18px;accent-color:var(--btn);flex:none}
.task .tt{flex:1;min-width:0}
.task.done .tt .t1{text-decoration:line-through;color:var(--ink-3)}
.task .tm{font-size:12px;color:var(--ink-2)}
.task .tm.late{color:var(--crit);font-weight:600}

.prop{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;padding:16px;border-top:1px solid var(--line);align-items:start}
.prop:first-child{border-top:0}
.prop .pv{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;color:var(--ink-2);font-size:13px}
.prop.nos .pv{background:var(--accent-soft);color:var(--accent-ink)}
.prop .pval{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.prop .pmeta{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.prop .pcond{font-size:13px;margin-top:6px}
.prop .pside{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.chk-group{padding:4px 0}
.chk-gh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.chk-gh .gt{font-weight:600}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.bar{width:140px;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--good);border-radius:3px}
.doc{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.doc .di{width:36px;height:36px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.doc .dn{font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc .ds{font-size:12px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .da{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.doc.future{opacity:.7}
.opt{font-size:11px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}

.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.tli:first-child{border-top:0}
.tli .ai{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.tli .tx{font-size:14px}
.tli .ts{font-size:12px;color:var(--ink-2);margin-top:2px}
.tli .when{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* forms */
form .fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface);width:100%;min-width:0}
.field textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.hint{font-size:12px;color:var(--ink-3)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.inline-form .field{flex:1 1 140px}
.inline-form .field.grow{flex:3 1 220px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:24px;width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:16px}
.dialog .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dialog .dh h2{font-size:20px;font-weight:500}
.dialog .df{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:8px;font-size:14px;max-width:min(560px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow-2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--crit);color:var(--surface)}

.sect-gap{margin-top:24px}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}

const docDue=d=>{const v=validade(d);return v?diff(TODAY_ISO,v):null};

/* ---------- regras de avanço ---------- */
function checkAdvance(p){
  const idx=SIDX(p.etapa),next=STAGES[idx+1];
  const r={next,ok:true,items:[],forcible:false};
  if(p.status!=='ativo'||!next){r.ok=false;return r}
  if(p.etapa==='viabilidade'){
    const ok=!!p.viab;r.items.push({ok,txt:ok?`Estudo ${p.viab.id} do BKM vinculado`:'Vincular um estudo de viabilidade do BKM',fix:ok?null:{a:'link-viab',l:'Vincular estudo'}});
  }
  CHECK.filter(g=>g.etapa===p.etapa).forEach(g=>{
    g.itens.filter(([,o])=>o).forEach(([t])=>{
      const d=docFor(p.id,t),st=docSt(d),ok=st==='validado';
      const why={pendente:'não enviado',recebido:'aguardando validação',vencido:'vencido',rejeitado:'rejeitado'}[st];
      r.items.push({ok,txt:ok?`${TIPOS[t].n} validado`:`${TIPOS[t].n}: ${why}`,fix:ok?null:{a:'tab',t:'documentos',l:'Ver documentos'}});
    });
  });
  if(p.etapa==='proposta'){
    const lp=lastProp(p),ok=!!lp&&lp.status==='Aceita';
    r.items.push({ok,txt:ok?'Proposta aceita pelo vendedor':'Ter uma proposta marcada como aceita',fix:ok?null:{a:'tab',t:'propostas',l:'Ver propostas'}});
  }
  if(next.k==='contrato'||next.k==='ganha'){
    const ok=UI.role==='Gestor';r.items.push({ok,txt:ok?'Aprovação de gestor':'Somente gestores aprovam a compra e o fechamento',gate:true});
  }
  const blockers=r.items.filter(i=>!i.ok);
  r.ok=blockers.length===0;
  r.forcible=!r.ok&&UI.role==='Gestor'&&blockers.every(i=>!i.gate);
  return r;
}
function ensureDocs(p){
  CHECK.forEach(g=>{if(reqOn(p,g.etapa))g.itens.forEach(([t])=>{if(!docFor(p.id,t))S.docs.push({id:'D-'+(S.seq.D++),pid:p.id,tipo:t,status:'pendente',emitido:null,versoes:0,arquivo:null})})});
}
function advance(p,forced){
  const r=checkAdvance(p);if(!r.next)return;
  if(!r.ok&&!forced){toast('Ainda há pendências para avançar.',true);return}
  p.etapa=r.next.k;
  p.hist.push({kind:'etapa',para:p.etapa,em:TODAY_ISO,user:me(),txt:`Avançou para ${r.next.n}`+(forced?' sem checklist completo (avanço forçado)':''),forced:!!forced});
  if(p.etapa==='ganha'){p.status='ganha';p.emp='E-'+String(8+S.procs.filter(x=>x.status==='ganha').length).padStart(2,'0')+' · '+T(p.tid).bairro;p.hist.push({kind:'fim',em:TODAY_ISO,user:me(),txt:`Empreendimento ${p.emp} criado`})}
  ensureDocs(p);save();render();
  toast(p.etapa==='ganha'?'Negociação ganha. Empreendimento criado.':`Movida para ${r.next.n}.`);
}

/* ---------- Terrenos ---------- */
function matchQ(t,q){
  if(!q)return true;q=q.toLowerCase();
  const p=procOf(t.id);
  const hay=[t.id,t.bairro,t.end,t.zon,...t.mats.map(m=>m.num+' '+m.cri),...t.mats.map(m=>digits(m.num)),...ofertasOf(t.id).map(o=>o.corretor),...t.props.map(x=>x.nome),p?p.resp:''].join(' ').toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w));
}
function terrenosFiltrados(){
  return S.terrenos.filter(t=>{const p=procOf(t.id);
    const f=UI.fT==='todos'||(UI.fT==='ativos'&&p.status==='ativo')||(UI.fT==='ganhos'&&p.status==='ganha')||(UI.fT==='encerrados'&&(p.status==='perdida'||p.status==='suspensa'));
    return f&&matchQ(t,UI.q)}).sort((a,b)=>b.id.localeCompare(a.id));
}
function terrenosRows(){

  return `<div class="tr th"><span class="c-id">Código</span><span>Terreno</span><span class="c-area r">Área</span><span class="c-zon">Zona</span><span class="c-val r">Valor ref.</span><span>Etapa</span><span class="c-go"></span></div>`+
    list.map(t=>{const p=procOf(t.id),fl=flagsOf(p),of=ofertasOf(t.id);
      return `<button class="tr" data-a="open" data-id="${t.id}"><span class="c-id faint num">${t.id}</span>
        <span style="min-width:0"><div class="t1">${esc(t.bairro)}</div><div class="t2">${esc(t.end)}${of.length>1?` · ${of.length} ofertas`:''}</div></span>
        <span class="c-area r num">${m2(t.area)}</span><span class="c-zon muted">${t.zon}</span><span class="c-val r num">${mi(valorRef(p))}</span>
        <span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${chipStatus(p)}${fl.venc||fl.atras?`<span class="flag crit" title="Pendências">${ic('warn',14)}</span>`:''}</span>
        <span class="c-go faint">${ic('chev',18)}</span>
        <span class="meta-sm num">${t.id} · ${m2(t.area)} · ${t.zon} · ${mi(valorRef(p))}</span></button>`}).join('');
}
function pgTerrenos(){

    <label class="search" for="q-page" style="margin:0;max-width:340px;height:40px;flex:1 1 220px">${ic('layers',18)}<input id="q-page" type="search" value="${esc(UI.q)}" placeholder="Filtrar por bairro, matrícula, corretor" autocomplete="off"></label></div>

/* ---------- Documentos ---------- */

    return `<button class="tr docs" data-a="open" data-id="${t.id}" data-tab="documentos" data-from="documentos"><span style="min-width:0"><div class="t1">${TIPOS[d.tipo].n}</div><div class="t2">${d.arquivo?esc(d.arquivo):'Nenhum arquivo enviado'}</div></span>
      <span class="c-ter" style="min-width:0"><div class="t1">${esc(t.bairro)}</div><div class="t2">${SN(p.etapa)}</div></span><span>${docChip(st)}</span>

}

}

    :`<div class="req"><div class="rt">Próxima etapa: ${r.next.n}</div><div class="muted" style="font-size:13px">Sem requisitos para avançar.</div></div>`;

    const active=reqOn(p,g.etapa);
    const req=g.itens.filter(([,o])=>o),ok=req.filter(([x])=>docSt(docFor(p.id,x))==='validado').length;
    return `<section class="card chk-group" style="margin-bottom:16px"><div class="chk-gh"><span class="gt">${g.titulo}</span>
      ${active?`<span class="progress"><span class="bar"><span style="width:${ok/req.length*100}%"></span></span>${ok} de ${req.length} obrigatórios</span>`:`<span class="chip">Etapa futura</span>`}</div>
      ${g.itens.map(([x,o])=>{const d=docFor(p.id,x),st=docSt(d),dd=d?docDue(d):null,va=d?validade(d):null;
        const sub=d&&d.arquivo?`${esc(d.arquivo)} · v${d.versoes} · emitido ${fd(d.emitido)}${va?` · ${st==='vencido'?'venceu':'vence'} ${fd(va)}${st!=='vencido'&&dd!=null&&dd<=15?` (${dd} dias)`:''}`:''}`:`Validade: ${TIPOS[x].val?TIPOS[x].val+' dias da emissão':'não vence'}`;
        return `<div class="doc ${active?'':'future'}"><span class="di">${ic('doc',18)}</span><div style="min-width:0"><div class="dn">${TIPOS[x].n} ${o?'':'<span class="opt">opcional</span>'}</div><div class="ds">${sub}</div></div>
        <div class="da">${docChip(st)}${p.status==='ativo'||p.status==='suspensa'?`${st==='recebido'?`<button class="btn sm" data-a="doc-ok" data-d="${d.id}">${ic('check',16)}Validar</button><button class="btn sm text danger" data-a="doc-no" data-d="${d.id}">Rejeitar</button>`:''}
        <button class="btn sm ${st==='pendente'||st==='vencido'||st==='rejeitado'?'':'text'}" data-a="upload" data-t="${x}">${ic('upload',16)}${d&&d.arquivo?'Nova versão':'Enviar'}</button>`:''}</div></div>`}).join('')}</section>`}).join('');
  return `${started?'':`<div class="banner blue" style="margin-bottom:16px"><span>${ic('doc')}</span><div>O checklist passa a valer na etapa Diligência. Você já pode enviar documentos antes disso.</div></div>`}${groups}
  <div class="faint" style="font-size:12px">Prazos de validade são exemplos configuráveis por tipo de documento. Arquivos ficam em armazenamento privado com histórico de versões.</div>`;
}
function tabAtiv(t,p){
  const list=[...p.ativ].sort((a,b)=>b.em.localeCompare(a.em));
  const icn={Ligação:'chat',Visita:'place',Reunião:'chat','E-mail':'chat',Nota:'doc'};
  return `<section class="card" style="margin-bottom:16px"><div class="card-b"><form data-form="ativ" class="inline-form" style="border:0;margin:0;padding:0">
    <div class="field" style="flex:0 1 150px"><label for="at-t">Tipo</label><select id="at-t" name="tipo">${['Ligação','Visita','Reunião','E-mail','Nota'].map(x=>`<option>${x}</option>`).join('')}</select></div>
    <div class="field grow"><label for="at-x">O que aconteceu</label><input id="at-x" name="txt" required placeholder="Resumo da conversa ou visita"></div>
    <button class="btn primary sm" type="submit">Registrar</button></form></div></section>
  <section class="card"><div class="tl">${list.map(a=>`<div class="tli"><span class="ai blue">${ic(icn[a.tipo]||'chat',16)}</span><div><div class="tx"><b>${esc(a.tipo)}</b> · ${esc(a.txt)}</div><div class="ts">${esc(a.user)}</div></div><span class="when">${fd(a.em)}</span></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}</div></section>`;
}
function tabOfertas(t,p){
  const of=ofertasOf(t.id);
  return `${of.length>1?`<div class="banner blue" style="margin-bottom:16px"><span>${ic('layers')}</span><div><div class="bt">${of.length} ofertas para o mesmo terreno</div><div>A primeira oferta registrada fica marcada. Ajuda a resolver disputa de comissão entre corretores.</div></div></div>`:''}
  <section class="card"><div class="tl">${of.map((o,i)=>`<div class="tli"><span class="ai ${i===0?'good':'blue'}">${ic('money',16)}</span><div><div class="tx"><b class="num">${brl(o.valor)}</b> · ${esc(o.origem)}${o.corretor?` · ${esc(o.corretor)}`:''}</div><div class="ts">${o.id} · ${brl(Math.round(o.valor/t.area))}/m²${i===0&&of.length>1?' · <b style="color:var(--good)">primeira oferta</b>':''}</div></div><span class="when">${fd(o.em)}</span></div>`).join('')}</div></section>`;
}
function tabHist(t,p){
  const list=[...p.hist].sort((a,b)=>b.em.localeCompare(a.em));
  const m={etapa:['fwd','blue'],prop:['money','blue'],fim:['block','crit'],doc:['doc','blue']};
  return `<section class="card"><div class="tl">${list.map(h=>`<div class="tli"><span class="ai ${h.forced?'warn':m[h.kind][1]}">${ic(h.forced?'warn':m[h.kind][0],16)}</span><div><div class="tx">${esc(h.txt)}</div><div class="ts">${esc(h.user)}</div></div><span class="when">${fd(h.em)}</span></div>`).join('')}</div></section>
  <div class="faint" style="font-size:12px;margin-top:8px">Registro automático e imutável. Avanços forçados aparecem destacados.</div>`;
}

/* ---------- modais ---------- */
function renderModal(){
  const M=UI.modal,el=$('#modal');
  if(!M){el.innerHTML='';return}
  let h='';
  if(M.k==='oferta')h=`<div class="dh"><div><h2>Nova oferta</h2><div class="muted" style="margin-top:4px">Só o essencial. O resto completa depois.</div></div><button class="iconbtn" data-a="close" aria-label="Fechar">${ic('close')}</button></div>
    <form data-form="oferta" id="f-oferta"><div class="fields">
      <div class="field"><label for="of-m">Matrícula (opcional)</label><input id="of-m" name="mat" inputmode="numeric" placeholder="Ex.: 184.552"></div>
      <div class="field"><label for="of-c">Cartório</label><select id="of-c" name="cri">${['6º CRI','8º CRI','9º CRI','11º CRI','12º CRI','18º CRI'].map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field full"><label for="of-e">Endereço</label><input id="of-e" name="end" required placeholder="Rua, número"></div>
      <div class="field"><label for="of-b">Bairro</label><input id="of-b" name="bairro" required placeholder="Ex.: Itaquera"></div>
      <div class="field"><label for="of-a">Área (m²)</label><input id="of-a" name="area" inputmode="numeric" required placeholder="3.120"></div>
      <div class="field"><label for="of-v">Valor pedido (R$)</label><input id="of-v" name="valor" inputmode="numeric" required placeholder="6.800.000"></div>
      <div class="field"><label for="of-o">Origem</label><select id="of-o" name="origem"><option>Corretor</option><option>Proprietário direto</option><option>Prospecção própria</option></select></div>
      <div class="field full"><label for="of-k">Corretor ou contato</label><input id="of-k" name="corretor" placeholder="Imobiliária · nome"></div>
      <div class="field full" id="dedupe" aria-live="polite"><div class="hint">Dica: digite 184552 na matrícula para ver a detecção de terreno já cadastrado.</div></div>
    </div></form>
    <div class="df"><button class="btn text" data-a="close">Cancelar</button><button class="btn primary" type="submit" form="f-oferta">Salvar oferta</button></div>`;
  if(M.k==='perder')h=`<div class="dh"><h2>Encerrar como perdida</h2><button class="iconbtn" data-a="close" aria-label="Fechar">${ic('close')}</button></div>
    <form data-form="perder" id="f-perder"><div class="fields"><div class="field full"><label for="pd-m">Motivo</label><select id="pd-m" name="motivo" required><option value="">Escolha um motivo</option>${MOTIVOS.map(x=>`<option>${x}</option>`).join('')}</select></div>
    <div class="field full"><label for="pd-t">Detalhe</label><textarea id="pd-t" name="txt" placeholder="O que levou à perda. Ajuda a calibrar as próximas compras."></textarea></div></div></form>
    <div class="df"><button class="btn text" data-a="close">Cancelar</button><button class="btn primary" type="submit" form="f-perder">Encerrar negociação</button></div>`;
  if(M.k==='suspender')h=`<div class="dh"><h2>Suspender negociação</h2><button class="iconbtn" data-a="close" aria-label="Fechar">${ic('close')}</button></div>
    <form data-form="suspender" id="f-susp"><div class="fields"><div class="field"><label for="sp-d">Retomar em</label><input id="sp-d" name="retorno" type="date" required value="${addDays(TODAY_ISO,30)}"></div>
    <div class="field full"><label for="sp-t">Motivo</label><textarea id="sp-t" name="txt" required placeholder="Ex.: inventário em andamento"></textarea></div></div></form>
    <div class="df"><button class="btn text" data-a="close">Cancelar</button><button class="btn primary" type="submit" form="f-susp">Suspender</button></div>`;
  if(M.k==='viab'){const t=T(UI.id),vgv=Math.round(t.area*14200/1e5)*1e5,pmax=Math.round(vgv*.135/1e4)*1e4;
    h=`<div class="dh"><h2>Vincular estudo do BKM</h2><button class="iconbtn" data-a="close" aria-label="Fechar">${ic('close')}</button></div>
    <div class="muted">Estudos do BKM para ${esc(t.bairro)} · ${t.id}</div>
    <button class="kcard" data-a="do-link" data-vgv="${vgv}" data-pmax="${pmax}"><div class="kr"><span class="num faint">V-1${S.seq.N}</span><span>${fd(TODAY_ISO)}</span></div><div class="kt">Estudo base · 2 dormitórios</div>
      <div class="kr"><span class="num">VGV ${mi(vgv)}</span><span class="num">Margem 15,1%</span><span class="num" style="color:var(--ink);font-weight:600">Máx. ${mi(pmax)}</span></div></button>
    <div class="hint">No sistema real esta lista vem direto do BKM. Aqui o estudo é simulado a partir da área.</div>`;}
  if(M.k==='force'){const p=procOf(UI.id),r=checkAdvance(p);
    h=`<div class="dh"><h2>Avançar sem checklist completo?</h2><button class="iconbtn" data-a="close" aria-label="Fechar">${ic('close')}</button></div>
    <div>${r.items.filter(i=>!i.ok).length} requisito(s) pendente(s). O avanço fica registrado no histórico como forçado, com seu nome.</div>
    <div class="df"><button class="btn text" data-a="close">Cancelar</button><button class="btn primary" data-a="do-force">Avançar para ${r.next.n}</button></div>`;}
  el.innerHTML=`<div class="scrim" data-a="scrim"><div class="dialog" role="dialog" aria-modal="true">${h}</div></div>`;
  const first=el.querySelector('input,select');if(first)setTimeout(()=>first.focus(),30);
}
function dedupeCheck(){
  const f=$('#f-oferta');if(!f)return;
  const mat=digits(f.mat.value),cri=f.cri.value,end=f.end.value.trim().toLowerCase(),bairro=f.bairro.value.trim().toLowerCase();
  const box=$('#dedupe');
  let hit=null,kind='';
  if(mat.length>=4){hit=S.terrenos.find(t=>t.mats.some(m=>digits(m.num)===mat&&m.cri===cri));if(hit)kind='mat';
    if(!hit){const other=S.terrenos.find(t=>t.mats.some(m=>digits(m.num)===mat));if(other){hit=other;kind='matcri'}}}
  if(!hit&&end.length>=6){const st=end.split(',')[0].split(' ').slice(0,3).join(' ');hit=S.terrenos.find(t=>t.end.toLowerCase().startsWith(st)&&(!bairro||t.bairro.toLowerCase()===bairro));if(hit)kind='end'}
  if(!hit){box.innerHTML=mat||end?'<div class="hint">Nenhum terreno parecido encontrado. Será criado um novo cadastro.</div>':'<div class="hint">Dica: digite 184552 na matrícula para ver a detecção de terreno já cadastrado.</div>';f.dataset.match='';return}
  const p=procOf(hit.id);
  f.dataset.match=kind==='mat'?hit.id:'';
  box.innerHTML=kind==='mat'
    ?`<div class="banner blue"><span>${ic('link')}</span><div><div class="bt">Terreno já cadastrado: ${hit.id} · ${esc(hit.bairro)}</div><div>Matrícula ${esc(f.mat.value)} do ${esc(cri)}. A oferta será anexada a esse terreno (${SN(p.etapa)}), sem criar duplicata.</div></div></div>`
    :`<div class="banner warn"><span>${ic('warn')}</span><div><div class="bt">Possível duplicidade com ${hit.id} · ${esc(hit.bairro)}</div><div>${kind==='matcri'?'Mesmo número de matrícula em outro cartório.':'Endereço parecido: '+esc(hit.end)+'.'} Confira antes de salvar; se for o mesmo, informe a matrícula e o cartório corretos.</div></div></div>`;
}

/* ---------- toast ---------- */
let tmr;
function toast(msg,err){const el=$('#toast');el.textContent=msg;el.className='toast show'+(err?' err':'');clearTimeout(tmr);tmr=setTimeout(()=>el.className='toast',2800)}

/* ---------- eventos ---------- */
function go(route,extra={}){Object.assign(UI,{route},extra);UI.modal=null;UI.showPropForm=false;render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a)return;
  const A=a.dataset.a;
  if(A==='scrim'){if(e.target===a){UI.modal=null;renderModal()}return}
  const p=UI.route==='terreno'?procOf(UI.id):null;
  switch(A){
    case 'nav':{const ex={};if(a.dataset.fd)ex.fD=a.dataset.fd;go(a.dataset.r,ex);break}
    case 'open':go('terreno',{id:a.dataset.id,tab:a.dataset.tab||'resumo',from:a.dataset.from||(UI.route==='terreno'?UI.from:UI.route)});break;
    case 'go-first-late':{const x=activeProcs().find(q=>lateTasks(q).length);if(x)go('terreno',{id:x.tid,tab:'resumo',from:'inicio'});break}
    case 'tab':UI.tab=a.dataset.t;UI.showPropForm=false;renderMain();if(a.closest('.adv')){const tb=document.querySelector('.tabs');if(tb)tb.scrollIntoView({behavior:'smooth',block:'start'})}break;
    case 'fT':UI.fT=a.dataset.v;renderMain();break;
    case 'fD':UI.fD=a.dataset.v;renderMain();break;
    case 'kView':UI.kView=a.dataset.v;renderMain();break;
    case 'role':UI.role=a.dataset.v;render();toast(`Testando como ${UI.role} (${me()}).`);break;
    case 'role-cycle':UI.role=UI.role==='Gestor'?'Analista':'Gestor';render();toast(`Testando como ${UI.role} (${me()}).`);break;
    case 'reset':S=seed();save();go('inicio');toast('Dados de exemplo restaurados.');break;
    case 'nova-oferta':UI.modal={k:'oferta'};renderModal();break;
    case 'close':UI.modal=null;renderModal();break;
    case 'advance':advance(p,false);break;
    case 'force':UI.modal={k:'force'};renderModal();break;
    case 'do-force':UI.modal=null;advance(p,true);break;
    case 'perder':UI.modal={k:'perder'};renderModal();break;
    case 'suspender':UI.modal={k:'suspender'};renderModal();break;
    case 'retomar':p.status='ativo';p.hist.push({kind:'etapa',para:p.etapa,em:TODAY_ISO,user:me(),txt:`Negociação retomada em ${SN(p.etapa)}`});delete p.retorno;save();render();toast('Negociação retomada.');break;
    case 'link-viab':UI.modal={k:'viab'};renderModal();break;
    case 'do-link':{const vgv=Number(a.dataset.vgv),pmax=Number(a.dataset.pmax);p.viab={id:'V-1'+S.seq.N,em:TODAY_ISO,vgv,margem:15.1,pmax};p.hist.push({kind:'etapa',para:p.etapa,em:TODAY_ISO,user:me(),txt:`Estudo ${p.viab.id} do BKM vinculado`});UI.modal=null;save();render();toast('Estudo vinculado.');break}
    case 'prop-form':UI.showPropForm=!UI.showPropForm;renderMain();if(UI.showPropForm)setTimeout(()=>{const x=$('#pp-v');if(x)x.focus()},30);break;
    case 'upload':UI.pendingUpload={pid:p.id,tipo:a.dataset.t};$('#file-in').value='';$('#file-in').click();break;
    case 'doc-ok':case 'doc-no':{const d=S.docs.find(x=>x.id===a.dataset.d);d.status=A==='doc-ok'?'validado':'rejeitado';p.hist.push({kind:'doc',em:TODAY_ISO,user:me(),txt:`${TIPOS[d.tipo].n} ${A==='doc-ok'?'validado':'rejeitado'}`});save();render();toast(A==='doc-ok'?'Documento validado.':'Documento rejeitado. Peça nova versão.');break}
  }
});
$('#file-in').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];const u=UI.pendingUpload;if(!f||!u)return;
  const p=S.procs.find(x=>x.id===u.pid);let d=docFor(u.pid,u.tipo);
  if(!d){d={id:'D-'+(S.seq.D++),pid:u.pid,tipo:u.tipo,status:'pendente',emitido:null,versoes:0,arquivo:null};S.docs.push(d)}
  d.arquivo=f.name;d.versoes++;d.emitido=TODAY_ISO;d.status='recebido';
  p.hist.push({kind:'doc',em:TODAY_ISO,user:me(),txt:`${TIPOS[u.tipo].n}: versão ${d.versoes} enviada (${f.name})`});
  UI.pendingUpload=null;save();render();toast(`Versão ${d.versoes} enviada. Falta validar.`);
});
document.addEventListener('change',e=>{
  const el=e.target;const p=UI.route==='terreno'?procOf(UI.id):null;
  if(el.dataset.ch==='task'){const k=p.tarefas.find(x=>x.id===el.dataset.k);k.feito=el.checked;save();render()}
  if(el.dataset.ch==='prop-status'){const lp=lastProp(p);lp.status=el.value;p.hist.push({kind:'prop',em:TODAY_ISO,user:me(),txt:`Proposta v${lp.v} marcada como ${el.value.toLowerCase()}`});save();render();toast(`Proposta v${lp.v}: ${el.value}.`)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q-top'||el.id==='q-page'){
    UI.q=el.value;
    if(el.id==='q-top'&&UI.route!=='terrenos'){UI.route='terrenos';UI.fT='todos';renderNav();renderMain()}
    else{const r=$('#terr-rows');if(r)r.innerHTML=terrenosRows()}
    const other=el.id==='q-top'?$('#q-page'):$('#q-top');if(other&&other.value!==el.value)other.value=el.value;
  }
  if(el.form&&el.form.dataset.form==='oferta')dedupeCheck();
  if(el.id==='pp-v'){const p=procOf(UI.id),v=money(el.value),w=$('#pp-warn');
    w.innerHTML=p.viab&&v>p.viab.pmax?`<div class="banner warn"><span>${ic('warn')}</span><div>${brl(v)} fica ${mi(v-p.viab.pmax)} acima do preço máximo da viabilidade (${mi(p.viab.pmax)}). Avançar vai exigir decisão do gestor.</div></div>`:(v?`<div class="hint">${p.viab?`${mi(p.viab.pmax-v)} abaixo do preço máximo.`:''}</div>`:'')}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,F=Object.fromEntries(new FormData(f));
  const p=UI.route==='terreno'?procOf(UI.id):null;
  if(f.dataset.form==='oferta'){
    const valor=money(F.valor),area=money(F.area);
    if(!valor||!area){toast('Informe área e valor pedido.',true);return}
    let tid=f.dataset.match;let novo=false;
    const corr=F.origem==='Corretor'?(F.corretor||'Corretor não informado'):F.corretor;
    if(!tid){novo=true;tid='T-0'+(++S.seq.T);
      S.terrenos.push({id:tid,bairro:F.bairro.trim(),end:F.end.trim(),cidade:'São Paulo',area,zon:'A definir',frente:0,mats:F.mat?[{num:F.mat,cri:F.cri}]:[],props:[{nome:'A confirmar',pct:100}]});}
    S.ofertas.push({id:'O-'+(++S.seq.O),tid,origem:F.origem,corretor:corr||'',em:TODAY_ISO,valor});
    let pr=procOf(tid);
    if(novo||!pr||pr.status==='perdida'){const id='N-0'+(++S.seq.N);
      pr={id,tid,etapa:'recebida',status:'ativo',resp:me(),aber:TODAY_ISO,ult:TODAY_ISO,viab:null,props:[],ativ:[],tarefas:[{id:'K'+Date.now(),t:'Triagem: localização e preço por m²',resp:me(),prazo:addDays(TODAY_ISO,3),feito:false}],
        hist:[{kind:'etapa',para:'recebida',em:TODAY_ISO,user:me(),txt:'Negociação aberta a partir da oferta'}]};S.procs.push(pr)}
    else pr.ativ.push({tipo:'Nota',em:TODAY_ISO,user:me(),txt:`Nova oferta de ${brl(valor)} recebida (${F.origem}${corr?' · '+corr:''}).`});
    save();go('terreno',{id:tid,tab:novo?'resumo':'ofertas',from:'terrenos'});
    toast(novo?`Terreno ${tid} criado com a oferta.`:`Oferta anexada ao terreno ${tid}.`);
  }
  if(f.dataset.form==='perder'){if(!F.motivo){toast('Escolha um motivo.',true);return}
    Object.assign(p,{status:'perdida',motivo:F.motivo,motivoTxt:F.txt,fim:TODAY_ISO});p.hist.push({kind:'fim',em:TODAY_ISO,user:me(),txt:`Encerrada como perdida: ${F.motivo}`});UI.modal=null;save();render();toast('Negociação encerrada como perdida.')}
  if(f.dataset.form==='suspender'){Object.assign(p,{status:'suspensa',retorno:F.retorno,motivoTxt:F.txt,fim:TODAY_ISO});p.hist.push({kind:'fim',em:TODAY_ISO,user:me(),txt:`Suspensa até ${fd(F.retorno)}`});UI.modal=null;save();render();toast(`Suspensa até ${fd(F.retorno)}.`)}
  if(f.dataset.form==='proposta'){const valor=money(F.valor);if(!valor){toast('Informe o valor.',true);return}
    const lp=lastProp(p);if(lp&&lp.status==='Em análise')lp.status=F.autor==='Nós'?'Recusada':'Contraproposta';
    const v=p.props.length+1;p.props.push({v,autor:F.autor,em:TODAY_ISO,valor,forma:F.forma,pct:Number(String(F.pct||'0').replace(',','.'))||0,cond:F.cond,status:F.autor==='Nós'?'Em análise':'Contraproposta'});
    p.hist.push({kind:'prop',em:TODAY_ISO,user:me(),txt:`Proposta v${v} registrada: ${mi(valor)} (${F.autor==='Nós'?'nossa':'do proprietário'})`});
    UI.showPropForm=false;save();render();toast(`Proposta v${v} registrada.`)}
  if(f.dataset.form==='tarefa'){p.tarefas.push({id:'K'+Date.now(),t:F.t,resp:F.resp,prazo:F.prazo,feito:false});save();render();toast('Tarefa adicionada.')}
  if(f.dataset.form==='ativ'){p.ativ.push({tipo:F.tipo,em:TODAY_ISO,user:me(),txt:F.txt});save();render();toast('Atividade registrada.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}});

render();
})();
</script>
