.adv-lista { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px }
.adv-lista li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 20px; color: var(--texto) }
.adv-lista li > span:first-child { flex: none; margin-top: 2px }
.adv-lista li .ok { color: #146c2e } .adv-lista li .no { color: #b3261e }
.adv-lista.adv-modal { padding: 4px 24px 8px }
.adv-l2 { display: flex; gap: 8px; align-items: center }
.adv-l2 > .btn.primary { flex: 1 1 auto; justify-content: center; min-width: 0 }
.adv-mais { position: relative; flex: none }
.adv-mb { width: 40px; min-width: 40px; padding: 0; justify-content: center }
.adv-menu { display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; min-width: 220px; background: var(--m-sc-low, #f0f4f9); border-radius: 12px; padding: 6px 0; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14) }
.adv-mais.aberto .adv-menu { display: block }
.adv-menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: var(--m-on-surface, var(--texto)); font-size: 14px; text-align: left; white-space: nowrap }
.adv-menu button:hover, .adv-menu button:focus-visible { background: rgba(127,127,127,.12); outline: 0 }
.adv-menu button.danger { color: #b3261e }
.pn-adv .adv.adv-c { padding: 14px 16px }
.pn-adv { overflow: visible; max-height: none }
.ro .adv-l2 { display: none }
:root[data-tema="escuro"] .adv-menu { background: #0d1530; box-shadow: 0 0 0 1px rgba(124,140,255,.2), 0 10px 28px rgba(0,0,0,.55) }
:root[data-tema="escuro"] .adv-menu button.danger { color: #ffb4ab }
:root[data-tema="escuro"] .adv-st.adv-st-pend { background: rgba(255,223,153,.12); color: #ffdf99; box-shadow: inset 0 0 0 1px rgba(255,223,153,.35) }
:root[data-tema="escuro"] .adv-st.adv-st-ok { background: rgba(196,238,208,.10); color: #a6e3b8; box-shadow: inset 0 0 0 1px rgba(166,227,184,.35) }
:root[data-tema="escuro"] .adv-lista li .ok { color: #a6e3b8 } :root[data-tema="escuro"] .adv-lista li .no { color: #ffb4ab }
/* Visão geral em uma coluna: o mapa de Localização vem primeiro */
@container bloco (max-width: 760px) { .geral { display: flex; flex-direction: column; align-items: stretch } .geral-c { display: contents } .geral .g-loc { order: -1 } }
/* pontos de interesse a pé */
.ent-l li.ent-vazio { grid-template-columns: minmax(0, 1fr) }
.ent-l li.ent-vazio .t2 { color: var(--texto-suave); font-style: italic }
.ent-pe { margin-top: 10px; display: block; line-height: 20px }
.ent-pe .linkbtn { font-size: inherit }
.ent-emp { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--m-outline-v, rgba(127,127,127,.25)) }
.ent-emp-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; font-size: 14px; font-weight: 500; color: var(--m-on-surface, var(--texto)) }
.ent-emp-h .linkbtn { display: inline-flex; align-items: center; gap: 4px; font-size: 14px }

/* ---------- lista lateral do mapa: número do pino, nome, área e lupa ---------- */
.mp-lst { display: flex; flex-direction: column; gap: 2px }
.mp-it { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 12px; padding: 8px 4px 8px 12px; border-radius: 12px; cursor: pointer; color: var(--m-on-surface, #1f1f1f) }
.mp-it:hover { background: rgba(31,31,31,.06) }
.mp-it:focus-visible { outline: 2px solid #0b57d0; outline-offset: -2px }
.mp-it.sel { background: #c2e7ff }
.mp-it .pin-mini { width: 26px; height: 26px; font-size: 12px }
.mp-it .t1 { font-size: 14px; font-weight: 500; line-height: 20px; white-space: normal; overflow: visible }
.mp-it .t2 { font-size: 13px; line-height: 18px; color: #444746; white-space: normal; overflow: visible }
.mp-lupa { width: 40px; height: 40px; border-radius: 20px; color: #444746 }
.mp-lupa:hover { background: rgba(31,31,31,.08); color: #0b57d0 }
.mp-lupa .bkm-ico { width: 22px; height: 22px }
.mp-it-a { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 4px 0 2px; font-size: 13px }
.mp-it-a .linkbtn { color: #0b57d0; font-weight: 500 }
:root[data-tema="escuro"] .mp-it { color: #e6ecff }
:root[data-tema="escuro"] .mp-it:hover { background: rgba(124,140,255,.08) }
:root[data-tema="escuro"] .mp-it.sel { background: rgba(99,112,255,.10); box-shadow: inset 0 0 0 1px rgba(124,140,255,.5) }
:root[data-tema="escuro"] .mp-it .t2, :root[data-tema="escuro"] .mp-lupa { color: #aab4d6 }
:root[data-tema="escuro"] .mp-it-a .linkbtn { color: #c9d6ff }
/* cartão do terreno selecionado sobre o mapa: só no celular, onde a lista fica abaixo do mapa */
.mp-cartao { display: none }
@media (max-width: 899px) {
  .mp-cartao:not(:empty) { display: block; position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1050 }
  .mp-cartao .mp-it { background: var(--m-surface, #fff); box-shadow: 0 1px 3px rgba(0,0,0,.2), 0 4px 12px rgba(0,0,0,.15) }
  :root[data-tema="escuro"] .mp-cartao .mp-it { background: #0d1530; box-shadow: 0 0 0 1px rgba(124,140,255,.35), 0 10px 28px rgba(0,0,0,.55) }
  .mapa-area:has(.mp-cartao:not(:empty)) .mp-legenda { display: none }
}

/* legenda do mapa: "Pontos de interesse" liga e desliga os pontos, depois das etapas */
.mp-leg-l .lg-sep { width: 100%; margin: 4px 0; border: 0; border-top: 1px solid var(--m-outline-variant, #c4c7c5) }
.lg-poi { width: 18px; height: 18px; display: grid; place-items: center; flex: none }
.lg-poi .poi-b { width: 12px; height: 12px; border-width: 2.5px; box-shadow: none }
.lg-i[aria-pressed="false"] .lg-poi { filter: grayscale(1) }
.lg-r { display: flex; align-items: center; gap: 2px }
.lg-r .lg-i { flex: 1; min-width: 0 }
.lg-d { width: 28px; height: 28px; flex: none }
.lg-h { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; padding: 0 4px 4px 0; margin-bottom: 2px; border-bottom: 1px solid var(--m-outline-variant, #c4c7c5) }
.lg-h .lg-v { width: 32px; height: 32px; flex: none }
:root[data-tema="escuro"] .lg-h { border-bottom-color: #1a2240 }
:root[data-tema="escuro"] .mp-leg-l .lg-sep { border-top-color: #1a2240 }

/* menu do clique direito no mapa (mesmo visual do menu do ponto) */
.mp-ctx { position: absolute; z-index: 1200; display: flex; flex-direction: column; min-width: 240px; width: auto }
.mp-ctx button { justify-content: flex-start !important; gap: 12px !important; white-space: nowrap }
.mp-ctx button .ic { color: #444746 }
:root[data-tema="escuro"] .mp-ctx button .ic { color: #aab4d6 }
/* concorrência no mapa e na legenda: quadrado roxo com prédio, sem o nome */
.conc { background: none; border: 0; overflow: visible }
.conc-b { display: grid; place-items: center; width: 24px; height: 24px; box-sizing: border-box; border-radius: 7px; background: #863d8f; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4) }
.conc.g { position: relative; width: 24px; height: 24px; transform: translateY(50%) }
.lg-poi .conc-b { width: 16px; height: 16px; border-radius: 5px; border-width: 1.5px; box-shadow: 0 0 0 1px rgba(0,0,0,.15) } .lg-poi .conc-b svg { width: 10px; height: 10px }
/* barra do mapa sem o fundo branco: só o seletor do tipo de mapa e o Importar KMZ/KML, cada um com a sua sombra */
.mapa-area .mp-barra { background: transparent !important; box-shadow: none !important; border-radius: 0 !important; align-items: center; flex-wrap: nowrap !important; flex-direction: row !important }
:root[data-tema="escuro"] .mapa-area .mp-barra { background: transparent !important }
@media (max-width: 899px) { .mp-barra .seg { min-width: 0; overflow-x: auto; scrollbar-width: none } }
/* Sobre o satélite (padrão), o segmentado sem fundo some: fundo translúcido com desfoque */
.mp-barra .seg { background: rgba(255,255,255,.78) !important; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-color: transparent !important; box-shadow: 0 1px 3px rgba(0,0,0,.2), 0 1px 2px rgba(0,0,0,.1) }
:root[data-tema="escuro"] .mp-barra .seg { background: rgba(6,12,32,.72) !important; box-shadow: 0 0 0 1px rgba(124,140,255,.35) }
.mp-barra .seg button { flex: 1 1 auto }
/* quadro do lugar (InfoWindow do Google): nome, nota e até 3 avaliações */
.lug { position: relative; font: 13px/1.4 "Google Sans Flex", system-ui, sans-serif; color: #1f1f1f; max-width: 290px; padding-right: 28px }
.lug .muted, .lug.muted { color: #5f6368 !important }
.lug-x { position: absolute; top: -4px; right: -6px; width: 32px; height: 32px; display: grid; place-items: center; border: 0 !important; border-radius: 16px; background: transparent !important; color: #444746 !important; cursor: pointer; padding: 0 !important; min-height: 0 !important; box-shadow: none !important }
.lug-x:hover { background: rgba(68,71,70,.08) !important }
.lug-n { font-size: 15px; font-weight: 500; margin-bottom: 2px }
.lug-e { font-size: 12px; margin-bottom: 6px }
.lug-nota { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px }
.lug-est { color: #e8a200; letter-spacing: 1px }
.lug-revs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 220px; overflow: auto; border-top: 1px solid #e3e3e3; padding-top: 8px }
.lug-ra { font-size: 12px } .lug-ra a { color: #0b57d0; font-weight: 500; text-decoration: none }
.lug-rt { margin-top: 2px; color: #444746; overflow-wrap: anywhere }
.lug-l { display: inline-block; margin-top: 8px; color: #0b57d0; font-weight: 500; text-decoration: none }
.lug-g { font-size: 11px; margin-top: 4px }
.mapa-area { container-type: inline-size }
@container (max-width: 600px) { .mapa-area .mp-barra { flex-wrap: wrap !important } .mapa-area .mp-busca { flex: 1 1 100%; max-width: none; order: -1; margin-right: 0 } .mapa-area .mp-barra .seg { flex: 1 1 0; min-width: 0; overflow-x: auto; scrollbar-width: none } }

/* ficha do terreno em painel sobre o mapa (lupa da lista lateral) */
.ficha-sheet { position: fixed; z-index: 30; top: 88px; right: 16px; bottom: 16px; width: min(560px, calc(100vw - 32px)); display: flex; flex-direction: column; background: var(--m-surface, #fff); border-radius: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.15), 0 12px 32px rgba(0,0,0,.18); overflow: hidden }
.fs-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 12px 12px 24px; border-bottom: 1px solid var(--m-outline-variant, #c4c7c5) }
.fs-e { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #444746; margin-bottom: 4px }
.fs-h h2 { font-size: 22px; line-height: 28px; font-weight: 400 }
.fs-s { font-size: 13px; color: #444746; margin-top: 2px }
.fs-b { flex: 1; overflow: auto; padding: 16px; overscroll-behavior: contain }
.fs-f { display: flex; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--m-outline-variant, #c4c7c5) }
.fs-ro .kv-ed, .fs-ro .ed, .fs-ro [data-a="edit"] { display: none !important }
.fs-ro .kv:has(.kv-ed) { grid-template-columns: minmax(120px, 38%) minmax(0, 1fr) }
:root[data-tema="escuro"] .ficha-sheet { background: #081028; box-shadow: 0 0 0 1px rgba(124,140,255,.35), 0 16px 40px rgba(0,0,0,.6) }
:root[data-tema="escuro"] .fs-h, :root[data-tema="escuro"] .fs-f { border-color: #1a2240 }
:root[data-tema="escuro"] .fs-e, :root[data-tema="escuro"] .fs-s { color: #aab4d6 }
@media (max-width: 899px) {
  .ficha-sheet { inset: 0; top: 0; width: auto; border-radius: 0; z-index: 35; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
  .fs-h { padding-left: 16px }
  .fs-b { padding: 12px }
  body[data-rota="mapa"] .fab { display: none !important }
}

/* ===== Alinhamento (out/2026): um só padrão de cabeçalho, rótulo, linha e controle em todos os quadros =====
   Recuo lateral do quadro (--q-px) e altura do cabeçalho (--q-cab) valem para card, sec e checklist.
   O cabeçalho tem altura mínima fixa e centra título, contadores e botões entre a borda e o fio de baixo;
   antes o padding de baixo era 0 e o título encostava no fio. */
:root { --q-px: 24px; --q-cab: 56px }
@media (max-width: 899px) { :root { --q-px: 16px } }
.card-h, .sec-h, .chk-gh { min-height: var(--q-cab); padding: 8px var(--q-px) !important; align-items: center; border-bottom: 1px solid var(--m-outline-var, var(--linha)) }
:root[data-tema="escuro"] .chk-gh { border-bottom-color: var(--m-outline-var) }
.card-h > h2, .sec-h > h2, .graf .card-h > h2 { flex: 1 1 0; font-size: 16px; line-height: 24px; font-weight: 500 }
.chk-gh .gt { flex: 1 1 0; font-size: 16px; line-height: 24px; font-weight: 500 }
.sec-h h2 .bkm-ico { width: 24px; height: 24px }
/* botão de texto no fim do cabeçalho ou da linha: o texto alinha com a margem do quadro, não 12 px antes */
:is(.card-h, .sec-h, .chk-gh) > .btn.text:last-child, :is(.card-h, .sec-h) > :last-child > .btn.text:last-child, .da > .btn.text:last-child { margin-right: -12px }
/* gráficos do Dashboard: mesmo cabeçalho dos outros quadros; barras alinhadas com o título */
.graf .card-b { padding-inline: calc(var(--q-px) - 8px) }
/* rótulos sem caixa-alta espaçada (regra do visual Material 3) */
:is(.kvg .k, .cond .lbl, .metric .ml, .area .as, .mini-tbl th, .tag-ref, .opt, .passo, .reu-p b, .reu-x .k, .lbl-up, .mp-legenda summary, .relevo-n .k, .chip.fase) { text-transform: none; letter-spacing: .01em }
:is(.kvg .k, .cond .lbl, .metric .ml, .mini-tbl th, .passo, .reu-p b, .reu-x .k, .lbl-up, .relevo-n .k) { font-size: 12px; font-weight: 500; color: var(--m-on-var, var(--texto-suave)) }
:is(.area .as, .tag-ref, .opt) { font-size: 12px }
/* lista de atenção do Início: sem quadro dentro do quadro; ícone e seta centrados na linha */
.alist { background: none; border: 0; border-radius: 0 }
.aitem { align-items: center }
.aitem:hover { background: rgba(31,31,31,.06) }
/* listas de chave e valor: quando alguma linha tem lápis, todas reservam a coluna e os valores alinham */
.kvl:has(> .kv > .kv-ed) > .kv:not(.editando) { grid-template-columns: minmax(120px, 38%) minmax(0, 1fr) 32px !important; align-items: center }
/* tabelas pequenas: célula centrada na altura da linha (o botão Remover não desce) */
.mini-tbl td { vertical-align: middle }
/* formulário em linha: botão de 40 px centrado nos campos de 44 px */
.inline-form > .btn { margin-bottom: 2px }
/* linhas de infraestrutura e de documento com o fio no recuo do quadro, como as demais listas */
.infra, .doc { margin-inline: var(--q-px); padding-inline: 0 }
.lista-vazia { padding: 12px 0 }
/* filtros de Tarefas: busca na mesma altura dos seletores */
.tk-filtros .search { min-height: 40px !important; height: 40px }
.tk-filtros .chk { min-height: 40px }
/* indicadores estreitos (Dashboard): o valor não quebra entre número e unidade */
.kpis-v .kpi { container-type: inline-size; min-width: 0 }
.kpis-v .kpi .v.sm { white-space: nowrap; font-size: clamp(14px, 17cqi, 18px) }
/* logs do painel: o fio fica no recuo do texto, não 8 px para fora */
.pn-log { border-bottom: 0; position: relative }
.pn-log:not(:last-child)::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 1px; background: var(--m-outline-var, var(--linha)) }
:root[data-tema="escuro"] .pn-log:not(:last-child)::after { background: rgba(124,140,255,.12) }
/* Condições pedidas: a segunda linha (permuta, observação) usa as mesmas colunas da primeira */
.cond + .grid2 { column-gap: var(--e6) }
.cond + .grid2 .lbl { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--m-on-var, var(--texto-suave)) }
@media (max-width: 899px) { .cond + .grid2 { column-gap: var(--e4) } }
.chk-gh + .doc { border-top: 0 }
.kv dd .chip { white-space: nowrap }
/* Condições pedidas: rótulo, valor e complemento em linhas comuns aos itens (rótulo de duas linhas não desce o valor do vizinho) */
.cond { row-gap: 0 !important }
.cond > div { display: grid; grid-row: span 3; grid-template-rows: subgrid; align-content: start; padding-bottom: var(--e6) }
@media (max-width: 899px) { .cond > div { padding-bottom: var(--e4) } }
.cond + .grid2 { margin-top: 0 !important }
.cond > div > .big { align-self: start }
/* quadro de avanço no painel: bloco tonal, não um quadro contornado dentro de outro */
.pn-adv .sec-adv.sec-adv { border: 0 !important; background: var(--m-sc-low) !important; border-radius: 16px !important }
:root[data-tema="escuro"] .pn-adv .sec-adv.sec-adv { background: rgba(124,140,255,.07) !important; border: 0 !important }
/* barras de rolagem finas e discretas (quadro de negociações, tabelas, painéis, página): trilho invisível,
   alça em cápsula na cor do texto secundário com transparência, mais forte ao passar o mouse */
:root { --rolagem: rgba(68,71,70,.28); --rolagem-h: rgba(68,71,70,.5) }
:root[data-tema="escuro"] { --rolagem: rgba(201,214,255,.18); --rolagem-h: rgba(201,214,255,.36) }
::-webkit-scrollbar { width: 10px; height: 10px }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent }
::-webkit-scrollbar-button { display: none; width: 0; height: 0 }
::-webkit-scrollbar-thumb { background: var(--rolagem); background-clip: padding-box; border: 3px solid transparent; border-radius: 999px; min-width: 40px; min-height: 40px }
::-webkit-scrollbar-thumb:hover, ::-webkit-scrollbar-thumb:active { background-color: var(--rolagem-h) }
@supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--rolagem) transparent } }

/* Dashboard: lista de terrenos abaixo dos gráficos; se não couber, some Código e Temperatura
   e, se ainda faltar espaço, desce para a largura inteira (ajustaDash) */
.dash-g { grid-template-rows: auto 1fr }
.dash-lado { grid-column: 1; grid-row: 1 / span 2 }
.dash-main { grid-column: 2; grid-row: 1 }
.dash-tab { grid-column: 2; grid-row: 2 }
.dash-g.tab-larga .dash-lado { grid-row: 1 }
.dash-g.tab-larga .dash-tab { grid-column: 1 / -1 }
.dash-tab.enxuta :is(.col-codigo, .col-temp) { display: none }
@media (max-width: 1100px) {
  .dash-g { grid-template-rows: none }
  .dash-lado, .dash-main, .dash-tab, .dash-g.tab-larga .dash-tab { grid-column: auto; grid-row: auto }
}

/* ===================== novo funil ===================== */
/* sino de notificações (barra superior) */
.sino-wrap { position: relative }
.sino-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--m-on-var); display: grid; place-items: center }
.sino-btn:hover { background: rgba(127,127,127,.14) }
.sino-n { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #b3261e; color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center }
.sino-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: min(380px, calc(100vw - 32px)); background: var(--m-sc-low); border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14); overflow: hidden }
.sino-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px 8px; font-weight: 500 }
.sino-l { max-height: min(420px, 60vh); overflow-y: auto }
.sino-i { display: flex; gap: 10px; width: 100%; padding: 10px 16px; border: 0; background: transparent; text-align: left; color: var(--m-on-surface); align-items: flex-start }
.sino-i:hover { background: rgba(127,127,127,.12) }
.sino-d { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; background: transparent }
.sino-i.nova .sino-d { background: var(--m-primary) }
.sino-i.nova .sino-t { font-weight: 500 }
.sino-c { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.sino-t { font-size: 14px; line-height: 20px }
.sino-s { font-size: 12px; color: var(--m-on-var) }
.sino-f { padding: 8px 16px 12px; border-top: 1px solid var(--m-outline-var) }
@media (max-width: 599px) { .sino-btn { width: 36px; height: 36px } .sino-menu { position: fixed; right: 16px; left: 16px; width: auto; top: 64px } }

/* linha do tempo do topo: data e subetapa debaixo do nome */
.sl-w { display: flex; flex-direction: column; min-width: 0 }
.sd { font-size: 12px; color: var(--m-on-var); white-space: nowrap }

/* chip de subetapa */
.chip.sub { background: var(--m-pc); color: var(--m-on-pc); border-color: transparent }
.chip.sub.warn { background: #ffdf99; color: #7a5900 }

/* quadro de avanço: subetapa e pedido de aprovação */
.adv-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--m-on-var); margin-bottom: 10px }
.adv-sub select { height: 32px; border-radius: 8px; border: 1px solid var(--m-outline); background: transparent; color: var(--m-on-surface); padding: 0 8px; font: inherit; font-size: 14px; max-width: 100% }
.adv-ap { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--m-on-var); border: 1px solid var(--m-outline-var); border-radius: 8px; padding: 2px 8px }
.adv-ped { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--m-pc); color: var(--m-on-pc); margin-bottom: 8px }
.adv-ped-t { display: flex; gap: 8px; align-items: center }
.adv-niv { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px }
.adv-niv li { display: flex; gap: 8px; align-items: center }
.adv-niv .nv-d { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; flex: none }
.adv-niv li.aprovado .nv-d { background: #146c2e; border-color: #146c2e; color: #fff }
.adv-niv .faint { margin-left: auto }
.adv-ped-a { display: flex; gap: 8px; flex-wrap: wrap }
:root[data-tema="escuro"] .adv-ped { background: rgba(99,112,255,.10); color: #c9d6ff; box-shadow: inset 0 0 0 1px rgba(124,140,255,.35) }
:root[data-tema="escuro"] .chip.sub { background: rgba(99,112,255,.14); color: #c9d6ff }

/* linha do tempo com datas (seção Negociação) */
.trilha { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px }
.tr-eh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.tr-e ul { list-style: none; margin: 6px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--m-outline-var); display: flex; flex-direction: column; gap: 4px }
.tr-e ul li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px }
.tr-e ul li .faint { font-size: 12px }

/* kanban: subetapa no card, pedido de aprovação, etapa clicável */
.ksub { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--m-on-pc); background: var(--m-pc); border-radius: 8px; padding: 2px 8px; align-self: flex-start; max-width: 100% }
.ksub > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.ksub > span { white-space: nowrap }
.kped { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #7a5900 }
.kcard.aprov { outline: 2px solid #ffdf99; outline-offset: -2px }
.katr { color: #b3261e !important; font-weight: 500 }
.col-ab { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: inherit; font: inherit; padding: 4px 6px; margin: -4px -6px; border-radius: 8px }
.col-ab span { text-align: left }
.col-ab:hover { background: rgba(127,127,127,.12) }
.col-s { font-size: 12px; padding: 0 var(--e2) var(--e1) }
:root[data-tema="escuro"] .ksub { background: rgba(99,112,255,.14); color: #c9d6ff }
:root[data-tema="escuro"] .kped { color: #ffdf99 }

/* relato com formatação */
.rt { border: 1px solid var(--m-outline); border-radius: 8px; overflow: hidden }
.rt-bar { display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid var(--m-outline-var) }
.rt-bar .iconbtn { width: 32px; height: 32px }
.rt-ed { min-height: 120px; padding: 10px 12px; outline: none; line-height: 1.5 }
.rt-ed:empty::before { content: attr(data-ph); color: var(--m-on-var) }
.rt-ed ul, .relato ul { margin: 4px 0; padding-left: 20px }
.relato p { margin: 4px 0 }

/* tarefa: colegas marcados */
.marc { display: flex; flex-wrap: wrap; gap: 4px 16px }

/* Configurações › Funil */
.cfg-abas { margin-bottom: 12px }
.cfg-t { display: flex; flex-direction: column; gap: 6px }
.cfg-r { display: grid; grid-template-columns: minmax(160px, 1.4fr) 110px minmax(240px, 2fr); gap: 10px; align-items: center }
.cfg-r.cfg-sub { grid-template-columns: 72px minmax(160px, 1.4fr) 110px minmax(240px, 2fr) 70px 70px }
.cfg-r.cfg-st { grid-template-columns: minmax(140px, 1fr) minmax(240px, 3fr) }
.cfg-r.cfg-mot { grid-template-columns: minmax(200px, 1fr) 100px 70px }
.cfg-r.cfg-nt { grid-template-columns: minmax(200px, 1.6fr) 70px minmax(140px, 1fr) }
.cfg-r.cfg-eq { grid-template-columns: minmax(160px, 1.4fr) 140px 160px 110px }
.cfg-hd { font-size: 12px; color: var(--m-on-var); font-weight: 500 }
.cfg-r input:not([type=checkbox]), .cfg-r select { height: 36px; border-radius: 8px; border: 1px solid var(--m-outline); background: transparent; color: var(--m-on-surface); padding: 0 10px; font: inherit; font-size: 14px; min-width: 0; width: 100% }
.cfg-r.inativa input:not([type=checkbox]) { color: var(--m-on-var); text-decoration: line-through }
.cfg-ap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
.cfg-ap select { width: auto !important }
.cfg-ord { display: flex; gap: 2px }
.cfg-ord .iconbtn { width: 32px; height: 32px; font-size: 16px }
.cfg-pre { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 8px }
.cfg-pre li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--m-sc-low) }
.cfg-docs { display: flex; flex-wrap: wrap; gap: 8px }
.linkbtn.danger { color: #b3261e }
@media (max-width: 899px) {
  .cfg-hd { display: none }
  .cfg-r, .cfg-r.cfg-sub, .cfg-r.cfg-st, .cfg-r.cfg-mot, .cfg-r.cfg-nt, .cfg-r.cfg-eq { grid-template-columns: 1fr 1fr; padding: 10px 0; border-bottom: 1px solid var(--m-outline-var) }
  .cfg-r > :first-child, .cfg-ap { grid-column: 1 / -1 }
  .cfg-r.cfg-sub > input:first-of-type { grid-column: 1 / -1 }
}
/* Fases: configuração, seção da ficha, chip da fase */
.cfg-r.cfg-fase { grid-template-columns: 72px minmax(160px, 1.4fr) 80px minmax(140px, 1fr) 80px 70px 70px }
.cfg-r.cfg-fe { grid-template-columns: 72px minmax(160px, 1fr) 100px minmax(260px, 2.4fr) 70px }
.cfg-subs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.cfg-subs .chip { gap: 4px }
.chip-x { border: 0; background: none; color: inherit; font-size: 16px; line-height: 1; padding: 0 2px; cursor: pointer }
.cfg-fs-add input { height: 30px !important; width: 140px !important; border-radius: 8px; border: 1px dashed var(--m-outline); background: transparent; color: var(--m-on-surface); padding: 0 10px; font: inherit; font-size: 13px }
.chip.fase-n { background: var(--m-sc-low); border-color: var(--m-outline-var); font-weight: 500 }
.fs-lst { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.fs-i { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--m-outline-var) }
.fs-i:last-child { border-bottom: 0 }
.fs-it { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.fs-st { display: inline-flex; flex-wrap: wrap; gap: 6px }
.fs-d { font-size: 13px }
.fs-deps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px }
.fs-deps li { display: flex; gap: 6px; align-items: center }
.fs-deps li.ok { color: #146c2e }
.fs-deps li.no { color: var(--m-on-var) }
:root[data-tema="escuro"] .fs-deps li.ok { color: #6dd58c }
.drill-h { display: flex; align-items: flex-start; gap: 8px }
.drill-v { margin: 2px 0 0 -8px; flex: none }
.drill-h:has(.drill-v) .sub { margin-left: 0 }
.drill-t { list-style: none; margin: 0 0 2px; padding: 0; display: flex; flex-wrap: wrap; font-size: 14px; color: var(--m-on-var) }
.drill-t li + li::before { content: "›"; margin: 0 6px; color: var(--m-on-var) }
.drill-t .linkbtn { font-size: 14px; padding: 0 }
.board-fases .ksub > span:first-child { white-space: normal }
.tl-topo .sd { overflow: hidden; text-overflow: ellipsis }
.fsel { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--m-on-var) }
.fsel select { height: 32px; border-radius: 8px; border: 1px solid var(--m-outline); background: transparent; color: var(--m-on-surface); padding: 0 8px; font: inherit; font-size: 14px }
@media (max-width: 899px) {
  .cfg-r.cfg-fase, .cfg-r.cfg-fe { grid-template-columns: 1fr 1fr; padding: 10px 0; border-bottom: 1px solid var(--m-outline-var) }
  .cfg-r.cfg-fase > input:first-of-type, .cfg-r.cfg-fe > input:first-of-type, .cfg-subs { grid-column: 1 / -1 }
}
/* celular: quatro papéis não cabem por extenso na barra; fica a inicial (nome completo no title) */
@media (max-width: 480px) {
}

/* Tema escuro: indicadores tonais, sem neon. Mesma luminosidade nos quatro, só o tom muda
   (oklch relativo); navegador sem suporte fica com o véu de color-mix */
:root[data-tema="escuro"] .kpi { background: color-mix(in srgb, var(--k, var(--neon-1)) 16%, transparent) !important; background: oklch(from var(--k, var(--neon-1)) 0.29 0.07 h) !important; border: 1px solid color-mix(in srgb, var(--k, var(--neon-1)) 60%, transparent) !important; border: 1px solid oklch(from var(--k, var(--neon-1)) 0.58 0.14 h) !important; box-shadow: none !important }
:root[data-tema="escuro"] .kpi .v { background: none !important; color: color-mix(in srgb, var(--k, var(--neon-1)) 40%, #fff) !important; color: oklch(from var(--k, var(--neon-1)) 0.86 0.09 h) !important; -webkit-text-fill-color: currentColor; text-shadow: none !important }

/* Selo do ambiente (fora da produção) */
.amb-selo { flex: none; align-self: center; padding: 2px 8px; border-radius: 8px; background: #ffdf99; color: #7a5900; font-size: 12px; line-height: 18px; font-weight: 500; white-space: nowrap }
.amb-selo .amb-c { display: none }
/* no celular não cabe na linha: vira etiqueta pequena sobre o canto do logo */
@media (max-width: 599px) { .top-in { position: relative } .amb-selo { position: absolute; left: 108px; top: 6px; padding: 0 5px; font-size: 10px; line-height: 15px; border-radius: 6px; pointer-events: none } .amb-selo .amb-l { display: none } .amb-selo .amb-c { display: inline } }
:root[data-tema="escuro"] .amb-selo { background: rgba(255,223,153,.14); color: #ffdf99; border: 1px solid rgba(255,223,153,.45) }

/* GeoSampa na inscrição: última consulta, o que toca o lote e os arquivos */
.geo-vazio { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 10px }
.geo { border: 1px solid var(--linha); border-radius: 12px; padding: 4px 16px 12px; margin: 6px 0 12px }
.geo-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 48px }
.geo-h > span { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px }
.geo-h .muted { font-size: 13px }
.geo-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); column-gap: 24px }
.geo-toca { margin-top: 10px }
.geo-st { font-size: 14px; font-weight: 500; margin: 6px 0 4px }
.geo-l { display: grid; grid-template-columns: minmax(140px, 38%) minmax(0, 1fr); gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--linha); font-size: 14px }
.geo-l .k { color: var(--texto-suave); font-size: 13px }
.geo-l .v { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; overflow-wrap: anywhere }
.geo-l .v .chip { height: auto; min-height: 24px; white-space: normal; text-align: left }
.geo-arq { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px }

/* Inscrição por cidade: a escolha do município ocupa a linha toda e quebra no celular */
.inline-form .field.full { flex: 1 1 100% }

/* ---------- Novo terreno pela poligonal (proto_novo.js) ---------- */
.nv-ops { display: flex; flex-direction: column; gap: 12px }
.nv-op { display: flex; gap: 16px; align-items: flex-start; text-align: left; width: 100%; padding: 16px; border: 1px solid var(--m-outline-var, #c4c7c5); border-radius: 12px; background: transparent; color: inherit; font: inherit; cursor: pointer }
button.nv-op:hover { background: rgba(11,87,208,.06) }
.nv-op > span:not(.nv-ic) b { display: block; font-weight: 500; font-size: 16px; line-height: 24px }
.nv-op .muted { display: block; font-size: 14px }
.nv-ic { flex: none; width: 24px; height: 24px; color: var(--m-primary, #0b57d0) }
.nv-kmz { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 16px }
.nv-kmz .lbl-f { flex: 1 1 100% }
.nv-sob { display: flex; flex-direction: column }
.nv-s { display: flex; gap: 12px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--m-outline-var, #c4c7c5) }
.nv-s-t { flex: 1 1 260px; min-width: 0 }
.nv-s-t .t1 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center }
.nv-s-t .t2 { font-size: 14px; color: var(--m-on-var, #444746); margin-top: 2px }
.nv-s-a { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end }
.nv-frentes { gap: 6px !important }
.nv-fr { display: flex; flex-direction: column; gap: 4px }
.nv-fr .opt-radio { justify-content: flex-start; white-space: normal; position: relative; border: 1px solid var(--m-outline-var, #c4c7c5); border-radius: 8px !important }
.nv-fr .opt-radio .faint { color: inherit; opacity: .75 }
@media (min-width: 900px) { .mp-barra .seg { flex: none } }
:root[data-tema="escuro"] .nv-op { border-color: #1a2240 }
:root[data-tema="escuro"] button.nv-op:hover { background: rgba(99,112,255,.10) }

/* busca de endereço na barra do mapa */
.mp-busca { position: relative; flex: 1 1 200px; max-width: 360px; min-width: 0; margin-right: auto; display: flex; align-items: center; height: 40px; border-radius: 20px; background: var(--m-surface, #fff); box-shadow: 0 1px 3px rgba(0,0,0,.2), 0 1px 2px rgba(0,0,0,.1) }
.mp-busca-i { position: absolute; left: 12px; top: 10px; width: 20px; height: 20px; color: var(--m-on-var, #444746); pointer-events: none }
.mp-busca input { flex: 1; min-width: 0; height: 40px; border: 0 !important; background: transparent !important; padding: 0 16px 0 42px !important; border-radius: 20px; font: inherit; font-size: 14px; color: inherit; outline-offset: -2px }
.mp-res { position: absolute; top: 46px; left: 0; right: 0; z-index: 3; background: var(--m-surface, #fff); border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.2); padding: 6px 0; max-height: 50vh; overflow: auto }
.mp-res button { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 10px 14px; border: 0; background: transparent; font: inherit; font-size: 14px; color: inherit; cursor: pointer }
.mp-res button:hover, .mp-res button:focus-visible { background: rgba(11,87,208,.08) }
.mp-res .ic { flex: none; color: var(--m-on-var, #444746) }
.mp-res .hint { padding: 8px 14px }
:root[data-tema="escuro"] .mp-busca, :root[data-tema="escuro"] .mp-res { background: #060c20; box-shadow: 0 0 0 1px rgba(124,140,255,.35) }
@media (max-width: 599px) { .mapa-area .mp-barra { flex-wrap: wrap !important } .mp-busca { flex: 1 1 100%; max-width: none; order: -1; margin-right: 0 } .mp-barra .seg { flex: 1 1 0 } }

/* Usar a poligonal dos lotes: desenhada (tracejada) x lotes da prefeitura */
.lotes-cmp { display: flex; gap: var(--e4); align-items: center; flex-wrap: wrap }
.lotes-svg { width: 180px; height: 180px; flex: none; background: var(--sup-2, #f0f4f9); border-radius: 12px }
.lotes-novo { fill: rgba(11, 87, 208, .18); stroke: #0b57d0; stroke-width: 2 }
.lotes-ant { fill: none; stroke: #b3261e; stroke-width: 2; stroke-dasharray: 5 4 }
.lotes-kv { flex: 1 1 220px; display: grid; gap: 8px; min-width: 0 }
.lotes-kv > div:not(.hint) { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--linha, #c4c7c5); padding-bottom: 6px }
.lotes-kv span { color: var(--texto-suave, #444746) }
.lotes-kv b { font-weight: 500; text-align: right }
.lotes-leg { display: inline-block; width: 18px; height: 0; vertical-align: middle; margin: 0 4px 0 8px; border-top: 2px solid #0b57d0 }
.lotes-leg-ant { border-top: 2px dashed #b3261e; margin-left: 0 }
html[data-tema="escuro"] .lotes-svg { background: #0d1530 }
html[data-tema="escuro"] .lotes-novo { fill: rgba(96, 165, 250, .2); stroke: #60a5fa }
html[data-tema="escuro"] .lotes-leg-novo { border-top-color: #60a5fa }

/* Kanban: arrastando um card, as colunas que aceitam ficam marcadas e a que está sob o card acende */
body.dnd .col[data-col]:not(.origem), body.dnd-tk .tk-col { outline: 2px dashed rgba(11, 87, 208, .35); outline-offset: -2px; transition: background-color .12s, outline-color .12s }
.col.sobre, .tk-col.sobre, .col.enc.sobre { background: #d3e3fd !important; outline: 2px solid #0b57d0 !important; outline-offset: -2px; box-shadow: none !important }
html[data-tema="escuro"] body.dnd .col[data-col]:not(.origem), html[data-tema="escuro"] body.dnd-tk .tk-col { outline-color: rgba(124, 140, 255, .35) }
html[data-tema="escuro"] .col.sobre, html[data-tema="escuro"] .tk-col.sobre { background: rgba(99, 112, 255, .18) !important; outline-color: rgba(124, 140, 255, .9) !important }

/* Mapa: botões do canto (minha localização, tela cheia), X do cartão do terreno e tela cheia (23/out/2026) */
.mp-ctrl { position: absolute; right: 10px; bottom: 40px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; transition: bottom .15s }
.mp-cb { width: 40px; height: 40px; border-radius: 20px; border: 0; display: grid; place-items: center; cursor: pointer; background: #fff; color: #444746; box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.15) }
.mp-cb:hover { color: #0b57d0; background: #f0f4f9 }
.mp-cb:focus-visible { outline: 2px solid #0b57d0; outline-offset: 2px }
.mp-cb.busca svg { animation: mp-pulso 1s ease-in-out infinite }
@keyframes mp-pulso { 50% { opacity: .35 } }
:root[data-tema="escuro"] .mp-cb { background: #0d1530; color: #c9d6ff; box-shadow: 0 0 0 1px rgba(124,140,255,.35), 0 6px 16px rgba(0,0,0,.5) }
:root[data-tema="escuro"] .mp-cb:hover { background: #142046 }
.mapa-area.sv-on .mp-cb[data-a="mp-eu"] { display: none }
.eu-dot { width: 16px; height: 16px; border-radius: 50%; background: #1a73e8; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 1px 4px rgba(0,0,0,.35); transform: translateY(50%) }
.mp-it.cartao { grid-template-columns: auto minmax(0, 1fr) auto auto; column-gap: 4px; padding-right: 4px }
.mp-it.cartao .mp-it-t { margin-left: 8px }
body.mp-cheia .mapa-area { position: fixed !important; inset: 0 !important; z-index: 25; height: auto !important; min-height: 0 !important; border-radius: 0 !important; margin: 0 !important }
body.mp-cheia .mapa-area .mp-barra { top: calc(12px + env(safe-area-inset-top, 0px)) }
body.mp-cheia .mp-ctrl { right: max(10px, env(safe-area-inset-right, 0px)) }
body.mp-cheia .fab { display: none !important }
/* Street View aberto na página Mapa: X próprio no canto de cima, à direita; cartão do terreno escondido */
.sv-x { display: none; position: absolute; top: 12px; right: 12px; z-index: 1100 }
.mapa-area.sv-on .sv-x { display: grid }
.mapa-area.sv-on .mp-cartao { display: none !important }
body.mp-cheia .sv-x { top: calc(12px + env(safe-area-inset-top, 0px)) }
/* indicadores (Início e Dashboard) no tema escuro: sóbrios, fundo escuro com faixa azul na lateral, número grande e leve em branco, rótulo cinza-azulado (versão A, decisão do Moisés, 23/out/2026) */
:root[data-tema="escuro"] .kpis .kpi { background: #0c1433 !important; border: 1px solid rgba(124,140,255,.28) !important; box-shadow: inset 3px 0 0 #7c8cff !important; container-type: inline-size }
:root[data-tema="escuro"] .kpis .kpi .v { color: #f2f5ff !important; -webkit-text-fill-color: currentColor; font-weight: 300 !important; font-size: min(34px, 26cqi) !important; white-space: nowrap; letter-spacing: -.01em; font-variant-numeric: tabular-nums }
:root[data-tema="escuro"] .kpis .kpi .v.sm { font-size: min(26px, 15.5cqi) !important }
:root[data-tema="escuro"] .kpis .kpi .l { color: #8e9ac4 !important; font-weight: 500 !important; font-size: 13px !important }
/* indicadores (Início e Dashboard) no tema claro: a mesma versão A, em branco com contorno claro e faixa azul da marca na lateral (decisão do Moisés, 23/out/2026) */
:root:not([data-tema="escuro"]) .kpis .kpi { background: #fff !important; border: 1px solid #dde3ea !important; box-shadow: inset 3px 0 0 #0b57d0 !important; container-type: inline-size }
:root:not([data-tema="escuro"]) .kpis .kpi .v { color: #1f1f1f !important; -webkit-text-fill-color: currentColor; font-weight: 300 !important; font-size: min(34px, 26cqi) !important; white-space: nowrap; letter-spacing: -.01em; font-variant-numeric: tabular-nums }
:root:not([data-tema="escuro"]) .kpis .kpi .v.sm { font-size: min(26px, 15.5cqi) !important }
:root:not([data-tema="escuro"]) .kpis .kpi .l { color: #5f6368 !important; font-weight: 500 !important; font-size: 13px !important }
/* no Início os indicadores são botões: a faixa fica vermelha (tarefas atrasadas) ou âmbar (fichas incompletas) quando há o que olhar; ao passar o mouse o contorno escurece (23/out/2026) */
:root[data-tema="escuro"] .kpis .kpi.crit { box-shadow: inset 3px 0 0 #f2b8b5 !important }
:root[data-tema="escuro"] .kpis .kpi.warn { box-shadow: inset 3px 0 0 #f5c451 !important }
/* tema claro: cada indicador com uma cor da paleta BKM na faixa (azul BKM, roxo, terracota, verde da marca; decisão do Moisés, 23/out/2026) */
:root:not([data-tema="escuro"]) .kpis .kpi:nth-child(4n+1) { box-shadow: inset 3px 0 0 #0094fe !important }
:root:not([data-tema="escuro"]) .kpis .kpi:nth-child(4n+2) { box-shadow: inset 3px 0 0 #863d8f !important }
:root:not([data-tema="escuro"]) .kpis .kpi:nth-child(4n+3) { box-shadow: inset 3px 0 0 #c67355 !important }
:root:not([data-tema="escuro"]) .kpis .kpi:nth-child(4n+4) { box-shadow: inset 3px 0 0 #7d8a3e !important }
:root[data-tema="escuro"] button.kpi:hover { border-color: rgba(124,140,255,.6) !important }
:root:not([data-tema="escuro"]) button.kpi:hover { border-color: #a8b3bf !important }
/* avatar do usuário na barra superior: o papel vem do perfil; o menu traz quem está entrando e, só no protótipo, a troca de usuário (decisão do Moisés, 23/out/2026) */
.perfil-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #8e4ec6; color: #fff; font-size: 14px; font-weight: 500; display: grid; place-items: center; cursor: pointer; margin-left: 4px }
.perfil-btn:hover, .perfil-btn[aria-expanded="true"] { box-shadow: 0 0 0 3px rgba(127,127,127,.25) }
.perfil-eu { display: flex; flex-direction: column; gap: 2px; padding: 10px 16px 10px; border-bottom: 1px solid var(--m-outline-var, #c4c7c5); margin-bottom: 4px }
.perfil-eu b { font-weight: 500; font-size: 14px } .perfil-eu span { font-size: 12px; color: var(--m-on-var, #444746) }
.perfil-av { width: 24px; height: 24px; border-radius: 50%; background: #8e4ec6; color: #fff; font-size: 12px; font-weight: 500; display: grid; place-items: center; flex: none }
#perfil .tema-menu { min-width: 240px }
/* partes do terreno (vários donos): resumo e um cartão por parte, cada um com a sua negociação (23/out/2026) */
.pt-res { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; margin-bottom: 16px }
.pt-res > div { display: flex; flex-direction: column; gap: 2px } .pt-res b { font-weight: 500; font-size: 16px }
.pt-res .lbl, .pt-f .lbl { font-size: 12px; color: var(--m-on-var, #444746) }
#sec-partes .banner { margin-bottom: 12px }
.pt-lista { display: flex; flex-direction: column; gap: 12px }
.pt-card { border: 1px solid var(--m-outline-var, #c4c7c5); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.pt-card.comprado { box-shadow: inset 3px 0 0 #146c2e } .pt-card.perdido, .pt-card.descartado { box-shadow: inset 3px 0 0 #b3261e } .pt-card.stand_by { box-shadow: inset 3px 0 0 #7a5900 }
.pt-card.fora { opacity: .7; border-style: dashed }
.pt-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap } .pt-n { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0 }
.pt-n b { font-weight: 500; font-size: 15px } .pt-n .num { font-size: 12px }
.pt-m { font-size: 13px } .pt-x { font-size: 13px }
.pt-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 16px; align-items: start }
.pt-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 14px } .pt-f select { height: 36px; max-width: 100% } .pt-f .faint { font-size: 12px }
.pt-f .temp { margin: 0 }
.pt-ped { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--m-sc-low, #f0f4f9) }
.pt-ped > span { margin-right: auto }
.pt-a { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.pt-a .adv-mais { margin-left: auto } .pt-a .adv-mais .adv-mb { width: 36px; padding: 0; justify-content: center }
.t-warn { color: #7a5900; font-weight: 500 }
.kcard .kpt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--m-on-var, #444746) }
.ptc-lista { display: flex; flex-direction: column; gap: 10px }
.ptc { border: 1px solid var(--m-outline-var, #c4c7c5); border-radius: 12px; padding: 8px 8px 10px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.ptc-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 36px } .ptc-h b { font-weight: 500; font-size: 15px } .ptc-h > .faint { font-size: 13px; margin-right: auto }
.ptc-l { display: flex; gap: 12px; font-size: 14px; min-width: 0; padding-right: 8px } .ptc-l > .faint:first-child { flex: 0 0 96px; font-size: 13px } .ptc-l > span:last-child { min-width: 0; overflow-wrap: anywhere }
.msel { min-width: 0 }
.msel-b { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--m-outline, #747775); border-radius: 4px; padding: 6px 8px 6px 14px; background: transparent; text-align: left; cursor: pointer; font-size: 15px }
.msel-b .ic { margin-left: auto; flex: none; transform: rotate(90deg); transition: transform .15s } .msel.aberto .msel-b .ic { transform: rotate(-90deg) }
.msel-r { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.msel-m { margin-top: 4px; border: 1px solid var(--m-outline-var, #c4c7c5); border-radius: 8px; padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; max-height: 240px; overflow: auto; background: var(--m-surface, #fff) }
.msel-m[hidden] { display: none } .msel-m .chk { min-height: 36px } .msel-m .btn { align-self: flex-start; margin: 4px 0 2px -12px } .msel-v { padding: 6px 0; font-size: 13px }
.ms-scrim { z-index: 60 } .dialog.mini { width: min(400px, 100%); padding: 24px } .dialog.mini h2 { font-size: 22px; line-height: 28px; font-weight: 400 } .dialog.mini .fields { grid-template-columns: 1fr }
.nv-pt { border: 1px solid var(--m-outline-var, #c4c7c5); border-radius: 12px; padding: 4px 16px 12px; margin: 0 0 12px; min-width: 0 }
.nv-pt legend { padding: 0 6px; font-size: 13px; font-weight: 500; color: var(--m-on-var, #444746) }
.nv-pt .btn { margin-top: 8px }
:root[data-tema="escuro"] .pt-card { border-color: rgba(124,140,255,.22); background: #060c20 }
:root[data-tema="escuro"] .ptc, :root[data-tema="escuro"] .nv-pt { border-color: rgba(124,140,255,.22) }
:root[data-tema="escuro"] .pt-ped { background: rgba(124,140,255,.07) }
:root[data-tema="escuro"] .t-warn { color: #f5c451 }
:root[data-tema="escuro"] .pt-card.comprado { box-shadow: inset 3px 0 0 #6dd58c } :root[data-tema="escuro"] .pt-card.perdido, :root[data-tema="escuro"] .pt-card.descartado { box-shadow: inset 3px 0 0 #f2b8b5 } :root[data-tema="escuro"] .pt-card.stand_by { box-shadow: inset 3px 0 0 #f5c451 }
:root[data-tema="escuro"] .msel-b { border-color: rgba(124,140,255,.35) } :root[data-tema="escuro"] .msel-m { background: #060c20; border-color: rgba(124,140,255,.22) }

/* ==== Filtros (Terrenos, Mapa e Fases): barra com chips e gaveta à direita ==== */
.fx-barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; min-width: 0 }
.fx-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; border: 1px solid #747775; background: transparent; color: #1f1f1f; font-family: inherit; font-size: 14px; font-weight: 500; line-height: 20px; cursor: pointer }
.fx-btn[aria-pressed="true"] { background: #c2e7ff; border-color: #c2e7ff; color: #001d35 }
.fx-n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #0b57d0; color: #fff; font-size: 12px; font-weight: 500 }
.fx-chip { display: inline-flex; align-items: center; gap: 2px; min-height: 32px; max-width: 100%; padding: 0 2px 0 12px; border-radius: 8px; border: 1px solid #c4c7c5; font-size: 14px; font-weight: 500; color: #1f1f1f; min-width: 0 }
.fx-chip { overflow-wrap: anywhere }
.fx-cx { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 0; border-radius: 14px; background: none; color: #444746; cursor: pointer }
.fx-cx:hover { background: rgba(31,31,31,.08) }
.fx-limpar { font-size: 14px }
.fx-visw { margin-left: auto; display: flex; align-items: center; gap: 4px; min-width: 0 }
.fx-vis { display: flex; min-width: 0; align-items: center; gap: 8px; font-size: 14px; color: #444746 }
.fx-vis select { height: 40px; border-radius: 20px; border: 1px solid #747775; padding: 0 12px; background: transparent; color: #1f1f1f; font-family: inherit; font-size: 14px; max-width: 220px }
.fx-vx { width: 40px; height: 40px }
.mapa-lado .fx-barra { margin: 8px 0 4px } .mapa-lado .fx-visw { margin-left: 0; flex: 1 1 100% } .mapa-lado .fx-vis { flex: 1 } .mapa-lado .fx-vis select { flex: 1; max-width: none; min-width: 0 }
.fx-scrim { position: fixed; inset: 0; z-index: 36; background: rgba(0,0,0,.16) }
.fx-dr { position: fixed; z-index: 37; top: 0; right: 0; bottom: 0; width: min(400px, 100vw); display: flex; flex-direction: column; background: #fff; color: #1f1f1f; border-radius: 16px 0 0 16px; box-shadow: 0 8px 28px rgba(0,0,0,.18) }
.fx-h { display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 0 12px 0 24px; border-bottom: 1px solid #e3e3e3 }
.fx-h h2 { flex: 1; font-size: 22px; line-height: 28px; font-weight: 400 }
.fx-b { flex: 1; overflow-y: auto; overscroll-behavior: contain }
.fx-s { border-bottom: 1px solid #e3e3e3 }
.fx-sh { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 20px 0 24px; border: 0; background: none; color: inherit; font-family: inherit; font-size: 16px; font-weight: 500; line-height: 24px; cursor: pointer; text-align: left }
.fx-sh .ic { margin-left: auto; transform: rotate(90deg); transition: transform .15s; color: #444746 } .fx-sh[aria-expanded="true"] .ic { transform: rotate(-90deg) }
.fx-sn { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 7px; border-radius: 10px; background: #c2e7ff; color: #001d35; font-size: 12px }
.fx-sb { display: flex; flex-direction: column; gap: 16px; padding: 0 24px 20px }
.fx-c { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.fx-l { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 500; color: #444746 } .fx-l small { font-weight: 400; text-align: right }
.fx-sub { font-size: 12px; color: #5f6368; margin-top: 2px }
.fx-ops { display: flex; flex-wrap: wrap; gap: 6px }
.fx-op { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #c4c7c5; background: transparent; color: #1f1f1f; font-family: inherit; font-size: 13px; font-weight: 500; line-height: 18px; cursor: pointer; text-align: left }
.fx-op[aria-pressed="true"] { background: #c2e7ff; border-color: #c2e7ff; color: #001d35 }
.fx-op .q { font-weight: 400; color: #5f6368 } .fx-op[aria-pressed="true"] .q { color: #0b3a66 }
.fx-op[data-zero] { color: #8e918f } .fx-op[data-zero] .q { color: #a8aaa9 }
.fx-sem { align-self: flex-start }
.fx-in { height: 40px; width: 100%; min-width: 0; border: 1px solid #747775; border-radius: 8px; padding: 0 12px; background: transparent; color: inherit; font-family: inherit; font-size: 14px }
.fx-r { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 8px } .fx-r > span, .fx-r1 > span { font-size: 13px; color: #444746 }
.fx-r1 { display: flex; align-items: center; gap: 8px } .fx-r1 .fx-in { width: 96px; flex: none }
.fx-hint { font-size: 12px; color: #5f6368 }
.fx-f { display: flex; align-items: center; gap: 8px; padding: 12px 16px 12px 24px; border-top: 1px solid #e3e3e3; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)) }
.fx-tot { flex: 1; font-size: 14px; color: #444746 }
@media (max-width: 699px) {
  .fx-dr { width: 100vw; border-radius: 0; padding-top: env(safe-area-inset-top, 0px) }
  .fx-visw { margin-left: 0; flex: 1 1 100% } .fx-vis { flex: 1 } .fx-vis select { flex: 1; max-width: none; min-width: 0 }
  .fx-h { padding-left: 16px } .fx-sh { padding-left: 16px; padding-right: 12px } .fx-sb { padding: 0 16px 20px } .fx-f { padding-left: 16px }
}
:root[data-tema="escuro"] .fx-dr { background: #060c20; color: #e6ecff; box-shadow: 0 0 0 1px rgba(124,140,255,.2), 0 10px 28px rgba(0,0,0,.55) }
:root[data-tema="escuro"] .fx-scrim { background: rgba(0,0,0,.4) }
:root[data-tema="escuro"] :is(.fx-h, .fx-s, .fx-f) { border-color: #1a2240 }
:root[data-tema="escuro"] :is(.fx-btn, .fx-chip, .fx-op, .fx-in, .fx-vis select) { border-color: rgba(124,140,255,.25); color: #e6ecff }
:root[data-tema="escuro"] :is(.fx-btn, .fx-op)[aria-pressed="true"], :root[data-tema="escuro"] .fx-sn { background: rgba(99,112,255,.10); border-color: rgba(124,140,255,.5); color: #c9d6ff }
:root[data-tema="escuro"] .fx-n { background: #7c8cff; color: #081028 }
:root[data-tema="escuro"] :is(.fx-l, .fx-hint, .fx-tot, .fx-sub, .fx-vis, .fx-op .q, .fx-r > span, .fx-r1 > span, .fx-cx, .fx-sh .ic) { color: #8e9ac4 }
:root[data-tema="escuro"] .fx-op[aria-pressed="true"] .q { color: #c9d6ff }
:root[data-tema="escuro"] .fx-op[data-zero] { color: #5d688f }
:root[data-tema="escuro"] .fx-vis select { background: #081028 }
:root[data-tema="escuro"] .fx-in { background: transparent }
/* ---------- Concorrência: quadro ao tocar no ícone e gaveta de cadastro ---------- */
.cc-box { position: absolute; z-index: 1060; top: 64px; right: 10px; width: min(400px, calc(100% - 20px)); max-height: calc(100% - 150px); overflow-y: auto; overscroll-behavior: contain; background: #fff; color: #1f1f1f; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.16); padding: 4px 0 12px }
.cc-hd { display: flex; align-items: flex-start; gap: 8px; padding: 12px 8px 4px 20px }
.cc-ti { flex: 1; min-width: 0 } .cc-n { font-size: 16px; line-height: 24px; font-weight: 500 }
.cc-ti .muted { font-size: 14px; line-height: 20px }
.cc-k { margin: 8px 20px 4px; padding: 12px 16px; border-radius: 12px; background: #f3f0f7; border-left: 3px solid #863d8f }
.cc-big { font-size: 24px; line-height: 32px; font-weight: 400 } .cc-k .faint { font-size: 12px; line-height: 16px }
.cc-meta { padding: 4px 20px 0; font-size: 14px; line-height: 20px }
.cc-tw { margin-top: 8px; overflow-x: auto }
.cc-t { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px }
.cc-t th { font-weight: 500; color: #444746; text-align: left; padding: 8px 6px; border-bottom: 1px solid #e3e3e3; white-space: nowrap }
.cc-t td { padding: 8px 6px; border-bottom: 1px solid #eef0f2; vertical-align: top } .cc-t .num { text-align: right; white-space: nowrap }
.cc-t :is(th, td):first-child { padding-left: 20px } .cc-t :is(th, td):last-child { padding-right: 20px }
.cc-t td .faint { font-size: 12px } .cc-tr.cc-tem { cursor: pointer } .cc-tr.cc-tem:hover { background: #f3f6fc }
.cc-tr .ic { vertical-align: -2px; margin-left: 2px; transition: transform .15s } .cc-tr[aria-expanded="true"] .ic { transform: rotate(180deg) }
.cc-h-r td { background: #f8fafd; padding-top: 4px; padding-bottom: 4px }
.cc-hl { list-style: none; margin: 0; padding: 0 } .cc-hl li { display: grid; grid-template-columns: 76px 1fr 1fr 1fr; gap: 8px; padding: 4px 0; font-size: 12px }
.cc-ac { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px 0 } .cc-ac [data-a=cc-desat] { margin-left: auto }
.cc-dr .cc-f { padding: 8px 24px 24px } .cc-sec { padding: 12px 0; border-bottom: 1px solid #e3e3e3 } .cc-sec:last-child { border-bottom: 0 }
.cc-sh { font-size: 16px; line-height: 24px; font-weight: 500; margin-bottom: 8px }
.cc-dr .fields { grid-template-columns: 1fr 1fr; gap: 12px } .cc-dr .field.full { grid-column: 1 / -1 } .cc-dr .hint { margin-top: 8px }
.cc-emp { display: flex; gap: 8px; align-items: center } .cc-emp select { flex: 1; min-width: 0 }
.cc-tp { border: 1px solid #c4c7c5; border-radius: 12px; padding: 8px 16px 16px; margin-bottom: 12px }
.cc-tp-h { display: flex; align-items: center; justify-content: space-between; min-height: 40px; font-weight: 500; font-size: 14px; margin-right: -8px }
@media (max-width: 899px) {
  .cc-box { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 62% }
  .mapa-area:has(.cc-box) .mp-legenda { display: none }
  .cc-dr .cc-f { padding: 8px 16px 24px }
}
:root[data-tema="escuro"] .cc-box { background: #0d1530; color: #e6ecff; box-shadow: 0 0 0 1px rgba(124,140,255,.35), 0 10px 28px rgba(0,0,0,.55) }
:root[data-tema="escuro"] .cc-k { background: rgba(168,85,247,.10); border-left-color: #a855f7 }
:root[data-tema="escuro"] .cc-t th { color: #8e9ac4; border-color: #1a2240 } :root[data-tema="escuro"] .cc-t td { border-color: #1a2240 }
:root[data-tema="escuro"] .cc-tr.cc-tem:hover, :root[data-tema="escuro"] .cc-h-r td { background: rgba(99,112,255,.08) }
:root[data-tema="escuro"] :is(.cc-sec) { border-color: #1a2240 } :root[data-tema="escuro"] .cc-tp { border-color: rgba(124,140,255,.25) }
.cc-tn { white-space: nowrap }
/* pino sem o número dentro (pedido do Moisés, 24/out/2026): só um ponto no meio */
.pin-b b.pin-d { display: block; width: 8px; height: 8px; border-radius: 50%; font-size: 0 }
/* olhinho e lixeira nos logs (pedido do Moisés, 24/out/2026) */
.pn-la { display: flex; justify-content: flex-end; gap: 2px; margin: 2px -6px -4px 0 }

.pn-lb:hover { background: rgba(127,127,127,.12) }

.pn-log.off .avatar, .pn-log.desf .avatar { filter: grayscale(1); opacity: .55 }
.pn-lx { font-size: 12px; color: #b3261e; margin-top: 2px }
.pn-lconf { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: #ffdad6; color: #410e0b; font-size: 13px; line-height: 18px; cursor: default }
.pn-lconf-b { display: flex; justify-content: flex-end; gap: 4px; margin-top: 6px }
.pn-lconf .btn.primary.crit { background: #b3261e !important; color: #fff !important; border-color: transparent !important }
.log-previa { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 8px 8px 8px 16px; margin-bottom: 12px; border-radius: 12px; background: #ffdf99; color: #3f2e00; font-size: 14px; line-height: 20px }
.log-previa > span { flex: 1 1 220px }
.log-previa .btn.text { color: #3f2e00 !important; font-weight: 500 }

    <div class="areas">${cards.map(([v,l,f,s])=>`<div class="area ${t.fonteArea===f?'sel':''}"${f==='poligonal'?' title="Calculada pelo desenho; muda quando a poligonal é ajustada"':''}><div class="al">${l} <span class="faint">· ${s}</span></div><div class="av">${v==null?'<span class="faint" style="font-size:14px;font-style:italic">Não informada</span>':m2(v)}</div>${t.fonteArea===f?'<div class="as">Área adotada</div>':''}</div>`).join('')}</div>
    ${div}<div class="kvg" style="margin-top:14px"><div><div class="k">Área adotada</div>${ad==null?'<span class="v ni">Escolha a fonte</span>':`<div class="v">${m2(ad)}</div>`}</div><div><div class="k">Testada principal</div>${t.testada==null?ni:`<div class="v">${num(t.testada,2)} m</div>`}</div>
    <div><div class="k">Valor pedido por m²</div>${ad&&ofertaRef(t)?.valor?`<div class="v">${brl(ofertaRef(t).valor/ad)}</div>`:ni}</div></div></div></section>`;
  return `<section class="sec" id="sec-areas"><form data-form="areas"><div class="sec-h"><h2>Áreas e dimensões</h2></div><div class="sec-b"><div class="editgrid">
    ${vals.map(([k,l,,s])=>`<div class="field"><label for="f-${k}">${l} (${s})</label><input id="f-${k}" name="${k}" inputmode="decimal" placeholder="m²" value="${t[k]==null?'':String(t[k]).replace('.',',')}"></div>`).join('')}
    <div class="field"><label>Poligonal (desenho no mapa)</label><div class="v" style="padding:10px 0">${apol==null?'<span class="ni">Sem poligonal</span>':m2(apol)} <span class="faint">· calculada</span></div></div>
    <div class="field"><label for="f-fonteArea">Área adotada vem de</label>${optSel('fonteArea',OPT.fonteArea,t.fonteArea)}</div>
    <div class="field"><label for="f-testada">Testada principal (m)</label><input id="f-testada" name="testada" inputmode="decimal" value="${t.testada==null?'':String(t.testada).replace('.',',')}"></div>
    </div><div class="hint" style="margin-top:8px">A área adotada é sempre uma das cinco acima, com a fonte registrada. A da poligonal é calculada pelo desenho e acompanha cada ajuste. Medidas de terrenos irregulares (segmentos e confrontações) entram depois em tabela própria.</div></div>
    <div class="sec-f"><button type="button" class="btn text" data-a="cancel-edit">Cancelar</button><button class="btn primary">Salvar</button></div></form></section>`;
}
function secaoMats(t){

function secaoInsc(t){
  const vig=ins=>{const r={};ins.valores.filter(v=>v.vig).forEach(v=>{r[v.ex]=v});return Object.values(r).sort((a,b)=>b.ex-a.ex)};
  const venal=v=>v.vt!=null&&v.vc!=null?v.vt+v.vc:(v.venal??v.vt??null);
  return `<section class="sec" id="sec-insc"><div class="sec-h"><h2>Inscrições municipais, valor venal e IPTU</h2>${UI.role!=='Leitura'&&lotesInsc(t).length?`<button class="btn sm text" data-a="lotes-poly" ${LOTES_BUSCANDO?'disabled':''}>${ic('layers',16)}${LOTES_BUSCANDO?'Buscando os lotes...':'Usar a poligonal dos lotes'}</button>`:''}</div><div class="sec-b">
    ${t.insc.length?t.insc.map((ins,i)=>{const vs=vig(ins),revs=ins.valores.filter(v=>!v.vig).length;return `<div style="margin-bottom:18px"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px"><b class="num">${CIDADES_INSC[insCid(ins)].rotulo} ${esc(ins.sql)}</b><span class="muted" style="font-size:13px">${esc(CIDADES_INSC[insCid(ins)].cidade)}</span><span class="muted" style="font-size:13px">Área cadastral ${m2(ins.area)}</span>${revs?`<span class="faint" style="font-size:12px">${revs} revis${revs>1?'ões anteriores preservadas':'ão anterior preservada'}</span>`:''}</div>
      ${loteQuadro(t,ins,i)}
      <div class="tblwrap"><table class="mini-tbl"><thead><tr><th>Exercício</th><th class="r">Venal terreno</th><th class="r">Venal construção</th><th class="r">Venal do imóvel</th><th>IPTU</th><th class="r">Anual</th><th class="r">Parcela</th><th class="r">Mensal</th><th>Fonte</th></tr></thead><tbody>
      ${vs.map((v,j)=>`<tr><td><b>${v.ex}</b>${v.rev>1?` <span class="faint" style="font-size:11px">rev. ${v.rev}</span>`:''}${j===0?' <span class="tag-ref">atual</span>':''}</td><td class="r">${brl(v.vt)}</td><td class="r">${brl(v.vc)}</td><td class="r"><b>${brl(venal(v))}</b></td>
      <td>${v.sit==='isento'?'<span class="chip good">Isento</span>':OPT.sitIptu[v.sit]}</td><td class="r">${v.sit==='isento'?'—':brl2(v.iptu)}</td><td class="r">${v.iptu!=null&&v.parc&&v.sit!=='isento'?`${brl2(v.iptu/v.parc)} <span class="faint">× ${v.parc}</span>`:'—'}</td>
      <td class="r">${v.sit==='isento'?'—':v.mensal!=null?`${brl2(v.mensal)}<div class="faint" style="font-size:11px">informado</div>`:v.iptu!=null?`${brl2(v.iptu/12)}<div class="faint" style="font-size:11px">anual ÷ 12</div>`:'—'}</td><td class="muted" style="font-size:12px">${esc(v.fonte||'—')}${v.data?`<div>${fd(v.data)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">Sem valores lançados.</td></tr>'}</tbody></table></div>
      <details class="details"><summary>Lançar exercício ou corrigir valores</summary><form class="inline-form" data-form="iptu" data-i="${i}" style="border:0;padding-top:4px">
      <div class="field" style="flex:0 1 96px"><label for="v-e${i}">Exercício</label><input id="v-e${i}" name="ex" inputmode="numeric" value="${new Date().getFullYear()}" required></div>
      <div class="field"><label for="v-vt${i}">Venal terreno (R$)</label><input id="v-vt${i}" name="vt" inputmode="decimal"></div><div class="field"><label for="v-vc${i}">Venal construção (R$)</label><input id="v-vc${i}" name="vc" inputmode="decimal"></div>
      <div class="field"><label for="v-s${i}">Situação do IPTU</label><select id="v-s${i}" name="sit">${Object.entries(OPT.sitIptu).map(([k,l])=>`<option value="${k}" ${k==='tributado'?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label for="v-i${i}">IPTU anual (R$)</label><input id="v-i${i}" name="iptu" inputmode="decimal"></div><div class="field" style="flex:0 1 86px"><label for="v-p${i}">Parcelas</label><input id="v-p${i}" name="parc" inputmode="numeric" value="10"></div>
      <div class="field"><label for="v-m${i}">IPTU mensal informado (R$)</label><input id="v-m${i}" name="mensal" inputmode="decimal" placeholder="se a fonte trouxer"></div>
      <div class="field grow"><label for="v-f${i}">Fonte</label><input id="v-f${i}" name="fonte" placeholder="Carnê, certidão de dados cadastrais..." required></div>
      <button class="btn sm">${ic('add',16)}Lançar</button></form><div class="hint">Lançar um exercício que já existe cria uma revisão nova; a anterior fica guardada.</div></details></div>`}).join(''):'<div class="muted" style="margin-bottom:8px">Nenhuma inscrição. O valor venal e o IPTU são lançados por inscrição e por ano.</div>'}
    <form class="inline-form" data-form="insc">${campoInsc('i',cidDoTerreno(t),'Nova inscrição',true)}<div class="field"><label for="i-a">Área cadastral (m²)</label><input id="i-a" name="area" inputmode="decimal"></div><button class="btn sm">${ic('add',16)}Adicionar inscrição</button></form>
    <div class="hint" style="margin-top:8px">Em São Paulo o IPTU é anual, em até 10 parcelas. Se a fonte trouxer o valor mensal, ele é usado; senão, o mensal mostrado é o anual ÷ 12.</div></div></section>`;
}

}

  return `<section class="sec" id="sec-pessoas"><div class="sec-h"><h2>Proprietários e contatos</h2></div><div class="sec-b">
    ${t.pessoas.length?`<div class="tblwrap"><table class="mini-tbl"><thead><tr><th>Nome</th><th>Vínculo</th><th class="r">Participação</th><th>Telefone</th>${partesAtivas(t).length?'<th>Parte</th>':''}<th></th></tr></thead><tbody>${t.pessoas.map((p,i)=>`<tr><td>${esc(p.nome)} <span class="faint" style="font-size:12px">${p.tipo}</span></td><td>${OPT.papel[p.papel]}</td><td class="r">${p.pct!=null?num(p.pct,2)+'%':'—'}</td><td>${esc(p.tel||'—')}</td>${partesAtivas(t).length?`<td>${selParte(t,'pes-parte',i,p.parte)}</td>`:''}<td class="r"><button class="btn sm text danger" data-a="del-pes" data-i="${i}">Remover</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Ninguém vinculado.</div>'}

    <div class="field"><label for="p-p">Vínculo</label><select id="p-p" name="papel">${Object.entries(OPT.papel).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div><div class="field" style="flex:0 1 110px"><label for="p-pc">% (prop.)</label><input id="p-pc" name="pct" inputmode="decimal"></div>

  if(UI.edit==='cond'&&o)return `<section class="sec"><form data-form="cond"><div class="sec-h"><h2>Condições pedidas</h2><span class="faint" style="font-size:12px">editando a oferta de ${fd(o.data)}</span></div><div class="sec-b"><div class="editgrid">
    <div class="field"><label for="c-v">Valor pedido (R$)</label><input id="c-v" name="valor" inputmode="decimal" value="${o.valor==null?'':num(o.valor)}"></div>
    <div class="field"><label for="c-f">Forma de pagamento pedida</label>${optSel('forma',OPT.forma,o.forma).replace('id="f-forma"','id="c-f"')}</div>
    <div class="field"><label for="c-c">Corretor</label><select id="c-c" name="cid"><option value="">Sem corretor</option>${S.corretores.map(c=>`<option value="${c.id}" ${c.id===o.cid?'selected':''}>${esc(c.nome)} · ${esc(c.imob)}</option>`).join('')}</select></div>

    <div class="sec-f"><button type="button" class="btn text" data-a="cancel-edit">Cancelar</button><button class="btn primary">Salvar</button></div></form></section>`;
  return `<section class="sec" id="sec-cond"><div class="sec-h"><h2>${ic('money',18)}Condições pedidas</h2><div style="display:flex;gap:8px;align-items:center">${t.ofertas.length>1?`<button class="btn text sm" data-a="tab" data-t="comercial">${t.ofertas.length} ofertas</button>`:''}${o?`<button class="btn text sm" data-a="edit" data-s="cond">${ic('edit',16)}Editar</button>`:`<button class="btn sm" data-a="nova-oferta">${ic('add',16)}Registrar oferta</button>`}</div></div>
    <div class="sec-b">${o?`<div class="cond">
      <div><div class="lbl">Valor pedido</div><div class="big">${o.valor?mi(o.valor):'<span class="faint" style="font-size:15px">Não informado</span>'}</div></div>
      <div><div class="lbl">Por m² (área adotada)</div><div class="big">${o.valor&&ad?brl(o.valor/ad):'<span class="faint" style="font-size:15px">—</span>'}</div></div>
      <div><div class="lbl">Forma de pagamento pedida</div><div class="big" style="font-size:17px">${o.forma?OPT.forma[o.forma]:'<span class="faint" style="font-size:15px">Não informada</span>'}</div></div>
      <div><div class="lbl">Corretor principal</div><div class="big" style="font-size:17px">${cp?esc(cp.nome):'<span class="faint" style="font-size:15px">—</span>'}</div>${cp?`<div class="faint" style="font-size:12px">${esc(cp.imob)}</div>`:''}</div></div>
      <div class="grid2" style="margin-top:14px"><div><div class="lbl muted" style="font-size:12px">Aceita permuta</div><div class="txt">${o.aceita?esc(o.aceita):'<span class="faint">Não informado</span>'}</div></div>
      <div><div class="lbl muted" style="font-size:12px">Observação sobre o pagamento</div><div class="txt">${o.obsPag?esc(o.obsPag):'<span class="faint">Não informado</span>'}</div></div></div>`

  <section class="sec"><div class="sec-h"><h2>Corretores do terreno</h2></div><div class="sec-b">

function abaNegociacao(t){
  const n=t.neg;
  if(!n)return `<section class="sec"><div class="sec-b"><div class="empty">Sem negociação aberta. Ela abre quando a primeira oferta é registrada.<br><button class="btn primary sm" style="margin-top:12px" data-a="nova-oferta">${ic('add',16)}Registrar oferta</button></div></div></section>`;
  const v=n.viab,ad=areaAdotada(t);
  const chain=t.propostas.slice().reverse();
  const form=UI.propForm?`<section class="sec"><form data-form="prop"><div class="sec-h"><h2>Nova proposta · v${t.propostas.length+1}</h2></div><div class="sec-b"><div class="editgrid">
    <div class="field"><label for="pp-o">Origem</label><select id="pp-o" name="origem"><option value="bkm">BKM</option><option value="vendedor">Vendedor</option></select></div>
    <div class="field"><label for="pp-v">Valor total (R$)</label><input id="pp-v" name="valor" inputmode="decimal" required></div>
    <div class="field"><label for="pp-f">Forma de pagamento</label><select id="pp-f" name="forma">${Object.entries(OPT.forma).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
    <div class="field"><label for="pp-s">Status</label><select id="pp-s" name="status"><option value="apresentada">Apresentada</option><option value="em_analise">Em análise</option><option value="rascunho">Rascunho</option></select></div>
    <div class="field"><label for="pp-d">Apresentada em</label><input id="pp-d" name="data" type="date" value="${HOJE}"></div>
    <div class="field"><label for="pp-val">Validade</label><input id="pp-val" name="validade" type="date" value="${addD(HOJE,15)}"></div>
    <div class="field full"><label for="pp-c">Condições de pagamento</label><textarea id="pp-c" name="cond" placeholder="Entrada, parcelas, permuta, torna, condição suspensiva"></textarea></div>
    <div class="field full" id="pp-warn"></div></div>
    <div class="hint">${t.propostas.length?`Responde à v${t.propostas.length}. Se vier do outro lado, a v${t.propostas.length} vira Recusada; se vier do mesmo lado, vira Substituída.`:'Primeira proposta da negociação.'}</div></div>
    <div class="sec-f"><button type="button" class="btn text" data-a="prop-form">Cancelar</button><button class="btn primary">Registrar</button></div></form></section>`:'';
  return `<div class="stack">${trilhaHtml(t)}

function dedupe(){

    // nos dois cadastros os 6 primeiros dígitos são setor e quadra
    if(nd&&sql.length===nd&&t.situacao==='ativo'){const q=t.insc.find(i=>insCid(i)===mun&&digits(i.sql).length===nd&&digits(i.sql).slice(0,6)===sql.slice(0,6)&&digits(i.sql)!==sql);if(q)quadra.push([t,q])}
  }

/* KMZ / KML */
async function lerKmz(file){let txt;
  if(/\.kmz$/i.test(file.name)){if(!window.JSZip)throw new Error('Não foi possível abrir KMZ: biblioteca de compactação indisponível.');
    const z=await JSZip.loadAsync(file);const f=Object.values(z.files).find(f=>/\.kml$/i.test(f.name));if(!f)throw new Error('O KMZ não tem um arquivo KML dentro.');txt=await f.async('text')}
  else txt=await file.text();
  const x=new DOMParser().parseFromString(txt,'application/xml');if(x.getElementsByTagName('parsererror').length)throw new Error('O arquivo não é um KML válido.');
  const crd=s=>String(s||'').trim().split(/\s+/).map(p=>{const [lng,lat]=p.split(',').map(Number);return [lat,lng]}).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
  const out=[...x.getElementsByTagName('Placemark')].map((p,i)=>{const nome=(p.getElementsByTagName('name')[0]?.textContent||'').trim()||`Item ${i+1}`;
    const pol=p.getElementsByTagName('Polygon')[0];
    if(pol){const ob=pol.getElementsByTagName('outerBoundaryIs')[0]||pol;let pts=crd(ob.getElementsByTagName('coordinates')[0]?.textContent);
      if(pts.length>3&&pts[0][0]===pts.at(-1)[0]&&pts[0][1]===pts.at(-1)[1])pts=pts.slice(0,-1);if(pts.length>=3)return {nome,tipo:'poligono',pts}}
    const pt=p.getElementsByTagName('Point')[0];if(pt){const c=crd(pt.getElementsByTagName('coordinates')[0]?.textContent);if(c.length)return {nome,tipo:'ponto',pts:c}}
    return null}).filter(Boolean);
  if(!out.length)throw new Error('Nenhum ponto ou polígono encontrado no arquivo.');return out}

function L_initMini(){const el=$('#mini-mapa'),t=T(UI.id);if(!el||!t||t.lat==null)return;if(!window.L){el.innerHTML='<div class="mapa-erro">Mapa indisponível.</div>';return}

  MINI.on('dblclick',e=>miniDuplo(t,e.latlng.lat,e.latlng.lng,false));

  const enq=()=>t.poly?MINI.fitBounds(t.poly,{padding:[24,24],maxZoom:18}):MINI.setView([t.lat,t.lng],17);
  if(t.poly)MINI.__poly=L.polygon(t.poly,{color:'#0094fe',weight:2,fillOpacity:.2}).on('dblclick',e=>{L.DomEvent.stop(e);miniDuplo(t,e.latlng.lat,e.latlng.lng,true)}).addTo(MINI);enq();
  MINI_DES=L.layerGroup().addTo(MINI);
  const mini=MINI;requestAnimationFrame(()=>setTimeout(()=>{if(MINI!==mini)return;MINI.invalidateSize();enq();if(UI.edMini)desenhaRascunho()},60));
  const pin=L.marker([t.lat,t.lng],{icon:pinIcon(k)}).addTo(MINI);if(t.poly)pin.on('dblclick',e=>{L.DomEvent.stop(e);miniDuplo(t,t.lat,t.lng,true)});

/* dois cliques (ou dois toques) no mini-mapa. Sobre a poligonal: entra em edição ali mesmo, com os pontos e o menu do ponto
   da página Mapa (Leitura não edita: abre o Mapa). No resto do mapa: abre a página Mapa. Editando, não faz nada (o clique fora conclui). */
function miniDuplo(t,lat,lng,naPoly,toque){if(!toque&&Date.now()-(UI.miniToqueEm||0)<600)return; /* os dois toques já foram tratados por miniToqueDuplo */
  if(UI.edMini&&UI.mpModo==='editar')return;
  if(naPoly&&UI.role!=='Leitura'&&t.poly&&t.poly.length>=3){editarPoligonal(t.id,true);return}
  miniAbrirMapa(t,lat,lng,MINI?.getZoom?.())}
/* no celular o navegador nem sempre transforma dois toques em duplo clique: contamos os toques aqui */
function miniToqueDuplo(el,t,ll){let ult=null,x0=0,y0=0,mov=false;
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;x0=e.clientX;y0=e.clientY;mov=false},true);
  el.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&Math.hypot(e.clientX-x0,e.clientY-y0)>10)mov=true},true);
  el.addEventListener('pointerup',e=>{if(e.pointerType!=='touch'||mov||e.target.closest('.v-alvo,.gm-control-active,.leaflet-control,button'))return;
    const agora=Date.now();if(ult&&agora-ult.em<350&&Math.hypot(e.clientX-ult.x,e.clientY-ult.y)<30){ult=null;
      if(UI.edMini&&UI.mpModo==='editar')return;const r=el.getBoundingClientRect(),q=ll(e.clientX-r.left,e.clientY-r.top);if(!q)return;
      const naPoly=!!(t.poly&&t.poly.length>=3&&dentroPoly(q[0],q[1],t.poly));UI.miniToqueEm=Date.now();setTimeout(()=>miniDuplo(t,q[0],q[1],naPoly,true),0);return}
    ult={em:agora,x:e.clientX,y:e.clientY}},true)}
/* edição no mini-mapa: some a poligonal fixa, aparecem os pontos; no celular, a barra de aviso fica logo abaixo do mapa */
function miniEdDesenha(){const el=$('#mini-mapa');if(!el||!MINI)return;el.classList.add('modo');
  if(GG){MINI.__poly?.setMap(null);MINI.setOptions({gestureHandling:'greedy'})}else{MINI.__poly&&MINI.removeLayer(MINI.__poly);MINI.dragging?.enable()}
  let b=$('#mini-modo');if(!b){b=document.createElement('div');b.id='mini-modo';b.className='mp-modo mini-modo';b.setAttribute('aria-live','polite');el.after(b)}b.innerHTML=modoBanner();
  desenhaRascunho();vMenuDesenha()}
function miniEdRefresh(){if(UI.mpModo==='editar'&&UI.edMini)return miniEdDesenha();

/* mini-mapa da Visão geral: a roda sozinha rola a página; Shift + roda dá zoom.
   Com Shift o navegador costuma mandar a rolagem como horizontal (deltaX), por isso vale qualquer eixo.
   A escuta é na captura do contêiner, antes do mapa: sem Shift o evento não chega ao mapa e a página rola. */
function miniGestos(el,zoom){let acc=0,ult=0;
  el.addEventListener('wheel',e=>{if(!e.shiftKey){e.stopPropagation();return}e.preventDefault();e.stopPropagation();
    const d=(Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX)*(e.deltaMode===1?40:1);if(Date.now()-ult>400)acc=0;acc+=d;
    if(Math.abs(acc)>=60&&Date.now()-ult>180){zoom(acc<0?1:-1);acc=0;ult=Date.now()}},{capture:true,passive:false})}
/* dois cliques no mini-mapa: abre a página Mapa centrada no ponto clicado, no mesmo zoom, com o terreno selecionado */
function miniAbrirMapa(t,lat,lng,z){go('mapa',{mpView:{c:{lat,lng},z:Math.max(z||17,15)},mpSel:t.id,mpFoco:null})}
