.dt tbody tr[data-a]:hover, .dt tbody tr.sel { background: var(--azul-gelo) }
.dt tr[data-a]:focus-visible { outline: 2px solid var(--foco); outline-offset: -2px }
.dt .t1 { white-space: normal } .dt .t2 { white-space: normal }
.dt .c-etapa { display: inline-flex; flex-direction: column; align-items: center; gap: var(--e1) }
.dt .temp-mini { margin: 0 auto }
.dt-sort { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; display: inline-flex; align-items: center; gap: 4px; cursor: pointer }
.dt-sort:hover { color: var(--texto) }
.dt th[aria-sort="ascending"], .dt th[aria-sort="descending"] { color: var(--texto) }
.dt-ar { font-size: 12px; letter-spacing: 0; opacity: .7 }
.dt.compacta td { padding: var(--e2) var(--e3) }
.dt.compacta th { padding: var(--e2) var(--e3) }
.dt tr.forte td { font-weight: 600; background: var(--azul-gelo) }
.sitchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap }
.sitchip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(29,46,92,.15) }
.lbl-up { font-size: 11px; line-height: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-suave); font-weight: 600; margin: 0 0 var(--e2) }
.search.sm { margin: 0; max-width: none; height: 40px; flex: none }
.chk { display: flex; align-items: center; gap: var(--e2); font-size: 14px; min-height: 32px; cursor: pointer }
.chk input { width: 18px; height: 18px; accent-color: var(--acao); margin: 0; flex: none }

/* mapa */
body[data-rota="mapa"] .main { padding-block: var(--e4) }
.mapa-pg { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: var(--e4); height: calc(100vh - 72px - 32px); min-height: 540px }
.mapa-lado { display: flex; flex-direction: column; gap: var(--e3); min-height: 0; overflow: auto; padding-right: var(--e1) }
.page-h.compacto { margin-bottom: 0 }
.mp-filtros { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e3) }
.mp-resumo { display: flex; flex-wrap: wrap; gap: var(--e1) var(--e4); font-size: 13px; color: var(--texto-suave); margin-bottom: var(--e2) }
.mp-resumo b { color: var(--texto); font-variant-numeric: tabular-nums }
.mapa-area { position: relative; border-radius: var(--raio-lg); overflow: hidden; background: var(--azul-gelo); min-height: 0 }
.mapa { position: absolute; inset: 0; background: var(--azul-gelo) }
.mapa.modo, .mapa.modo .leaflet-interactive { cursor: crosshair }
.sem-fundo .mapa, .sem-fundo.mini-mapa, .sem-fundo .mini-mapa { background-color: #eef2f8; background-image: linear-gradient(rgba(29,46,92,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(29,46,92,.06) 1px, transparent 1px); background-size: 48px 48px }
.mp-aviso { display: none }
.sem-fundo .mp-aviso { display: block; position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 500; max-width: min(560px, calc(100% - 24px)); background: var(--superficie); border-left: 3px solid var(--pessego); border-radius: var(--raio-md); padding: var(--e2) var(--e3); font-size: 12px; line-height: 17px; color: var(--texto-suave); box-shadow: 0 2px 8px rgba(29,46,92,.12) }
.sem-fundo .mp-aviso.mini { position: static; transform: none; margin-top: var(--e2); box-shadow: none; max-width: none }
.mp-barra { position: absolute; top: 12px; right: 12px; left: 60px; z-index: 500; display: flex; flex-wrap: wrap; gap: var(--e2); justify-content: flex-end; pointer-events: none }
.mp-barra > * { pointer-events: auto }
.mp-barra .seg { background: var(--superficie); box-shadow: 0 1px 4px rgba(29,46,92,.18) }
.mp-barra .seg button { font-size: 13px; padding: 6px 12px }
.mp-acoes { display: flex; flex-wrap: wrap; gap: var(--e2); justify-content: flex-end }
.mp-acoes .btn { background: var(--superficie); border-color: transparent; box-shadow: 0 1px 4px rgba(29,46,92,.18) }
.mp-acoes .btn.on { box-shadow: inset 0 0 0 2px var(--azul-bkm), 0 1px 4px rgba(29,46,92,.18) }
.mp-modo:empty { display: none }
.mp-modo { position: absolute; top: 108px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; align-items: center; gap: var(--e2); flex-wrap: wrap; justify-content: center; background: var(--acao); color: var(--sobre-acao); border-radius: var(--raio-botao); padding: var(--e2) var(--e2) var(--e2) var(--e4); font-size: 14px; max-width: calc(100% - 24px) }
.mp-modo .btn.text { color: var(--sobre-acao) }
.mp-modo .btn.primary { background: var(--azul-bkm); border-color: var(--azul-bkm) }
.mp-legenda { position: absolute; left: 12px; bottom: 28px; z-index: 500; background: var(--superficie); border-radius: var(--raio-md); padding: var(--e2); display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 4px rgba(29,46,92,.18); max-height: calc(100% - 140px); overflow: auto }
.lg-i { display: flex; align-items: center; gap: var(--e2); border: 0; background: none; padding: 4px var(--e2); border-radius: var(--raio-sm); font-size: 13px; color: var(--texto); text-align: left; min-height: 28px }
.lg-i:hover { background: var(--azul-gelo) }
.lg-i .n { margin-left: auto; padding-left: var(--e3); color: var(--texto-suave); font-variant-numeric: tabular-nums }
.lg-i[aria-pressed="false"] { opacity: .45 }
.lg-i[aria-pressed="false"] .pin-mini { filter: grayscale(1) }
.pin-mini { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px rgba(29,46,92,.2) }
.mapa-erro { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--e6); text-align: center; color: var(--texto-suave) }
.pin { background: none; border: 0 }
.pin-b { position: absolute; left: 1px; top: 1px; width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: grid; place-items: center }
.pin-b b { transform: rotate(45deg); font-size: 13px; line-height: 1; font-weight: 700 }
.pin.sel .pin-b { box-shadow: 0 0 0 3px #0094fe, 0 2px 6px rgba(0,0,0,.35) }
.poi { background: none; border: 0 }
.poi-b { display: block; width: 14px; height: 14px; border-radius: 3px; background: #fff; border: 3px solid #1d2e5c; box-shadow: 0 1px 3px rgba(0,0,0,.3) }
.leaflet-container { font-family: var(--font-aptos); font-size: 13px }
.leaflet-popup-content-wrapper { border-radius: var(--raio-md); box-shadow: 0 4px 16px rgba(29,46,92,.22) }
.leaflet-popup-content { margin: var(--e4); width: auto !important; min-width: 240px }
.pop { display: flex; flex-direction: column; gap: 6px; color: var(--texto) }
.pop-e { display: flex; justify-content: space-between; align-items: center; gap: var(--e2); font-size: 12px; color: var(--texto-suave) }
.pop-t { font-size: 16px; font-weight: 600; line-height: 21px }
.pop-s { font-size: 13px; color: var(--texto-suave) }
.pop-n { display: flex; flex-wrap: wrap; gap: 2px var(--e3); font-size: 13px; font-variant-numeric: tabular-nums }
.pop-poi { border-top: 1px solid var(--linha); padding-top: 6px; display: flex; flex-direction: column; gap: 4px; font-size: 12px }
.pop-poi div { display: flex; gap: var(--e2); align-items: baseline }
.pop-poi span { flex: 1; min-width: 0 }
.pop-poi b { font-variant-numeric: tabular-nums }
.pop-a { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
.pop-a .btn.sm { min-height: 32px; padding: 0 var(--e3); font-size: 13px }
.mini-mapa { height: 260px; border-radius: var(--raio-md); overflow: hidden; background: var(--azul-gelo) }
.mini-pe { display: flex; justify-content: space-between; align-items: center; gap: var(--e2); margin-top: var(--e2); flex-wrap: wrap; font-size: 12px }
.kmz-l { display: flex; flex-direction: column; gap: var(--e2); max-height: 50vh; overflow: auto }
.kmz-i { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--e3); align-items: center; padding: var(--e2) 0; border-bottom: 1px solid var(--linha) }
.kmz-i select { min-height: 40px; border: 1px solid var(--borda-controle); border-radius: var(--raio-sm); padding: 0 var(--e2); background: var(--superficie); width: 100%; font-size: 14px }
.lbl-f { font-size: 13px; color: var(--texto-suave) }

/* dashboard */
.dash { background: var(--superficie) }
.dash-g { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: var(--e6); align-items: start }
.dash-lado { display: flex; flex-direction: column; gap: var(--e4); position: sticky; top: calc(72px + var(--e4)) }
.kpis-v { grid-template-columns: 1fr 1fr; gap: var(--e3) }
.kpis-v .kpi { padding: var(--e4) }
.kpis-v .kpi .v { font-size: 28px; line-height: 32px }
.kpis-v .kpi .v.sm { font-size: 18px; line-height: 24px }
.kpis-v .kpi .l { font-size: 12px; line-height: 16px }
.kpis-v .kpi:hover { box-shadow: none }
.dash-filtro .sec-b { padding-top: var(--e4); display: flex; flex-direction: column; gap: var(--e3); align-items: flex-start }
.fchip.on { background: var(--acao); border-color: var(--acao); color: var(--sobre-acao); font-weight: 600 }
.dash-sel { display: flex; flex-direction: column; gap: 2px; padding-top: var(--e3) }
.dash-graf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e4) }
.graf.larga { grid-column: 1 / -1 }
.graf .card-h { padding: var(--e4) var(--e4) 0 var(--e6) }
.graf .card-h h2 { font-size: 16px; line-height: 22px; font-weight: 600 }
.graf .card-b { padding: var(--e3) var(--e6) var(--e6) }
.hb { display: flex; flex-direction: column; gap: 2px }
.hb-r { display: grid; grid-template-columns: minmax(96px, 36%) minmax(0, 1fr) auto; align-items: center; gap: var(--e3); border: 0; background: none; padding: 5px var(--e2); border-radius: var(--raio-sm); text-align: left; color: var(--texto); font-size: 13px; cursor: pointer }
.hb.g .hb-r { font-size: 15px; padding-block: 8px }
.hb-r:hover { background: rgba(255,255,255,.7) }
.hb-r:focus-visible { outline: 2px solid var(--foco) }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.hb-t { height: 14px; display: flex; align-items: center }
.hb.g .hb-t { height: 20px }
.hb-b { height: 100%; border-radius: 0 4px 4px 0; min-width: 3px }
.hb-v { font-weight: 600; font-size: 13px; min-width: 3ch; text-align: right }
.hb-r.dim { opacity: .4 }
.hb-r.on { background: rgba(255,255,255,.85); box-shadow: inset 0 0 0 1.5px var(--acao) }
.gl { width: 100%; height: auto; display: block; overflow: visible }
.gl-grid { stroke: rgba(29,46,92,.12); stroke-width: 1 }
.gl-ax { fill: var(--texto-suave); font-size: 11px }
.gl-area { fill: rgba(0,148,254,.12) }
.gl-line { fill: none; stroke: var(--azul-bkm); stroke-width: 2; stroke-linejoin: round }
.gl-pt { fill: var(--superficie); stroke: var(--azul-bkm); stroke-width: 2 }
.gl-pt.on { fill: var(--acao); stroke: var(--acao) }
.gl-val { fill: var(--texto); font-size: 12px; font-weight: 600 }
.gl-hit { fill: transparent; cursor: pointer }
.gl-hit:hover { fill: rgba(29,46,92,.05) }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--marinho); color: #fff; font-size: 12px; line-height: 16px; padding: 6px 10px; border-radius: var(--raio-sm); max-width: 280px; opacity: 0; transition: opacity .1s }
.tip.on { opacity: 1 }
.dialog:has(.g-exp) { width: min(1000px, 100%) }
.dash:fullscreen { overflow: auto; padding: var(--e8) max(32px, env(safe-area-inset-right, 0px)) var(--e8) max(32px, env(safe-area-inset-left, 0px)) }
body.dash-fixo .dash { position: fixed; inset: 0; z-index: 30; overflow: auto; padding: calc(var(--e6) + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) var(--e8) max(24px, env(safe-area-inset-left, 0px)) }
.dash:fullscreen .dash-lado, body.dash-fixo .dash-lado { top: 0 }

/* ficha: visão geral */
.geral { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: var(--e4); align-items: start }
.geral-c { display: flex; flex-direction: column; gap: var(--e4); min-width: 0 }
.geral .cond { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.kvl { margin: 0; display: flex; flex-direction: column }
.kv { display: grid; grid-template-columns: minmax(120px, 38%) minmax(0, 1fr); gap: var(--e3); padding: var(--e2) 0; border-bottom: 1px solid rgba(29,46,92,.08) }
.kv:last-child { border-bottom: 0 }
.kv dt { font-size: 13px; color: var(--texto-suave) }
.kv dd { margin: 0; font-size: 14px; text-align: right; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px }
.kv .ni { color: var(--texto-suave); font-style: italic }
.sec-h h2 .bkm-ico { width: 32px; height: 32px }
.poil { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.poil li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--e3); align-items: center; padding: var(--e2) 0; border-bottom: 1px solid rgba(29,46,92,.08) }
.poil li:last-child { border-bottom: 0 }
.poil li > span { display: flex; flex-direction: column; min-width: 0 }
.poil .t1 { font-weight: 500; white-space: normal }

/* tarefas */
.tk-filtros { display: flex; flex-wrap: wrap; gap: var(--e3); align-items: flex-end; margin-bottom: var(--e4) }
.tk-filtros .search.sm { width: 260px }
.tk-filtros .field { width: 180px }
.tk-filtros .field select { min-height: 40px }
.tk-board .tk-col { flex: 1 0 248px; min-height: 0 }
.tk-lista { display: flex; flex-direction: column; gap: var(--e2); min-height: 48px }
.tk { background: var(--superficie); border-radius: var(--raio-md); padding: var(--e3); display: flex; flex-direction: column; gap: 6px; cursor: pointer; border: 1px solid transparent }
.tk[draggable="true"] { cursor: grab }
.tk:hover { border-color: var(--borda-controle) }
.tk:focus-visible { outline: 2px solid var(--foco) }
.tk.arrastando { opacity: .4 }
.tk.concluida .tk-t { text-decoration: line-through; color: var(--texto-suave) }
.tk-t { font-weight: 600; font-size: 14px; line-height: 19px }
.tk-d { font-size: 13px; color: var(--texto-suave); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.tk-ter { font-size: 12px; color: var(--texto-suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tk-p { display: flex; align-items: center; gap: var(--e2); font-size: 12px }
.tk-prazo { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums }
.tk-prazo.atras { color: var(--terracota); font-weight: 600 }
.tk-add { display: flex; align-items: center; gap: var(--e2); border: 0; background: none; color: var(--texto-suave); padding: var(--e2); border-radius: var(--raio-sm); font-size: 13px; margin-top: var(--e1) }
.tk-add:hover { background: rgba(255,255,255,.7); color: var(--texto) }
.tk-marca { height: 4px; border-radius: 2px; background: var(--azul-bkm) }
.tk-col.sobre { box-shadow: inset 0 0 0 2px var(--azul-bkm) }
.chip.tkst.concluida { background: var(--ok-fundo); border-color: transparent }
.chip.tkst.em_andamento { border-color: var(--azul-bkm) }
.chip.tkst.aguardando_terceiro { background: var(--atencao-fundo); border-color: transparent }

/* papel leitura e celular */
.ro .ed, .ro .mp-acoes .btn[data-a="mp-modo"], .ro .mp-acoes .btn[data-a="mp-kmz"], .ro .tk-add { display: none !important }
.bnav button { font-size: 11px }
@media (max-width: 1100px) {
  .dash-g { grid-template-columns: minmax(0, 1fr) }
  .dash-lado { position: static }
  .kpis-v { grid-template-columns: repeat(4, minmax(0, 1fr)) }
  .geral { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 899px) {
  .dt .hm { display: none }
  .mapa-pg { grid-template-columns: minmax(0, 1fr); height: auto }
  .mapa-area { height: 64vh; min-height: 380px; order: -1 }
  .mapa-lado { overflow: visible }
  .mp-barra { left: 12px; top: 12px }
  .mp-modo { top: auto; bottom: 12px }
  .mp-legenda { bottom: auto; top: 120px; max-height: 40% }
  .dash-graf { grid-template-columns: minmax(0, 1fr) }
  .kpis-v { grid-template-columns: 1fr 1fr }
  .tk-filtros .search.sm, .tk-filtros .field { width: 100% }
  .kmz-i { grid-template-columns: minmax(0, 1fr) }
  .bnav .pill { width: 48px }
  .bnav button { font-size: 10px }
}
.mapa-area, .mini-mapa { position: relative; z-index: 0; isolation: isolate }
.tk-board .tk-col { flex: 1 1 232px; min-width: 232px }
.tk, .tk-lista { min-width: 0 }
.tabs { overflow-x: auto }
.tabs .tab { flex: none; white-space: nowrap }
.dt td.num, .dt td.faint, .dt th { white-space: nowrap }
.dt td.esq { min-width: 180px }
.dt.compacta td.esq { min-width: 140px }
.sem-fundo .mp-aviso { left: auto; right: 12px; bottom: 36px; transform: none; max-width: min(360px, calc(100% - 24px)) }
.mapa-lado .dt td { text-align: left } .mapa-lado .dt th { text-align: left }
.mapa-lado .dt td.num, .mapa-lado .dt th:last-child { text-align: right }
.mapa-lado .dt .cod { display: block; font-size: 11px; color: var(--texto-suave); letter-spacing: .04em }
@media (max-width: 899px) { .sem-fundo .mp-aviso { bottom: 60px } }
.mp-legenda { padding: 0 }
.mp-legenda summary { cursor: pointer; padding: var(--e2) var(--e3); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); list-style: none }
.mp-legenda summary::-webkit-details-marker { display: none }
.mp-legenda summary::after { content: " ▾"; letter-spacing: 0 }
.mp-legenda[open] summary::after { content: " ▴" }
.mp-leg-l { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--e2) var(--e2) }
.search.sm { display: flex !important }
@media (max-width: 899px) {
  .mp-barra { flex-wrap: nowrap; flex-direction: column; align-items: stretch; left: 52px }
  .mp-barra .seg, .mp-acoes { overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; scrollbar-width: none }
  .mp-acoes .btn { flex: none }
  .mp-legenda { top: auto; bottom: 28px }
}
.mp-barra .seg button { white-space: nowrap }

/* ---- Google Maps ---- */
.pin.g { position: relative; width: 30px; height: 40px }
.poi.g { position: relative; width: 14px; height: 14px; transform: translateY(50%) }
.poi.g .poi-b { position: absolute; inset: 0 }
.ent.g { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #863d8f; color: #863d8f; font-size: 11px; font-weight: 700; display: grid; place-items: center; transform: translateY(50%); box-shadow: 0 1px 3px rgba(0,0,0,.3) }
.mp-rota { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 6; background: var(--superficie); border-radius: var(--raio-md); padding: var(--e3) var(--e4); box-shadow: 0 2px 10px rgba(29,46,92,.22); display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2) var(--e4); max-width: calc(100% - 24px); font-size: 13px }
.mp-rota .seg button { font-size: 12px; padding: 4px 10px }
.sec.entorno { margin-bottom: var(--e3) }
.sec.entorno .sec-h { padding: var(--e4) var(--e4) 0 }
.sec.entorno .sec-b { padding: var(--e2) var(--e4) var(--e4) }
.relevo { display: flex; gap: var(--e4); flex-wrap: wrap; align-items: flex-start }
.relevo svg { flex: none; max-width: 100%; height: auto; border-radius: var(--raio-sm) }
.relevo-n { flex: 1 1 200px; display: flex; flex-direction: column; gap: var(--e2); font-size: 14px }
.relevo-n .k { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-suave); font-weight: 600 }
.relevo-n b { font-size: 22px; font-weight: 600 }
.relevo-vazio { display: flex; justify-content: space-between; align-items: center; gap: var(--e3); flex-wrap: wrap }
.gauto gmp-place-autocomplete, .gauto > * { width: 100%; display: block }
.gm-style .gm-style-iw-c { border-radius: var(--raio-md) }
.gm-style .gm-style-iw-d { overflow: auto !important }
.gm-style .pop { padding: 2px 4px 4px; min-width: 240px }
.mapa .gm-style { font-family: var(--font-aptos) }
.mapa-area.sv-on .mp-barra, .mapa-area.sv-on .mp-legenda, .mapa-area.sv-on .mp-modo, .mapa-area.sv-on .mp-rota { display: none }

/* ==== Tema Google (Material 3) ====
   Linguagem visual do Google Material 3 sobre a marca BKM (logo e ícones de linha mantidos).
   Vem por último e sobrepõe o tema anterior; quando o front for portado, os tokens acima
   devem ser reescritos com estes valores e os !important removidos. */
:root{
  --font-aptos:"Google Sans Flex","Google Sans",Roboto,system-ui,sans-serif;
  --m-primary:#0b57d0; --m-on-primary:#fff; --m-pc:#d3e3fd; --m-on-pc:#041e49;
  --m-sc:#c2e7ff; --m-on-sc:#001d35;
  --m-surface:#f8fafd; --m-sc-low:#f0f4f9; --m-sc-high:#e9eef6; --m-card:#ffffff;
  --m-on-surface:#1f1f1f; --m-on-var:#444746; --m-outline:#747775; --m-outline-var:#c4c7c5;
  --texto:var(--m-on-surface); --texto-suave:var(--m-on-var); --linha:var(--m-outline-var); --superficie:var(--m-surface);
  --superficie-elevada:var(--m-sc-low); --destaque:var(--m-primary); --acao:var(--m-primary); --texto-destaque:var(--m-primary);
  --ok-fundo:#c4eed0; --ok-marca:#146c2e; --atencao-fundo:#ffdf99; --atencao-marca:#7a5900;
  --critico-fundo:#ffdad6; --critico-marca:#b3261e; --info-fundo:var(--m-pc); --info-marca:var(--m-primary);
  --fase-enviada:#0b57d0; --fase-contra:#8e4ec6; --fase-finais:#146c2e;
}
body{background:var(--m-surface);color:var(--m-on-surface);font-size:14px;letter-spacing:.01em}
h1{font-size:28px;line-height:36px;font-weight:400;letter-spacing:0}
h2{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.01em}
.rotulo,.eyebrow{text-transform:none;letter-spacing:.01em;font-size:12px;font-weight:500;color:var(--m-on-var)}
.forma::before{display:none!important}

/* top app bar */
.top{background:var(--m-surface)!important;border-bottom:0!important;box-shadow:none!important}
.search{background:var(--m-sc-high)!important;border:0!important;border-radius:28px!important;min-height:48px!important}
.search:focus-within{background:#fff!important;box-shadow:0 1px 3px rgba(0,0,0,.2)!important}
.demo-pill{border:1px solid var(--m-outline-var)!important;border-radius:8px!important;text-transform:none!important;letter-spacing:.01em!important;font-weight:500;color:var(--m-on-var)!important;background:transparent!important}
.avatar{background:#8e4ec6!important;color:#fff!important}

/* segmented button M3 */
.seg{border:1px solid var(--m-outline)!important;border-radius:20px!important;padding:0!important;gap:0!important;background:transparent!important;overflow:hidden}
.seg button{border:0!important;border-radius:0!important;background:transparent!important;font-weight:500;min-height:40px!important;color:var(--m-on-surface)!important}
.seg button+button{border-left:1px solid var(--m-outline)!important}
.seg button[aria-pressed="true"]{background:var(--m-sc)!important;color:var(--m-on-sc)!important;box-shadow:none!important}

/* navigation drawer */
.side{background:var(--m-surface)!important;border-right:0!important}
.compose{background:var(--m-pc)!important;color:var(--m-on-pc)!important;border:0!important;border-radius:16px!important;min-height:56px!important;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.1)!important}
.nav-item{border-radius:28px!important;min-height:48px!important;padding:0 16px!important;font-weight:500;font-size:14px!important;color:var(--m-on-var)!important;background:transparent!important}
.nav-item:hover{background:rgba(31,31,31,.08)!important}
.nav-item[aria-current="page"]{background:var(--m-sc)!important;color:var(--m-on-sc)!important;box-shadow:none!important;font-weight:700}
.nav-item .bkm-ico{width:24px!important;height:24px!important}
.nav-item .cnt{color:var(--m-on-var)!important}

/* cards: filled / outlined M3 */
.card,.sec,.tbl{background:var(--m-card)!important;border:1px solid var(--m-outline-var)!important;border-radius:12px!important;box-shadow:none!important}
.kpi{background:var(--m-sc-low)!important;border:0!important;border-radius:16px!important;box-shadow:none!important}
.kpi::before{display:none!important}
.kpi .v{font-weight:400}
.card-h,.sec-h{border-bottom:1px solid var(--m-outline-var)!important}

/* buttons */
.btn{border-radius:20px!important;border:1px solid var(--m-outline)!important;background:transparent!important;color:var(--m-primary)!important;font-weight:500;min-height:40px!important;box-shadow:none!important;padding:0 24px!important}
.btn.primary{background:var(--m-primary)!important;color:#fff!important;border-color:var(--m-primary)!important}
.btn.text{border:0!important;padding:0 12px!important}
.fab{background:var(--m-pc)!important;color:var(--m-on-pc)!important;border-radius:16px!important;box-shadow:0 3px 6px rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.15)!important}

/* chips M3 (assist / filter) */
.chip{border:1px solid var(--m-outline-var)!important;border-radius:8px!important;background:transparent!important;text-transform:none!important;letter-spacing:.01em!important;font-weight:500}
.chip.good{background:var(--ok-fundo)!important;border-color:transparent!important}
.chip.warn{background:var(--atencao-fundo)!important;border-color:transparent!important}
.chip.crit{background:var(--critico-fundo)!important;border-color:transparent!important}
.dchips *{text-transform:none!important;letter-spacing:.01em!important}
.fchip{border:1px solid var(--m-outline-var)!important;border-radius:8px!important;background:transparent!important;color:var(--m-on-var)!important;font-weight:500}
.fchip[aria-pressed="true"]{background:var(--m-sc)!important;border-color:transparent!important;color:var(--m-on-sc)!important}
.missing button{border:1px dashed var(--m-outline)!important;border-radius:8px!important}

/* tables */
.dt{background:#fff;border:1px solid var(--m-outline-var);border-radius:12px;overflow:hidden}
.tr,.dt tr,.dt td,.dt th{border-color:var(--m-outline-var)!important}
.tr.th,.dt th{background:var(--m-sc-low)!important;color:var(--m-on-var)!important;font-weight:500;text-transform:none!important;letter-spacing:.01em!important}
.dt tbody tr:nth-child(even){background:transparent!important}
.dt tbody tr:hover,button.tr:hover{background:rgba(11,87,208,.06)!important}

/* kanban */
.col{background:var(--m-sc-low)!important;border:0!important;border-radius:16px!important;box-shadow:none!important}
.col-h,.col-h *{text-transform:none!important;letter-spacing:.01em!important}
.col-h{font-size:14px!important;font-weight:500!important}
.kcard{background:#fff!important;border:0!important;border-radius:12px!important;box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15)!important}
.kcard.proposta_enviada,.kcard.contraproposta,.kcard.negociacoes_finais{box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15)!important}
.kfase{text-transform:none!important;letter-spacing:.01em!important;font-weight:500!important;border-radius:8px!important}

/* tabs, progress */
.bar{background:var(--m-pc)!important;border-radius:4px!important;height:4px!important}
.bar span{background:var(--m-primary)!important;border-radius:4px!important}

/* navigation bar (mobile) */
.bnav{background:var(--m-sc-low)!important;border-top:0!important;box-shadow:none!important}
.bnav .pill{border-radius:16px!important}
.bnav button[aria-current="page"] .pill{background:var(--m-sc)!important}
.bnav .bkm-ico{width:24px!important;height:24px!important}

.mapa-area,.mini-mapa{border-radius:16px!important;overflow:hidden}
.mp-barra{background:#fff!important;border-radius:28px!important;box-shadow:0 1px 3px rgba(0,0,0,.2)!important}

/* ==== Tema escuro (azul-noite com acentos neon) ====
   Ativado por <html data-tema="escuro">, escolhidos no menu de tema da barra superior
   (Claro, Escuro ou Automático, que segue o sistema).  */
:root[data-tema="escuro"]{
  /* azul-noite com acentos neon (azul, índigo, violeta, rosa, ciano) */
  --m-primary:#8ab4ff; --m-on-primary:#0b1030; --m-pc:#2a2f7a; --m-on-pc:#e6e9ff; --m-sc:#2a2f7a; --m-on-sc:#e6e9ff;
  --m-surface:#0d1436; --m-sc-low:#141c48; --m-sc-high:#1b2458; --m-card:#141c48;
  --m-on-surface:#eef1ff; --m-on-var:#a7b0dd; --m-outline:#6f79b8; --m-outline-var:#252f6e;
  --t-btn:linear-gradient(90deg,#3b82f6,#7c5cff); --t-btn-h:linear-gradient(90deg,#4f8ff8,#8d70ff); --t-btn-txt:#fff;
  --t-nav:linear-gradient(90deg,rgba(91,108,255,.38),rgba(155,92,255,.22)); --t-nav-txt:#fff;
  --t-sel:rgba(99,102,241,.38); --t-sel-txt:#fff;
  --t-ico:brightness(0) invert(.86) sepia(.2) hue-rotate(195deg); --t-ico-ativo:brightness(0) invert(1);
  --t-mapa:#0d1436; --t-hover:rgba(124,92,255,.10);
  --neon-1:#3b82f6; --neon-2:#6366f1; --neon-3:#a855f7; --neon-4:#ec4899; --neon-c:#22d3ee;
  --fase-enviada:#60a5fa; --fase-contra:#c084fc; --fase-finais:#34d399; --azul-bkm:#60a5fa;
}
:root[data-tema="escuro"]{
  color-scheme:dark;
  --branco:var(--m-card); --azul-gelo:var(--m-sc-high); --cinza-claro:var(--m-outline-var); --cinza-escuro:var(--m-on-var); --marinho:var(--m-on-surface);
  --sobre-acao:var(--t-btn-txt);
  --ok-fundo:#0f5223; --ok-marca:#6dd58c; --atencao-fundo:#5c4300; --atencao-marca:#ffd36e;
  --critico-fundo:#8c1d18; --critico-marca:#f2b8b5; --info-fundo:var(--m-pc); --info-marca:var(--m-primary);
  --fase-enviada:#7cacf8; --fase-contra:#d7aefb; --fase-finais:#6dd58c;
  --terracota:#f2b8b5; --pessego:#ffb68e; --roxo:#d7aefb; --verde-claro:#0f5223; --azul-bkm:#7cacf8;
}
:root[data-tema="escuro"] body{background:var(--m-surface);color:var(--m-on-surface)}
:root[data-tema="escuro"] .brand img{filter:brightness(0) invert(1)}
:root[data-tema="escuro"] .search:focus-within{background:var(--m-sc-high)!important}
:root[data-tema="escuro"] .btn.primary{background:var(--t-btn)!important;border-color:var(--t-btn)!important;color:var(--t-btn-txt)!important}
:root[data-tema="escuro"] .btn.primary:hover{background:var(--t-btn-h)!important}
:root[data-tema="escuro"] :is(.compose,.fab){background:var(--t-btn)!important;color:var(--t-btn-txt)!important;box-shadow:0 1px 3px rgba(0,0,0,.5)!important}
:root[data-tema="escuro"] .nav-item[aria-current="page"]{background:var(--t-nav)!important;color:var(--t-nav-txt)!important}
:root[data-tema="escuro"] .nav-item[aria-current="page"] .cnt{color:var(--t-nav-txt)!important;opacity:.75}
:root[data-tema="escuro"] .bnav button[aria-current="page"] .pill{background:var(--t-nav)!important}
:root[data-tema="escuro"] .bkm-ico{filter:var(--t-ico)}
:root[data-tema="escuro"] :is(.nav-item[aria-current="page"],.bnav button[aria-current="page"]) .bkm-ico{filter:var(--t-ico-ativo)!important}
:root[data-tema="escuro"] :is(.seg button[aria-pressed="true"],.fchip[aria-pressed="true"]){background:var(--t-sel)!important;color:var(--t-sel-txt)!important}
:root[data-tema="escuro"] :is(.kcard,.dt,.mp-barra){background:var(--m-card)!important}
:root[data-tema="escuro"] :is(.kcard,.kcard.proposta_enviada,.kcard.contraproposta,.kcard.negociacoes_finais){box-shadow:0 1px 2px rgba(0,0,0,.6),0 1px 3px 1px rgba(0,0,0,.4)!important}
:root[data-tema="escuro"] .kfase{color:var(--m-surface)!important}
:root[data-tema="escuro"] :is(.aitem:hover,button.tr:hover,.hb-r:hover,.tk-add:hover,.dt tbody tr:hover){background:var(--t-hover)!important}
:root[data-tema="escuro"] .hb-r.on{background:rgba(255,255,255,.1)!important}
:root[data-tema="escuro"] .avatar{background:#7d4bb8!important}
:root[data-tema="escuro"] .dot{color:var(--m-on-surface)}
:root[data-tema="escuro"] .done .dot{color:var(--m-on-primary)!important}
:root[data-tema="escuro"] .bnav .badge{color:var(--m-surface)!important}
:root[data-tema="escuro"] :is(input,select,textarea){background:var(--m-sc-high);color:var(--m-on-surface);border-color:var(--m-outline-var)}
:root[data-tema="escuro"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
:root[data-tema="escuro"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) sepia(.35) hue-rotate(185deg) saturate(1.6)}
:root[data-tema="escuro"] .leaflet-container{background:var(--t-mapa)}
:root[data-tema="escuro"] .leaflet-bar a{background:var(--m-sc-high)!important;color:var(--m-on-surface)!important;border-color:var(--m-outline-var)!important}

/* menu de tema na barra superior */
.tema-wrap{position:relative}
.tema-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--m-on-var);display:grid;place-items:center}
.tema-btn:hover{background:rgba(127,127,127,.14)}
.tema-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:220px;background:var(--m-sc-low);border-radius:12px;padding:6px 0;box-shadow:0 2px 6px rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.14)}
.tema-menu .tl{padding:8px 16px 6px;font-size:12px;font-weight:500;color:var(--m-on-var)}
.tema-menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 16px;border:0;background:transparent;color:var(--m-on-surface);text-align:left;font-size:14px}
.tema-menu button:hover{background:rgba(127,127,127,.12)}
.tema-menu button[aria-checked="true"]{font-weight:600}
.tema-menu button[aria-checked="true"]::after{content:"";margin-left:auto;width:6px;height:10px;border:solid var(--m-primary);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px)}
.tema-menu .sw{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5)}
@media (max-width: 899px){
  .top-in{gap:12px!important}
  .top-right{gap:4px}
  .seg button{padding:0 8px!important;font-size:13px}
  .tema-btn{width:36px;height:36px}
}
@media (max-width: 380px){ .seg button{padding:0 7px!important;font-size:12px} }

/* a etapa Minutagem usa o marinho #1d2e5c, que some no fundo escuro: vira violeta no tema escuro */

:root[data-tema="escuro"] [style*="background: #1d2e5c"]{background:#a78bfa!important}

:root[data-tema="escuro"]{--m-surface:#081028}

:root[data-tema="escuro"] .side{background:#081028!important;border-right:1px solid #1a2240!important}
:root[data-tema="escuro"] .top{background:#081028!important;border-bottom:1px solid #1a2240!important}

:root[data-tema="escuro"] .bnav button[aria-current="page"] .bkm-ico{filter:brightness(0) invert(86%) sepia(18%) saturate(600%) hue-rotate(190deg)!important}

/* ==== Painel lateral da ficha: Logs / Ações (desktop e tablet) ==== */
.ficha-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start }
.pn { display: none }
.pn-q { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums }
.pn-h { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--m-outline-var, var(--linha)) }
.pn-h .seg { flex: 1; display: flex }
.pn-h .seg button { flex: 1; padding: 0 10px }
.pn-b { overflow-y: auto; padding: 4px 16px 24px; flex: 1; min-height: 0 }
.pn-dia { position: sticky; top: 0; z-index: 1; background: inherit; font-size: 12px; font-weight: 500; color: var(--texto-suave); padding: 14px 0 6px; background: var(--pn-bg) }
.pn-log { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--m-outline-var, var(--linha)) }
.pn-log:last-child { border-bottom: 0 }
.pn-log .avatar { flex: none; margin-top: 2px }
.pn-lc { min-width: 0; flex: 1 }
.pn-lt { font-size: 14px; line-height: 20px }
.pn-det { margin: 4px 0 0; padding-left: 16px; font-size: 12px; line-height: 18px; color: var(--texto-suave) }
.pn-lm { font-size: 12px; line-height: 16px; color: var(--texto-suave); margin-top: 2px }
.pn-grupo { padding: 8px 0 4px }
.pn-gt { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 10px 0 6px }
.pn-gt .n { font-size: 12px; font-weight: 500; color: var(--texto-suave) }
.pn-acao { display: flex; gap: 10px; padding: 8px 0; font-size: 14px; line-height: 20px }
.pn-ai { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--m-sc-low, var(--superficie-elevada)); color: var(--texto-suave) }
.pn-acao.warn .pn-ai { background: var(--atencao-fundo); color: var(--atencao-marca) }
.pn-acao.crit .pn-ai { background: var(--critico-fundo); color: var(--critico-marca) }
.pn-acao.good .pn-ai { background: var(--ok-fundo); color: var(--ok-marca) }
.pn-ac { min-width: 0; padding-top: 4px }
.pn-ac .linkbtn { font-size: 13px; margin-top: 2px }
.pn-tar { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--m-outline-var, var(--linha)) }
.pn-tar:last-child { border-bottom: 0 }
.pn-chk { flex: none; width: 20px; height: 20px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--m-outline, var(--borda-controle)); background: transparent; padding: 0 }
.pn-chk:hover { border-color: var(--ok-marca); background: var(--ok-fundo) }
.pn-tc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left; border: 0; background: none; padding: 0; color: inherit }
.pn-tt { font-size: 14px; line-height: 20px }
.pn-tm { font-size: 12px; line-height: 16px; color: var(--texto-suave) }
.pn-tm.late { color: var(--critico-marca); font-weight: 500 }
.pn-min { gap: 6px; align-items: center; padding: 8px 0 }
.pn-rb { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--texto-suave); display: grid; place-items: center }
.pn-rb:hover { background: rgba(127,127,127,.12) }
.pn-badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 10px; line-height: 16px; font-weight: 600; background: var(--m-sc, var(--superficie-elevada)); color: var(--m-on-sc, var(--texto)) }

/* O painel ocupa uma coluna própria e nunca cobre a página: encolhe com a largura disponível
   (280 a 360 px) e some quando não sobra espaço para ele com largura mínima e a página com ao menos 520 px.
   A conta é feita sobre a largura real da área de conteúdo (container query), não da janela,
   porque o menu lateral aberto ou recolhido muda o espaço disponível. */
body[data-rota="terreno"] .main { container: pagina / inline-size }
@container pagina (min-width: 824px) {
  .pn { --pn-bg: var(--m-card, #fff); display: flex; flex-direction: column; background: var(--pn-bg); border: 1px solid var(--m-outline-var, var(--linha)); border-radius: 12px; overflow: hidden; position: sticky; top: 96px; height: calc(100vh - 120px) }
  .pn-min { height: auto }
  .ficha-wrap.pn-on { grid-template-columns: minmax(0, 1fr) clamp(280px, 30cqi, 360px) }
  .ficha-wrap.pn-off { grid-template-columns: minmax(0, 1fr) 56px }
  .tab-hist, .bl-hist { display: none }
  .ficha-wrap.pn-on .adv-main { display: none }
}
@media (max-width: 899px) { .pn { height: calc(100vh - 96px - 100px - env(safe-area-inset-bottom, 0px)) } }

/* tema escuro: quadro afundado, como os demais */
:root[data-tema="escuro"] .pn { --pn-bg: #060c20; border-color: rgba(124,140,255,.16) }
:root[data-tema="escuro"] .pn-h, :root[data-tema="escuro"] .pn-log, :root[data-tema="escuro"] .pn-tar { border-color: rgba(124,140,255,.12) }
:root[data-tema="escuro"] .pn-ai { background: rgba(124,140,255,.10) }
:root[data-tema="escuro"] .pn-badge { background: rgba(99,112,255,.18); color: #c9d6ff }
/* cabeçalho da ficha mais estreito (painel aberto, tablet): responsável e temperatura em linha, alinhados à esquerda */
@media (max-width: 1599px) {
  .ficha-main .dhead > div:last-child { flex-direction: row !important; align-items: center !important; flex-wrap: wrap; gap: 16px 24px !important }
}
/* barra do topo em tablet: sem o selo "Dados de exemplo" e com busca mais curta */
@media (min-width: 900px) and (max-width: 1199px) { .demo-pill { display: none } .search { min-width: 0 } }
.avatar.xs { width: 20px; height: 20px; font-size: 9px; line-height: 20px }
/* filtros do Logs: usuários (seleção múltipla) e período, um abaixo do outro */
.pn-filtros { display: flex; flex-direction: column; gap: 8px; padding: 12px 0 4px }
.pn-dd { position: relative; width: 100% }
.pn-dd.aberto { z-index: 41 }
.pn-dd-b { display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; padding: 0 12px 0 16px; border: 1px solid var(--m-outline, var(--borda-controle)); border-radius: 8px; background: transparent; color: var(--m-on-surface, var(--texto)); font-size: 14px; text-align: left }
.pn-dd-b > svg:first-child { flex: none; margin-left: -4px; color: var(--texto-suave) }
.pn-dd-b:hover { background: rgba(127,127,127,.08) }
.pn-dd-b.ativo { background: var(--m-sc, #c2e7ff); border-color: transparent; color: var(--m-on-sc, #001d35); font-weight: 500 }
.pn-dd-b.ativo > svg:first-child { color: inherit }
.pn-dd-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pn-dd.aberto .pn-dd-b > svg:last-child { transform: rotate(180deg) }
.pn-menu { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40; max-height: min(480px, calc(100vh - 240px)); overflow-y: auto; background: var(--m-sc-low, #f0f4f9); border-radius: 12px; padding: 6px 0; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14) }
.pn-menu.cal { max-height: none; padding: 0 }
.pn-dd.aberto .pn-menu { display: block }
.pn-menu button[role] { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 16px; border: 0; background: transparent; color: var(--m-on-surface, var(--texto)); font-size: 14px; text-align: left }
.pn-menu button[role]:hover, .pn-menu button[role]:focus-visible { background: rgba(127,127,127,.12); outline: 0 }
.pn-menu button.zero { color: var(--texto-suave) }
.pn-menu .pn-mn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pn-menu .n { font-size: 12px; color: var(--texto-suave); font-variant-numeric: tabular-nums }
.pn-menu [role="menuitemradio"][aria-checked="true"] { font-weight: 600 }
.pn-menu [role="menuitemradio"][aria-checked="true"]::after { content: ""; flex: none; width: 6px; height: 11px; border: solid var(--m-primary, #0b57d0); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-2px,-2px) }
.pn-menu [role="menuitemradio"] > svg { flex: none; color: var(--texto-suave) }
.pn-msep { height: 1px; margin: 4px 0; background: var(--m-outline-var, var(--linha)) }
.pn-ck { flex: none; width: 18px; height: 18px; border-radius: 3px; border: 2px solid var(--m-on-var, #444746); position: relative }
.pn-menu [aria-checked="true"] .pn-ck { background: var(--m-primary, #0b57d0); border-color: var(--m-primary, #0b57d0) }
.pn-menu [aria-checked="true"] .pn-ck::after { content: ""; position: absolute; left: 4px; top: 0; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) }
/* calendário do período personalizado (seletor de intervalo do Material 3) */
.pn-cal { padding: 12px 12px 8px }
.pn-ct { font-size: 12px; font-weight: 500; color: var(--texto-suave); padding: 0 4px }
.pn-cr { font-size: 20px; line-height: 28px; padding: 4px 4px 8px; border-bottom: 1px solid var(--m-outline-var, var(--linha)) }
.pn-cr .vazio { color: var(--texto-suave) }
.pn-cn { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 2px }
.pn-cm { font-size: 14px; font-weight: 500 }
.pn-cn .iconbtn:disabled { opacity: .35; cursor: default }
.pn-cw, .pn-cg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) }
.pn-cw span { height: 32px; display: grid; place-items: center; font-size: 12px; color: var(--texto-suave) }
.pn-cd { display: grid; place-items: center; height: 40px; position: relative }
.pn-cd.meio, .pn-cd.ini, .pn-cd.fim { background: var(--m-sc, #c2e7ff) }
.pn-cd.ini { background: linear-gradient(90deg, transparent 50%, var(--m-sc, #c2e7ff) 50%) }
.pn-cd.fim { background: linear-gradient(90deg, var(--m-sc, #c2e7ff) 50%, transparent 50%) }
.pn-cd button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--m-on-surface, var(--texto)); font-size: 14px; padding: 0; position: relative; font-variant-numeric: tabular-nums }
.pn-cd button:hover:not(:disabled) { background: rgba(127,127,127,.14) }
.pn-cd button.hoje { box-shadow: inset 0 0 0 1px var(--m-primary, #0b57d0); color: var(--m-primary, #0b57d0) }
.pn-cd button.sel { background: var(--m-primary, #0b57d0); color: #fff; box-shadow: none }
.pn-cd button:disabled { color: var(--texto-suave); opacity: .4; cursor: default }
.pn-cf { display: flex; justify-content: flex-end; gap: 4px; padding-top: 4px }
.pn-cf .btn:disabled { opacity: .4 }
:root[data-tema="escuro"] .pn-dd-b { border-color: rgba(124,140,255,.25) }
:root[data-tema="escuro"] .pn-dd-b.ativo { background: rgba(99,112,255,.10); border-color: rgba(124,140,255,.5); color: #c9d6ff }
:root[data-tema="escuro"] .pn-menu { background: #0d1530; box-shadow: 0 0 0 1px rgba(124,140,255,.2), 0 10px 28px rgba(0,0,0,.55) }
:root[data-tema="escuro"] .pn-ck { border-color: rgba(201,214,255,.6) }
:root[data-tema="escuro"] .pn-menu [aria-checked="true"] .pn-ck { background: rgba(99,112,255,.35); border-color: #7c8cff }
:root[data-tema="escuro"] .pn-menu [aria-checked="true"] .pn-ck::after { border-color: #e6ecff }
:root[data-tema="escuro"] .pn-menu [role="menuitemradio"][aria-checked="true"]::after { border-color: #9fb0ff }
:root[data-tema="escuro"] :is(.pn-msep) { background: rgba(124,140,255,.15) }
:root[data-tema="escuro"] .pn-cr { border-color: rgba(124,140,255,.15) }
:root[data-tema="escuro"] .pn-cd.meio { background: rgba(99,112,255,.16) }
:root[data-tema="escuro"] .pn-cd.ini { background: linear-gradient(90deg, transparent 50%, rgba(99,112,255,.16) 50%) }
:root[data-tema="escuro"] .pn-cd.fim { background: linear-gradient(90deg, rgba(99,112,255,.16) 50%, transparent 50%) }
:root[data-tema="escuro"] .pn-cd button.hoje { box-shadow: inset 0 0 0 1px rgba(124,140,255,.7); color: #c9d6ff }
:root[data-tema="escuro"] .pn-cd button.sel { background: rgba(99,112,255,.45); color: #fff; box-shadow: inset 0 0 0 1px #7c8cff }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
/* menu lateral: botão de recolher/expandir no topo, só o ícone */
.side > .menu-tg { align-self: flex-start; width: 48px; height: 48px; min-height: 48px; padding: 0; margin: calc(var(--e6) * -1 + 8px) 0 8px 3px; justify-content: center; border-radius: 50% }
body.menu-min .side > .menu-tg { align-self: center; margin-left: 0 }
/* ficha em página única: seções em sequência, cada uma recolhível pela seta antes do título */
.blocos { margin-top: 32px }
.bl { border-top: 1px solid var(--m-outline-var, var(--linha)); scroll-margin-top: 88px }
.bl-t { margin: 0; font: inherit }
.bl-h { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 64px; padding: 12px 8px 12px 0; border: 0; background: none; color: var(--m-on-surface, var(--texto)); text-align: left; font-size: 22px; line-height: 28px; font-weight: 400 }
.bl-seta { flex: none; width: 40px; height: 40px; padding: 8px; margin-left: -8px; border-radius: 50%; color: var(--texto-suave); transition: transform .15s ease }
.bl-h:hover .bl-seta { background: rgba(127,127,127,.12) }
.bl-h[aria-expanded="true"] .bl-seta { transform: rotate(90deg) }
.bl-h .n { font-size: 14px; line-height: 20px; color: var(--texto-suave); font-variant-numeric: tabular-nums; padding: 0 8px; border-radius: 8px; background: var(--m-sc-low, var(--superficie-elevada)) }
.bl-c { padding: 4px 0 32px }
@media (prefers-reduced-motion: reduce) { .bl-seta { transition: none } }
:root[data-tema="escuro"] .bl { border-color: rgba(124,140,255,.15) }
:root[data-tema="escuro"] .bl-h .n { background: rgba(124,140,255,.10); color: #c9d6ff }
/* na ficha, o rodapé da página não empurra o painel fixo para cima ao chegar ao fim */
@media (min-width: 900px) { body[data-rota="terreno"] .main { padding-bottom: 24px } }
/* linha do tempo das etapas no topo da ficha: acompanha a largura, sem rolagem lateral; some no celular */
.tl-topo { display: none }
@media (min-width: 768px) {
  .tl-topo { display: block; margin: 0 0 20px }
  .tl-topo .stepper { padding: 0; overflow: visible; display: flex; align-items: center; min-width: 0 }
  .tl-topo .step { flex: 1 1 0; min-width: 0 }

@keyframes pisca { 0% { background: transparent; box-shadow: 0 0 0 0 transparent } 8%, 75% { background: var(--m-sc, #c2e7ff); box-shadow: 0 0 0 6px var(--m-sc, #c2e7ff), 0 0 0 8px var(--m-primary, #0b57d0) } 100% { background: transparent; box-shadow: 0 0 0 6px transparent, 0 0 0 8px transparent } }
