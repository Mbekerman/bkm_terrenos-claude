/* ===================== partes: terreno com vários donos =====================
   No banco: terreno_partes, oferta_partes e processos com parte_id/principal_id
   (app.salvar_parte, app.remover_parte, _abrir_negociacoes_partes, _sincronizar_principal).
   Cada parte é um dono, ou um grupo de donos que negocia junto. Com duas ou mais
   partes ativas, quando o terreno chega à etapa da divisão (Negociação), cada parte
   ganha a sua negociação (pa.neg, pa.propostas), no mesmo formato da do terreno, e
   passa pelas mesmas regras (moverPara) através de vtParte. A negociação do terreno
   fica na etapa e na subetapa da parte mais atrasada e só fica Comprado com todas as
   partes ativas compradas. */
const etapaPartes=()=>cfg().etapaPartes||'negociacao';
const partesDe=t=>t.partes||(t.partes=[]);
const partesAtivas=t=>(t.partes||[]).filter(p=>p.ativa);
const parteDe=(t,id)=>(t.partes||[]).find(p=>p.id===id);
const dividida=t=>(t.partes||[]).some(p=>p.neg);
/* a parte vista como um terreno: as regras do funil leem t.neg e t.propostas; o resto vem do terreno */
const vtParte=(t,pa)=>Object.assign(Object.create(t),{neg:pa.neg,propostas:pa.propostas||(pa.propostas=[]),_parte:pa});
const terrenoDe=t=>t._parte?Object.getPrototypeOf(t):t;
const donosParte=(t,pa)=>t.pessoas.filter(p=>p.parte===pa.id&&p.papel==='proprietario').map(p=>p.nome);
const matsParte=(t,pa)=>t.mats.filter(m=>m.parte===pa.id);
const inscParte=(t,pa)=>t.insc.filter(i=>i.parte===pa.id);
const corParte=(t,pa)=>t.corretores.filter(x=>(x.partes||[]).includes(pa.id)).map(x=>corretor(x.cid)?.nome).filter(Boolean);
/* corretor ligado a uma parte (pode trazer várias; a parte pode ter vários): entra também nos corretores do terreno */
const ligarCorretor=(t,cid,pid)=>{let x=t.corretores.find(y=>y.cid===cid);if(!x)t.corretores.push(x={cid,principal:!t.corretores.some(y=>y.principal)});x.partes=x.partes||[];if(!x.partes.includes(pid))x.partes.push(pid)};
const listaTxt=v=>Array.isArray(v)?v:String(v||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
/* partes digitadas no Novo terreno ou na ficha: só o nome é obrigatório; matrículas, inscrições e
   vendedores digitados entram no cadastro do terreno já ligados à parte */
function gravarParteNova(t,d){const pa={id:uid(),ativa:true,neg:null,propostas:[],nome:d.nome,essencial:true,area:d.area??null};partesDe(t).push(pa);
  listaTxt(d.mats).forEach(n=>{const m=t.mats.find(x=>digits(x.num)===digits(n));if(m){if(!m.parte)m.parte=pa.id}else t.mats.push({num:n,cri:d.cri||'',area:null,data:null,parte:pa.id})});
  listaTxt(d.insc).forEach(n=>{const i=t.insc.find(x=>digits(x.sql)===digits(n));if(i){if(!i.parte)i.parte=pa.id}else t.insc.push({mun:d.mun||'outro',sql:n,area:null,valores:[],parte:pa.id})});
  listaTxt(d.vend).forEach(n=>{const x=t.pessoas.find(y=>y.nome===n);if(x){if(!x.parte)x.parte=pa.id}else t.pessoas.push({nome:n,tipo:'PF',papel:'proprietario',pct:null,tel:'',parte:pa.id})});
  (d.cids||[]).forEach(cid=>ligarCorretor(t,cid,pa.id));
  return pa}
/* quadro Partes do Cadastro: o que cada parte tem; a negociação de cada uma fica na seção Negociação */
function secPartesCad(t){const P=partesAtivas(t),ro=UI.role==='Leitura';
  const add=ro?'':`<button class="btn text sm" data-a="pt-nova">${ic('add',16)}Adicionar parte</button>`;
  const linha=(l,v)=>v?`<div class="ptc-l"><span class="faint">${l}</span><span>${v}</span></div>`:'';
  return `<section class="sec" id="sec-partes-cad"><div class="sec-h"><h2>Partes</h2>${add}</div><div class="sec-b">
    ${P.length?`<div class="ptc-lista">${P.map(pa=>{const ms=matsParte(t,pa),is=inscParte(t,pa),vs=donosParte(t,pa),cs=corParte(t,pa);
      return `<div class="ptc"><div class="ptc-h"><b>${esc(pa.nome)}</b>${pa.essencial?'':'<span class="chip">Dispensável</span>'}<span class="faint">${pa.area?m2(pa.area):'tamanho não informado'}</span>${ro?'':`<button class="btn text sm" data-a="pt-editar" data-p="${pa.id}" aria-label="Editar ${esc(pa.nome)}">${ic('edit',16)}Editar</button>`}</div>
        ${linha('Matrículas',ms.map(m=>esc(m.num)).join(', '))}${linha('Inscrições',is.map(i=>esc(i.sql)).join(', '))}${linha('Vendedores',vs.map(esc).join(', '))}${linha(cs.length>1?'Corretores':'Corretor',cs.map(esc).join(', '))}
        ${!ms.length&&!is.length&&!vs.length&&!cs.length?'<div class="faint ptc-l">Nada vinculado ainda.</div>':''}</div>`}).join('')}</div>`
    :`<div class="muted">Se os lotes têm donos que negociam separado, cadastre uma parte para cada dono ou grupo de donos. Só o nome é obrigatório.</div>`}</div></section>`}
const ordSub=(e,s)=>subsDe(e).findIndex(x=>x.k===s);
const precoParte=(t,pa)=>{const o=t.ofertas.find(x=>x.id===pa.neg?.ofRef)||t.ofertas.filter(x=>x.partes&&pa.id in x.partes).slice(-1)[0];
  if(!o||!o.partes||!(pa.id in o.partes))return null;return o.partes[pa.id]??(Object.keys(o.partes).length===1?o.valor:null)};

function abrirPartes(t){const n=t.neg;if(!n||n.status!=='ativo'||t._parte)return;
  if(SIDX(n.etapa)<SIDX(etapaPartes())||partesAtivas(t).length<2)return;
  const e=etapaPartes(),s=subInicial(e);
  partesAtivas(t).filter(pa=>!pa.neg).forEach(pa=>{const seq=(t.partes||[]).filter(x=>x.neg).length+1;
    const of=t.ofertas.filter(o=>o.partes&&pa.id in o.partes).slice(-1)[0];
    pa.neg={codigo:n.codigo+'-'+seq,etapa:e,sub:s,status:'ativo',desde:HOJE,subDesde:HOJE,ofRef:of?.id||n.ofRef,viab:null,pedido:null,
      trilha:[{em:agora(),user:me(),ev:'abertura',deEtapa:null,deSub:null,paraEtapa:e,paraSub:s,status:'ativo'}]};
    pa.propostas=pa.propostas||[];log(t,`Negociação da parte ${pa.nome} aberta (${pa.neg.codigo})`)});
  sincPrincipal(t)}
/* o terreno acompanha a parte mais atrasada em aberto (sem nenhuma em aberto, a mais adiantada das compradas) */
function sincPrincipal(t){const n=t.neg;if(!n||n.status!=='ativo')return;
  const ab=partesAtivas(t).filter(pa=>pa.neg&&['ativo','stand_by'].includes(pa.neg.status)),co=partesAtivas(t).filter(pa=>pa.neg?.status==='comprado');
  const k=pa=>SIDX(pa.neg.etapa)*100+ordSub(pa.neg.etapa,pa.neg.sub);
  const alvo=ab.length?ab.sort((a,b)=>k(a)-k(b))[0]:co.sort((a,b)=>k(b)-k(a))[0];if(!alvo)return;
  const {etapa,sub}=alvo.neg;if(etapa===n.etapa&&sub===n.sub)return;
  const ev={em:agora(),user:me(),deEtapa:n.etapa,deSub:n.sub,ev:etapa===n.etapa?'subetapa':SIDX(etapa)>SIDX(n.etapa)?'avanco':'retorno'};
  if(etapa!==n.etapa){n.etapa=etapa;n.desde=HOJE}n.sub=sub;n.subDesde=HOJE;
  (n.trilha=n.trilha||[]).push(Object.assign(ev,{paraEtapa:etapa,paraSub:sub,status:'ativo'}));
  log(t,`Pelas negociações das partes: ${SN(etapa)} · ${subN(sub)}`)}
/* encerrar o terreno leva as partes em aberto; retomar o terreno retoma as partes */
function encerrarPartes(t,dest,d){partesDe(t).filter(pa=>pa.neg&&(pa.neg.status==='ativo'||(pa.neg.status==='stand_by'&&dest!=='stand_by'))).forEach(pa=>{const p=pa.neg;
  p.pedido=null;Object.assign(p,{status:dest,encerradoEm:HOJE,motivo:d.motivo||null,detalhe:'Com a negociação do terreno'+(d.detalhe?': '+d.detalhe:''),retomar:d.retomar||null});
  (p.trilha=p.trilha||[]).push({em:agora(),user:me(),ev:{perdido:'perda',descartado:'descarte',stand_by:'stand_by'}[dest],deEtapa:p.etapa,deSub:p.sub,paraEtapa:p.etapa,paraSub:p.sub,status:dest})})}
function retomarPartes(t){partesDe(t).filter(pa=>pa.neg?.status==='stand_by').forEach(pa=>retomar(vtParte(t,pa)))}

/* pendências extras: compra do terreno dividido exige cada parte ativa comprada (nem o gestor força) */
function pendPartes(t,tipo,dest){if(t._parte||!dividida(t)||tipo!=='status'||dest!=='comprado')return [];
  return partesAtivas(t).map(pa=>{const st=pa.neg?.status;return {ok:st==='comprado',trava:true,fix:st==='comprado'?null:['tab:negociacao','Ver partes'],
    txt:`Parte ${pa.nome}: `+({comprado:'comprada',perdido:'perdida (tire a parte do terreno ou encerre a negociação)',descartado:'descartada (tire a parte do terreno ou encerre a negociação)',stand_by:'em stand by',ativo:'em negociação'}[st]||'sem negociação')}})}
/* quem pode se mover: o terreno dividido não anda à mão; a parte só da etapa da divisão em diante e com o terreno ativo */
function movePartes(t,tipo,dest){
  if(!t._parte)return dividida(t)&&tipo!=='status'?'Com várias partes, a negociação do terreno anda pelas negociações das partes.':null;
  if(terrenoDe(t).neg?.status!=='ativo')return 'A negociação do terreno não está ativa.';
  if(tipo==='etapa'&&SIDX(dest)<SIDX(etapaPartes()))return `A negociação da parte começa em ${SN(etapaPartes())}: as etapas anteriores são do terreno todo.`;
  return null}

/* ---------- ficha: seção Partes (dentro de Negociação) ---------- */
const PT_ST={ativo:'',comprado:'good',perdido:'crit',descartado:'',stand_by:'warn'};
function parteCard(t,pa){const ro=UI.role==='Leitura',n=pa.neg,vt=n?vtParte(t,pa):null,donos=donosParte(t,pa),ms=matsParte(t,pa);

  const preco=precoParte(t,pa),lp=(pa.propostas||[]).slice(-1)[0];
  let corpo='';
  if(!pa.ativa)corpo=`<div class="pt-x faint">Saiu do terreno: ${esc(pa.motivoRem||'')}</div>`;
  else if(!n)corpo=`<div class="pt-x faint">Ganha a sua negociação quando o terreno chegar a ${esc(SN(etapaPartes()))}.</div>`;
  else{const subs=subsDe(n.etapa),r=n.status==='ativo'?checkAdv(vt):null,p=n.pedido;
    const ultima=SIDX(n.etapa)===STAGES.length-1;
    corpo=`<div class="pt-g">
      ${n.status==='ativo'?`<label class="pt-f"><span class="lbl">Subetapa</span><select data-ch="pt-sub" data-p="${pa.id}" ${ro||p?'disabled':''} aria-label="Subetapa de ${esc(pa.nome)}">${subs.map(s=>`<option value="${s.k}" ${s.k===n.sub?'selected':''}>${esc(s.nome)}</option>`).join('')}</select><span class="faint">${diasSub(n)??0} d${subAtrasada(n)?' · <b class="t-warn">prazo estourado</b>':''}</span></label>`
        :`<div class="pt-f"><span class="lbl">${STATUS_N[n.status]}</span><span>${n.status==='stand_by'?'revisitar '+fd(n.retomar):fd(n.encerradoEm)}${n.motivo?' · '+esc(motivoN(n.status,n.motivo)):''}</span>${n.detalhe||n.relato?`<span class="faint">${esc(n.detalhe||textoDe(n.relato))}</span>`:''}</div>`}
      <div class="pt-f"><span class="lbl">Pedido</span><span class="num">${preco?mi(preco):'<span class="faint">—</span>'}</span></div>
      <div class="pt-f"><span class="lbl">Última proposta</span><span class="num">${lp?mi(lp.valor)+' <span class="faint">'+(lp.origem==='bkm'?'BKM':'vendedor')+' · '+OPT.statusProp[lp.status].toLowerCase()+'</span>':'<span class="faint">—</span>'}</span></div></div>
      ${p?`<div class="pt-ped">${ic('clock',16)}<span>Aguardando ${esc(quemFalta(p))} para ${esc(destinoNome(p.tipo,p.dest))}</span>${ro?'':`${naVez(p).some(x=>podeDecidir(x,me()))?`<button class="btn primary sm" data-a="pt-aprovar" data-p="${pa.id}">Aprovar</button><button class="btn sm" data-a="pt-recusar" data-p="${pa.id}">Recusar</button>`:''}${p.por===me()||nivelDe(me())>nivelDe(p.por)?`<button class="btn text sm" data-a="pt-cancelar" data-p="${pa.id}">Cancelar pedido</button>`:''}`}</div>`:''}
      ${ro?'':`<div class="pt-a">${n.status==='ativo'&&!p?`<button class="btn primary sm" data-a="pt-ir" data-p="${pa.id}">${ic(ultima?'check':'fwd',16)}${ultima?'Concluir como Comprado':r.aprov.niveis.length?'Pedir aprovação':'Avançar para '+esc(r.next[1])}</button><button class="btn sm" data-a="pt-prop" data-p="${pa.id}">${ic('add',16)}Proposta</button>`:''}
        ${n.status==='stand_by'&&terrenoDe(t).neg?.status==='ativo'?`<button class="btn sm" data-a="pt-retomar" data-p="${pa.id}">Retomar</button>`:''}
        ${parteMenu(t,pa)}</div>`}`}
  return `<article class="pt-card ${!pa.ativa?'fora':n?.status||''}" id="pt-${pa.id}"><div class="pt-h"><span class="pt-n"><b>${esc(pa.nome)}</b>${n?`<span class="num faint">${esc(n.codigo)}</span>`:''}</span>
    <span class="chip ${pa.essencial?'blue':''}" title="${pa.essencial?'Sem ela o terreno não serve':'Dá para seguir sem ela, com área menor'}">${pa.essencial?'Essencial':'Dispensável'}</span>${st}</div>
    <div class="pt-m muted">${donos.length?esc(donos.join(', ')):'<span class="faint">Sem dono vinculado</span>'} · ${ms.length} matrícula${ms.length===1?'':'s'}${pa.area?' · '+m2(pa.area):''}</div>${corpo}</article>`}
function parteMenu(t,pa){const n=pa.neg,it=[];if(!pa.ativa)return '';
  if(n?.status==='ativo')it.push(`<button role="menuitem" data-a="pt-suspender" data-p="${pa.id}">${ic('pause',18)}Colocar em Stand By</button>`,`<button role="menuitem" class="danger" data-a="pt-perder" data-p="${pa.id}">${ic('block',18)}Marcar como Perdida</button>`,`<button role="menuitem" class="danger" data-a="pt-descartar" data-p="${pa.id}">${ic('close',18)}Descartar</button>`);
  it.push(`<button role="menuitem" data-a="pt-editar" data-p="${pa.id}">${ic('edit',18)}Editar parte</button>`);
  if(!n||!['ativo','stand_by','comprado'].includes(n.status))it.push(`<button role="menuitem" class="danger" data-a="pt-remover" data-p="${pa.id}">${ic('close',18)}Tirar do terreno</button>`);
  return `<div class="adv-mais"><button class="btn sm adv-mb" data-a="adv-mais" aria-haspopup="menu" aria-expanded="false" aria-label="Mais ações da parte ${esc(pa.nome)}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" d="M12 5.5h.01M12 12h.01M12 18.5h.01"/></svg></button><div class="adv-menu" role="menu">${it.join('')}</div></div>`}
function secPartes(t){const P=t.partes||[],at=partesAtivas(t),ro=UI.role==='Leitura',div=dividida(t);
  const add=ro?'':`<button class="btn text sm" data-a="pt-nova">${ic('add',16)}Adicionar parte</button>`;
  if(!P.length)return `<section class="sec" id="sec-partes"><div class="sec-h"><h2>Partes</h2>${add}</div><div class="sec-b"><div class="muted">Um dono, mesmo com várias matrículas, é uma negociação só. Se os lotes têm donos que negociam separado, cadastre uma parte para cada dono ou grupo de donos: cada uma terá preço, propostas e status próprios (a temperatura é uma só, a da negociação do terreno) a partir de ${esc(SN(etapaPartes()))}.</div></div></section>`;
  const co=at.filter(pa=>pa.neg?.status==='comprado'),aT=at.reduce((s,p)=>s+(p.area||0),0),aC=co.reduce((s,p)=>s+(p.area||0),0);
  const pedidos=at.map(pa=>precoParte(t,pa)),soma=pedidos.every(v=>v!=null)?pedidos.reduce((a,b)=>a+b,0):null;
  const prob=at.filter(pa=>['perdido','descartado'].includes(pa.neg?.status));
  return `<section class="sec" id="sec-partes"><div class="sec-h"><h2>Partes</h2>${add}</div><div class="sec-b">
    <div class="pt-res"><div><span class="lbl">Partes</span><b>${at.length}</b>${P.length>at.length?`<span class="faint"> + ${P.length-at.length} fora</span>`:''}</div>
      <div><span class="lbl">Compradas</span><b>${co.length} de ${at.length}</b>${aT?`<span class="faint"> · ${num(100*aC/aT,0)}% da área</span>`:''}</div>
      <div><span class="lbl">Pedido somado</span><b>${soma!=null?mi(soma):'<span class="faint">—</span>'}</b></div>
      <div><span class="lbl">Negociação</span><b>${div?'Uma por parte':at.length>1?'Divide em '+esc(SN(etapaPartes())):'Uma só'}</b></div></div>
    ${prob.length?`<div class="banner warn">${ic('warn')}<div>${prob.map(pa=>`<b>${esc(pa.nome)}</b> ${pa.neg.status==='perdido'?'perdida':'descartada'}`).join(', ')}: o terreno só fica Comprado se a parte sair (área menor, estudo refeito) ou com a negociação encerrada.</div></div>`:''}
    <div class="pt-lista">${P.slice().sort((a,b)=>b.ativa-a.ativa).map(pa=>parteCard(t,pa)).join('')}</div></div></section>`}
const selParte=(t,ch,i,v)=>UI.role==='Leitura'?esc(parteDe(t,v)?.nome||'—'):`<select data-ch="${ch}" data-i="${i}" aria-label="Parte"><option value="">—</option>${partesAtivas(t).map(pa=>`<option value="${pa.id}" ${pa.id===v?'selected':''}>${esc(pa.nome)}</option>`).join('')}</select>`;
const resumoPartes=t=>{const at=partesAtivas(t);if(!dividida(t))return '';const co=at.filter(pa=>pa.neg?.status==='comprado').length;return `${at.length} partes · ${co} comprada${co===1?'':'s'}`};

/* ---------- ações ---------- */
function tentarParte(t,pa,tipo,dest,o={}){const vt=vtParte(t,pa),r=moverPara(vt,tipo,dest,o);save();render();
  if(r.ok){toast(`${pa.nome}: ${destinoNome(tipo,dest)}.`);return r}
  if(r.pedido){toast(r.msg);return r}
  if(r.bloq){UI.acao={tid:t.id,parte:pa.id,tipo,dest,dados:o.dados,pend:r.pend.map(x=>x.txt),items:r.pend};UI.alvoParte=pa.id;UI.modal=r.podeForcar?'forcar':'adv-bloq';renderModal();return r}
  toast(r.erro,true);return r}
function partesClick(A,a,t){if(!A.startsWith('pt-')||!t)return false;const pa=parteDe(t,a.dataset.p);
  const abre=m=>{UI.alvoParte=pa?.id||null;UI.modal=m;renderModal()};
  switch(A){
    case 'pt-nova':UI.alvoParte=null;UI.modal='pt-parte';renderModal();return true;
    case 'pt-editar':abre('pt-parte');return true;
    case 'pt-remover':if(pa.essencial&&nivelDe(me())<2){toast('Só gestor ou diretor tira uma parte essencial.',true);return true}abre('pt-remover');return true;
    case 'pt-ir':{const r=checkAdv(vtParte(t,pa));if(!r)return true;if(r.compra){const pend=r.items.filter(x=>!x.ok);
        if(pend.length&&!r.forcar){UI.acao={tid:t.id,parte:pa.id,tipo:'status',dest:'comprado',pend:pend.map(x=>x.txt),items:pend};abre('adv-bloq')}else{UI.acao={pend:pend.map(x=>x.txt)};abre('pt-comprar')}return true}
      tentarParte(t,pa,'etapa',r.dest);return true}
    case 'pt-prop':abre('pt-prop');return true;
    case 'pt-suspender':abre('suspender');return true;
    case 'pt-perder':abre('perder');return true;
    case 'pt-descartar':abre('descartar');return true;
    case 'pt-retomar':{const r=movePartes(vtParte(t,pa),'status','ativo');if(r){toast(r,true);return true}retomar(vtParte(t,pa));sincPrincipal(t);save();render();toast(`${pa.nome}: retomada.`);return true}
    case 'pt-aprovar':{const r=decidir(vtParte(t,pa),true,'');save();render();toast(r.erro||r.msg,!!r.erro);return true}
    case 'pt-recusar':abre('recusar');return true;
    case 'pt-cancelar':cancelarPedido(vtParte(t,pa));save();render();toast('Pedido cancelado.');return true;
  }
  return false}
function partesChange(el){const t=UI.route==='terreno'?T(UI.id):null;if(!t)return false;
  if(el.dataset.ch==='pt-sub'){const pa=parteDe(t,el.dataset.p);if(pa)tentarParte(t,pa,'subetapa',el.value);return true}
  if(el.dataset.ch==='mat-parte'||el.dataset.ch==='pes-parte'){const L=el.dataset.ch==='mat-parte'?t.mats:t.pessoas,x=L[+el.dataset.i],pa=parteDe(t,el.value);x.parte=el.value||null;
    log(t,`${el.dataset.ch==='mat-parte'?'Matrícula '+x.num:x.nome}: ${pa?'parte '+pa.nome:'sem parte'}`);save();render();return true}
  return false}
function partesSubmit(form,F,t,f){if(!t)return false;const pa=UI.alvoParte?parteDe(t,UI.alvoParte):null;
  if(form==='pt-parte'){const nome=F.nome.trim();if(!nome){toast('Dê um nome à parte.',true);return true}
    if(partesAtivas(t).some(x=>x!==pa&&x.nome.toLowerCase()===nome.toLowerCase())){toast('Já existe uma parte com esse nome.',true);return true}

// Inscrição municipal por cidade. A cidade é sempre a do terreno (pela poligonal):
// São Paulo (SQL, base GeoSampa), São José dos Campos (inscrição imobiliária,
// base GeoSanja) ou outro (digitada, sem base). O campo abre com a máscara da

const CIDADES_INSC={

const insCid=ins=>ins.mun||'sp';
const digitosMasc=m=>(m.match(/0/g)||[]).length;
function mascarar(v,m){if(!m)return v;const d=digits(v).slice(0,digitosMasc(m));let r='',j=0;
  for(const c of m){if(j>=d.length)break;r+=c==='0'?d[j++]:c}return r}
const cidDoNome=n=>/s[aã]o jos[eé] dos campos/i.test(n||'')?'sjc':!n||/^s[aã]o paulo\b/i.test(n)?'sp':'outro';
const cidDoTerreno=t=>cidDoNome(t.municipio);

function loteRegistrar(t,ins,{lote,poly,areaPol,zonas,erros,camadas,area,aConst}){const c=CIDADES_INSC[insCid(ins)];
  ins.geo=ins.geo||[];ins.geo.unshift({em:agora(),user:me(),lote,poly,areaPol,zonas,erros,camadas});

const geoAneis=g=>!g?[]:g.type==='Polygon'?g.coordinates:g.type==='MultiPolygon'?g.coordinates.flat():g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];

  if((yi>pt[1])!==(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)c=!c}return c}
const geoDentro=(pt,g)=>(g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[]).some(poly=>geoNoAnel(pt,poly[0])&&!poly.slice(1).some(h=>geoNoAnel(pt,h)));
// Área de cada zona dentro do lote, por amostragem em grade (~2.500 pontos): erro abaixo de 1%.
function geoAreaZonas(lote,feicoes,cod){const r=geoAneis(lote)[0],xs=r.map(p=>p[0]),ys=r.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),
  passo=Math.max(.2,Math.sqrt((Math.max(...xs)-x0)*(Math.max(...ys)-y0)/2500)),area=geoAreaAnel(r),cont={};let n=0;
  for(let x=x0+passo/2;x<Math.max(...xs);x+=passo)for(let y=y0+passo/2;y<Math.max(...ys);y+=passo){const pt=[x,y];if(!geoDentro(pt,lote))continue;n++;
    const f=feicoes.find(f=>geoDentro(pt,f.geometry));if(f){const k=cod(f.properties);cont[k]=(cont[k]||0)+1}}
  return Object.entries(cont).map(([sigla,c])=>({sigla,area_m2:Math.round(area*c/n*100)/100})).sort((a,b)=>b.area_m2-a.area_m2)}

async function geoWfs(params){const u=new URL(GEO_BASE+'ows');Object.entries({service:'WFS',version:'2.0.0',request:'GetFeature',outputFormat:'application/json',srsName:'EPSG:31983',...params}).forEach(([k,v])=>u.searchParams.set(k,v));

const geoWkt=g=>'POLYGON('+geoAneis(g).map(r=>'('+r.map(p=>p[0]+' '+p[1]).join(',')+')').join(',')+')';

async function geoBuscar(t,ins){const d=digits(ins.sql);
  const lotes=await geoWfs({typeNames:'geoportal:lote_cidadao',CQL_FILTER:`cd_setor_fiscal='${d.slice(0,3)}' AND cd_quadra_fiscal='${d.slice(3,6)}' AND cd_lote='${d.slice(6,10)}'`});
  const lote=lotes.find(f=>String(f.properties.cd_digito_sql)===d[10]&&f.properties.tx_situ_lote!=='INATIVO')||null;
  if(!lote){toast(lotes.length?`O dígito do SQL não confere (no GeoSampa é ${lotes[0].properties.cd_digito_sql}).`:'SQL não encontrado no GeoSampa.',true);return}
  const wkt=geoWkt(lote.geometry),camadas={},erros=[];
  await Promise.all(GEO_CAMADAS.map(async([k,,geom,,,dist])=>{try{camadas[k]=await geoWfs({typeNames:'geoportal:'+k,count:'50',CQL_FILTER:dist?`DWITHIN(${geom},${wkt},${dist},meters)`:`INTERSECTS(${geom},${wkt})`})}catch(e){erros.push(k)}}));
  const zf=camadas.perimetro_zona_lei_18081_24||[],zonas=zf.length?geoAreaZonas(lote.geometry,zf,p=>p.cd_zoneamento_perimetro):[];
  const anel=geoAneis(lote.geometry)[0],areaPol=Math.round(geoAreaAnel(anel)*100)/100,poly=anel.slice(0,-1).map(p=>utmLatLng(p[0],p[1]).map(v=>+v.toFixed(7)));
  const props=c=>(camadas[c]||[]).map(f=>f.properties),p=lote.properties;
  if(p.cd_cib)ins.cib=p.cd_cib;const zfis=props('zona_fiscal')[0];if(zfis)ins.zf=zfis.sg_zona_fiscal;
  loteRegistrar(t,ins,{lote:p,poly,areaPol,zonas,erros,camadas:Object.fromEntries(Object.keys(camadas).map(k=>[k,props(k)])),area:p.qt_area_terreno,aConst:p.qt_area_construida});
  geoArquivos(t,ins,lote.geometry)}

// Planta (PDF do servidor) e desenho (DXF montado aqui), com 40 m de folga em volta do lote.
async function geoArquivos(t,ins,geom){const r=geoAneis(geom)[0],m=40,xs=r.map(p=>p[0]),ys=r.map(p=>p[1]);
  const bb=[Math.min(...xs)-m,Math.min(...ys)-m,Math.max(...xs)+m,Math.max(...ys)+m],arq=GEO_ARQ[t.id]=GEO_ARQ[t.id]||{};const nomeBase='lote_'+digits(ins.sql);
  try{const w=1600,h=Math.round(w*(bb[3]-bb[1])/(bb[2]-bb[0])),u=new URL(GEO_BASE+'wms');
    Object.entries({service:'WMS',version:'1.1.1',request:'GetMap',layers:GEO_DESENHO.map(c=>'geoportal:'+c[0]).join(','),styles:'',srs:'EPSG:31983',bbox:bb.join(','),width:w,height:h,format:'application/pdf'}).forEach(([k,v])=>u.searchParams.set(k,v));
    const rp=await fetch(u);if(!rp.ok)throw 0;arq.pdf=await rp.blob();loteDoc(t,ins,'lote_pdf',nomeBase+'.pdf')}catch(e){toast('A planta em PDF não saiu agora; o desenho segue.',true)}
  try{const feic=await Promise.all(GEO_DESENHO.map(([k])=>geoWfs({typeNames:'geoportal:'+k,bbox:bb.join(',')+',EPSG:31983'}).catch(()=>[])));
    arq.dxf=new Blob([geoDxf(GEO_DESENHO,feic,bb,`GeoSampa - SQL ${ins.sql}`,(k,p)=>k==='lote_cidadao'?p.nr_contribuinte:null)],{type:'application/dxf'});loteDoc(t,ins,'lote_dxf',nomeBase+'.dxf')}catch(e){console.error(e);toast('O desenho em DXF não saiu agora.',true)}
  save();render();toast('Planta e desenho do lote guardados nos documentos.')}

// DXF R12 (AutoCAD abre e salva como DWG). Coordenadas UTM 23S SIRGAS 2000 em metros; curvas com a cota como elevação.
// desenho: [chave, layer, cor ACI, campo da cota]; feic: feições de cada chave; rotulo(chave, atributos): texto no centro da feição.
function geoDxf(desenho,feic,bb,titulo,rotulo){const L=[],out=(...a)=>{for(let i=0;i<a.length;i+=2)L.push(a[i],a[i+1])};const asc=s=>String(s??'').normalize('NFD').replace(/[^\x20-\x7e]/g,'');
  out(0,'SECTION',2,'HEADER',9,'$ACADVER',1,'AC1009',9,'$EXTMIN',10,bb[0],20,bb[1],9,'$EXTMAX',10,bb[2],20,bb[3],0,'ENDSEC');
  out(0,'SECTION',2,'TABLES',0,'TABLE',2,'LTYPE',70,1,0,'LTYPE',2,'CONTINUOUS',70,0,3,'Solid line',72,65,73,0,40,0,0,'ENDTAB',0,'TABLE',2,'LAYER',70,desenho.length+1);
  [...desenho.map(c=>[c[1],c[2]]),['TEXTOS',7]].forEach(([n,c])=>out(0,'LAYER',2,n,70,0,62,c,6,'CONTINUOUS'));out(0,'ENDTAB',0,'ENDSEC',0,'SECTION',2,'ENTITIES');
  const f2=v=>Number(v).toFixed(3);
  desenho.forEach(([k,lay,,zc],i)=>(feic[i]||[]).forEach(f=>{const g=f.geometry;if(!g)return;const z=zc&&f.properties[zc]!=null?Number(f.properties[zc]):0;
    if(g.type==='Point'){const [x,y]=g.coordinates;out(0,'POINT',8,lay,10,f2(x),20,f2(y),30,f2(z));if(zc)out(0,'TEXT',8,lay,10,f2(x+.4),20,f2(y+.4),30,f2(z),40,'0.8',1,num(z,2));return}
    geoAneis(g).forEach(r=>{const fechado=g.type.includes('Polygon');const pts=fechado&&r.length>1?r.slice(0,-1):r;
      out(0,'POLYLINE',8,lay,66,1,10,'0',20,'0',30,f2(z),70,fechado?1:0);pts.forEach(p=>out(0,'VERTEX',8,lay,10,f2(p[0]),20,f2(p[1]),30,f2(z)));out(0,'SEQEND',8,lay)});
    const txt=rotulo&&rotulo(k,f.properties);if(txt&&/Polygon/.test(g.type)){const r=geoAneis(g)[0],cx=r.reduce((s,p)=>s+p[0],0)/r.length,cy=r.reduce((s,p)=>s+p[1],0)/r.length;out(0,'TEXT',8,'TEXTOS',10,f2(cx),20,f2(cy),30,'0',40,'1.2',1,asc(txt))}}));
  out(0,'TEXT',8,'TEXTOS',10,f2(bb[0]+2),20,f2(bb[1]+2),30,'0',40,'1.5',1,asc(`${titulo} - ${new Date().toLocaleDateString('pt-BR')} - UTM 23S SIRGAS 2000`));
  out(0,'ENDSEC',0,'EOF');return L.join('\r\n')+'\r\n'}
function geoBaixar(t,k){const a=GEO_ARQ[t.id]?.[k];if(!a){toast('Arquivo gerado em outra sessão: busque de novo para baixar.',true);return}
  const d=t.docs.find(x=>x.tipo==='lote_'+k),url=URL.createObjectURL(a),el=document.createElement('a');el.href=url;el.download=d?.nome||'lote.'+k;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}

// Quadro na inscrição: última consulta e o que toca o lote.
function geoQuadro(t,ins,i){const g=(ins.geo||[])[0];

  const lin=(k,v)=>`<div class="kv"><dt>${k}</dt><dd>${v}</dd></div>`;
  const linhas=GEO_CAMADAS.filter(c=>!/^zona_fiscal$|^perimetro_zona/.test(c[0])).map(([k,tema,,fmt,grav])=>{const fs=g.camadas[k],erro=g.erros.includes(k);

    <div class="geo-kv">${lin('Área do terreno (cadastro)',m2(p.qt_area_terreno))}${lin('Área da poligonal',m2(g.areaPol)+(p.qt_area_terreno&&Math.abs(g.areaPol/p.qt_area_terreno-1)>.05?` <span class="chip warn">${g.areaPol>p.qt_area_terreno?'+':''}${num((g.areaPol/p.qt_area_terreno-1)*100,0)}% sobre o cadastro</span>`:''))}${lin('Área construída',m2(p.qt_area_construida))}${lin('Uso',esc(p.dc_tipo_uso_imovel||'—'))}
    ${lin('Endereço fiscal',esc(end||'—')+(end&&t.logradouro&&!end.toLowerCase().includes(t.logradouro.toLowerCase().split(' ').pop())?' <span class="chip warn">difere do cadastro</span>':''))}
    ${lin('Condomínio',p.cd_condominio&&p.cd_condominio!=='00'?`<span class="chip warn">Sim (${esc(p.cd_condominio)})</span>`:'Não')}${lin('CIB',esc(p.cd_cib||'—'))}${lin('Zona fiscal',esc(ins.zf||'—'))}
    ${lin('Zona no lote',zonasTxt||'—')}</div>
    ${dif?`<div class="banner warn" style="margin:8px 0">${ic('warn')}<div>As camadas de zoneamento das Leis 18.081 e 18.177 dão zonas diferentes para o lote. Confira antes de usar.</div></div>`:''}
    ${loteToca(linhas)}
    ${loteArqBotoes(t)}</div>`}

  let r=await ped(await gsjToken());if(r.status===401)r=await ped(await gsjToken(true));if(!r.ok)throw new Error('GeoSanja respondeu '+r.status);

// Feições da camada dentro do retângulo (graus): um pixel no centro com raio que alcança os cantos.

  const r=await fetch(u);if(!r.ok)throw new Error('GeoSanja respondeu '+r.status);const j=await r.json();if(!j||!Array.isArray(j.features))throw new Error('Resposta inesperada do GeoSanja');return j.features}

// --- coordenadas: graus -> metros locais (área e distâncias) e -> UTM 23S SIRGAS 2000 (DXF)
const mapCoord=(c,f)=>!c.length?c:typeof c[0]==='number'?f(c):c.map(x=>mapCoord(x,f));

function latLngUtm(lat,lng){const a=6378137,f=1/298.257222101,k0=.9996,e2=f*(2-f),ep2=e2/(1-e2),p=lat*Math.PI/180,l=(lng+45)*Math.PI/180,s=Math.sin(p),c=Math.cos(p),
  N=a/Math.sqrt(1-e2*s*s),T=Math.tan(p)**2,C=ep2*c*c,A=c*l,
  M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*p-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*p)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*p)-(35*e2**3/3072)*Math.sin(6*p));
  return [5e5+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120),
    1e7+k0*(M+N*Math.tan(p)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))]}
// pontos do lote para conferir o que toca: vértices, bordas a cada metro e grade interna
function gsjAmostra(lote){const r=geoAneis(lote)[0],pts=[];
  r.forEach((p,i)=>{const q=r[(i+1)%r.length],n=Math.max(1,Math.ceil(Math.hypot(q[0]-p[0],q[1]-p[1])));for(let k=0;k<n;k++)pts.push([p[0]+(q[0]-p[0])*k/n,p[1]+(q[1]-p[1])*k/n])});
  const xs=r.map(p=>p[0]),ys=r.map(p=>p[1]),passo=Math.max(.5,Math.sqrt((Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys))/400));

/* ---------- poligonal pelos lotes das inscrições ----------
   O cadastro começa sempre pelo desenho. Depois, em Inscrições, "Usar a poligonal
   dos lotes" troca a desenhada pela soma dos lotes de todas as inscrições com base
   na prefeitura (GeoSampa, GeoSanja), mostrando antes a diferença de área e os
   terrenos que a área nova passaria a ocupar. A desenhada fica guardada. */
const lotesInsc=t=>t.insc.map((ins,i)=>({ins,i,cid:insCid(ins)})).filter(x=>LOTE_ADAPT[x.cid]?.poligono);
let LOTES_BUSCANDO=false;
async function lotesPolyCalcular(t){if(LOTES_BUSCANDO)return;const L=lotesInsc(t);if(!L.length)return;
  if(L.some(x=>!(x.ins.geo||[])[0]?.poly&&!LOTE_ADAPT[x.cid].url())){toast('A busca na prefeitura funciona na versão publicada no Railway.',true);return}
  LOTES_BUSCANDO=true;render();const polys=[],falhas=[];
  try{for(const x of L){const c=CIDADES_INSC[x.cid];let p=(x.ins.geo||[])[0]?.poly||null;
      if(!p)try{p=await LOTE_ADAPT[x.cid].poligono(x.ins.sql)}catch(e){console.warn(e);falhas.push(`${c.rotulo} ${x.ins.sql}: ${typeof e==='string'?e:'a prefeitura não respondeu'}`);continue}
      if(p)polys.push(p);else falhas.push(`${c.rotulo} ${x.ins.sql}: não encontrado no ${c.base}`)}}
  finally{LOTES_BUSCANDO=false}
  const u=lotesUniao(polys);
  UI.lotes={tid:t.id,poly:u,n:polys.length,total:L.length,falhas,separados:polys.length>1&&!u,sobre:u?sobreposicoes(u,t.id):[]};UI.modal='lotes-poly';render();renderModal()}
// Lotes vizinhos dividem a divisa, caso em que a união pura não acha cruzamento.
// Cada lote cresce 1 cm para fora antes de juntar (erro de área ~ perímetro × 1 cm).
function engorda(poly,m){const pj=nvProj(centro(poly)[0]),P=poly.map(pj.xy),n=P.length,
    s=Math.sign(P.reduce((a,p,i)=>{const q=P[(i+1)%n];return a+p[0]*q[1]-q[0]*p[1]},0))||1,
    nor=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1;return [s*dy/L,-s*dx/L]};
  return P.map((p,i)=>{const a=nor(P[(i-1+n)%n],p),b=nor(p,P[(i+1)%n]),bx=a[0]+b[0],by=a[1]+b[1],k=(bx*bx+by*by)/2||1;
    return pj.ll([p[0]+m*bx/k,p[1]+m*by/k])})}
function lotesUniao(polys){if(!polys.length)return null;if(polys.length===1)return polys[0];
  let u=engorda(polys[0],.01);for(const p of polys.slice(1)){u=u&&uniaoPoly(u,engorda(p,.01))}return u&&limpaPoly(u)}
// tira os pontos que sobram da junção: colados (< 5 cm) ou em linha reta com os vizinhos
function limpaPoly(poly){const pj=nvProj(centro(poly)[0]);let P=poly.map(pj.xy),mudou=true;
  while(mudou&&P.length>3){mudou=false;for(let i=0;i<P.length&&P.length>3;i++){const a=P[(i-1+P.length)%P.length],b=P[i],c=P[(i+1)%P.length];
    if(Math.hypot(b[0]-a[0],b[1]-a[1])<.05||Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2<.02){P.splice(i,1);mudou=true;i--}}}
  return P.map(q=>pj.ll(q).map(v=>+v.toFixed(7)))}
// contorno das duas poligonais lado a lado, na mesma escala
function lotesSvg(a,b){const pts=[...a,...b],lat0=centro(pts)[0],k=Math.cos(lat0*Math.PI/180),xs=pts.map(p=>p[1]*k),ys=pts.map(p=>-p[0]),
    x0=Math.min(...xs),y0=Math.min(...ys),s=Math.max(Math.max(...xs)-x0,Math.max(...ys)-y0)||1,W=220,pad=8,f=(W-2*pad)/s,
    d=P=>P.map((p,i)=>(i?'L':'M')+(pad+(p[1]*k-x0)*f).toFixed(1)+' '+(pad+(-p[0]-y0)*f).toFixed(1)).join('')+'Z';
  return `<svg class="lotes-svg" viewBox="0 0 ${W} ${W}" role="img" aria-label="Poligonal desenhada e lotes da prefeitura"><path d="${d(b)}" class="lotes-novo"/><path d="${d(a)}" class="lotes-ant"/></svg>`}
function lotesPolyHtml(fechar){const L=UI.lotes,t=T(L.tid);if(!t)return '';const ant=t.poly?areaPoly(t.poly):null;
  const cab=`<div class="dh"><div><h2>Usar a poligonal dos lotes</h2><div class="muted" style="margin-top:4px">Substitui a poligonal desenhada pela soma dos lotes das inscrições, como estão na prefeitura.</div></div>${fechar}</div>`;
  const falhas=L.falhas.length?`<div class="banner warn">${ic('warn')}<div><div class="bt">${L.falhas.length===L.total?'Nenhum lote encontrado':`${L.falhas.length} de ${L.total} inscrições ficaram de fora`}</div>${L.falhas.map(esc).join('<br>')}</div></div>`:'';
  if(!L.poly)return cab+`<div class="fields"><div class="field full">${falhas}${L.separados?`<div class="banner warn">${ic('warn')}<div><div class="bt">Os lotes não se encostam</div>A poligonal do terreno precisa ser uma área só. Confira as inscrições ou continue com a desenhada.</div></div>`:''}</div></div><div class="df"><button class="btn text" data-a="close">Fechar</button></div>`;
  const nova=areaPoly(L.poly),dif=ant?nova-ant:null,com=ant?sobre2(t.poly,L.poly):null,ro=UI.role==='Leitura';
  return cab+`<div class="fields"><div class="field full lotes-cmp">${t.poly?lotesSvg(t.poly,L.poly):''}<div class="lotes-kv">
      <div><span>Desenhada</span><b>${ant?m2(Math.round(ant)):'—'}</b></div>
      <div><span>Lotes da prefeitura (${L.n} ${L.n>1?'inscrições':'inscrição'})</span><b>${m2(Math.round(nova))}</b></div>
      ${dif!=null?`<div><span>Diferença</span><b>${dif>=0?'+':'−'}${m2(Math.abs(Math.round(dif)))} (${dif>=0?'+':'−'}${num(Math.abs(dif/ant*100),1)}%)</b></div>
      <div><span>Em comum com a desenhada</span><b>${num(com.pctA,0)}% dela · ${num(com.pctB,0)}% dos lotes</b></div>`:''}
      <div class="hint"><span class="lotes-leg lotes-leg-ant"></span>desenhada <span class="lotes-leg lotes-leg-novo"></span>lotes</div></div></div>
    ${falhas?`<div class="field full">${falhas}</div>`:''}
    ${L.sobre.length?`<div class="field full"><div class="banner warn">${ic('warn')}<div><div class="bt">A área dos lotes ocupa parte de outro terreno</div>${L.sobre.map(x=>`${esc(x.t.codigo)} · ${esc(x.t.nome)}: ${m2(Math.round(x.area))} em comum`).join('<br>')}<div style="margin-top:4px">Substituir assim registra que são terrenos diferentes.</div></div></div></div>`:''}
    <div class="field full hint">A poligonal desenhada fica guardada no histórico do terreno.</div></div>
  <div class="df"><button class="btn text" data-a="close">Cancelar</button>${ro?'':`<button class="btn primary" data-a="lotes-usar">${L.sobre.length?'Substituir mesmo assim':'Substituir a poligonal'}</button>`}</div>`}
function lotesPolyUsar(){const L=UI.lotes,t=L&&T(L.tid);if(!t||!L.poly)return;
  nvTrocarPoly(t,L.poly,`pelos lotes da prefeitura (${L.n} ${L.n>1?'inscrições':'inscrição'})`);
  if(L.sobre.length)t.sobreAceitas=[...new Set([...(t.sobreAceitas||[]),...L.sobre.map(x=>x.t.id)])];
  UI.modal=null;UI.lotes=null;save();renderModal();render();toast('Poligonal substituída pelos lotes da prefeitura. A desenhada ficou guardada.')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a="lotes-poly"],[data-a="lotes-usar"]');if(!a)return;
  if(a.dataset.a==='lotes-poly'){const t=T(UI.id);if(t)lotesPolyCalcular(t)}else lotesPolyUsar()});

/* =====================================================================
   Filtros de terrenos (decisão do Moisés, 23/out/2026): um painel só, numa
   gaveta à direita (tela cheia no celular), o mesmo em Terrenos, Mapa e Fases,
   com a mesma seleção valendo nas três páginas. Na barra da página: botão
   Filtros com o número de filtros ativos, um chip por filtro (X tira só ele),
   Limpar e as visões salvas (pessoais; as da empresa só o administrador cria).
   Dentro de um filtro as opções somam (ou); entre filtros, todos valem (e).
   "Não informado" não some calado: faixa com mínimo ou máximo deixa de fora o
   terreno sem o dado, com "Incluir sem informação (N)".
   No banco: v_terrenos (uf, vgv, corretor_ids, proposta_ativa_valor, tem_partes,
   zonas_siglas, ultima_movimentacao_em) e app.filtros_salvos.
   ===================================================================== */
P.filtro='M4 6h16M7 12h10M10 18h4';
const FX_KEY='bkm-terrenos-filtros';
const FX_VAZIO=()=>({});
UI.fx=UI.fx||(()=>{try{const h=location.hash.match(/[#&]f=([^&]+)/);if(h)return JSON.parse(decodeURIComponent(h[1]))}catch(e){}try{return JSON.parse(sessionStorage.getItem(FX_KEY)||'{}')}catch(e){return {}}})();
UI.fxAb=UI.fxAb||['funil','comercial','local'];
let FX_ABERTO=false,FX_SO_RESULTADO=false;

/* ---------- valores do terreno usados pelos filtros ---------- */
const STP=['apresentada','em_analise','aceita'];
const propAtiva=L=>(L||[]).filter(p=>STP.includes(p.status)).slice(-1)[0]||null;
/* última proposta ativa; dividido em partes, a soma das partes em aberto (como app.v_terrenos.proposta_ativa_valor) */
function fxProposta(t){const p=propAtiva(t.propostas);if(p)return p.valor;
  if(typeof dividida==='function'&&dividida(t)){const vs=partesAtivas(t).map(pa=>propAtiva(pa.propostas)?.valor).filter(v=>v!=null);return vs.length?vs.reduce((a,b)=>a+b,0):null}return null}
const fxPedido=t=>ofertaRef(t)?.valor??null;
const fxM2=t=>{const v=fxPedido(t),a=areaAdotada(t);return v!=null&&a?v/a:null};
const fxCidade=t=>(t.municipio||'').split(' · ')[0]||null;
const fxUF=t=>(t.municipio||'').split(' · ')[1]||null;
/* parado: última atividade, reunião realizada, passagem do funil ou log */
function fxParadoDias(t){const ds=[t.dataIdent,...(t.reunioes||[]).filter(m=>m.status==='realizada').map(m=>m.data),...(t.neg?.trilha||[]).map(x=>x.em.slice(0,10)),...procsDe(t).flatMap(p=>(p.trilha||[]).map(x=>x.em.slice(0,10))),...(t.hist||[]).map(h=>h.em.slice(0,10))].filter(Boolean).sort();
  return ds.length?diff(ds[ds.length-1],HOJE):null}
/* processos do terreno, cada um com a fase; status do Comprado vira o Concluído da fase de entrada */
const fxProcs=t=>[...(t.neg?[{...t.neg,fase:faseEnt(),_neg:true}]:[]),...procsDe(t)].map(p=>({...p,st:p.status==='comprado'?'concluido':p.status}));
const fxEtapaK=(f,e)=>f+':'+e,fxSubK=(f,s)=>f+':'+s;
const fxCorretores=t=>(t.corretores||[]).map(x=>x.cid);
const fxZonas=t=>{const a=analiseVig(t);return a?[...new Set(a.zonas.map(z=>z.sigla))]:[]};
const fxDocsVenc=t=>(t.docs||[]).some(d=>docSt(d)==='vencido');

/* ---------- definição dos filtros ----------
   tipo: 'lista' (várias opções; op(): [[valor, rótulo]]; v(t): valor ou lista de valores do terreno),

const FX_GRUPOS=[['funil','Funil'],['comercial','Comercial'],['local','Localização'],['terreno','Terreno'],['urb','Urbanismo'],['gestao','Gestão e pendências']];
const FX=[
  {k:'fase',g:'funil',l:'Fase',tipo:'lista',funil:true,op:()=>fasesL().filter(f=>f.ativo).map(f=>[f.k,f.nome])},
  {k:'etapa',g:'funil',l:'Etapa',tipo:'lista',funil:true,op:()=>fxFasesSel().flatMap(f=>etapasF(f).map(e=>[fxEtapaK(f,e.k),e.nome,f])),
    vis:()=>fxFasesSel().length>0,dica:'Marque uma fase para escolher as etapas.'},
  {k:'sub',g:'funil',l:'Subetapa',tipo:'lista',funil:true,op:()=>fxEtapasSel().flatMap(([f,e])=>(etapaF(f,e)?.subs||[]).map(s=>[fxSubK(f,s.k),s.nome,f])),
    vis:()=>fxEtapasSel().length>0,dica:'Marque uma etapa para escolher as subetapas.'},
  {k:'status',g:'funil',l:'Status',tipo:'lista',funil:'status',op:()=>[['ativo','Ativo'],['stand_by','Stand By'],['concluido',fxConcNome()],['perdido','Perdido'],['descartado','Descartado'],['sem','Sem negociação']]},
  {k:'atrasada',g:'funil',l:'Prazo da subetapa estourado',tipo:'marca',funil:'status',p:t=>fxProcs(t).some(p=>p.st==='ativo'&&(p._neg?subAtrasada(p):procAtrasada(p)))},
  {k:'aprov',g:'funil',l:'Aguardando aprovação',tipo:'marca',funil:'status',p:t=>fxProcs(t).some(p=>p.pedido)},
  {k:'dias',g:'funil',l:'Dias na etapa',tipo:'faixa',un:'d',funil:'status',v:t=>{const a=faseAtual(t)?.p;return a&&aberto(a)?diff(a.desde,HOJE):null}},
  {k:'temp',g:'comercial',l:'Temperatura',tipo:'lista',op:()=>[['5','5 · '+TEMP[5]],['4','4 · '+TEMP[4]],['3','3'],['2','2'],['1','1'],['na','Não avaliada']],v:t=>t.neg?String(t.neg.temp||'na'):null},
  {k:'preco',g:'comercial',l:'Preço pedido',dica2:'da oferta de referência',tipo:'faixa',un:'R$',v:fxPedido},
  {k:'m2',g:'comercial',l:'Preço pedido por m²',tipo:'faixa',un:'R$',v:fxM2},
  {k:'prop',g:'comercial',l:'Última proposta ativa',dica2:'apresentada, em análise ou aceita',tipo:'faixa',un:'R$',v:fxProposta},
  {k:'vgv',g:'comercial',l:'VGV estimado',dica2:'da viabilidade',tipo:'faixa',un:'R$',v:t=>t.neg?.viab?.vgv??null},
  {k:'acima',g:'comercial',l:'Proposta acima do preço máximo',tipo:'marca',p:t=>acimaMax(t)},
  {k:'corretor',g:'comercial',l:'Corretor',dica2:'do terreno ou de qualquer parte',tipo:'lista',busca:true,op:()=>S.corretores.map(c=>[c.id,c.nome]),v:fxCorretores},
  {k:'forma',g:'comercial',l:'Forma de pagamento pedida',tipo:'lista',op:()=>Object.entries(OPT.forma),v:t=>ofertaRef(t)?.forma||null},
  {k:'origem',g:'comercial',l:'Origem do cadastro',tipo:'lista',op:()=>Object.entries(OPT.origem),v:t=>t.origem||null},
  {k:'uf',g:'local',l:'Estado',tipo:'lista',op:()=>fxDistintos(fxUF),v:fxUF},
  {k:'cidade',g:'local',l:'Cidade',tipo:'lista',op:()=>fxDistintos(fxCidade,t=>!fxSel('uf').length||fxSel('uf').includes(fxUF(t))),v:fxCidade},
  /* a lista de regiões é a mesma para qualquer cidade e não quer dizer a mesma coisa em duas cidades: só com uma cidade marcada */
  {k:'zona',g:'local',l:'Região da cidade',tipo:'lista',op:()=>Object.entries(OPT.zona),v:t=>t.zona||null,vis:()=>fxSel('cidade').length===1,dica:'Marque uma cidade para filtrar pela região.'},
  {k:'bairro',g:'local',l:'Bairro',tipo:'lista',busca:true,op:()=>fxDistintos(t=>t.bairro,t=>!fxSel('cidade').length||fxSel('cidade').includes(fxCidade(t))),v:t=>t.bairro||null},
  {k:'eixo',g:'local',l:'Eixo comercial',tipo:'lista',op:()=>S.eixos.map(e=>[e.id,e.nome]),v:t=>t.eixo||null},
  {k:'area',g:'terreno',l:'Área',dica2:'área adotada',tipo:'faixa',un:'m²',v:t=>areaAdotada(t)},
  {k:'partes',g:'terreno',l:'Vários donos',tipo:'lista',op:()=>[['com','Com partes'],['sem','Sem partes']],v:t=>typeof partesAtivas==='function'&&partesAtivas(t).length?'com':'sem'},
  {k:'zon',g:'urb',l:'Zoneamento',dica2:'análise vigente',tipo:'lista',busca:true,op:()=>fxDistintos(fxZonas),v:fxZonas},
  {k:'resp',g:'gestao',l:'Responsável',tipo:'lista',op:()=>[['eu','Meus terrenos'],...USERS.map(u=>[u,u])],v:t=>t.resp?[t.resp,...(t.resp===me()?['eu']:[])]:null},
  {k:'prio',g:'gestao',l:'Prioridade',tipo:'lista',op:()=>Object.entries(OPT.prioridade),v:t=>t.prioridade||null},
  {k:'ident',g:'gestao',l:'Cadastrado entre',tipo:'periodo',v:t=>t.dataIdent||null},
  {k:'parado',g:'gestao',l:'Parado há mais de',tipo:'numero',un:'dias',v:fxParadoDias},
  {k:'tarAtr',g:'gestao',l:'Tarefas atrasadas',tipo:'marca',p:t=>atrasadas(t).length>0},
  {k:'docVenc',g:'gestao',l:'Documentos vencidos',tipo:'marca',p:fxDocsVenc},
  {k:'dilImp',g:'gestao',l:'Diligência impeditiva',tipo:'marca',p:t=>(t.dilig||[]).some(d=>d.sit==='impeditiva')},
  {k:'incomp',g:'gestao',l:'Ficha incompleta (menos de 50%)',tipo:'marca',p:t=>completude(t).pct<50},
  {k:'arq',g:'gestao',l:'Incluir arquivados',tipo:'marca',sempre:true}];
const FXK=Object.fromEntries(FX.map(d=>[d.k,d]));
const fxConcNome=()=>{const fs=fxFasesSel();return fs.length===1?(faseCfg(fs[0])?.conc||'Concluído'):'Concluído (Comprado, Aprovado...)'};
const fxSel=k=>UI.fx[k]||[];
const fxFasesSel=()=>fxSel('fase').filter(f=>faseCfg(f));
const fxEtapasSel=()=>fxSel('etapa').map(x=>x.split(':')).filter(([f,e])=>fxFasesSel().includes(f)&&etapaF(f,e));
function fxDistintos(fv,pre){const m=new Map();S.terrenos.filter(pre||(()=>true)).forEach(t=>{[].concat(fv(t)||[]).forEach(v=>{if(v)m.set(v,v)})});return [...m.keys()].sort((a,b)=>a.localeCompare(b,'pt')).map(v=>[v,v])}

/* ---------- o filtro está ativo? quais valem? ---------- */
const fxTem=(d,f=UI.fx)=>{const v=f[d.k];if(d.tipo==='lista')return Array.isArray(v)&&v.length>0;if(d.tipo==='marca')return !!v;if(d.tipo==='faixa'||d.tipo==='periodo')return !!v&&(v.min!=null||v.max!=null);if(d.tipo==='numero')return v!=null&&v!=='';return false};
/* no quadro das fases, a descida Fases › fase › etapa já é o filtro do funil: fase, etapa e subetapa não valem lá */
const fxValeEm=(d,ctx)=>!(ctx==='kanban'&&d.funil===true)&&(!d.vis||d.vis());
const fxAtivos=ctx=>FX.filter(d=>fxTem(d)&&fxValeEm(d,ctx)&&d.k!=='arq');

/* funil: fase, etapa, subetapa e status juntos sobre o mesmo processo.
   Sem status marcado, valem os processos abertos (ativo ou Stand By). */
function fxFunil(t,f,ctx){const fs=ctx==='kanban'?[]:f.fase||[],es=ctx==='kanban'?[]:(f.etapa||[]).filter(x=>fs.includes(x.split(':')[0])),ss=ctx==='kanban'?[]:(f.sub||[]).filter(x=>es.some(e=>x.startsWith(e.split(':')[0]+':'))),st=f.status||[];
  if(!fs.length&&!st.length)return true;const ps=fxProcs(t);
  if(st.includes('sem')&&!ps.length)return !fs.length;
  const stOk=p=>st.length?st.includes(p.st):['ativo','stand_by'].includes(p.st);
  /* etapa e subetapa só restringem as fases em que o usuário escolheu alguma */
  const etOk=p=>{const daFase=es.filter(x=>x.startsWith(p.fase+':'));if(!daFase.length)return true;if(!daFase.includes(fxEtapaK(p.fase,p.etapa)))return false;
    const subsDaEtapa=ss.filter(x=>{const [ff,sk]=x.split(':');return ff===p.fase&&(etapaF(ff,p.etapa)?.subs||[]).some(s=>s.k===sk)});return !subsDaEtapa.length||subsDaEtapa.includes(fxSubK(p.fase,p.sub))};
  return ps.some(p=>(!fs.length||fs.includes(p.fase))&&stOk(p)&&etOk(p))}
function fxPassaUm(t,d,f){const v=f[d.k];
  if(d.tipo==='marca')return d.k==='arq'?true:!!d.p(t);
  if(d.tipo==='lista'){const tv=[].concat(d.v(t)??[]);return tv.some(x=>v.includes(x))}
  if(d.tipo==='faixa'){const x=d.v(t);if(x==null)return !!v.semInfo;return (v.min==null||x>=v.min)&&(v.max==null||x<=v.max)}
  if(d.tipo==='periodo'){const x=d.v(t);if(!x)return false;return (!v.min||x>=v.min)&&(!v.max||x<=v.max)}
  if(d.tipo==='numero'){const x=d.v(t);return x!=null&&x>Number(v)}
  return true}
/* passa em tudo, menos (opcional) o filtro `fora` — para as contagens de cada opção */
function fxPassa(t,ctx,fora,f=UI.fx){if(t.situacao==='arquivado'&&!f.arq&&ctx!=='kanban')return false;
  const funFora=fora&&FXK[fora]?.funil;
  if(!funFora){if(!fxFunil(t,f,ctx))return false}else{const g={...f};delete g[fora];if(fora==='fase'){delete g.etapa;delete g.sub}if(!fxFunil(t,g,ctx))return false}
  return FX.every(d=>d.funil===true||d.k==='status'||d.k===fora||!fxTem(d,f)||!fxValeEm(d,ctx)||fxPassaUm(t,d,f))}
const fxCtx=()=>UI.route==='mapa'?'mapa':UI.route==='negociacoes'?'kanban':'terrenos';
const fxLista=(ctx=fxCtx())=>S.terrenos.filter(t=>fxPassa(t,ctx));
/* quantos ficam marcando a opção (com os outros filtros valendo) */
function fxConta(d,val,ctx){const base=S.terrenos.filter(t=>fxPassa(t,ctx,d.k));
  if(d.funil){const g={...UI.fx,[d.k]:[val]};if(d.k==='fase'){delete g.etapa;delete g.sub}return base.filter(t=>fxPassa(t,ctx,null,g)).length}
  return base.filter(t=>[].concat(d.v(t)??[]).includes(val)).length}

/* ---------- mudar o filtro ---------- */
function fxGuardar(){try{sessionStorage.setItem(FX_KEY,JSON.stringify(UI.fx))}catch(e){}
  try{const s=Object.keys(UI.fx).length?'#f='+encodeURIComponent(JSON.stringify(UI.fx)):'';history.replaceState(null,'',location.pathname+location.search+s)}catch(e){}}
function fxLimparDependentes(){const fs=fxFasesSel();if(UI.fx.etapa){UI.fx.etapa=UI.fx.etapa.filter(x=>fs.includes(x.split(':')[0]));if(!UI.fx.etapa.length)delete UI.fx.etapa}
  const es=fxEtapasSel();if(UI.fx.sub){UI.fx.sub=UI.fx.sub.filter(x=>{const [f,s]=x.split(':');return es.some(([ff,e])=>ff===f&&(etapaF(f,e)?.subs||[]).some(z=>z.k===s))});if(!UI.fx.sub.length)delete UI.fx.sub}
  if(UI.fx.zona&&fxSel('cidade').length!==1)delete UI.fx.zona;
  Object.keys(UI.fx).forEach(k=>{if(FXK[k]&&!fxTem(FXK[k]))delete UI.fx[k]})}
function fxAplicar(soResultado){fxLimparDependentes();fxGuardar();UI.fxVisaoMudou=!!UI.fxVisao;
  if(UI.route==='mapa'&&typeof mpRefresh==='function'){mpRefresh();const b=$('#fx-barra');if(b)b.outerHTML=fxBarra();if(!soResultado)fxDrawer();else fxRodape();return}
  FX_SO_RESULTADO=!!soResultado;render();FX_SO_RESULTADO=false;if(soResultado)fxRodape()}
const fxTira=k=>{delete UI.fx[k];if(k==='fase'){delete UI.fx.etapa;delete UI.fx.sub}if(k==='etapa')delete UI.fx.sub;if(k==='cidade')delete UI.fx.zona};

/* ---------- textos dos chips ---------- */
const fxNum=(v,un)=>un==='R$'?mi(v):un==='m²'?m2(v):num(v)+(un?' '+un:'');
function fxChipTxt(d){const v=UI.fx[d.k];
  if(d.tipo==='marca')return d.l;
  if(d.tipo==='lista'){const ops=new Map(d.op().map(o=>[o[0],o[1]]));const ls=v.map(x=>ops.get(x)||x);
    if(d.k==='etapa'||d.k==='sub')return `${d.l}: ${ls.join(', ')}`;
    return `${['status','temp'].includes(d.k)?'':d.l+': '}${ls.length>2?ls.slice(0,2).join(', ')+' +'+(ls.length-2):ls.join(', ')}`}
  if(d.tipo==='faixa'){const a=v.min!=null?fxNum(v.min,d.un):null,b=v.max!=null?fxNum(v.max,d.un):null;return `${d.l} ${a&&b?a+' a '+b:a?'≥ '+a:'até '+b}${v.semInfo?' (com sem informação)':''}`}
  if(d.tipo==='periodo')return `Cadastrado ${v.min&&v.max?fd(v.min)+' a '+fd(v.max):v.min?'desde '+fd(v.min):'até '+fd(v.max)}`;
  if(d.tipo==='numero')return `Parado há mais de ${v} dias`;
  return d.l}

/* ---------- barra da página: botão, chips, limpar, visões ---------- */
function fxBarra(ctx=fxCtx()){const at=fxAtivos(ctx),n=at.length+(UI.fx.arq&&ctx!=='kanban'?1:0),vs=fxVisoes(),cur=vs.find(v=>v.id===UI.fxVisao);
  const chips=at.map(d=>`<span class="fx-chip">${esc(fxChipTxt(d))}<button class="fx-cx" data-a="fx-tira" data-v="${d.k}" aria-label="Tirar o filtro ${esc(d.l)}" title="Tirar">${ic('close',16)}</button></span>`).join('');

      ${['empresa','minhas'].map(g=>{const L=vs.filter(v=>g==='empresa'?!v.dono:v.dono);return L.length?`<optgroup label="${g==='empresa'?'Da empresa':'Minhas'}">${L.map(v=>`<option value="${v.id}" ${v.id===UI.fxVisao?'selected':''}>${esc(v.nome)}${v.id===UI.fxVisao&&UI.fxVisaoMudou?' (alterada)':''}</option>`).join('')}</optgroup>`:''}).join('')}</select></label>
    ${pod?`<button class="iconbtn fx-vx" data-a="fx-visao-x" title="Excluir a visão ${esc(cur.nome)}" aria-label="Excluir a visão ${esc(cur.nome)}">${ic('close',18)}</button>`:''}</span></div>`}

/* ---------- visões salvas (no banco: app.filtros_salvos) ---------- */
function fxVisoes(){if(!S.visoes){S.visoes=[{id:'v1',nome:'Minhas em negociação',dono:null,f:{resp:['eu'],fase:[faseEnt()],status:['ativo']}},{id:'v2',nome:'Quentes (4 e 5)',dono:null,f:{temp:['4','5'],status:['ativo']}},

  return S.visoes.filter(v=>!v.dono||v.dono===me())}

/* ---------- a gaveta ---------- */
function fxCampo(d,ctx){if(!fxValeEm(d,ctx)&&d.vis&&!d.vis())return d.dica?`<div class="fx-c"><div class="fx-l">${esc(d.l)}</div><div class="fx-hint">${esc(d.dica)}</div></div>`:'';
  const v=UI.fx[d.k],dica=d.dica2?`<small>${esc(d.dica2)}</small>`:'';
  if(d.tipo==='marca')return `<button class="fx-op fx-mk" data-a="fx-marca" data-k="${d.k}" aria-pressed="${!!v}">${v?ic('check',16):''}${esc(d.l)}${d.k==='arq'?'':` <span class="q">${fxContaMarca(d,ctx)}</span>`}</button>`;
  if(d.tipo==='lista'){let ops=d.op();const sel=v||[],q=(UI.fxBusca?.[d.k]||'').toLowerCase();
    if(d.k==='etapa'||d.k==='sub'){const fs=[...new Set(ops.map(o=>o[2]))];return `<div class="fx-c"><div class="fx-l">${esc(d.l)}${dica}</div>${fs.map(f=>`${fs.length>1||d.k==='sub'?`<div class="fx-sub">${esc(faseN(f))}</div>`:''}<div class="fx-ops">${ops.filter(o=>o[2]===f).map(o=>fxOp(d,o,sel,ctx)).join('')}</div>`).join('')}</div>`}
    const busca=d.busca&&ops.length>6?`<input class="fx-in" type="search" data-fx-busca="${d.k}" placeholder="Buscar ${esc(d.l.toLowerCase())}…" value="${esc(UI.fxBusca?.[d.k]||'')}" aria-label="Buscar ${esc(d.l.toLowerCase())}">`:'';
    if(q)ops=ops.filter(o=>sel.includes(o[0])||o[1].toLowerCase().includes(q));
    return `<div class="fx-c"><div class="fx-l">${esc(d.l)}${dica}</div>${busca}<div class="fx-ops">${ops.map(o=>fxOp(d,o,sel,ctx)).join('')||'<span class="fx-hint">Nada encontrado.</span>'}</div></div>`}
  if(d.tipo==='faixa'){const w=v||{},sem=S.terrenos.filter(t=>fxPassa(t,ctx,d.k)&&d.v(t)==null).length,fmt=x=>x==null?'':d.un==='R$'?num(x):num(x);
    return `<div class="fx-c"><div class="fx-l">${esc(d.l)}${d.un?' ('+d.un+')':''}${dica}</div><div class="fx-r"><input class="fx-in" inputmode="decimal" data-fx="${d.k}" data-p="min" placeholder="Mínimo" value="${fmt(w.min)}" aria-label="${esc(d.l)} mínimo"><span>até</span><input class="fx-in" inputmode="decimal" data-fx="${d.k}" data-p="max" placeholder="Máximo" value="${fmt(w.max)}" aria-label="${esc(d.l)} máximo"></div>
      ${sem&&fxTem(d)?`<button class="fx-op fx-mk fx-sem" data-a="fx-sem" data-k="${d.k}" aria-pressed="${!!w.semInfo}">${w.semInfo?ic('check',16):''}Incluir sem informação <span class="q">${sem}</span></button>`:''}${d.un==='R$'?'<div class="fx-hint">Aceita "12 mi" ou "800 mil".</div>':''}</div>`}
  if(d.tipo==='periodo'){const w=v||{};return `<div class="fx-c"><div class="fx-l">${esc(d.l)}</div><div class="fx-r"><input class="fx-in" type="date" data-fx="${d.k}" data-p="min" value="${w.min||''}" aria-label="De"><span>e</span><input class="fx-in" type="date" data-fx="${d.k}" data-p="max" value="${w.max||''}" aria-label="Até"></div></div>`}
  if(d.tipo==='numero')return `<div class="fx-c"><div class="fx-l">${esc(d.l)}</div><div class="fx-r1"><input class="fx-in" inputmode="numeric" data-fx="${d.k}" value="${v??''}" placeholder="Ex.: 30" aria-label="${esc(d.l)}"><span>dias sem movimentação</span></div></div>`;
  return ''}
const fxContaMarca=(d,ctx)=>S.terrenos.filter(t=>fxPassa(t,ctx,d.k)&&d.p(t)).length;
function fxOp(d,o,sel,ctx){const on=sel.includes(o[0]),n=fxConta(d,o[0],ctx);
  return `<button class="fx-op" data-a="fx-op" data-k="${d.k}" data-v="${esc(o[0])}" aria-pressed="${on}" ${!on&&!n?'data-zero="1"':''}>${on?ic('check',16):''}${esc(o[1])} <span class="q">${n}</span></button>`}
function fxDrawer(){let el=$('#fx-dr'),sc=$('#fx-scrim');
  if(!FX_ABERTO){el?.remove();sc?.remove();document.body.classList.remove('fx-on');return}
  const ctx=fxCtx(),top=el?.querySelector('.fx-b')?.scrollTop||0;
  if(!el){sc=document.createElement('div');sc.id='fx-scrim';sc.className='fx-scrim';sc.dataset.a='fx-fechar';document.body.appendChild(sc);
    el=document.createElement('aside');el.id='fx-dr';el.className='fx-dr';el.setAttribute('role','dialog');el.setAttribute('aria-label','Filtros');document.body.appendChild(el)}
  document.body.classList.add('fx-on');
  const grupos=FX_GRUPOS.map(([g,l])=>{const ds=FX.filter(d=>d.g===g&&!(ctx==='kanban'&&d.funil===true)),ab=UI.fxAb.includes(g),n=ds.filter(d=>fxTem(d)&&d.k!=='arq').length;
    return `<section class="fx-s"><button class="fx-sh" data-a="fx-grupo" data-v="${g}" aria-expanded="${ab}">${esc(l)}${n?`<span class="fx-sn">${n}</span>`:''}${ic('chev',18)}</button>${ab?`<div class="fx-sb">${g==='funil'&&ctx==='kanban'?'<div class="fx-hint">No quadro, a fase e a etapa vêm da navegação (Fases › fase › etapa).</div>':''}
      ${fxMarcasJuntas(ds,ctx)}</div>`:''}</section>`}).join('');
  el.innerHTML=`<div class="fx-h"><h2>Filtros</h2>${Object.keys(UI.fx).length?'<button class="linkbtn" data-a="fx-limpar">Limpar tudo</button>':''}<button class="iconbtn" data-a="fx-fechar" aria-label="Fechar filtros" title="Fechar (Esc)">${ic('close',22)}</button></div>
    <div class="fx-b">${grupos}</div><div class="fx-f" id="fx-f">${fxRodapeHtml(ctx)}</div>`;
  el.querySelector('.fx-b').scrollTop=top}
/* marcas soltas (prazo, aprovação, pendências) ficam juntas numa linha de botões */
function fxMarcasJuntas(ds,ctx){let h='',mk=[];const sai=()=>{if(mk.length){h+=`<div class="fx-ops">${mk.join('')}</div>`;mk=[]}};
  ds.forEach(d=>{if(d.tipo==='marca')mk.push(fxCampo(d,ctx));else{sai();h+=fxCampo(d,ctx)}});sai();return h}
function fxRodapeHtml(ctx=fxCtx()){const n=fxLista(ctx).length,at=fxAtivos(ctx).length;
  return `<span class="fx-tot">${at?at+' filtro'+(at>1?'s':''):'Sem filtros'}</span>${UI.role!=='Leitura'||true?`<button class="btn sm" data-a="fx-salvar" ${at?'':'disabled'}>Salvar visão</button>`:''}<button class="btn primary sm" data-a="fx-fechar">Ver ${n} terreno${n===1?'':'s'}</button>`}
function fxRodape(){const f=$('#fx-f');if(f)f.innerHTML=fxRodapeHtml()}

/* ---------- valores digitados: "12 mi", "800 mil", "1.500.000" ---------- */
function fxLerNum(s){s=String(s||'').trim().toLowerCase().replace(/r\$\s*/,'');if(!s)return null;let mult=1;
  if(/\bmi(lh[õo]es|lhão)?\b|\bmi$/.test(s)){mult=1e6;s=s.replace(/mi.*$/,'')}else if(/\bmil\b/.test(s)){mult=1e3;s=s.replace(/mil.*$/,'')}
  s=s.trim().replace(/\./g,'').replace(',','.');const v=Number(s);return isFinite(v)&&s!==''?v*mult:null}

/* ---------- eventos ---------- */
function fxAcao(a){const k=a.dataset.k,v=a.dataset.v;
  switch(a.dataset.a){
    case 'fx-abrir':FX_ABERTO=!FX_ABERTO;if(FX_ABERTO&&UI.fichaSheet){UI.fichaSheet=null;fichaSheet()}fxDrawer();const b=$('.fx-btn');b?.setAttribute('aria-expanded',FX_ABERTO);if(FX_ABERTO)setTimeout(()=>$('#fx-dr .fx-sh')?.focus(),30);return true;
    case 'fx-fechar':FX_ABERTO=false;fxDrawer();$('.fx-btn')?.setAttribute('aria-expanded','false');return true;
    case 'fx-grupo':UI.fxAb=UI.fxAb.includes(v)?UI.fxAb.filter(x=>x!==v):[...UI.fxAb,v];fxDrawer();return true;
    case 'fx-op':{const cur=fxSel(k);UI.fx[k]=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];if(!UI.fx[k].length)fxTira(k);fxAplicar();return true}
    case 'fx-marca':UI.fx[k]=!UI.fx[k];if(!UI.fx[k])delete UI.fx[k];fxAplicar();return true;
    case 'fx-sem':UI.fx[k]={...UI.fx[k],semInfo:!UI.fx[k]?.semInfo};fxAplicar();return true;
    case 'fx-tira':fxTira(v);fxAplicar();return true;
    case 'fx-limpar':UI.fx={};UI.fxVisao=null;UI.fxVisaoMudou=false;fxAplicar();toast('Filtros limpos.');return true;
    case 'fx-salvar':UI.modal='fx-salvar';renderModal();return true;
    case 'fx-visao-x':{const x=S.visoes.find(z=>z.id===UI.fxVisao);if(!x)return true;S.visoes=S.visoes.filter(z=>z!==x);UI.fxVisao=null;save();fxAplicar();toast(`Visão "${x.nome}" excluída.`);return true}
  }return false}
function fxMudou(el){if(el.dataset.ch==='fx-visao'){const x=S.visoes.find(z=>z.id===el.value);UI.fxVisao=x?.id||null;if(x)UI.fx=JSON.parse(JSON.stringify(x.f));fxAplicar();UI.fxVisaoMudou=false;const b=$('#fx-barra');if(b)b.outerHTML=fxBarra();return true}
  if(el.dataset.fx){fxDigitado(el,false);return true}return false}
function fxDigitado(el,soResultado){const d=FXK[el.dataset.fx];if(!d)return;
  if(d.tipo==='numero'){const n=parseInt(el.value,10);if(isFinite(n)&&n>=0)UI.fx[d.k]=n;else delete UI.fx[d.k]}
  else{const w={...(UI.fx[d.k]||{})},p=el.dataset.p,val=d.tipo==='periodo'?(el.value||null):fxLerNum(el.value);w[p]=val;UI.fx[d.k]=w;if(!fxTem(d))delete UI.fx[d.k]}
  fxAplicar(soResultado)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a^="fx-"]');if(!a)return;if(fxAcao(a)){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('change',e=>{const el=e.target;if(el.closest&&(el.closest('#fx-dr')||el.closest('#fx-barra'))&&fxMudou(el)){e.stopImmediatePropagation()}},true);
/* enquanto digita: só o resultado muda (a gaveta não redesenha, para não perder o cursor) */
document.addEventListener('input',e=>{const el=e.target;if(!el.closest||!el.closest('#fx-dr'))return;e.stopImmediatePropagation();
  if(el.dataset.fxBusca){UI.fxBusca={...(UI.fxBusca||{}),[el.dataset.fxBusca]:el.value};const k=el.dataset.fxBusca,pos=el.selectionStart;fxDrawer();const n=$(`#fx-dr [data-fx-busca="${k}"]`);if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(el.dataset.fx&&el.type!=='date'){clearTimeout(el._t);el._t=setTimeout(()=>fxDigitado(el,true),250)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&FX_ABERTO&&!UI.modal){FX_ABERTO=false;fxDrawer();$('.fx-btn')?.setAttribute('aria-expanded','false');e.preventDefault();e.stopImmediatePropagation()}},true);
/* a gaveta acompanha cada redesenho da página (troca de página, de papel...), menos enquanto se digita nela */
const _posRenderFx=posRender;posRender=function(){_posRenderFx.apply(this,arguments);if(!['terrenos','mapa','negociacoes'].includes(UI.route))FX_ABERTO=false;if(!FX_SO_RESULTADO)fxDrawer()};
/* a gaveta e o painel da ficha no mapa não abrem juntos */

const _renderModalFx=renderModal;renderModal=function(){if(UI.modal==='fx-salvar'){const el=$('#modal'),fechar=`<button class="iconbtn" data-a="close" aria-label="Fechar">${ic('close')}</button>`;

/* ---------- concorrência: empreendimentos de outras empresas no mapa ----------
   Espelha app.concorrentes / concorrencia_empreendimentos / concorrencia_tipologias / concorrencia_precos
   (decisão do Moisés, 24/out/2026). Cadastro numa gaveta à direita, aberta pelo clique direito no mapa
   (toque longo no celular); o toque no ícone abre o quadro com os dados. O preço médio de cada
   tipologia nunca é sobrescrito: cada data de apuração é uma linha nova (a mesma data corrige aquele
   valor). O preço por m² do empreendimento sai das tipologias, como app.concorrencia_resumo. */
const CC_SIT={lancamento:'Lançamento',em_obras:'Em obras',pronto:'Pronto',nao_informado:'Não informada'};
const CC_FAIXA={his1:'HIS 1',his2:'HIS 2',hmp:'HMP',r2v:'R2V',nr:'NR',nao_informado:'Não informada'};
const CC_FONTE={stand:'Stand de vendas',site:'Site da empresa',corretor:'Corretor',portal:'Portal de anúncios',outra:'Outra',nao_informado:'Não informada'};
const CC={dr:null,box:null,hist:null,desativar:false,abertoEm:0};
const ccData=s=>s?s.split('-').reverse().join('/'):'—';
const ccCurta=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y.slice(2)}`};
const ccMes=s=>{if(!s)return '—';const [y,m]=s.split('-');return MES[+m-1]+'/'+y};
const ccDorm=d=>d==null?'—':d===0?'Studio':d+' dorm';
const ccM2=v=>v==null?'—':brl(v)+'/m²';
/* marca no mapa (opção A, decisão do Moisés de 24/out/2026): quadrado roxo com prédio, sem o nome ao lado
   (atrapalhava a leitura do mapa); o nome fica no quadro que abre ao tocar */
const CC_PREDIO='<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 21V5l8-3v19M12 9l8 3v9M2 21h20M7 8h2M7 12h2M7 16h2M15 14h2M15 18h2"/></svg>';
const ccMarcaHtml=()=>`<span class="conc-b">${CC_PREDIO}</span>`;
const ccAtivos=()=>(S.concorrentes||[]).filter(c=>c.ativo!==false);
const ccC=id=>(S.concorrentes||[]).find(c=>c.id===id);
const ccEmp=id=>(S.concEmpresas||[]).find(e=>e.id===id);
const ccEmpN=c=>ccEmp(c.emp)?.nome||'';

/* dados de exemplo e conversão do formato antigo (empresa em texto, sem tipologias) */
function ccPreparar(){if(!S.concEmpresas)S.concEmpresas=[];
  (S.concorrentes||[]).forEach(c=>{if(c.emp===undefined){const n=(c.empresa||'').trim();let e=n&&S.concEmpresas.find(x=>x.nome.toLowerCase()===n.toLowerCase());
      if(n&&!e){e={id:uid(),nome:n};S.concEmpresas.push(e)}c.emp=e?e.id:null;delete c.empresa}
    if(!c.tip)c.tip=[];if(!c.sit)c.sit='nao_informado'})}

      tip:[tp('t11',2,40,180,'his2',[['2026-03-10',245000,'stand'],['2026-09-15',259000,'stand']]),tp('t12',2,48,60,'hmp',[['2026-03-10',330000,'stand'],['2026-09-15',345000,'stand']])]},

      tip:[tp('t21',1,32,null,'his1',[['2026-07-02',198000,'site']]),tp('t22',2,42,null,'his2',[['2026-07-02',262000,'site']]),tp('t23',3,64,null,'r2v',[['2026-05-20',520000,'portal']])]},
    {id:'c3',nome:'Vila Cupecê Residencial',emp:'ce3',lat:-23.66450,lng:-46.64900,end:'Cidade Ademar, São Paulo',unid:null,sit:'nao_informado',lanc:null,obs:'',ativo:true,tip:[]}]}}

/* ---------- cálculo (o mesmo de app.concorrencia_tipologias_em e app.concorrencia_resumo) ---------- */
function ccVig(tp,data=HOJE){const p=(tp.precos||[]).filter(x=>x.em<=data).sort((a,b)=>b.em.localeCompare(a.em))[0];
  return p?{...p,m2:Math.round(p.preco/tp.area*100)/100}:null}
function ccResumo(c,data=HOJE){const ts=(c.tip||[]).filter(t=>t.ativo!==false),cp=ts.map(t=>({t,p:ccVig(t,data)})).filter(x=>x.p);
  const mix=cp.length>0&&cp.every(x=>x.t.unid!=null);let m2=null;
  if(cp.length)m2=mix?cp.reduce((s,x)=>s+x.p.preco*x.t.unid,0)/cp.reduce((s,x)=>s+x.t.area*x.t.unid,0):cp.reduce((s,x)=>s+x.p.m2,0)/cp.length;
  const ds=cp.map(x=>x.p.em).sort();
  return {n:ts.length,ncp:cp.length,m2:m2==null?null:Math.round(m2*100)/100,mix,de:ds[0]||null,ate:ds[ds.length-1]||null,
    faixas:[...new Set(ts.map(t=>t.faixa).filter(f=>f&&f!=='nao_informado'))].sort()}}

/* ---------- quadro ao tocar no ícone ---------- */
function ccBoxHtml(c){const r=ccResumo(c),ro=UI.role==='Leitura',ts=(c.tip||[]).filter(t=>t.ativo!==false);
  const per=r.de?(r.de===r.ate?`apurado em ${ccData(r.de)}`:`apurados de ${ccMes(r.de)} a ${ccMes(r.ate)}`):'';
  const meta=[c.unid!=null?num(c.unid)+' unidades':'Unidades não informadas',c.lanc?'lançado em '+ccMes(c.lanc):'',r.faixas.map(f=>CC_FAIXA[f]).join(', ')].filter(Boolean).join(' · ');
  const linhas=ts.map(t=>{const p=ccVig(t),ab=CC.hist===t.id,hs=[...(t.precos||[])].sort((a,b)=>b.em.localeCompare(a.em));
    return `<tr class="cc-tr${hs.length>1?' cc-tem':''}" ${hs.length>1?`data-a="cc-hist" data-id="${t.id}" tabindex="0" aria-expanded="${ab}" title="Histórico de preços"`:''}><td><span class="cc-tn">${ccDorm(t.dorm)} · ${num(t.area,2)} m²${hs.length>1?ic('chev',14):''}</span>${t.faixa!=='nao_informado'?`<div class="faint">${CC_FAIXA[t.faixa]}</div>`:''}</td><td class="num">${p?brl(p.preco):'—'}</td><td class="num">${p?brl(p.m2):'—'}</td><td class="num">${p?ccCurta(p.em):'—'}</td></tr>`
      +(ab?`<tr class="cc-h-r"><td colspan="4"><ul class="cc-hl">${hs.map(h=>`<li><span>${ccData(h.em)}</span><span class="num">${brl(h.preco)}</span><span class="num">${ccM2(h.preco/t.area)}</span><span class="faint">${esc(CC_FONTE[h.fonte]||'')}</span></li>`).join('')}</ul></td></tr>`:'')}).join('');
  return `<div class="cc-box" role="dialog" aria-label="${esc(c.nome)}">
  <div class="cc-hd"><div class="cc-ti"><div class="cc-n">${esc(c.nome)}</div><div class="muted">${esc([ccEmpN(c),CC_SIT[c.sit]!=='Não informada'?CC_SIT[c.sit]:''].filter(Boolean).join(' · '))}</div></div><button type="button" class="iconbtn" data-a="cc-x" aria-label="Fechar" title="Fechar (Esc)">${ic('close',20)}</button></div>
  <div class="cc-k"><div class="cc-big">${r.m2!=null?ccM2(r.m2):'Sem preço apurado'}</div>${r.m2!=null?`<div class="faint">${r.ncp>1?(r.mix?'média ponderada pelas unidades':'média das tipologias (sem as unidades de cada uma)'):'de uma tipologia'} · ${per}</div>`:''}</div>
  <div class="cc-meta muted">${esc(meta)}</div>${c.end?`<div class="cc-meta faint">${esc(c.end)}</div>`:''}
  ${ts.length?`<div class="cc-tw"><table class="cc-t"><thead><tr><th>Tipologia</th><th class="num">Preço médio</th><th class="num">Por m²</th><th class="num">Apuração</th></tr></thead><tbody>${linhas}</tbody></table></div>`:'<div class="faint cc-meta">Nenhuma tipologia cadastrada.</div>'}
  ${c.obs?`<div class="cc-meta">${esc(c.obs)}</div>`:''}
  ${ro?'':`<div class="cc-ac">${CC.desativar?`<span class="muted">Tirar do mapa? O histórico fica.</span><button class="btn text sm" data-a="cc-desat-n">Não</button><button class="btn sm" data-a="cc-desat-s">Desativar</button>`
    :`<button class="btn primary sm" data-a="cc-precos" ${ts.length?'':'disabled'}>Atualizar preços</button><button class="btn sm" data-a="cc-editar">Editar</button><button class="btn text sm" data-a="cc-desat">Desativar</button>`}</div>`}</div>`}
function ccBox(){const area=$('.mapa-area');let el=$('#cc-box');const c=CC.box&&UI.route==='mapa'?ccC(CC.box):null;
  if(!c||c.ativo===false||!area){el?.remove();if(!c)CC.box=null;return}
  if(!el||el.parentNode!==area){el?.remove();el=document.createElement('div');el.id='cc-box';area.appendChild(el)}
  el.innerHTML=ccBoxHtml(c)}
function ccAbrir(id){CC.box=id;CC.hist=null;CC.desativar=false;CC.abertoEm=Date.now();if(UI.mpSel)mpSelecionar(null);if(UI.fichaSheet){UI.fichaSheet=null;fichaSheet()}ccBox()}
function ccFechar(){if(!CC.box)return false;CC.box=null;CC.hist=null;CC.desativar=false;ccBox();return true}
const ccFecharDoMapa=()=>{if(Date.now()-CC.abertoEm>350)ccFechar()};

/* ---------- gaveta: nova concorrência, editar e atualizar preços ---------- */
function ccNovo(ll){CC.dr={modo:'novo',lat:ll.lat,lng:ll.lng,c:{nome:'',emp:'',end:'',unid:null,sit:'nao_informado',lanc:'',obs:'',tip:[ccTipVazia()]}};ccAbreDr();
  localDoPonto(ll.lat,ll.lng).then(r=>{const d=CC.dr;if(!d||d.modo!=='novo'||d.c.end)return;d.c.end=[[r.logradouro,r.numero].filter(Boolean).join(', '),r.bairro,r.cidade].filter(Boolean).join(' · ');

const ccTipVazia=()=>({id:uid(),dorm:2,area:null,unid:null,faixa:'nao_informado',ativo:true,precos:[],novo:true});
function ccEditar(id,modo){const c=ccC(id);if(!c)return;CC.dr={modo,id,c:JSON.parse(JSON.stringify(c))};ccFechar();ccAbreDr()}
function ccAbreDr(){if(typeof FX_ABERTO!=='undefined'&&FX_ABERTO){FX_ABERTO=false;fxDrawer()}if(UI.fichaSheet){UI.fichaSheet=null;fichaSheet()}ccDrawer();setTimeout(()=>$('#cc-dr input:not([type=hidden]):not([disabled])')?.focus(),30)}
function ccFecharDr(){CC.dr=null;ccDrawer();$('#cc-emp-dlg')?.remove()}
function ccTipHtml(t,i,modo){const so=modo==='precos',p=ccVig(t),pre=n=>`cc-${n}-${t.id}`;
  const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${esc(l)}</option>`).join('');
  return `<div class="cc-tp" data-tid="${t.id}"><div class="cc-tp-h"><span>${so?`${ccDorm(t.dorm)} · ${num(t.area,2)} m²${t.faixa!=='nao_informado'?' · '+CC_FAIXA[t.faixa]:''}`:`Tipologia ${i+1}`}</span>${so?'':`<button type="button" class="iconbtn" data-a="cc-tp-x" data-id="${t.id}" aria-label="Tirar a tipologia ${i+1}" title="Tirar">${ic('close',18)}</button>`}</div>
  <div class="fields">${so?'':`<div class="field"><label for="${pre('d')}">Dormitórios</label><select id="${pre('d')}" data-k="dorm">${[['','Não informado'],['0','Studio'],['1','1'],['2','2'],['3','3'],['4','4 ou mais']].map(([v,l])=>`<option value="${v}" ${String(t.dorm??'')===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label for="${pre('a')}">Área privativa (m²) *</label><input id="${pre('a')}" data-k="area" inputmode="decimal" required value="${t.area!=null?num(t.area,2):''}" placeholder="42,5"></div>
    <div class="field"><label for="${pre('u')}">Unidades</label><input id="${pre('u')}" data-k="unid" inputmode="numeric" value="${t.unid??''}" placeholder="Não informado"></div>
    <div class="field"><label for="${pre('f')}">Faixa social</label><select id="${pre('f')}" data-k="faixa">${opt(CC_FAIXA,t.faixa)}</select></div>`}
    <div class="field full"><label for="${pre('p')}">Preço médio (R$)</label><input id="${pre('p')}" data-k="preco" inputmode="decimal" value="${esc(t._preco||'')}" placeholder="${p?'Último: '+brl(p.preco)+' em '+ccData(p.em):'Ex.: 260 mil'}">${p?'<div class="hint">Em branco, fica o último preço.</div>':''}</div></div></div>`}
function ccDrawer(){let el=$('#cc-dr'),sc=$('#cc-scrim');const d=CC.dr;
  if(!d){el?.remove();sc?.remove();return}

    el=document.createElement('aside');el.id='cc-dr';el.className='fx-dr cc-dr';el.setAttribute('role','dialog');document.body.appendChild(el)}
  const c=d.c,so=d.modo==='precos',tit={novo:'Nova concorrência',editar:'Editar concorrência',precos:'Atualizar preços'}[d.modo];el.setAttribute('aria-label',tit);
  const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${esc(l)}</option>`).join('');
  const emps=(S.concEmpresas||[]).filter(e=>e.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

  el.innerHTML=`<div class="fx-h"><h2>${tit}</h2><button class="iconbtn" data-a="cc-dr-x" aria-label="Fechar" title="Fechar (Esc)">${ic('close',22)}</button></div>
  <form class="fx-b cc-f" id="cc-f" novalidate>
  ${so?`<div class="cc-sec"><div class="cc-n">${esc(c.nome)}</div><div class="muted">${esc(ccEmpN(c))}</div></div>`:`<div class="cc-sec"><div class="fields">
    <div class="field full"><label for="cc-emp">Empresa *</label><div class="cc-emp"><select id="cc-emp" name="emp" required><option value="">Escolher</option>${emps.map(e=>`<option value="${e.id}" ${c.emp===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select><button type="button" class="btn text sm" data-a="cc-emp-novo">${ic('add',16)}Incluir empresa</button></div></div>
    <div class="field full"><label for="cc-nome">Empreendimento *</label><input id="cc-nome" name="nome" required value="${esc(c.nome)}" placeholder="Nome do empreendimento"></div>
    <div class="field full"><label for="cc-end">Endereço</label><input id="cc-end" name="end" value="${esc(c.end||'')}" placeholder="${d.modo==='novo'?'Buscando pelo ponto…':''}"></div>
    <div class="field"><label for="cc-unid">Unidades no total</label><input id="cc-unid" name="unid" inputmode="numeric" value="${c.unid??''}" placeholder="Não informado"></div>

    <div class="field"><label for="cc-lanc">Data de lançamento</label><input id="cc-lanc" name="lanc" type="date" max="${HOJE}" value="${c.lanc||''}"></div>
    <div class="field full"><label for="cc-obs">Observação</label><input id="cc-obs" name="obs" value="${esc(c.obs||'')}"></div></div></div>`}
  <div class="cc-sec"><div class="cc-sh">Apuração dos preços</div><div class="fields">
    <div class="field"><label for="cc-em">Data de apuração</label><input id="cc-em" name="em" type="date" max="${HOJE}" value="${HOJE}" required></div>
    <div class="field"><label for="cc-fonte">Fonte</label><select id="cc-fonte" name="fonte">${opt(CC_FONTE,'stand')}</select></div></div>
    <div class="hint">Vale para os preços preenchidos abaixo. Cada data vira um registro novo; na mesma data, corrige o preço daquele dia.</div></div>
  <div class="cc-sec"><div class="cc-sh">Tipologias</div>${ts.map((t,i)=>ccTipHtml(t,i,d.modo)).join('')||'<div class="faint">Nenhuma tipologia.</div>'}
    ${so?'':`<button type="button" class="btn text sm" data-a="cc-tp-add">${ic('add',16)}Adicionar tipologia</button>`}</div>
  </form><div class="fx-f"><span class="fx-tot"></span><button class="btn text sm" data-a="cc-dr-x">Cancelar</button><button class="btn primary sm" type="submit" form="cc-f">Salvar</button></div>`}
/* o que está digitado volta para o rascunho (para redesenhar a gaveta sem perder nada) */
function ccLer(){const d=CC.dr,f=$('#cc-f');if(!d||!f)return;const c=d.c,v=n=>f.querySelector(`[name="${n}"]`)?.value;
  if(d.modo!=='precos'){c.emp=v('emp')||'';c.nome=v('nome')||'';c.end=v('end')||'';c.unid=ccInt(v('unid'));c.sit=v('sit');c.lanc=v('lanc')||''; c.obs=v('obs')||''}
  d.em=v('em');d.fonte=v('fonte');
  f.querySelectorAll('.cc-tp').forEach(b=>{const t=c.tip.find(x=>x.id===b.dataset.tid);if(!t)return;const g=k=>b.querySelector(`[data-k="${k}"]`)?.value;
    if(d.modo!=='precos'){const dm=g('dorm');t.dorm=dm===''?null:+dm;t.area=ccDec(g('area'));t.unid=ccInt(g('unid'));t.faixa=g('faixa')}
    t._preco=g('preco')})}
const ccDec=s=>{s=String(s??'').trim();if(!s)return null;const n=Number(s.replace(/\./g,'').replace(',','.'));return isFinite(n)&&n>0?n:null};
const ccInt=s=>{const n=parseInt(String(s??'').replace(/\D/g,''),10);return isFinite(n)&&n>0?n:null};
function ccGravar(){ccLer();const d=CC.dr,c=d.c,ts=c.tip.filter(t=>t.ativo!==false);
  if(d.modo!=='precos'){if(!c.emp)return toast('Escolha a empresa.',true);if(!c.nome.trim())return toast('Preencha o nome do empreendimento.',true);
    if(ts.some(t=>t.area==null))return toast('Preencha a área privativa de cada tipologia.',true)}
  if(!d.em||d.em>HOJE)return toast('A data de apuração não pode ser no futuro.',true);
  const precos=ts.filter(t=>String(t._preco||'').trim());for(const t of precos){t._v=fxLerNum(t._preco);if(!(t._v>0))return toast('Preço médio inválido: use números, como 260 mil ou 260.000.',true)}
  if(d.modo==='precos'&&!precos.length)return toast('Preencha o preço de ao menos uma tipologia.',true);
  precos.forEach(t=>{t.precos=(t.precos||[]).filter(p=>p.em!==d.em);t.precos.push({em:d.em,preco:t._v,fonte:d.fonte})});
  c.tip.forEach(t=>{delete t._preco;delete t._v;delete t.novo});c.tip=c.tip.filter(t=>t.ativo!==false||t.precos.length);  // tipologia nova tirada some; com preço, fica desativada
  c.nome=c.nome.trim();
  if(d.modo==='novo'){const n={id:uid(),...c,lat:d.lat,lng:d.lng,lanc:c.lanc||null,ativo:true};S.concorrentes=S.concorrentes||[];S.concorrentes.push(n);d.id=n.id}
  else{const o=ccC(d.id);Object.assign(o,c,{lanc:c.lanc||null})}
  save();const id=d.id,modo=d.modo;ccFecharDr();desenhaConc();const lg=$('#mp-leg');if(lg)lg.innerHTML=mpLegenda();
  toast(modo==='novo'?'Concorrência salva.':modo==='precos'?`Preços de ${ccData(precos[0]?.precos.at(-1).em)} salvos.`:'Concorrência atualizada.');ccAbrir(id)}
function ccEmpPopup(){const dlg=document.createElement('div');dlg.id='cc-emp-dlg';dlg.className='scrim ms-scrim';
  dlg.innerHTML=`<div class="dialog mini" role="dialog" aria-modal="true" aria-labelledby="cce-h"><div class="dh"><h2 id="cce-h">Incluir empresa</h2><button type="button" class="iconbtn" data-a="cc-emp-x" aria-label="Fechar">${ic('close')}</button></div>

    <div class="df"><button type="button" class="btn text" data-a="cc-emp-x">Cancelar</button><button class="btn primary" type="submit" form="cc-emp-f">Incluir</button></div></div>`;
  document.body.appendChild(dlg);dlg.querySelector('input').focus()}
function ccEmpGravar(f){const n=f.n.value.trim();if(!n)return toast('Preencha o nome da empresa.',true);
  if((S.concEmpresas||[]).some(e=>e.ativo!==false&&e.nome.toLowerCase()===n.toLowerCase()))return toast('Essa empresa já está na lista.',true);
  const e={id:uid(),nome:n};S.concEmpresas.push(e);save();ccLer();if(CC.dr)CC.dr.c.emp=e.id;$('#cc-emp-dlg')?.remove();ccDrawer();toast('Empresa incluída.')}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const a=e.target.closest('[data-a^="cc-"]');if(!a)return;e.preventDefault();e.stopImmediatePropagation();const id=a.dataset.id;
  switch(a.dataset.a){
    case 'cc-x':ccFechar();break;
    case 'cc-hist':CC.hist=CC.hist===id?null:id;ccBox();break;
    case 'cc-editar':ccEditar(CC.box,'editar');break;
    case 'cc-precos':ccEditar(CC.box,'precos');break;
    case 'cc-desat':CC.desativar=true;ccBox();break;
    case 'cc-desat-n':CC.desativar=false;ccBox();break;
    case 'cc-desat-s':{const c=ccC(CC.box);c.ativo=false;save();ccFechar();desenhaConc();const lg=$('#mp-leg');if(lg)lg.innerHTML=mpLegenda();toast(`${c.nome} saiu do mapa.`);break}

   de listas) e só no log mais recente de cada campo: se o campo mudou depois, desfazer aquele log não teria efeito.

function setPreparar(j){const n=j.n,Q=1e5,G=0.002,bb=new Float64Array(n*4),rings=new Array(n),idx=new Map();
