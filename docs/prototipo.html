/* ---------- pontos de interesse do terreno: Places (busca por raio) + Routes (distância a pé) ---------- */
const normNome=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
/* matriz de rotas do terreno até vários destinos: Routes computeRouteMatrix; reserva Distance Matrix. Devolve [{m,min}|null] */
async function gMatriz(lat,lng,dest,modo){const out=dest.map(()=>null);const ll=(a,b)=>({waypoint:{location:{latLng:{latitude:a,longitude:b}}}});
  try{const r=await fetch('https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GKEY,'X-Goog-FieldMask':'originIndex,destinationIndex,distanceMeters,duration,condition'},
      body:JSON.stringify({origins:[ll(lat,lng)],destinations:dest.map(p=>ll(p.lat,p.lng)),travelMode:modo,languageCode:'pt-BR',regionCode:'BR'})});
    if(!r.ok)throw new Error('Routes '+r.status);const els=await r.json();if(!Array.isArray(els))throw new Error('resposta inesperada');
    els.forEach(e=>{const k=e.destinationIndex||0;if(k<out.length&&e.condition==='ROUTE_EXISTS'&&e.distanceMeters!=null)out[k]={m:e.distanceMeters,min:Math.max(1,Math.round(parseInt(e.duration||'0')/60))}});
    if(!out.some(Boolean))throw new Error('sem rotas')}
  catch(e1){const svc=new google.maps.DistanceMatrixService();
    for(let i=0;i<dest.length;i+=25){const ch=dest.slice(i,i+25);
      const res=await svc.getDistanceMatrix({origins:[gLL(lat,lng)],destinations:ch.map(p=>gLL(p.lat,p.lng)),travelMode:modo==='WALK'?'WALKING':'DRIVING'});
      (res?.rows?.[0]?.elements||[]).forEach((e,j)=>{if(e&&e.status==='OK')out[i+j]={m:e.distance.value,min:Math.max(1,Math.round(e.duration.value/60))}})}
    if(!out.some(Boolean))throw new Error('sem rotas')}
  return out}
async function gEntornoTerreno(t){if(!GG||!gLib.places||t.lat==null||ENT_BUSCA[t.id])return;
  ENT_BUSCA[t.id]=true;const lat=t.lat,lng=t.lng;entRefresh(t);
  try{const {Place,SearchNearbyRankPreference}=gLib.places;
    const res=await Promise.all(ENT_CAT.map(([k,,,tipos])=>Place.searchNearby({fields:['id','displayName','location'],locationRestriction:{center:gLL(lat,lng),radius:RAIO_PE},
      includedTypes:tipos,maxResultCount:20,rankPreference:SearchNearbyRankPreference.DISTANCE,language:'pt-BR',region:'br'})
      .then(r=>(r.places||[]).map(p=>({gid:p.id,nome:p.displayName,cat:k,lat:p.location.lat(),lng:p.location.lng()})))));
    /* um lugar entra uma vez (na primeira categoria); mesmo nome na mesma categoria = mesma estação/hospital, fica o mais perto */
    const ids=new Set(),nomes=new Set();let itens=[];
    res.flat().forEach(p=>{const n=p.cat+'|'+normNome(p.nome);if(ids.has(p.gid)||nomes.has(n))return;ids.add(p.gid);nomes.add(n);p.reta=Math.round(distKm(lat,lng,p.lat,p.lng)*1000);itens.push(p)});
    let semPe=false;
    if(itens.length){try{(await gMatriz(lat,lng,itens,'WALK')).forEach((x,i)=>{if(x){itens[i].pe=x.m;itens[i].min=x.min}})}catch(e1){semPe=true;itens.forEach(p=>{p.pe=p.reta;p.min=null})}}
    itens=itens.filter(p=>p.pe!=null&&p.pe<=RAIO_PE);
    t.entorno={lat,lng,em:HOJE,fonte:'google',semPe,itens};
    log(t,`Pontos de interesse buscados no Google: ${itens.length} a até ${fKm(RAIO_PE/1000)} a pé`);save();
    if(semPe)toast('A rota a pé não respondeu; os pontos foram filtrados pela distância em linha reta. Confira se a Routes API está liberada para a chave.',true)}
  catch(e){toast(`Não foi possível buscar os pontos de interesse (${e.message||e}). Confira se a Places API (New) está liberada para a chave.`,true)}
  finally{delete ENT_BUSCA[t.id];entRefresh(t)}}
/* distâncias pela rota até os pontos cadastrados pela empresa: a pé (perto) e de carro (todos) */
const idsPontos=()=>(S.pontos||[]).map(p=>p.id).sort().join(',');
const DIST_BUSCA={};
async function gDistEmpresa(t){if(!GG||t.lat==null||DIST_BUSCA[t.id])return;const pts=(S.pontos||[]).slice(),lat=t.lat,lng=t.lng;
  DIST_BUSCA[t.id]=true;const m={};let semRota=false;
  try{if(pts.length){const perto=pts.filter(p=>distKm(lat,lng,p.lat,p.lng)*1000<=RAIO_PE);
      const [pe,car]=await Promise.all([perto.length?gMatriz(lat,lng,perto,'WALK').catch(()=>null):Promise.resolve([]),gMatriz(lat,lng,pts,'DRIVE').catch(()=>null)]);

/* ---------- relevo (Elevation API) ---------- */
async function gRelevo(t){let pts=[];
  if(t.poly&&t.poly.length>=3){const pg=new google.maps.Polygon({paths:t.poly.map(p=>gLL(p[0],p[1]))});const la=t.poly.map(p=>p[0]),lo=t.poly.map(p=>p[1]);
    const [a,b,c,d]=[Math.min(...la),Math.max(...la),Math.min(...lo),Math.max(...lo)],n=12;
    for(let i=0;i<=n;i++)for(let j=0;j<=n;j++){const q=new google.maps.LatLng(a+(b-a)*i/n,c+(d-c)*j/n);if(google.maps.geometry.poly.containsLocation(q,pg))pts.push({i,j,q})}}
  if(pts.length<4){const r=0.00025;pts=[];for(let i=0;i<=6;i++)for(let j=0;j<=6;j++)pts.push({i,j,q:new google.maps.LatLng(t.lat-r+2*r*i/6,t.lng-r+2*r*j/6)})}
  try{const {results}=await new google.maps.ElevationService().getElevationForLocations({locations:pts.map(p=>p.q)});
    const el=results.map((r,k)=>({...pts[k],z:r.elevation,res:r.resolution}));const zs=el.map(e=>e.z),min=Math.min(...zs),max=Math.max(...zs);
    t.relevo={em:HOJE,min,max,desnivel:max-min,res:Math.max(...el.map(e=>e.res||0)),grade:el.map(e=>[e.i,e.j,+e.z.toFixed(1)]),n:el.length,poligonal:!!t.poly};
    log(t,`Relevo estimado pelo Google: desnível ${num(max-min,1)} m`);save();render();toast(`Desnível estimado: ${num(max-min,1)} m.`)}
  catch(e){toast(`Elevação indisponível (${e.message||e}). Confira se a Elevation API está liberada para a chave.`,true)}}
function relevoHtml(t){const r=t.relevo;if(!GG&&!r)return '';
  if(!r)return t.lat!=null?`<div class="relevo-vazio"><span class="muted">Relevo ainda não estimado.</span><button class="btn sm ed" data-a="g-relevo" data-id="${t.id}">Estimar relevo pelo Google</button></div>`:'';
  const ni=Math.max(...r.grade.map(g=>g[0]))+1,nj=Math.max(...r.grade.map(g=>g[1]))+1,cel=Math.max(8,Math.floor(220/Math.max(ni,nj)));
  // rampa sequencial de um matiz: mais claro = mais baixo
  const cor=z=>{const f=r.max>r.min?(z-r.min)/(r.max-r.min):0;return `hsl(212 70% ${88-f*58}%)`};
  return `<div class="relevo"><svg viewBox="0 0 ${nj*cel} ${ni*cel}" width="${nj*cel}" height="${ni*cel}" role="img" aria-label="Grade de elevação do terreno">${r.grade.map(([i,j,z])=>`<rect x="${j*cel}" y="${(ni-1-i)*cel}" width="${cel-1}" height="${cel-1}" fill="${cor(z)}" data-tip="${num(z,1)} m"/>`).join('')}</svg>
    <div class="relevo-n"><div><span class="k">Desnível estimado</span><b>${num(r.desnivel,1)} m</b></div><div><span class="k">Cota mínima / máxima</span>${num(r.min,1)} m / ${num(r.max,1)} m</div>
    <div class="hint">Google Elevation, ${r.n} pontos ${r.poligonal?'dentro da poligonal':'ao redor do ponto'}; resolução de até ${num(r.res,0)} m. Serve para triagem; não substitui o levantamento planialtimétrico.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${t.desnivel!==+r.desnivel.toFixed(1)?`<button class="btn sm ed" data-a="g-relevo-usar" data-id="${t.id}">Usar como desnível estimado</button>`:''}${GG?`<button class="btn sm text ed" data-a="g-relevo" data-id="${t.id}">Recalcular</button>`:''}</div></div></div>`}

const hhmm=s=>s&&s.length>10?s.slice(11,16):'';

const LAB_CAMPO={situacao:'Situação',aDoc:'Área documental',aCad:'Área cadastral',aLev:'Área de levantamento',aEst:'Área estimada',fonteArea:'Fonte da área adotada',testada:'Testada'};

const SEC_DE={};Object.entries(SECOES).forEach(([id,s])=>s.campos.forEach(([k])=>{SEC_DE[k]=id}));
const TIPO_CAMPO={};Object.values(SECOES).forEach(s=>s.campos.forEach(([k,,tipo,opt])=>{TIPO_CAMPO[k]=[tipo,opt]}));
['aDoc','aCad','aLev','aEst','aConst','aDemolir'].forEach(k=>TIPO_CAMPO[k]=['m2']);TIPO_CAMPO.testada=['m'];
function valTxt(k,v){
  if(v==null||v==='')return 'não informado';
  const [tipo,opt]=TIPO_CAMPO[k]||[];
  if(tipo==='sel'&&OPT[opt])return NI_OPT.has(v)?'não informado':(OPT[opt][v]||v);
  if(tipo==='m2')return m2(v);if(tipo==='m')return num(v,2)+' m';if(tipo==='date')return fd(v);if(tipo==='dec')return num(v,6);if(tipo==='eixo')return eixo(v)||'—';
  if(typeof v==='boolean')return v?'sim':'não';
  const s=String(v);return s.length>60?s.slice(0,57)+'…':s;

const ARR_LAB={mats:['Matrícula',x=>x.num],insc:['Inscrição imobiliária',x=>x.sql],confr:['Confrontação',x=>x.tipo],dilig:['Diligência',x=>x.titulo],pessoas:['Pessoa',x=>x.nome],
  corretores:['Corretor',x=>(typeof corretor==='function'&&corretor(x.cid)?.nome)||''],ofertas:['Oferta',x=>x.valor!=null?mi(x.valor):''],propostas:['Proposta',x=>'v'+x.v+(x.valor!=null?' · '+mi(x.valor):'')],
  reunioes:['Reunião',x=>fd(x.data)+(x.hora?' '+x.hora:'')],tarefas:['Tarefa',x=>x.titulo],docs:['Documento',x=>(TIPOS_DOC[x.tipo]||[x.nome||x.tipo])[0]],analises:['Análise urbanística',x=>x.fonte||fd(x.data)]};
const ITEM_LAB={titulo:'título',prazo:'prazo',resp:'responsável',status:'status',prio:'prioridade',desc:'descrição',valor:'valor',data:'data',hora:'hora',sit:'situação',area:'área',
  cond:'condições',forma:'forma de pagamento',validade:'validade',emitido:'emissão',versoes:'versão',resultado:'resultado',pauta:'pauta',resumo:'resumo',nome:'nome',papel:'papel',principal:'principal'};
const NEG_LAB={etapa:'Etapa',status:'Situação da negociação',temp:'Temperatura',retomar:'Revisitar em',motivo:'Motivo',ofRef:'Oferta de referência',final:'Fase final',fase_final:'Fase final'};
let AUD={};
const retrato=t=>{const {hist,relevo,...r}=t;return JSON.stringify(r)};
function audSnap(){AUD={};S.terrenos.forEach(t=>{AUD[t.id]={j:retrato(t),h:(t.hist||[]).length}})}
function diffTerreno(a,b){
  const campos=[],itens=[];
  Object.keys({...a,...b}).forEach(k=>{
    if(['hist','relevo','id','codigo'].includes(k))return;
    const va=a[k],vb=b[k];if(JSON.stringify(va)===JSON.stringify(vb))return;
    if(k==='poly'){campos.push({k,txt:vb?'Poligonal alterada':'Poligonal removida'});return}
    if(k==='neg'){const na=va||{},nb=vb||{};if(!va&&vb){itens.push('Negociação aberta');return}
      Object.keys({...na,...nb}).forEach(x=>{if(JSON.stringify(na[x])===JSON.stringify(nb[x])||typeof (nb[x]??na[x])==='object'&&x!=='viab')return;
        if(x==='viab'){campos.push({k:'neg.viab',txt:nb.viab?`Estudo de viabilidade vinculado: ${nb.viab.nome||''}`:'Estudo de viabilidade desvinculado'});return}
        const f=v=>v==null||v===''?'não informado':x==='etapa'?SN(v):x==='retomar'?fd(v):x==='temp'?v+'/5':String(v);
        campos.push({k:'neg.'+x,txt:`${NEG_LAB[x]||x}: ${f(na[x])} → ${f(nb[x])}`})});return}
    if(k==='infra'){Object.keys({...va,...vb}).forEach(x=>{const da=va?.[x]?.d,db=vb?.[x]?.d;if(da!==db)campos.push({k:'infra.'+x,txt:`Infraestrutura · ${x}: ${da||'não verificado'} → ${db||'não verificado'}`})});return}
    if(Array.isArray(va)||Array.isArray(vb)){const [lab,desc]=ARR_LAB[k]||[k,()=>''];const A=va||[],B=vb||[];
      const chave=(x,i)=>x&&x.id!=null?'id:'+x.id:x&&x.v!=null?'v:'+x.v:'i:'+i;
      const mA=new Map(A.map((x,i)=>[chave(x,i),x])),mB=new Map(B.map((x,i)=>[chave(x,i),x]));
      mB.forEach((x,c)=>{const d=desc(x)||'';if(!mA.has(c))itens.push(`${lab} adicionada${d?': '+d:''}`);else if(JSON.stringify(mA.get(c))!==JSON.stringify(x)){const o=mA.get(c);const ks=Object.keys({...o,...x}).filter(q=>JSON.stringify(o[q])!==JSON.stringify(x[q])).map(q=>ITEM_LAB[q]||q);itens.push(`${lab} alterada${d?' ('+d+')':''}: ${ks.join(', ')}`)}});
      mA.forEach((x,c)=>{if(!mB.has(c)){const d=desc(x)||'';itens.push(`${lab} removida${d?': '+d:''}`)}});return}
    if(typeof (vb??va)==='object')return;
    if(valTxt(k,va)!==valTxt(k,vb))campos.push({k,txt:`${LAB_CAMPO[k]||k}: ${valTxt(k,va)} → ${valTxt(k,vb)}`});
  });
  return {campos,itens};
}
function audit(){
  S.terrenos.forEach(t=>{
    const s=AUD[t.id];t.hist=t.hist||[];
    if(!s)return;
    const {campos,itens}=diffTerreno(JSON.parse(s.j),JSON.parse(retrato(t)));
    const novos=t.hist.slice(s.h);
    /* edição salva sem mudar nenhum valor: não deixa registro vazio */
    if(!campos.length&&!itens.length){const vaz=novos.filter(e=>/atualizad[oa]s?$/.test(e.txt)&&!(e.det&&e.det.length));if(vaz.length)t.hist=t.hist.filter(e=>!vaz.includes(e));return}
    if(novos.length){const e=novos[novos.length-1];const det=campos.map(c=>c.txt);if(det.length)e.det=(e.det||[]).concat(det)}
    else{const secs=new Set(campos.map(c=>SEC_DE[c.k]).filter(Boolean));
      const txt=itens.length&&!campos.length?itens[0]:secs.size===1&&!itens.length?`${SECOES[[...secs][0]].titulo} editado`:'Ficha editada';
      const det=campos.map(c=>c.txt).concat(itens.length&&!(itens.length===1&&!campos.length)?itens:[]);
      t.hist.push({em:agora(),user:me(),txt,det:det.length?det:undefined})}
  });
  audSnap();
}

function alvoLog(h){
  const x=h.txt||'',det=h.det||[];
  const campos=det.map(d=>{const m=/^([^:]+):.*→/.exec(d);return m&&LAB_INV[m[1].trim().toLowerCase()]}).filter(Boolean);
  const secDe=k=>SEC_AREA.has(k)?'areas':SEC_DE[k];
  if(campos.length)return {b:'cadastro',s:secDe(campos[0]),campos};
  const sec=Object.entries(SECOES).find(([,v])=>x===`${v.titulo} editado`);if(sec)return {b:'cadastro',s:sec[0]};
  const R=[[/^Terreno cadastrado/,{b:'cadastro',s:'ident'}],[/^Matr[íi]cula/,{b:'cadastro',s:'mats'}],[/^Inscri[çc][ãa]o/,{b:'cadastro',s:'insc'}],
    [/^Confronta/,{b:'cadastro',s:'confr'}],[/^Pessoa|^Propriet/,{b:'cadastro',s:'pessoas'}],[/^Poligonal|^[ÁA]rea/,{b:'cadastro',s:'areas'}],
    [/^(Oferta|Corretor)/,{b:'comercial'}],[/^Estudo de viabilidade/,{b:'geral'}],[/^(Proposta|Reuni[ãa]o|Oferta de refer)/,{b:'negociacao'}],
    [/^(Documento|Dilig)/,{b:'documentos'}],[/^Tarefa/,{b:'tarefas'}],[/^(An[áa]lise urban|Infraestrutura|Zoneamento)/,{b:'urbanismo'}],
    [/^Temperatura/,{topo:'.temp'}],[/^(Etapa|Avan[çc]ou|Retomad|Stand by|Em stand by|Situa[çc][ãa]o da negocia|Negocia[çc][ãa]o|Revisitar|Fase final|Motivo)/,{topo:'.tl-topo'}]];
  const r=R.find(([re])=>re.test(x));return r?r[1]:{b:'geral'};
}
let pnPiscaT=null;
function mostrarLog(h){
  const a=alvoLog(h);
  if(a.b){blocoAbre(a.b);if(a.s&&!['ident','loc','fis'].includes(a.s)||!a.s)UI.edit=null;render()}
  setTimeout(()=>{
    const bloco=a.b&&document.getElementById('bl-'+a.b);
    const alvo=a.topo?document.querySelector(a.topo):(a.s&&document.getElementById('sec-'+a.s))||bloco;if(!alvo)return;
    let marcas=[];
    /* 1. campos citados no log (rótulos da ficha) */
    if(a.campos&&a.campos.length){const nomes=a.campos.map(k=>[LAB_CAMPO[k].toLowerCase(),LAB_CAMPO[k].replace(/^Área /,'').toLowerCase()]).flat();
      (bloco||alvo).querySelectorAll('.k,.al,.lbl,dt,label').forEach(el=>{const tx=el.textContent.trim().toLowerCase();if(nomes.some(n=>tx===n||tx.startsWith(n+' ')))marcas.push(el.closest('.area')||el.parentElement)})}
    /* 2. item citado no log: documento, tarefa, proposta, matrícula, reunião, corretor… */
    if(!marcas.length&&!a.topo){
      const x=h.txt||'',v=/\bv(\d+)\b/.exec(x),sub=x.split(': ').slice(1).join(': ').replace(/\s*\(.*$/,'').trim(),par=(/\(([^)]+)\)/.exec(x)||[])[1];
      const termos=[sub,par,...(h.det||[]).map(d=>(d.split('→')[1]||'').trim())].filter(q=>q&&q.length>2&&!/^(BKM|vendedor)$/i.test(q));
      termos.slice().forEach(q=>{const m=/R\$\s*([\d.,]+)\s*mi/.exec(q);if(m)termos.push(Math.round(parseFloat(m[1].replace(/\./g,'').replace(',','.'))*1e6).toLocaleString('pt-BR'),m[1]+' mi')});
      const linhas=[...(bloco||alvo).querySelectorAll('.doc,.task,.pnode,.tli,tr,.infra,.kcard,.pn-tar,.dilig,.reu,.mat,.ins,.area,.kvg>div,li')];
      const el=v?(linhas.find(e=>e.matches('.pnode')&&e.textContent.trim().startsWith('v'+v[1]))||linhas.find(e=>e.textContent.trim().startsWith('v'+v[1]))):termos.map(q=>linhas.find(e=>e.textContent.includes(q))).find(Boolean);
      if(el)marcas=[el]
      else{ /* a seção cujo título combina com o assunto do log */
        const T=[[/^Reuni/,'Reuni'],[/^Estudo de viabilidade/,'viabilidade'],[/^Oferta/,'Ofertas'],[/^Corretor/,'Corretor'],[/^An[áa]lise/,'Análise'],[/^Documento/,'Checklist'],[/^Dilig/,'Dilig'],[/^Proposta/,'Proposta'],[/^Tarefa/,'Tarefa']].find(([re])=>re.test(x));
        const sec=T&&[...(bloco||alvo).querySelectorAll('.sec')].find(e=>(e.querySelector('h2,.gt,.sec-h')?.textContent||'').includes(T[1]));if(sec)marcas=[sec]}}
    /* 3. sem item exato: a seção inteira */
    if(!marcas.length)marcas=[a.topo?alvo:(alvo.matches('.bl')?(alvo.querySelector('.bl-c .sec')||alvo):alvo)];
    marcas[0].scrollIntoView({behavior:'smooth',block:'center'});
    /* acende depois que a rolagem termina, para o destaque ser visto inteiro */
    document.querySelectorAll('.pisca').forEach(el=>el.classList.remove('pisca'));clearTimeout(pnPiscaT);
    let feito=false;const acende=()=>{if(feito)return;feito=true;marcas.forEach(el=>{void el.offsetWidth;el.classList.add('pisca')});pnPiscaT=setTimeout(()=>marcas.forEach(el=>el.classList.remove('pisca')),4200)};
    if('onscrollend' in window){window.addEventListener('scrollend',acende,{once:true});setTimeout(acende,900)}else setTimeout(acende,500);
  },40);
}
const _pgFicha=pgFicha;
pgFicha=function(){const t=T(UI.id);return `<div class="ficha-wrap ${PN.aberto?'pn-on':'pn-off'}"><div class="ficha-main">${_pgFicha()}</div>${painelFicha(t)}</div>`};

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a)return;const A=a.dataset.a;
  if(A==='end-manual'){const f=a.closest('form');f.querySelectorAll('input.auto-v').forEach(i=>{i.readOnly=false;i.classList.add('auto-ed');i.placeholder=''});a.remove();f.querySelector('[name="logradouro"]')?.focus();return}
  if(A==='pn-log'){const t=T(UI.id),h=t&&t.hist[+a.dataset.i];if(h)mostrarLog(h)}
  else if(A==='pn-abrir'){PN.aberto=true;pnSalva();render()}
  else if(A==='pn-fechar'){PN.aberto=false;pnSalva();render()}
  else if(A==='pn-u'){const v=a.dataset.v;PN.users=PN.users.includes(v)?PN.users.filter(x=>x!==v):[...PN.users,v];pnSalva();
    pnFoco=`.pn-menu [data-a="pn-u"][data-v="${CSS.escape(v)}"]`;render()}
  else if(A==='pn-todos'){PN.users=[];pnSalva();pnFoco='.pn-menu [data-a="pn-todos"]';render()}
  else if(A==='pn-menu'){pnMenuSet(pnMenu===a.dataset.v?null:a.dataset.v)}
  else if(A==='pn-per'){PN.per={k:a.dataset.v};pnSalva();pnMenu=null;pnCal=null;pnFoco='.pn-dd[data-dd="per"] .pn-dd-b';render()}
  else if(A==='pn-per-custom'){const P=PN.per||{};pnCal={mes:(P.k==='custom'&&P.ini?P.ini:HOJE).slice(0,7),ini:P.k==='custom'?P.ini||null:null,fim:P.k==='custom'?P.fim||null:null};pnPerRefresh();document.querySelector('.pn-cal [data-a="pn-cal-dia"]:not([disabled])')?.focus({preventScroll:true})}
  else if(A==='pn-cal-mes'){if(!pnCal)return;pnCal.mes=a.dataset.v;pnPerRefresh()}
  else if(A==='pn-cal-dia'){if(!pnCal)return;const d=a.dataset.d,c=pnCal;
    if(!c.ini||c.fim)Object.assign(c,{ini:d,fim:null});else if(d<c.ini)Object.assign(c,{ini:d,fim:c.ini});else c.fim=d;
    pnPerRefresh();document.querySelector(`.pn-cal [data-d="${d}"]`)?.focus({preventScroll:true})}
  else if(A==='pn-cal-cancel'){pnCal=null;pnPerRefresh();document.querySelector('[data-a="pn-per-custom"]')?.focus()}
  else if(A==='pn-cal-ok'){if(!pnCal||!pnCal.ini)return;PN.per={k:'custom',ini:pnCal.ini,fim:pnCal.fim||pnCal.ini};pnSalva();pnCal=null;pnMenu=null;pnFoco='.pn-dd[data-dd="per"] .pn-dd-b';render()}
  else if(A==='pn-aba'){PN.aba=a.dataset.v;PN.aberto=true;pnSalva();render()}
  else if(A==='pn-concluir'){const t=T(UI.id),k=t?.tarefas.find(x=>x.id===a.dataset.k);if(!k)return;const de=k.status;k.status='concluida';log(t,`Tarefa "${k.titulo}": ${OPT.statusTar[de]} → Concluída`);save();render();toast('Tarefa concluída.')}
});

render();
})();
</script>
