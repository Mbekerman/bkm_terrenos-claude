/* ---------- pontos de interesse do terreno: Places (busca por raio) + Routes (distância a pé) ---------- */
const normNome=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
/* matriz de rotas do terreno até vários destinos: Routes computeRouteMatrix; reserva Distance Matrix. Devolve [{m,min}|null] */
async function gMatriz(lat,lng,dest,modo){const out=dest.map(()=>null);const ll=(a,b)=>({waypoint:{location:{latLng:{latitude:a,longitude:b}}}});
  try{const r=await fetch('https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GKEY,'X-Goog-FieldMask':'originIndex,destinationIndex,distanceMeters,duration,condition'},
      body:JSON.stringify({origins:[ll(lat,lng)],destinations:dest.map(p=>ll(p.lat,p.lng)),travelMode:modo,languageCode:'pt-BR',regionCode:'BR'})});
    if(!r.ok)throw new Error('Routes '+r.status);const els=await r.json();if(!Array.isArray(els))throw new Error('resposta inesperada');
    els.forEach(e=>{const k=e.destinationIndex||0;if(k<out.length&&e.condition==='ROUTE_EXISTS'&&e.distanceMeters!=null)out[k]={m:e.distanceMeters,min:Math.max(1,Math.round(parseInt(e.duration||'0')/60))}});
    if(!out.some(Boolean))throw new Error('sem rotas')}
  catch(e1){const svc=new google.maps.DistanceMatrixService();
    for(let i=0;i<dest.length;i+=25){const ch=dest.slice(i,i+25);
      const res=await svc.getDistanceMatrix({origins:[gLL(lat,lng)],destinations:ch.map(p=>gLL(p.lat,p.lng)),travelMode:modo==='WALK'?'WALKING':'DRIVING'});
      (res?.rows?.[0]?.elements||[]).forEach((e,j)=>{if(e&&e.status==='OK')out[i+j]={m:e.distance.value,min:Math.max(1,Math.round(e.duration.value/60))}})}
    if(!out.some(Boolean))throw new Error('sem rotas')}
  return out}
async function gEntornoTerreno(t){if(!GG||!gLib.places||t.lat==null||ENT_BUSCA[t.id])return;
  ENT_BUSCA[t.id]=true;const lat=t.lat,lng=t.lng;entRefresh(t);
  try{const {Place,SearchNearbyRankPreference}=gLib.places;
    const res=await Promise.all(ENT_CAT.map(([k,,,tipos])=>Place.searchNearby({fields:['id','displayName','location'],locationRestriction:{center:gLL(lat,lng),radius:RAIO_PE},
      includedTypes:tipos,maxResultCount:20,rankPreference:SearchNearbyRankPreference.DISTANCE,language:'pt-BR',region:'br'})
      .then(r=>(r.places||[]).map(p=>({gid:p.id,nome:p.displayName,cat:k,lat:p.location.lat(),lng:p.location.lng()})))));
    /* um lugar entra uma vez (na primeira categoria); mesmo nome na mesma categoria = mesma estação/hospital, fica o mais perto */
    const ids=new Set(),nomes=new Set();let itens=[];
    res.flat().forEach(p=>{const n=p.cat+'|'+normNome(p.nome);if(ids.has(p.gid)||nomes.has(n))return;ids.add(p.gid);nomes.add(n);p.reta=Math.round(distKm(lat,lng,p.lat,p.lng)*1000);itens.push(p)});
    let semPe=false;
    if(itens.length){try{(await gMatriz(lat,lng,itens,'WALK')).forEach((x,i)=>{if(x){itens[i].pe=x.m;itens[i].min=x.min}})}catch(e1){semPe=true;itens.forEach(p=>{p.pe=p.reta;p.min=null})}}
    itens=itens.filter(p=>p.pe!=null&&p.pe<=RAIO_PE);
    t.entorno={lat,lng,em:HOJE,fonte:'google',semPe,itens};
    log(t,`Pontos de interesse buscados no Google: ${itens.length} a até ${fKm(RAIO_PE/1000)} a pé`);save();
    if(semPe)toast('A rota a pé não respondeu; os pontos foram filtrados pela distância em linha reta. Confira se a Routes API está liberada para a chave.',true)}
  catch(e){toast(`Não foi possível buscar os pontos de interesse (${e.message||e}). Confira se a Places API (New) está liberada para a chave.`,true)}
  finally{delete ENT_BUSCA[t.id];entRefresh(t)}}
/* distâncias pela rota até os pontos cadastrados pela empresa: a pé (perto) e de carro (todos) */
const idsPontos=()=>(S.pontos||[]).map(p=>p.id).sort().join(',');
const DIST_BUSCA={};
async function gDistEmpresa(t){if(!GG||t.lat==null||DIST_BUSCA[t.id])return;const pts=(S.pontos||[]).slice(),lat=t.lat,lng=t.lng;
  DIST_BUSCA[t.id]=true;const m={};let semRota=false;
  try{if(pts.length){const perto=pts.filter(p=>distKm(lat,lng,p.lat,p.lng)*1000<=RAIO_PE);
      const [pe,car]=await Promise.all([perto.length?gMatriz(lat,lng,perto,'WALK').catch(()=>null):Promise.resolve([]),gMatriz(lat,lng,pts,'DRIVE').catch(()=>null)]);
      if(!pe&&!car)semRota=true;
      pts.forEach(p=>m[p.id]={});(pe||[]).forEach((x,i)=>{if(x){m[perto[i].id].pe=x.m;m[perto[i].id].pm=x.min}});(car||[]).forEach((x,i)=>{if(x){m[pts[i].id].cm=x.m;m[pts[i].id].cmin=x.min}})}
    t.dist={lat,lng,ids:pts.map(p=>p.id).sort().join(','),semRota,m};save()}
  catch(e){}finally{delete DIST_BUSCA[t.id];entRefresh(t)}}
/* busca automática: terreno localizado sem busca para a coordenada atual (cadastro novo, endereço ou ponto mudou) */
function gEntornoAuto(){if(!GG||!gLib.places||UI.route!=='terreno'||UI.role==='Leitura')return;const t=T(UI.id);if(!t||t.lat==null)return;

/* ---------- relevo (Elevation API) ---------- */
async function gRelevo(t){let pts=[];
  if(t.poly&&t.poly.length>=3){const pg=new google.maps.Polygon({paths:t.poly.map(p=>gLL(p[0],p[1]))});const la=t.poly.map(p=>p[0]),lo=t.poly.map(p=>p[1]);
    const [a,b,c,d]=[Math.min(...la),Math.max(...la),Math.min(...lo),Math.max(...lo)],n=12;
    for(let i=0;i<=n;i++)for(let j=0;j<=n;j++){const q=new google.maps.LatLng(a+(b-a)*i/n,c+(d-c)*j/n);if(google.maps.geometry.poly.containsLocation(q,pg))pts.push({i,j,q})}}
  if(pts.length<4){const r=0.00025;pts=[];for(let i=0;i<=6;i++)for(let j=0;j<=6;j++)pts.push({i,j,q:new google.maps.LatLng(t.lat-r+2*r*i/6,t.lng-r+2*r*j/6)})}
  try{const {results}=await new google.maps.ElevationService().getElevationForLocations({locations:pts.map(p=>p.q)});
    const el=results.map((r,k)=>({...pts[k],z:r.elevation,res:r.resolution}));const zs=el.map(e=>e.z),min=Math.min(...zs),max=Math.max(...zs);
    t.relevo={em:HOJE,min,max,desnivel:max-min,res:Math.max(...el.map(e=>e.res||0)),grade:el.map(e=>[e.i,e.j,+e.z.toFixed(1)]),n:el.length,poligonal:!!t.poly};
    log(t,`Relevo estimado pelo Google: desnível ${num(max-min,1)} m`);save();render();toast(`Desnível estimado: ${num(max-min,1)} m.`)}
  catch(e){toast(`Elevação indisponível (${e.message||e}). Confira se a Elevation API está liberada para a chave.`,true)}}
function relevoHtml(t){const r=t.relevo;if(!GG&&!r)return '';
  if(!r)return t.lat!=null?`<div class="relevo-vazio"><span class="muted">Relevo ainda não estimado.</span><button class="btn sm ed" data-a="g-relevo" data-id="${t.id}">Estimar relevo pelo Google</button></div>`:'';
  const ni=Math.max(...r.grade.map(g=>g[0]))+1,nj=Math.max(...r.grade.map(g=>g[1]))+1,cel=Math.max(8,Math.floor(220/Math.max(ni,nj)));
  // rampa sequencial de um matiz: mais claro = mais baixo
  const cor=z=>{const f=r.max>r.min?(z-r.min)/(r.max-r.min):0;return `hsl(212 70% ${88-f*58}%)`};
  return `<div class="relevo"><svg viewBox="0 0 ${nj*cel} ${ni*cel}" width="${nj*cel}" height="${ni*cel}" role="img" aria-label="Grade de elevação do terreno">${r.grade.map(([i,j,z])=>`<rect x="${j*cel}" y="${(ni-1-i)*cel}" width="${cel-1}" height="${cel-1}" fill="${cor(z)}" data-tip="${num(z,1)} m"/>`).join('')}</svg>
    <div class="relevo-n"><div><span class="k">Desnível estimado</span><b>${num(r.desnivel,1)} m</b></div><div><span class="k">Cota mínima / máxima</span>${num(r.min,1)} m / ${num(r.max,1)} m</div>
    <div class="hint">Google Elevation, ${r.n} pontos ${r.poligonal?'dentro da poligonal':'ao redor do ponto'}; resolução de até ${num(r.res,0)} m. Serve para triagem; não substitui o levantamento planialtimétrico.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${t.desnivel!==+r.desnivel.toFixed(1)?`<button class="btn sm ed" data-a="g-relevo-usar" data-id="${t.id}">Usar como desnível estimado</button>`:''}${GG?`<button class="btn sm text ed" data-a="g-relevo" data-id="${t.id}">Recalcular</button>`:''}</div></div></div>`}

const NEG_LAB={etapa:'Etapa',sub:'Subetapa',status:'Status',temp:'Temperatura',retomar:'Retomar em',motivo:'Motivo',detalhe:'Relato',pontos:'Pontos de sucesso',ofRef:'Oferta de referência'};
const NEG_SEM_LOG=['desde','subDesde','encerradoEm','relato'];

function audSnap(){AUD={};S.terrenos.forEach(t=>{AUD[t.id]={j:retrato(t),h:(t.hist||[]).length}})}
function diffTerreno(a,b){
  const campos=[],itens=[];
  Object.keys({...a,...b}).forEach(k=>{
    if(['hist','relevo','id','codigo'].includes(k))return;
    const va=a[k],vb=b[k];if(JSON.stringify(va)===JSON.stringify(vb))return;
    /* o pino acompanha a poligonal: a mudança de lugar dele vai junto do ajuste, sem log próprio */
    if(['lat','lng','precisao'].includes(k)&&JSON.stringify(a.poly)!==JSON.stringify(b.poly))return;
    if(k==='poly'){campos.push({k,txt:!vb?'Poligonal removida':va?polyLogTxt(areaPoly(va),areaPoly(vb)):'Poligonal desenhada'});return}
    if(k==='neg'){const na=va||{},nb=vb||{};if(!va&&vb){itens.push('Negociação aberta');return}
      Object.keys({...na,...nb}).forEach(x=>{if(NEG_SEM_LOG.includes(x)||JSON.stringify(na[x])===JSON.stringify(nb[x])||typeof (nb[x]??na[x])==='object'&&x!=='viab')return;
        if(x==='viab'){campos.push({k:'neg.viab',txt:nb.viab?`Estudo de viabilidade vinculado: ${nb.viab.nome||''}`:'Estudo de viabilidade desvinculado'});return}
        const f=v=>v==null||v===''?'não informado':x==='etapa'?SN(v):x==='sub'?subN(v):x==='status'?STATUS_N[v]||v:x==='motivo'?motivoN(nb.status,v):x==='retomar'?fd(v):x==='temp'?v+'/5':String(v);
        campos.push({k:'neg.'+x,txt:`${NEG_LAB[x]||x}: ${f(na[x])} → ${f(nb[x])}`})});return}
    if(k==='infra'){Object.keys({...va,...vb}).forEach(x=>{const da=va?.[x]?.d,db=vb?.[x]?.d;if(da!==db)campos.push({k:'infra.'+x,txt:`Infraestrutura · ${x}: ${da||'não verificado'} → ${db||'não verificado'}`})});return}
    if(Array.isArray(va)||Array.isArray(vb)){const [lab,desc]=ARR_LAB[k]||[k,()=>''];const A=va||[],B=vb||[];
      const chave=(x,i)=>x&&x.id!=null?'id:'+x.id:x&&x.v!=null?'v:'+x.v:'i:'+i;
      const mA=new Map(A.map((x,i)=>[chave(x,i),x])),mB=new Map(B.map((x,i)=>[chave(x,i),x]));
      mB.forEach((x,c)=>{const d=desc(x)||'';if(!mA.has(c))itens.push(`${lab} adicionada${d?': '+d:''}`);else if(JSON.stringify(mA.get(c))!==JSON.stringify(x)){const o=mA.get(c);const ks=Object.keys({...o,...x}).filter(q=>JSON.stringify(o[q])!==JSON.stringify(x[q])).map(q=>ITEM_LAB[q]||q);itens.push(`${lab} alterada${d?' ('+d+')':''}: ${ks.join(', ')}`)}});
      mA.forEach((x,c)=>{if(!mB.has(c)){const d=desc(x)||'';itens.push(`${lab} removida${d?': '+d:''}`)}});return}
    if(typeof (vb??va)==='object')return;
    if(valTxt(k,va)!==valTxt(k,vb))campos.push({k,txt:`${LAB_CAMPO[k]||k}: ${valTxt(k,va)} → ${valTxt(k,vb)}`});
  });
  return {campos,itens};
}
/* Cliques seguidos no mesmo campo (temperatura 2 → 3 → 4) viram um log só, como app.juntar_auditoria no banco:
   se o log anterior é do mesmo usuário, nos mesmos campos, há menos de JANELA_LOG, ele dá lugar a um com o valor
   de antes da sequência e o final; se o final é o de antes, os dois somem. Mudança de etapa, subetapa e status fica
   de fora (cada passagem conta para o SLA). O registro é gravado na hora; só o histórico junta. */
const JANELA_LOG=7000,LOG_NAO_JUNTA=['neg.etapa','neg.sub','neg.status'];
/* ajuste na poligonal junta por 2 minutos (app.janela_log no banco; decisão do Moisés, 24/out/2026) */
const janelaLog=ks=>ks.join()==='poly'?120000:JANELA_LOG;
const polyLogTxt=(a0,a)=>`Ajuste na poligonal${a0&&a?`: ${m2(a0)} → ${m2(a)}`:''}`;
const valCampo=(o,k)=>{const [a,b]=k.split('.');const v=b?o[a]?.[b]:o[a];return v===undefined?null:v};
function juntarLog(t,s,campos,itens,nNovos){
  const e=t.hist[t.hist.length-1];if(!e||!campos.length)return;
  const ks=campos.map(c=>c.k).sort();
  if(itens.length||nNovos>1||ks.some(k=>LOG_NAO_JUNTA.includes(k))||e.det&&e.det.length>ks.length)return;
  const a=JSON.parse(s.j);e.ks=ks;e.ant=Object.fromEntries(ks.map(k=>[k,valCampo(a,k)]));
  /* valores depois da ação: o olhinho e a lixeira só valem enquanto o campo ainda tem estes valores */
  {const d=JSON.parse(retrato(t));e.dep=Object.fromEntries(ks.map(k=>[k,valCampo(d,k)]))}
  const p=t.hist[t.hist.length-2];
  /* o desfazer e a ação desfeita não se juntam com nada */
  if(e.desfaz||p&&(p.desfeito||p.desfaz))return;
  if(!p||!p.ks||p.user!==e.user||p.ks.join()!==ks.join()||Date.parse(e.em)-Date.parse(p.em)>=janelaLog(ks))return;
  const atual=JSON.parse(retrato(t));
  if(ks.every(k=>JSON.stringify(valCampo(atual,k))===JSON.stringify(p.ant[k]))){t.hist.splice(-2,2);return}
  const base=JSON.parse(retrato(t));ks.forEach(k=>{const [x,y]=k.split('.');if(y)base[x]={...base[x],[y]:p.ant[k]};else base[x]=p.ant[k]});
  const c=diffTerreno(base,atual).campos;
  e.ant=p.ant;if(c.length===1){e.txt=c[0].txt;delete e.det}else e.det=c.map(x=>x.txt);
  t.hist.splice(-2,1);
}
function audit(){
  S.terrenos.forEach(t=>{
    const s=AUD[t.id];t.hist=t.hist||[];
    if(!s)return;
    const {campos,itens}=diffTerreno(JSON.parse(s.j),JSON.parse(retrato(t)));
    const novos=t.hist.slice(s.h);
    /* edição salva sem mudar nenhum valor: não deixa registro vazio */
    if(!campos.length&&!itens.length){const vaz=novos.filter(e=>/atualizad[oa]s?$/.test(e.txt)&&!(e.det&&e.det.length));if(vaz.length)t.hist=t.hist.filter(e=>!vaz.includes(e));return}
    if(novos.length){const e=novos[novos.length-1];const det=campos.map(c=>c.txt).filter(x=>x!==e.txt);if(det.length)e.det=(e.det||[]).concat(det)}
    else{const secs=new Set(campos.map(c=>SEC_DE[c.k]).filter(Boolean));
      const txt=itens.length&&!campos.length?itens[0]:secs.size===1&&!itens.length?`${SECOES[[...secs][0]].titulo} editado`:'Ficha editada';
      const det=campos.map(c=>c.txt).concat(itens.length&&!(itens.length===1&&!campos.length)?itens:[]);
      t.hist.push({em:agora(),user:me(),txt,det:det.length?det:undefined})}
    juntarLog(t,s,campos,itens,novos.length);
  });
  audSnap();
}

/* histórico de exemplo: reconstrói, a partir dos dados semeados, os registros que o sistema teria feito */

  S.terrenos.forEach(t=>{
    const H=[];const add=(dia,user,txt,det)=>{if(!dia)return;H.push({em:dia.length>10?dia:dia+'T'+hora(t.id+txt,H.length),user:user||t.resp,txt,det})};
    add(t.dataIdent,t.resp,'Terreno cadastrado',[t.nome,t.logradouro&&`Endereço: ${t.logradouro}${t.numero?', '+t.numero:''}`].filter(Boolean));
    (t.ofertas||[]).forEach(o=>add(o.data,t.resp,`Oferta registrada: ${mi(o.valor)}`,[typeof corretor==='function'&&corretor(o.cid)?`Corretor: ${corretor(o.cid).nome}`:null,o.forma&&OPT.forma?.[o.forma]?`Forma: ${OPT.forma[o.forma]}`:null].filter(Boolean)));
    (t.mats||[]).forEach(m=>add(m.data||addD(t.dataIdent,1),'Rafael Souza',`Matrícula adicionada: ${m.num}`,[m.cri,m.area!=null?`Área: ${m2(m.area)}`:null].filter(Boolean)));
    (t.insc||[]).forEach(i=>add(i.valores?.[0]?.data||addD(t.dataIdent,2),'Rafael Souza',`Inscrição imobiliária adicionada: ${i.sql}`));
    (t.analises||[]).forEach(a=>add(a.data,'Rafael Souza',`Análise urbanística registrada (${a.fonte})`,(a.zonas||[]).map(z=>`${z.sigla} · CA ${num(z.ca,2)}`)));
    (t.neg?.trilha||[]).forEach(x=>add(x.em.slice(0,10),x.user,x.status!=='ativo'?`Status: ${STATUS_N[x.status]}${t.neg.motivo?' · '+motivoN(x.status,t.neg.motivo):''}`:x.ev==='subetapa'?`Subetapa: ${subN(x.paraSub)}`:`Etapa: ${SN(x.paraEtapa)} · ${subN(x.paraSub)}`,x.status==='ativo'?undefined:[t.neg.detalhe||null,x.status==='stand_by'&&t.neg.retomar?`Retomar em ${fd(t.neg.retomar)}`:null].filter(Boolean)));
    if(t.neg?.pedido)add(t.neg.pedido.em,t.neg.pedido.por,`Pedido de aprovação: ${SN(t.neg.pedido.dest)} (gestor)`);
    if(t.neg?.viab)add(t.neg.viab.em,t.resp,`Estudo de viabilidade vinculado: ${t.neg.viab.nome}`,[`Preço máximo ${mi(t.neg.viab.pmax)}`,`Margem ${num(t.neg.viab.margem,1)}%`]);
    (t.propostas||[]).forEach(p=>add(p.data,p.origem==='bkm'?t.resp:t.resp,`Proposta v${p.v} registrada (${p.origem==='bkm'?'BKM':'vendedor'}): ${mi(p.valor)}`,[p.cond].filter(Boolean)));
    (t.propostas||[]).filter(p=>['recusada','aceita'].includes(p.status)).forEach(p=>add(addD(p.data,3),t.resp,`Proposta v${p.v}: ${OPT.statusProp[p.status]}`));
    (t.reunioes||[]).forEach(r=>add(r.status==='realizada'?r.data:addD(r.data,-7),t.resp,r.status==='realizada'?`Reunião registrada (${fd(r.data)})`:`Reunião agendada para ${fd(r.data)} ${r.hora||''}`.trim(),[r.pauta].filter(Boolean)));
    (t.docs||[]).forEach(d=>add(d.emitido?addD(d.emitido,1):null,'Camila Torres',`Documento enviado: ${(TIPOS_DOC[d.tipo]||[d.nome||d.tipo])[0]}`));
    (t.docs||[]).filter(d=>d.status==='validado').forEach(d=>add(d.emitido?addD(d.emitido,2):null,'Moisés',`Documento validado: ${(TIPOS_DOC[d.tipo]||[d.nome||d.tipo])[0]}`));
    (t.dilig||[]).forEach(d=>add(addD(t.dataIdent,3),d.resp||t.resp,`Diligência aberta: ${d.titulo}`));
    (t.tarefas||[]).forEach(k=>add(addD(k.prazo,-7),k.resp===t.resp?'Moisés':t.resp,`Tarefa criada: ${k.titulo}`,[`Responsável: ${k.resp}`,`Prazo: ${fd(k.prazo)}`]));
    t.hist=H.filter(h=>h.em.slice(0,10)<=HOJE).sort((a,b)=>a.em.localeCompare(b.em));
  });
}

function proximasAcoes(t){
  const L=[],n=t.neg;const fixBtn=(a,l,extra='')=>({a,l,extra});
  if(n?.status==='stand_by')L.push({sev:'warn',i:'pause',txt:`Negociação em Stand By. Retomar em ${fd(n.retomar)}`,fix:UI.role!=='Leitura'?fixBtn('retomar','Retomar'):null});
  if(n?.status==='ativo'){
    const r=checkAdv(t);
    if(n.pedido)L.push({sev:'warn',i:'check',txt:possoDecidir(t)?`Aprovar: ${destinoNome(n.pedido.tipo,n.pedido.dest)} (pedido por ${n.pedido.por})`:`Aguardando ${quemFalta(n.pedido)} aprovar ${destinoNome(n.pedido.tipo,n.pedido.dest)}`,fix:null});
    if(subAtrasada(n))L.push({sev:'warn',i:'clock',txt:`${subN(n.sub)} há ${diasSub(n)} dias (prazo de ${subCfg(n.sub).prazo})`,fix:null});
    if(r)r.items.filter(x=>!x.ok).forEach(x=>L.push({sev:x.gate?'':'warn',i:x.gate?'warn':'fwd',txt:x.txt,fix:x.fix?fixBtn(x.fix[0].startsWith('tab:')?'tab':x.fix[0],x.fix[1],x.fix[0].startsWith('tab:')?`data-t="${x.fix[0].slice(4)}"`:''):null}));
    if(r&&r.ok&&!n.pedido)L.push({sev:'good',i:'fwd',txt:`Pronto para ${r.compra?'concluir como Comprado':'avançar para '+r.next[1]}${r.aprov.niveis.length?' (pede aprovação)':''}`,fix:null});
    const lp=lastProp(t);
    if(lp&&['apresentada','em_analise'].includes(lp.status))L.push({sev:'warn',i:'money',txt:lp.origem==='bkm'?`Cobrar resposta da proposta v${lp.v} (enviada em ${fd(lp.data)})`:`Responder à proposta v${lp.v} do vendedor (${mi(lp.valor)})`,fix:fixBtn('tab','Ver propostas','data-t="negociacao"')});
    if(acimaMax(t))L.push({sev:'crit',i:'money',txt:`Levar ao comitê: proposta ${mi(lastProp(t).valor)} acima do preço máximo (${mi(n.viab.pmax)})`,fix:null});
    if(!n.temp)L.push({sev:'warn',i:'warn',txt:'Avaliar a temperatura da negociação',fix:null});
    const pr=proxReuniao(t);if(pr)L.push({sev:'',i:'clock',txt:`Reunião ${fd(pr.data)}${pr.hora?' às '+pr.hora:''}${pr.pauta?' · '+pr.pauta:''}`,fix:fixBtn('tab','Ver','data-t="negociacao"')});
  }
  (t.dilig||[]).filter(d=>d.sit!=='resolvida').forEach(d=>L.push({sev:d.sit==='impeditiva'?'crit':'warn',i:'warn',txt:`Resolver diligência: ${d.titulo}`,fix:fixBtn('tab','Ver','data-t="documentos"')}));
  (t.docs||[]).filter(d=>docSt(d)==='vencido').forEach(d=>L.push({sev:'crit',i:'doc',txt:`Renovar documento vencido: ${(TIPOS_DOC[d.tipo]||[d.tipo])[0]}`,fix:fixBtn('tab','Ver','data-t="documentos"')}));
  const c=completude(t);if(c.faltam.length)L.push({sev:'',i:'edit',txt:`Completar a ficha (${c.pct}%): ${c.faltam.slice(0,3).map(f=>f[0]).join(', ')}${c.faltam.length>3?'…':''}`,fix:fixBtn('ir','Completar',`data-t="${c.faltam[0][2]}" data-s="${c.faltam[0][3]||''}"`)});
  if(!n&&t.situacao==='ativo')L.push({sev:'',i:'fwd',txt:'Terreno sem negociação. Registre uma oferta para abrir a negociação.',fix:UI.role!=='Leitura'?fixBtn('nova-oferta','Registrar oferta'):null});
  return L;
}

    ['analise','Análise Caixa',60,[['engenharia','Engenharia'],['juridico','Jurídico'],['risco','Risco']]],
    ['contratacao','Contratação',30,[['demanda_minima','Demanda Mínima'],['assinatura','Assinatura']]]])},
  {k:'lancamento',nome:'Lançamento',prefixo:'LAN',ativo:true,conc:'Lançado',descarta:true,etapas:etx([
    ['preparacao','Preparação',60,[['produto','Produto e Tabela'],['stand','Stand e Decorado']]],
    ['vendas','Vendas Iniciais',60,[['evento','Evento de Lançamento'],['vendas_iniciais','Vendas Iniciais']]]])},
  {k:'obras',nome:'Obras',prefixo:'OBR',ativo:true,conc:'Obra entregue',descarta:true,etapas:etx([
    ['inicio','Início',60,[['mobilizacao','Mobilização'],['fundacao','Fundação']]],
    ['execucao','Execução',540,[['estrutura','Estrutura'],['vedacoes','Vedações e Instalações'],['acabamento','Acabamento']]],
    ['entrega','Entrega',60,[['habite_se','Vistoria e Habite-se'],['entrega_chaves','Entrega das Chaves']]]])},
  {k:'entregue',nome:'Entregue',prefixo:'ENT',ativo:true,conc:'Garantia encerrada',descarta:false,etapas:etx([
    ['pos_entrega','Pós-entrega',null,[['assistencia_tecnica','Assistência Técnica'],['garantia','Em Garantia']]]])}];
/* cada fase abre quando a anterior é concluída */
const DEPS_PADRAO=()=>[['aprovacao','novos_negocios'],['incorporacao','aprovacao'],['caixa','incorporacao'],['lancamento','caixa'],['obras','lancamento'],['entregue','obras']]
  .map(([fase,reqFase],i)=>({id:'fd'+i,fase,reqFase,tipo:'conclusao',req:null}));

const fasesL=()=>cfg().fases||[];
const faseCfg=k=>fasesL().find(f=>f.k===k);
const faseN=k=>faseCfg(k)?.nome||k||'';
const faseEnt=()=>(fasesL().find(f=>f.entrada)||{}).k;
const fIdx=k=>fasesL().findIndex(f=>f.k===k);
/* etapas da fase (a de entrada usa o funil de sempre) */
const etapasF=k=>k===faseEnt()?cfg().etapas.map(e=>({k:e.k,nome:e.nome,sla:e.sla,subs:subsDe(e.k).map(s=>({k:s.k,nome:s.nome}))})):(faseCfg(k)?.etapas||[]);
const etapaF=(f,e)=>etapasF(f).find(x=>x.k===e);
const subF=(f,s)=>etapasF(f).flatMap(e=>e.subs).find(x=>x.k===s);
const procsDe=t=>t.procs||(t.procs=[]);
const aberto=p=>p&&['ativo','stand_by'].includes(p.status);
const procAberto=(t,f)=>procsDe(t).find(p=>p.fase===f&&aberto(p));
const ultimoProc=(t,f)=>procsDe(t).filter(p=>p.fase===f).slice(-1)[0];
const teveFase=(t,f)=>f===faseEnt()?!!t.neg:procsDe(t).some(p=>p.fase===f);
const concluiu=(t,f)=>f===faseEnt()?t.neg?.status==='comprado':procsDe(t).some(p=>p.fase===f&&p.status==='concluido');
const passou=(t,f,tipo,k)=>{if(concluiu(t,f))return true;const L=f===faseEnt()?(t.neg?[t.neg]:[]):procsDe(t).filter(p=>p.fase===f);
  return L.some(p=>(tipo==='etapa'?p.etapa===k:p.sub===k)||(p.trilha||[]).some(x=>(tipo==='etapa'?x.paraEtapa:x.paraSub)===k))};
const depTxt=d=>d.tipo==='conclusao'?`${faseCfg(d.reqFase)?.conc||'Concluir'} em ${faseN(d.reqFase)}`:d.tipo==='etapa'?`${faseN(d.reqFase)}: chegar à etapa ${etapaF(d.reqFase,d.req)?.nome||d.req}`:`${faseN(d.reqFase)}: passar por ${subF(d.reqFase,d.req)?.nome||d.req}`;
const depsDe=(t,f)=>(cfg().deps||[]).filter(d=>d.fase===f).map(d=>({ok:passou(t,d.reqFase,d.tipo,d.req)&&(d.tipo!=='conclusao'||concluiu(t,d.reqFase)),txt:depTxt(d)}));
/* fase atual: a aberta mais adiante; sem nenhuma aberta, a última encerrada (no banco: v_terrenos.fase) */
function faseAtual(t){const ent=faseEnt(),abertas=fasesL().filter(f=>f.entrada?aberto(t.neg):procAberto(t,f.k));
  if(abertas.length){const f=abertas[abertas.length-1];return {k:f.k,p:f.entrada?t.neg:procAberto(t,f.k),aberta:true}}
  const teve=fasesL().filter(f=>teveFase(t,f.k));if(!teve.length)return null;const f=teve[teve.length-1];
  return {k:f.k,p:f.entrada?t.neg:ultimoProc(t,f.k),aberta:false}}
const fasesAbertas=t=>fasesL().filter(f=>f.entrada?aberto(t.neg):procAberto(t,f.k)).map(f=>f.k);
const naEntrada=t=>{const a=faseAtual(t);return !a||a.k===faseEnt()};

/* abrir: primeira etapa com subetapa da fase (no banco: app._abrir_processo) */
function abrirFase(t,f,just){const fc=faseCfg(f),e=etapasF(f).find(x=>x.subs.length);if(!fc||!e)return null;
  const p={id:uid(),fase:f,codigo:fc.prefixo+'-'+String(Math.floor(Math.random()*900)+100).padStart(5,'0'),etapa:e.k,sub:e.subs[0].k,status:'ativo',desde:HOJE,subDesde:HOJE,
    trilha:[{em:agora(),user:me(),ev:'abertura',paraEtapa:e.k,paraSub:e.subs[0].k,status:'ativo',forcado:just||null}]};
  procsDe(t).push(p);log(t,`Fase aberta: ${fc.nome} (${p.codigo})${just?' · sem as dependências: '+just:''}`);
  notificar(t.resp,'aprovacao_decidida',`${t.nome} entrou em ${fc.nome}`,t);return p}
/* depois de cada passagem: abre a fase que o terreno nunca teve e cujas dependências se cumpriram */
function abrirLiberadas(t){if(t.situacao==='arquivado')return [];const abertas=[];let mudou=true,n=0;
  while(mudou&&n++<20){mudou=false;fasesL().filter(f=>!f.entrada&&f.ativo&&(cfg().deps||[]).some(d=>d.fase===f.k)&&!teveFase(t,f.k)).forEach(f=>{
    if(depsDe(t,f.k).every(x=>x.ok)&&abrirFase(t,f.k)){abertas.push(f.nome);mudou=true}})}
  if(abertas.length)setTimeout(()=>toast(`${t.nome} entrou em ${abertas.join(' e ')}.`),1200);
  return abertas}

/* passagens do processo de uma fase (etapa, subetapa, status) */
function procIr(t,p,tipo,dest,d={}){const ev={em:agora(),user:me(),deEtapa:p.etapa,deSub:p.sub};const es=etapasF(p.fase),ix=k=>es.findIndex(e=>e.k===k);
  if(tipo==='etapa'){const volta=ix(dest)<ix(p.etapa),e=etapaF(p.fase,dest);p.etapa=dest;p.sub=e.subs[0]?.k||null;p.desde=HOJE;p.subDesde=HOJE;ev.ev=volta?'retorno':'avanco';
    log(t,`${faseN(p.fase)}: ${volta?'voltou':'avançou'} para ${e.nome}${volta&&d.motivo?' · '+d.motivo:''}`)}
  else if(tipo==='subetapa'){p.sub=dest;p.subDesde=HOJE;ev.ev='subetapa';log(t,`${faseN(p.fase)}: ${subF(p.fase,dest)?.nome}`)}
  else{p.status=dest;p.encerradoEm=HOJE;ev.ev={concluido:'conclusao',descartado:'descarte',stand_by:'stand_by'}[dest];Object.assign(p,{relato:d.relato||null,motivo:d.motivo||null,detalhe:d.detalhe||null,retomar:d.retomar||null});
    log(t,`${faseN(p.fase)}: ${procStatusN(p)}${d.motivo?' · '+motivoN(dest,d.motivo):''}${dest==='stand_by'?' até '+fd(d.retomar):''}`)}
  Object.assign(ev,{paraEtapa:p.etapa,paraSub:p.sub,status:p.status});(p.trilha=p.trilha||[]).push(ev);abrirLiberadas(t)}
function procRetomar(t,p){const parado=p.encerradoEm?diff(p.encerradoEm,HOJE):0;p.status='ativo';p.desde=addD(p.desde,parado);p.subDesde=addD(p.subDesde||HOJE,parado);p.retomar=null;p.encerradoEm=null;
  p.trilha.push({em:agora(),user:me(),ev:'retomada',paraEtapa:p.etapa,paraSub:p.sub,status:'ativo'});log(t,`${faseN(p.fase)}: retomada`)}
const procStatusN=p=>p.status==='concluido'?faseCfg(p.fase)?.conc||'Concluído':STATUS_N[p.status]||p.status;
const procAtrasada=p=>{const e=etapaF(p.fase,p.etapa);return !!(p.status==='ativo'&&e?.sla&&diff(p.desde,HOJE)>e.sla)};
const ultimaEtapa=p=>{const es=etapasF(p.fase);return es[es.length-1]?.k===p.etapa};

/* ---------- desenho ---------- */
/* chip da situação: na entrada, o de sempre; depois, a fase com a etapa e a subetapa */
function chipFase(t){const a=faseAtual(t);if(!a||a.k===faseEnt())return chipNeg(t);const p=a.p,e=etapaF(p.fase,p.etapa);
  const st=p.status==='ativo'?`<span class="chip sub ${procAtrasada(p)?'warn':''}">${esc(e?.nome||p.etapa)}${p.sub?' · '+esc(subF(p.fase,p.sub)?.nome||''):''}</span>`:`<span class="chip ${p.status==='concluido'?'good':p.status==='stand_by'?'warn':''}"><span class="d"></span>${esc(procStatusN(p))}</span>`;
  const mais=fasesAbertas(t).length>1?`<span class="chip" title="${esc(fasesAbertas(t).map(faseN).join(', '))}">+${fasesAbertas(t).length-1} fase</span>`:'';
  return `<span class="chip fase-n">${esc(faseN(a.k))}</span>${st}${mais}`}
/* linha do tempo do topo: na entrada, as etapas da negociação; depois, as fases */
function linhaTopo(t){if(naEntrada(t))return linhaEtapas(t);const a=faseAtual(t),ia=fIdx(a.k);
  return `<nav class="tl-topo" aria-label="Fases do terreno"><ol class="stepper">${fasesL().filter(f=>f.ativo||teveFase(t,f.k)).map((f,i)=>{const p=f.entrada?t.neg:ultimoProc(t,f.k),fim=concluiu(t,f.k),cur=f.k===a.k&&!fim,st=fim?'done':cur||aberto(p)?'cur':'fut';
    /* atual: a etapa; concluída: a data da conclusão; futuras: só o nome */
    const sd=!p?'':cur||aberto(p)?(f.entrada?SN(p.etapa):etapaF(f.k,p.etapa)?.nome||''):fim?fd(p.encerradoEm):'';
    return `<li class="step ${st}" ${cur?'aria-current="step"':''}><span class="dot">${st==='done'?ic('check',14):i+1}</span><span class="sl-w"><span class="sl" title="${esc(f.nome)}">${esc(f.nome)}</span>${sd?`<span class="sd" title="${esc(sd)}">${esc(sd)}</span>`:''}</span></li>`}).join('')}</ol></nav>`}
/* quadro de avanço do processo de uma fase (a de entrada usa painelNeg) */
function painelProc(t,p){const ro=UI.role==='Leitura',fc=faseCfg(p.fase),es=etapasF(p.fase),e=etapaF(p.fase,p.etapa),ix=es.findIndex(x=>x.k===p.etapa),prox=es[ix+1];
  if(p.status==='stand_by')return `<section class="sec sec-adv"><div class="banner warn" style="justify-content:space-between;flex-wrap:wrap"><span style="display:flex;gap:12px">${ic('pause')}<span><b>${esc(fc.nome)} em Stand By · ${esc(e?.nome||'')} · revisitar em ${fd(p.retomar)}</b>${p.detalhe?`<br><span>${esc(p.detalhe)}</span>`:''}</span></span>${ro?'':`<button class="btn sm" data-a="p-retomar" data-p="${p.id}">Retomar</button>`}</div></section>`;
  if(p.status!=='ativo')return '';
  const subSel=`<label class="adv-sub"><span>${esc(fc.nome)} · ${esc(e?.nome||'')}</span><select data-ch="psub" data-p="${p.id}" ${ro?'disabled':''} aria-label="Subetapa">${(e?.subs||[]).map(s=>`<option value="${s.k}" ${s.k===p.sub?'selected':''}>${esc(s.nome)}</option>`).join('')}</select><span class="faint">${diff(p.subDesde||p.desde,HOJE)} d${e?.sla?` · etapa ${diff(p.desde,HOJE)} de ${e.sla} d`:''}</span>${procAtrasada(p)?'<span class="chip warn">acima do SLA</span>':''}</label>`;
  const menu=`<div class="adv-mais"><button class="btn adv-mb" data-a="adv-mais" aria-haspopup="menu" aria-expanded="false" aria-label="Mais ações" title="Stand By${fc.descarta?' ou Descartado':''}"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" d="M12 5.5h.01M12 12h.01M12 18.5h.01"/></svg></button><div class="adv-menu" role="menu"><button role="menuitem" data-a="p-suspender" data-p="${p.id}">${ic('pause',18)}Colocar em Stand By</button>${fc.descarta?`<button role="menuitem" class="danger" data-a="p-descartar" data-p="${p.id}">${ic('close',18)}Descartar</button>`:''}</div></div>`;
  return `<section class="sec sec-adv"><div class="adv adv-c">${subSel}<div class="adv-l1"><span class="adv-t">${prox?'Próxima: '+esc(prox.nome):'Próxima: concluir como '+esc(fc.conc)}</span></div>
    ${ro?'':`<div class="adv-l2"><button class="btn primary" data-a="p-ir" data-p="${p.id}">${ic(prox?'fwd':'check',18)}<span>${prox?'Avançar':'Concluir como '+esc(fc.conc)}</span></button>${menu}</div>`}</div></section>`}
/* quadro de avanço da ficha: o da fase atual, e o de cada outra fase aberta ao mesmo tempo */
function painelAvanco(t){const ab=fasesAbertas(t);if(!ab.length||ab.length===1&&ab[0]===faseEnt())return painelNeg(t);
  return ab.slice().reverse().map(f=>f===faseEnt()?painelNeg(t):painelProc(t,procAberto(t,f))).join('')}
/* seção Fases da ficha: cada fase com a situação, o processo e o que falta para abrir */
function abaFases(t){const ent=faseEnt(),ro=UI.role==='Leitura';
  return `<section class="sec"><div class="sec-h"><h2>Fases do terreno</h2><span class="faint" style="font-size:13px">Cada fase abre quando as dependências dela se cumprem</span></div><div class="sec-b"><ul class="fs-lst">${fasesL().filter(f=>f.ativo||teveFase(t,f.k)).map(f=>{
    const p=f.entrada?t.neg:ultimoProc(t,f.k),deps=f.entrada?[]:depsDe(t,f.k),falta=deps.filter(x=>!x.ok);
    const st=!p?`<span class="chip">${f.entrada?'Sem negociação':'Não aberta'}</span>`:f.entrada?chipNeg(t):p.status==='ativo'?`<span class="chip fase">${esc(etapaF(f.k,p.etapa)?.nome||'')}</span><span class="chip sub">${esc(subF(f.k,p.sub)?.nome||'')}</span>`:`<span class="chip ${p.status==='concluido'?'good':p.status==='stand_by'?'warn':''}"><span class="d"></span>${esc(procStatusN(p))}</span>`;
    /* abrir à mão: a próxima fase que falta, fase sem dependência, ou reabrir a descartada */
    const proxima=fasesL().find(x=>x.ativo&&!x.entrada&&!teveFase(t,x.k))?.k===f.k;
    const pode=!f.entrada&&!ro&&(p?p.status==='descartado':f.ativo&&(proxima||!deps.length));
    return `<li class="fs-i ${p&&aberto(p)?'aberta':''}"><div class="fs-it"><b>${esc(f.nome)}</b>${p?`<span class="num faint">${esc(p.codigo)}</span>`:''}<span class="fs-st">${st}</span></div>
      ${p?`<div class="faint fs-d">${fd(p.trilha?.[0]?.em?.slice(0,10)||p.desde)}${p.encerradoEm&&!aberto(p)?' → '+fd(p.encerradoEm):''}${p.relato&&!f.entrada?' · '+esc(textoDe(p.relato)):''}</div>`:''}
      ${!p&&deps.length?`<ul class="fs-deps">${deps.map(x=>`<li class="${x.ok?'ok':'no'}">${ic(x.ok?'check':'close',14)}${esc(x.txt)}</li>`).join('')}</ul>`:''}
      ${!p&&!f.entrada&&!deps.length?'<div class="faint fs-d">Sem dependência: abre à mão.</div>':''}
      ${pode?`<button class="btn sm ${p?'text':''}" data-a="f-abrir" data-v="${f.k}">${ic('add',16)}${p?'Reabrir':'Abrir'} ${esc(f.nome)}${falta.length?' antes da hora':''}</button>`:''}</li>`}).join('')}</ul></div></section>`}

/* ---------- kanban em três níveis: fase › etapa › subetapa ----------
   UI.negFase vazio = quadro das fases; com fase = etapas dela; com UI.negEtapa = subetapas.
   O título de cada coluna desce um nível; a seta e a trilha no topo voltam. */
const procDaFase=(t,f)=>f===faseEnt()?(aberto(t.neg)?t.neg:null):procAberto(t,f);
function negTopo(titulo,sub){const f=UI.negFase,e=UI.negEtapa,it=[{l:'Fases',v:''}];
  if(f)it.push({l:faseN(f),v:f});if(f&&e)it.push({l:etapaF(f,e)?.nome||e,v:f+'|'+e});const volta=it[it.length-2];
  return `<div class="page-h"><div class="drill-h">${volta?`<button class="iconbtn drill-v" data-a="neg-nivel" data-v="${esc(volta.v)}" title="Voltar para ${esc(volta.l)}" aria-label="Voltar para ${esc(volta.l)}">${ic('back',22)}</button>`:''}<div>
    ${volta?`<ol class="drill-t" aria-label="Nível do quadro">${it.slice(0,-1).map(x=>`<li><button class="linkbtn" data-a="neg-nivel" data-v="${esc(x.v)}">${esc(x.l)}</button></li>`).join('')}</ol>`:''}
    <h1>${volta?'':'<span class="marca"></span>'}${esc(titulo)}</h1><div class="sub">${sub}</div></div></div></div>${fxBarra('kanban')}`}
/* título de coluna que desce um nível */
const colDesce=(a,v,l,dica)=>`<button class="col-ab" data-a="${a}" data-v="${esc(v)}" title="${esc(dica)}"><span>${esc(l)}</span>${ic('chev',16)}</button>`;
function kcardFase(t,f,p){const e=etapaF(f,p.etapa),s=p.sub&&subF(f,p.sub),sb=p.status==='stand_by',outras=fasesAbertas(t).filter(x=>x!==f);
  return `<button class="kcard" data-a="abrir" data-id="${t.id}" data-from="negociacoes"><div class="kr"><span class="num faint">${t.codigo}</span>${f===faseEnt()?tempMini(p.temp):`<span class="num faint">${esc(p.codigo||'')}</span>`}</div><div class="kt">${esc(t.nome)}</div>
  <div class="ksub"><span>${esc(e?.nome||'')}${s?' · '+esc(s.nome):''}</span>${sb?'<span class="faint">Stand By</span>':''}</div>
  <div class="ks">${esc(t.bairro||'')}${outras.length?' · também em '+esc(outras.map(faseN).join(', ')):''}</div>${f===faseEnt()&&typeof dividida==='function'&&dividida(t)?`<div class="kpt">${ic('layers',14)}${esc(resumoPartes(t))}</div>`:''}
  <div class="kr">${av(t.resp,'sm')}<span class="faint">${sb?'revisitar '+fd(p.retomar):diff(p.desde,HOJE)+' d na etapa'}</span></div></button>`}
function pgFasesBoard(){const F=fasesL().filter(f=>f.ativo);
  return `${negTopo('Fases','Cada coluna é uma fase. Clique no nome da fase para ver as etapas dela; ali, no nome da etapa, as subetapas.')}
  <div class="board board-fases" id="board">${F.map(f=>{const L=fxLista('kanban').map(t=>[t,procDaFase(t,f.k)]).filter(([,p])=>p);
  return `<section class="col" data-fase="${f.k}" aria-label="${esc(f.nome)}"><div class="col-h">${colDesce('neg-fase',f.k,f.nome,'Ver etapas de '+f.nome)}<span class="n">${L.length}</span></div>${L.map(([t,p])=>kcardFase(t,f.k,p)).join('')||'<div class="col-empty">Nenhum</div>'}</section>`}).join('')}</div>`}
function kcardProc(t,p){return `<button class="kcard" data-a="abrir" data-id="${t.id}" data-from="negociacoes" ${UI.role!=='Leitura'?'draggable="true"':''}><div class="kr"><span class="num faint">${esc(p.codigo)}</span><span class="num faint">${t.codigo}</span></div><div class="kt">${esc(t.nome)}</div>
  ${p.sub?`<div class="ksub"><span>${esc(subF(p.fase,p.sub)?.nome||'')}</span><span class="faint">${diff(p.subDesde||p.desde,HOJE)} d</span></div>`:''}
  <div class="ks">${esc(t.bairro||'')}${p.status==='stand_by'?' · parou em '+esc(etapaF(p.fase,p.etapa)?.nome||''):''}${fasesAbertas(t).length>1?' · também em '+esc(fasesAbertas(t).filter(f=>f!==p.fase).map(faseN).join(', ')):''}</div>
  <div class="kr">${av(t.resp,'sm')}<span class="faint ${procAtrasada(p)?'katr':''}">${p.status==='stand_by'?'revisitar '+fd(p.retomar):diff(p.desde,HOJE)+' d na etapa'}</span></div></button>`}
function pgFaseBoard(f){const fc=faseCfg(f),es=etapasF(f),L=fxLista('kanban').map(t=>[t,procAberto(t,f)]).filter(([,p])=>p),e=UI.negEtapa&&etapaF(f,UI.negEtapa);
  const cols=e?e.subs.map(s=>({k:'fe:sub:'+s.k,l:s.nome,f:([,p])=>p.status==='ativo'&&p.etapa===e.k&&p.sub===s.k}))
    :[...es.map(x=>({k:'fe:'+x.k,l:x.nome,sla:x.sla,abre:x.k,f:([,p])=>p.status==='ativo'&&p.etapa===x.k})),{k:'fe:stand_by',l:'Stand By',cls:'enc',f:([,p])=>p.status==='stand_by'}];
  return `${negTopo(e?e.nome:fc.nome,e?`Subetapas de ${esc(e.nome)}, em ${esc(fc.nome)}. Arraste o card para mudar a subetapa.`:`Arraste os cards entre as colunas para mudar a etapa. Clique no nome da etapa para ver as subetapas. ${esc(fc.conc)} sai do quadro e abre a fase seguinte, se as dependências dela se cumprirem.`)}
  <div class="board ${e?'board-sub':''}" id="board">${cols.map(c=>{const ts=L.filter(c.f);
  return `<section class="col ${c.cls||''}" data-col="${c.k}" aria-label="${esc(c.l)}"><div class="col-h">${c.abre?colDesce('neg-etapa',c.abre,c.l,'Ver subetapas de '+c.l):`<span>${esc(c.l)}</span>`}<span class="n">${ts.length}</span></div>${c.sla?`<div class="col-s faint">SLA ${c.sla} d</div>`:''}${ts.map(([t,p])=>kcardProc(t,p)).join('')||'<div class="col-empty">Nenhuma</div>'}</section>`}).join('')}</div>`}
function soltarProc(id,col){const t=T(id),f=UI.negFase,p=t&&procAberto(t,f);if(!p||UI.role==='Leitura')return;
  if(col==='stand_by'){if(p.status==='ativo'){UI.alvo=id;UI.alvoProc=p.id;UI.modal='p-suspender';renderModal()}return}
  if(col.startsWith('sub:')){const k=col.slice(4);if(p.status!=='ativo'||p.etapa!==UI.negEtapa||p.sub===k)return;procIr(t,p,'subetapa',k);save();render();toast(`${t.nome}: ${subF(f,k)?.nome}.`);return}
  if(p.status==='stand_by'){procRetomar(t,p);if(p.etapa===col){save();render();toast('Retomada.');return}}
  if(p.etapa===col){save();render();return}
  const es=etapasF(f),ix=k=>es.findIndex(e=>e.k===k);
  if(ix(col)<ix(p.etapa)){save();render();UI.alvo=id;UI.alvoProc=p.id;UI.alvoEtapa=col;UI.modal='p-retornar';renderModal();return}
  procIr(t,p,'etapa',col);save();render();toast(`${t.nome}: ${etapaF(f,col).nome}.`)}

/* ---------- Configurações › Fases ---------- */
const slug=(nome,usados)=>{let k=nome.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'x';while(usados.includes(k))k+='_';return k};
const faseUsada=k=>S.terrenos.some(t=>k===faseEnt()?!!t.neg:procsDe(t).some(p=>p.fase===k));
const etapaUsada=(f,e)=>S.terrenos.some(t=>procsDe(t).some(p=>p.fase===f&&(p.etapa===e||(p.trilha||[]).some(x=>x.paraEtapa===e||x.deEtapa===e))));
/* dependência: sem ciclo e sem dependência na fase de entrada (no banco: adicionar_dependencia) */
function validaDep(f,rf){if(f===rf)return 'Uma fase não depende dela mesma.';if(faseCfg(f)?.entrada)return `${faseN(f)} abre pela oferta, sem dependência.`;
  const dep=(x,vis=new Set())=>{if(vis.has(x))return false;vis.add(x);return (cfg().deps||[]).filter(d=>d.fase===x).some(d=>d.reqFase===f||dep(d.reqFase,vis))};
  if(rf===f||dep(rf))return 'Isso cria um ciclo entre as fases.';return null}

      <input data-ch="cfg" data-p="fases.${i}.conc" value="${esc(f.conc)}" aria-label="Nome do concluído em ${esc(f.nome)}">
      <label class="chk"><input type="checkbox" data-ch="cfg" data-p="fases.${i}.descarta" ${f.descarta?'checked':''} aria-label="Permite descartar"></label>
      <label class="chk"><input type="checkbox" data-ch="cfg-fase-ativa" data-i="${i}" ${f.ativo?'checked':''} ${f.entrada?'disabled':''} aria-label="Ativa">${f.entrada?'<span class="faint" style="font-size:12px">entrada</span>':''}</label>

    <ul class="cfg-pre">${(C.deps||[]).map(d=>`<li><span><b>${esc(faseN(d.fase))}</b> abre quando: ${esc(depTxt(d))}</span><button class="linkbtn danger" data-a="cfg-dep-del" data-v="${d.id}">Remover</button></li>`).join('')||'<li class="faint">Nenhuma dependência. Toda fase abre à mão.</li>'}</ul>

  ${F.filter(f=>!f.entrada).map(f=>{const i=fIdx(f.k);return `<section class="sec"><div class="sec-h"><h2>Etapas · ${esc(f.nome)}</h2></div><div class="sec-b"><div class="cfg-t">

      <input data-ch="cfg" data-p="fases.${i}.etapas.${j}.nome" value="${esc(e.nome)}" aria-label="Nome da etapa"><input type="number" min="0" data-ch="cfg" data-p="fases.${i}.etapas.${j}.sla" value="${e.sla??''}" aria-label="SLA de ${esc(e.nome)}">
      <span class="cfg-subs">${e.subs.map((s,m)=>`<span class="chip">${esc(s.nome)}${e.subs.length>1&&!S.terrenos.some(t=>procsDe(t).some(p=>p.fase===f.k&&p.sub===s.k))?`<button class="chip-x" data-a="cfg-fs-del" data-f="${i}" data-i="${j}" data-m="${m}" aria-label="Tirar ${esc(s.nome)}">×</button>`:''}</span>`).join('')}

      <span>${etapaUsada(f.k,e.k)||f.etapas.length<2?'':`<button class="linkbtn danger" data-a="cfg-fe-del" data-f="${i}" data-i="${j}">Apagar</button>`}</span></div>`).join('')||'<div class="faint" style="padding:12px 0">Sem etapas: a fase não abre até ter uma.</div>'}</div>
    <form class="inline-form" data-form="cfg-fe" data-f="${i}"><div class="field grow"><label for="fe-${f.k}">Nova etapa</label><input id="fe-${f.k}" name="nome" required></div><div class="field" style="flex:0 1 120px"><label for="fs-${f.k}">SLA (dias)</label><input id="fs-${f.k}" name="sla" type="number" min="0"></div><button class="btn sm">${ic('add',16)}Adicionar</button></form>

/* ---------- eventos (chamados antes dos do funil) ---------- */
function fasesClick(A,a,t){const P=()=>t&&procsDe(t).find(p=>p.id===a.dataset.p);
  switch(A){
    case 'neg-fase':UI.negFase=a.dataset.v;UI.negEtapa=null;render();return true;
    case 'neg-nivel':{const [f,e]=(a.dataset.v||'').split('|');UI.negFase=f||null;UI.negEtapa=e||null;render();return true}
    case 'f-abrir':{const f=a.dataset.v,falta=depsDe(t,f).filter(x=>!x.ok);
      if(!falta.length){abrirFase(t,f);abrirLiberadas(t);save();render();toast(`${faseN(f)} aberta.`);return true}
      UI.acao={fase:f,pend:falta.map(x=>x.txt)};UI.modal=nivelDe(me())>=2?'f-forcar':'f-bloq';renderModal();return true}
    case 'p-ir':{const p=P();if(!p)return true;const es=etapasF(p.fase),ix=es.findIndex(e=>e.k===p.etapa);
      if(es[ix+1]){procIr(t,p,'etapa',es[ix+1].k);save();render();toast(`${t.nome}: ${es[ix+1].nome}.`)}else{UI.alvoProc=p.id;UI.modal='p-concluir';renderModal()}return true}
    case 'p-suspender':UI.alvoProc=a.dataset.p;UI.modal='p-suspender';renderModal();return true;
    case 'p-descartar':UI.alvoProc=a.dataset.p;UI.modal='p-descartar';renderModal();return true;
    case 'p-retomar':{const p=P();if(p){procRetomar(t,p);save();render();toast('Retomada. O tempo parado não conta no prazo.')}return true}
    case 'cfg-fase-ord':{const F=fasesL(),i=+a.dataset.i,j=i+Number(a.dataset.v);if(!F[j])return true;[F[i],F[j]]=[F[j],F[i]];save();render();return true}
    case 'cfg-fase-del':{const F=fasesL(),f=F[+a.dataset.i];if(faseUsada(f.k)){toast('Fase já usada: desative em vez de apagar.',true);return true}
      F.splice(+a.dataset.i,1);cfg().deps=(cfg().deps||[]).filter(d=>d.fase!==f.k&&d.reqFase!==f.k);save();render();toast(`${f.nome} apagada.`);return true}
    case 'cfg-dep-del':cfg().deps=(cfg().deps||[]).filter(d=>d.id!==a.dataset.v);save();render();toast('Dependência removida.');return true;
    case 'cfg-fe-ord':{const L=fasesL()[+a.dataset.f].etapas,i=+a.dataset.i,j=i+Number(a.dataset.v);if(!L[j])return true;[L[i],L[j]]=[L[j],L[i]];save();render();return true}
    case 'cfg-fe-del':{const f=fasesL()[+a.dataset.f],e=f.etapas[+a.dataset.i];
      if(etapaUsada(f.k,e.k)){toast('Etapa já usada: não pode ser apagada.',true);return true}
      if((cfg().deps||[]).some(d=>d.reqFase===f.k&&(d.req===e.k||e.subs.some(s=>s.k===d.req)))){toast('Outra fase depende desta etapa: remova a dependência antes.',true);return true}
      f.etapas.splice(+a.dataset.i,1);save();render();toast(`${e.nome} apagada.`);return true}
    case 'cfg-fs-del':{const e=fasesL()[+a.dataset.f].etapas[+a.dataset.i];e.subs.splice(+a.dataset.m,1);save();render();return true}
  }
  return false}
function fasesChange(el){
  if(el.dataset.ch==='psub'){const t=T(UI.id),p=t&&procsDe(t).find(x=>x.id===el.dataset.p);if(p&&el.value!==p.sub){procIr(t,p,'subetapa',el.value);save();render()}return true}
  if(el.dataset.ch==='cfg-prefixo'){const F=fasesL(),i=+el.dataset.i,v=el.value.trim().toUpperCase();
    if(!/^[A-Z]{2,5}$/.test(v))toast('Prefixo: de 2 a 5 letras.',true);else if(F.some((f,j)=>j!==i&&f.prefixo===v))toast(`O prefixo ${v} já é de outra fase.`,true);else{F[i].prefixo=v;save();toast('Prefixo salvo.')}render();return true}
  if(el.dataset.ch==='cfg-fase-ativa'){const f=fasesL()[+el.dataset.i];
    if(!el.checked&&S.terrenos.some(t=>procAberto(t,f.k))){toast('Há terrenos nesta fase: encerre os processos antes de desativar.',true);render();return true}
    f.ativo=el.checked;save();render();return true}
  return false}
function fasesSubmit(form,F,t,f){const C=cfg();
  switch(form){
    case 'cfg-fase':{const p=F.prefixo.trim().toUpperCase();if(!/^[A-Z]{2,5}$/.test(p)){toast('Prefixo: de 2 a 5 letras.',true);return true}
      if(fasesL().some(x=>x.prefixo===p)){toast(`O prefixo ${p} já é de outra fase.`,true);return true}
      const nome=F.nome.trim(),k=slug(nome,fasesL().map(x=>x.k));
      fasesL().push({k,nome,prefixo:p,ativo:true,conc:'Concluído',descarta:true,etapas:[{k:'andamento',nome:'Em andamento',sla:null,subs:[{k:'andamento',nome:'Em andamento'}]}]});
      save();render();toast(`${nome} criada. Defina as etapas e as dependências dela.`);return true}
    case 'cfg-dep':{const [rf,tipo,req]=F.req.split('|'),e=validaDep(F.fase,rf);if(e){toast(e,true);return true}
      if((C.deps||[]).some(d=>d.fase===F.fase&&d.reqFase===rf&&d.tipo===tipo&&(d.req||'')===req)){toast('Essa dependência já existe.',true);return true}
      (C.deps=C.deps||[]).push({id:uid(),fase:F.fase,reqFase:rf,tipo,req:req||null});
      const n=S.terrenos.filter(x=>abrirLiberadas(x).length).length;save();render();toast(`Dependência adicionada.${n?` ${n} terreno${n>1?'s entraram':' entrou'} na fase.`:''}`);return true}
    case 'cfg-fe':{const fs=fasesL()[+f.dataset.f],nome=F.nome.trim(),k=slug(nome,[...fs.etapas.map(e=>e.k),...fs.etapas.flatMap(e=>e.subs.map(s=>s.k))]);
      fs.etapas.push({k,nome,sla:lerNum(F.sla),subs:[{k,nome:'Em andamento'}]});save();render();toast(`${nome} adicionada em ${fs.nome}.`);return true}
    case 'cfg-fs':{const fs=fasesL()[+f.dataset.f],e=fs.etapas[+f.dataset.i],nome=F.nome.trim();
      if(e.subs.some(s=>s.nome.toLowerCase()===nome.toLowerCase())){toast('Já existe uma subetapa com esse nome.',true);return true}
      e.subs.push({k:slug(nome,fs.etapas.flatMap(x=>[x.k,...x.subs.map(s=>s.k)])),nome});save();render();return true}
    case 'f-forcar':{const a=UI.acao;if(!F.j.trim()){toast('Justifique a abertura antes da hora.',true);return true}abrirFase(t,a.fase,F.j.trim());abrirLiberadas(t);UI.modal=null;UI.acao=null;save();render();toast(`${faseN(a.fase)} aberta.`);return true}
    case 'p-concluir':{const p=procsDe(t).find(x=>x.id===UI.alvoProc);if(!F.relato.trim()){toast('Escreva o relato da conclusão.',true);return true}
      UI.modal=null;procIr(t,p,'status','concluido',{relato:F.relato.trim()});save();render();toast(`${faseN(p.fase)}: ${faseCfg(p.fase).conc}.`);return true}
    case 'p-suspender':{const p=procsDe(t).find(x=>x.id===UI.alvoProc);UI.modal=null;procIr(t,p,'status','stand_by',{retomar:F.retomar,detalhe:F.detalhe.trim()});save();render();toast('Em Stand By.');return true}
    case 'p-descartar':{const p=procsDe(t).find(x=>x.id===UI.alvoProc),m=(C.motivos.descartado||[]).find(x=>x.k===F.motivo);
      if(m?.texto&&!F.detalhe.trim()){toast('Esse motivo pede uma explicação no texto.',true);return true}
      UI.modal=null;procIr(t,p,'status','descartado',{motivo:F.motivo,detalhe:F.detalhe.trim()});save();render();toast(`${faseN(p.fase)}: descartada.`);return true}
    case 'p-retornar':{const p=procsDe(t).find(x=>x.id===UI.alvoProc);UI.modal=null;procIr(t,p,'etapa',UI.alvoEtapa,{motivo:F.motivo});save();render();toast(`Voltou para ${etapaF(p.fase,p.etapa).nome}.`);return true}
  }
  return false}
function fasesModal(M,fechar){const t=UI.alvo?T(UI.alvo):T(UI.id),p=t&&procsDe(t).find(x=>x.id===UI.alvoProc);

  if(M==='p-concluir')return `<div class="dh"><div><h2>Concluir como ${esc(fc.conc)}</h2><div class="muted" style="margin-top:4px">${esc(t.nome)} · ${esc(fc.nome)}</div></div>${fechar}</div><form data-form="p-concluir" id="f-pc"><div class="field"><label for="pc-r">Relato</label><textarea id="pc-r" name="relato" required placeholder="O que foi concluído, datas e documentos"></textarea></div></form>${df('f-pc','Concluir')}`;

/* =====================================================================
   Funil da negociação: etapas, subetapas, status, pré-requisitos,
   aprovações por hierarquia, notificações e Configurações › Funil.
   Espelha as RPCs do banco (app._passagem, app.decidir_aprovacao,
   app.encerrar_processo, app.retomar_processo, app.rotina_diaria).
   Injetado no mesmo escopo do protótipo.
   ===================================================================== */

/* ---------- equipe e hierarquia (no banco: membros.papel, superior_id, administrador) ---------- */
const NIVEL={diretor:3,gestor:2,analista:1,leitura:0};
const PAPEL_N={diretor:'Diretor',gestor:'Gestor',analista:'Analista',leitura:'Leitura'};
const NIV_N={2:'gestor',3:'diretor'};
const membro=n=>(S.membros||[]).find(m=>m.nome===n)||{nome:n,papel:'leitura',sup:null,admin:false};
const nivelDe=n=>NIVEL[membro(n).papel]||0;
const ehAdmin=n=>!!membro(n).admin;
const ehSuperior=(chefe,m)=>{let x=membro(m).sup,i=0;while(x&&i++<10){if(x===chefe)return true;x=membro(x).sup}return false};
/* aprovador previsto: quem, subindo a hierarquia de quem pediu, tem o papel do nível */
const aprovadorPrevisto=(quem,nv)=>{let x=membro(quem).sup,i=0;while(x&&i++<10){if(nivelDe(x)===nv)return x;x=membro(x).sup}return null};

/* ---------- configuração ---------- */
const subCfg=k=>cfg().subs.find(s=>s.k===k);
const destinoCfg=(tipo,k)=>tipo==='etapa'?etapaCfg(k):tipo==='subetapa'?subCfg(k):cfg().status[k];
const destinoNome=(tipo,k)=>tipo==='etapa'?SN(k):tipo==='subetapa'?subN(k):STATUS_N[k]||k;
function syncCfg(){STAGES.splice(0,STAGES.length,...cfg().etapas.map(e=>[e.k,e.nome]))}
/* dados carregados ou restaurados: garante configuração, equipe e avisos dos pedidos de exemplo */
function prepararDados(){if(!S.cfg)S.cfg=CFG_PADRAO();if(!S.cfg.fases)S.cfg.fases=FASES_PADRAO();if(!S.cfg.deps)S.cfg.deps=DEPS_PADRAO();if(!S.membros)S.membros=MEMBROS_PADRAO();if(!S.notifs)S.notifs=[];syncCfg();partesPreparar();
  if(!S.pedidosAvisados){S.terrenos.forEach(t=>{if(t.neg?.pedido)avisarAprovadores(t)});S.pedidosAvisados=true}}

/* ---------- regras da passagem ---------- */
const passouPor=(n,sub)=>n.sub===sub||(n.trilha||[]).some(x=>x.paraSub===sub||x.deSub===sub);
const diasSub=n=>n.subDesde?diff(n.subDesde,HOJE):null;
const subAtrasada=n=>{const c=subCfg(n.sub);return !!(n.status==='ativo'&&c&&c.prazo&&diasSub(n)>c.prazo)};
const etapaAtrasada=n=>{const c=etapaCfg(n.etapa);return !!(n.status==='ativo'&&c&&c.sla&&diff(n.desde,HOJE)>c.sla)};
/* pendências para chegar ao destino: pré-requisitos configurados; ao sair de uma etapa, o checklist dela; na compra, diligência impeditiva */
function pendencias(t,tipo,dest){const n=t.neg,L=[];
  cfg().prereq.filter(p=>p.alvoTipo===tipo&&p.alvo===dest).forEach(p=>{const ok=passouPor(n,p.req);
    L.push({ok,txt:ok?`Passou por ${subN(p.req)}`:`Passar antes por ${subN(p.req)} (${SN(subCfg(p.req)?.etapa)})`,fix:null})});
  const saindo=((tipo==='etapa'&&SIDX(dest)>SIDX(n.etapa))||(tipo==='status'&&dest==='comprado'))&&!(!t._parte&&dividida(t));
  if(saindo){(cfg().checklist[n.etapa]||[]).filter(c=>c.obrig).forEach(({doc})=>{const st=docSt(t.docs.find(d=>d.tipo===doc));
      L.push({ok:st==='validado',txt:TIPOS_DOC[doc][0]+(st==='validado'?' validado':st==='pendente'?': não enviado':st==='recebido'?': aguardando validação':': '+st),fix:st==='validado'?null:['tab:documentos','Ver documentos']})})}
  if(tipo==='status'&&dest==='comprado'&&!t._parte)t.dilig.filter(d=>d.sit==='impeditiva').forEach(d=>L.push({ok:false,txt:'Diligência impeditiva: '+d.titulo,fix:['tab:documentos','Ver diligências']}));
  return L.concat(pendPartes(t,tipo,dest))}
/* aprovações exigidas, menos os níveis que quem move já tem */
function aprovExig(tipo,dest,ator){const c=destinoCfg(tipo,dest)||{},nv=[];if(c.g)nv.push(2);if(c.d)nv.push(3);
  const q=nivelDe(ator);return {niveis:nv.filter(x=>x>q),modo:c.modo||'sequencia'}}
const proxDestino=n=>{const i=SIDX(n.etapa);return STAGES[i+1]?['etapa',STAGES[i+1][0]]:['status','comprado']};
/* quadro de avanço: próximo destino, pendências e aprovações (mesmo formato usado nas Ações do painel) */
function checkAdv(t){const n=t.neg;if(!n||n.status!=='ativo')return null;
  const [tipo,dest]=proxDestino(n),items=pendencias(t,tipo,dest),b=items.filter(x=>!x.ok);
  return {next:[dest,destinoNome(tipo,dest)],tipo,dest,items,ok:!b.length,forcar:!!b.length&&!b.some(x=>x.trava)&&nivelDe(me())>=2,aprov:aprovExig(tipo,dest,me()),compra:tipo==='status'}}
const naVez=p=>{const pend=p.niveis.filter(r=>r.status==='pendente');if(!pend.length)return [];const o=Math.min(...pend.map(r=>r.ordem));return pend.filter(r=>r.ordem===o)};
const podeDecidir=(r,u)=>nivelDe(u)>=r.nivel&&(!r.previsto||r.previsto===u||ehSuperior(u,r.previsto));
const possoDecidir=t=>{const p=t.neg?.pedido;return !!p&&naVez(p).some(r=>podeDecidir(r,me()))};
const quemFalta=p=>naVez(p).map(r=>r.previsto?`${r.previsto} (${NIV_N[r.nivel]})`:`um ${NIV_N[r.nivel]}`).join(' e ');

/* mesmo caminho de app._passagem: pendências travam (gestor ou diretor força com justificativa); aprovações viram pedido; sem pedido, executa */
function moverPara(t,tipo,dest,o={}){const n=t.neg,eu=me(),mp=movePartes(t,tipo,dest);
  if(mp)return {erro:mp};
  if(n.pedido)return {erro:`Há um pedido de aprovação aberto para ${destinoNome(n.pedido.tipo,n.pedido.dest)}. Decida ou cancele antes.`};
  const pend=pendencias(t,tipo,dest).filter(x=>!x.ok);
  if(pend.some(x=>x.trava))return {bloq:true,pend,podeForcar:false};
  if(pend.length&&!o.forcar)return {bloq:true,pend,podeForcar:nivelDe(eu)>=2};
  const dados={...(o.dados||{}),forcado:pend.length?o.just:null};
  const ap=aprovExig(tipo,dest,eu);
  if(ap.niveis.length){
    n.pedido={id:uid(),tipo,dest,modo:ap.modo,por:eu,em:agora(),dados,niveis:ap.niveis.map((nv,i)=>({nivel:nv,ordem:ap.modo==='sequencia'?i+1:1,previsto:aprovadorPrevisto(eu,nv),status:'pendente'}))};
    log(t,`Pedido de aprovação: ${destinoNome(tipo,dest)} (${ap.niveis.map(x=>NIV_N[x]).join(ap.modo==='sequencia'?', depois ':' e ')})${dados.forcado?' · sem requisitos: '+dados.forcado:''}`);
    avisarAprovadores(t);return {pedido:true,msg:`Pedido enviado. Aguardando ${quemFalta(n.pedido)}.`}}
  executar(t,tipo,dest,dados);return {ok:true}}
function executar(t,tipo,dest,d){const n=t.neg,ev={em:agora(),user:me(),deEtapa:n.etapa,deSub:n.sub};n.trilha=n.trilha||[];
  if(tipo==='etapa'){const volta=SIDX(dest)<SIDX(n.etapa);n.etapa=dest;n.sub=subInicial(dest);n.desde=HOJE;n.subDesde=HOJE;ev.ev=volta?'retorno':'avanco';
    log(t,`${volta?'Voltou':'Avançou'} para ${SN(dest)}${n.sub?' · '+subN(n.sub):''}${d.forcado?' sem requisitos: '+d.forcado:''}${volta&&d.motivo?': '+d.motivo:''}`)}
  else if(tipo==='subetapa'){n.sub=dest;n.subDesde=HOJE;ev.ev='subetapa';log(t,`Subetapa: ${subN(dest)}${d.forcado?' sem requisitos: '+d.forcado:''}`)}
  else{n.status=dest;n.encerradoEm=HOJE;ev.ev={comprado:'compra',perdido:'perda',descartado:'descarte',stand_by:'stand_by'}[dest];
    if(dest==='comprado')Object.assign(n,{relato:d.relato,pontos:d.pontos});
    if(dest==='perdido'||dest==='descartado')Object.assign(n,{motivo:d.motivo,detalhe:d.detalhe});
    if(dest==='stand_by')Object.assign(n,{retomar:d.retomar,detalhe:d.detalhe});
    log(t,`Status: ${STATUS_N[dest]}${d.motivo?' · '+motivoN(dest,d.motivo):''}${dest==='stand_by'?' até '+fd(d.retomar):''}${d.forcado?' · sem requisitos: '+d.forcado:''}`)}
  Object.assign(ev,{paraEtapa:n.etapa,paraSub:n.sub,status:n.status});n.trilha.push(ev);
  if(t._parte){sincPrincipal(terrenoDe(t));return}
  if(tipo==='etapa')abrirPartes(t);
  if(tipo==='status'&&['perdido','descartado','stand_by'].includes(dest))encerrarPartes(t,dest,d);
  if(tipo==='status')abrirLiberadas(t)}
function decidir(t,aprovar,coment){const n=t.neg,p=n.pedido,eu=me();if(!p)return null;
  if(!naVez(p).some(r=>podeDecidir(r,eu)))return {erro:`Este pedido aguarda ${quemFalta(p)}.`};
  if(!aprovar){p.niveis.forEach(r=>{if(r.status==='pendente')r.status='cancelado'});n.pedido=null;
    log(t,`Pedido recusado: ${destinoNome(p.tipo,p.dest)} · ${coment}`);notificar(p.por,'aprovacao_decidida',`${eu} recusou ${destinoNome(p.tipo,p.dest)}: ${coment}`,t);return {ok:true,msg:'Pedido recusado.'}}
  /* quem está acima aprova também os níveis seguintes que alcança (diretor que aprova pelo gestor cobre os dois) */
  let mud=true;while(mud){mud=false;naVez(p).forEach(r=>{if(podeDecidir(r,eu)){Object.assign(r,{status:'aprovado',por:eu,em:agora(),coment});mud=true}})}
  if(p.niveis.every(r=>r.status==='aprovado')){n.pedido=null;log(t,`Aprovado: ${destinoNome(p.tipo,p.dest)}${coment?' · '+coment:''}`);
    executar(t,p.tipo,p.dest,p.dados);notificar(p.por,'aprovacao_decidida',`${eu} aprovou ${destinoNome(p.tipo,p.dest)}`,t);return {ok:true,msg:`Aprovado: ${destinoNome(p.tipo,p.dest)}.`}}
  log(t,`Aprovação de ${eu} registrada; falta ${quemFalta(p)}`);avisarAprovadores(t);return {ok:true,msg:`Aprovação registrada. Falta ${quemFalta(p)}.`}}
function cancelarPedido(t){const p=t.neg.pedido;if(!p)return;p.niveis.forEach(r=>{if(r.status==='pendente')r.status='cancelado'});t.neg.pedido=null;log(t,`Pedido de aprovação cancelado: ${destinoNome(p.tipo,p.dest)}`)}
/* retomar: o tempo parado não conta no prazo da etapa nem da subetapa */
function retomar(t){const n=t.neg,parado=n.encerradoEm?diff(n.encerradoEm,HOJE):0;
  n.status='ativo';n.desde=addD(n.desde,parado);n.subDesde=n.subDesde?addD(n.subDesde,parado):HOJE;n.retomar=null;n.encerradoEm=null;
  (n.trilha=n.trilha||[]).push({em:agora(),user:me(),ev:'retomada',deEtapa:n.etapa,deSub:n.sub,paraEtapa:n.etapa,paraSub:n.sub,status:'ativo'});log(t,'Negociação retomada');
  if(!t._parte)retomarPartes(t)}
/* kanban: para frente passa por cada etapa (só a última pode esperar aprovação); falhou uma, nada muda */
function levarAte(t,alvo,o={}){const snap=JSON.stringify(t.neg),h=t.hist.length,nt=S.notifs.length;
  const desfaz=()=>{t.neg=JSON.parse(snap);t.hist.length=h;S.notifs.splice(0,S.notifs.length-nt)};
  while(SIDX(t.neg.etapa)<SIDX(alvo)){const prox=STAGES[SIDX(t.neg.etapa)+1][0],ult=prox===alvo;
    if(!ult&&aprovExig('etapa',prox,me()).niveis.length){desfaz();return {erro:`${SN(prox)} pede aprovação. Leve uma etapa por vez.`}}
    const r=moverPara(t,'etapa',prox,o);
    if(r.bloq||r.erro){desfaz();return {...r,etapa:prox}}
    if(r.pedido)return r}
  return {ok:true}}

/* ---------- notificações (no banco: notificacoes, lembretes, rotina_diaria) ---------- */
function notificar(para,tipo,txt,t,chave){const c=cfg().notif[tipo];if(!para||!c||!c.ativo)return;
  if(!chave&&para===me())return;
  const k=chave?`${tipo}|${chave}|${para}`:null;if(k&&S.notifs.some(x=>x.chave===k))return;
  S.notifs.unshift({id:uid(),para,tipo,txt,tid:t?t.id:null,em:agora(),lida:false,chave:k,autor:chave?null:me()})}
function avisarAprovadores(t){const p=t.neg.pedido;if(!p)return;
  naVez(p).forEach(r=>{const dest=r.previsto?[r.previsto]:S.membros.filter(m=>NIVEL[m.papel]===r.nivel).map(m=>m.nome);
    dest.forEach(u=>notificar(u,'aprovacao_pendente',`${p.por} pede aprovação para ${destinoNome(p.tipo,p.dest)}`,t,p.id+':'+r.nivel))})}
const quando=d=>{const x=diff(HOJE,d);return x===0?'hoje':x===1?'amanhã':x>1?`em ${x} dias`:`há ${-x} dia${x<-1?'s':''}`};
/* rotina diária: prazos de tarefa, tarefa atrasada, subetapa estourada, retomada de stand by, documento vencendo, reunião */
function rotinaNotif(){const N=cfg().notif,dentro=(data,tipo)=>(N[tipo].dias||[]).filter(d=>data>=HOJE&&diff(HOJE,data)<=d);
  S.terrenos.forEach(t=>{
    abertas(t).forEach(k=>{if(k.prazo<HOJE)notificar(k.resp,'tarefa_atrasada',`Tarefa atrasada: ${k.titulo} (venceu ${fd(k.prazo)})`,t,k.id+':'+k.prazo);
      else dentro(k.prazo,'tarefa_prazo').forEach(d=>notificar(k.resp,'tarefa_prazo',`Tarefa vence ${quando(k.prazo)}: ${k.titulo}`,t,k.id+':'+k.prazo+':'+d))});
    const n=t.neg;if(!n)return;
    if(subAtrasada(n))notificar(t.resp,'subetapa_prazo',`${subN(n.sub)} passou do prazo de ${subCfg(n.sub).prazo} dias`,t,n.codigo+':'+n.sub+':'+n.subDesde);
    if(n.status==='stand_by'&&n.retomar)dentro(n.retomar,'stand_by_retomar').forEach(d=>notificar(t.resp,'stand_by_retomar',`Revisitar o stand by ${quando(n.retomar)}`,t,n.codigo+':'+n.retomar+':'+d));
    if(n.status!=='ativo')return;
    t.docs.forEach(d=>{const v=docVal(d);if(v)dentro(v,'documento_vencendo').forEach(x=>notificar(t.resp,'documento_vencendo',`${TIPOS_DOC[d.tipo][0]} vence ${quando(v)}`,t,d.tipo+':'+v+':'+x))});
    (t.reunioes||[]).filter(r=>r.status==='agendada').forEach(r=>dentro(r.data,'reuniao_agendada').forEach(x=>notificar(t.resp,'reuniao_agendada',`Reunião ${quando(r.data)}${r.hora?' às '+r.hora:''}`,t,r.id+':'+r.data+':'+x)))})}
/* tarefa criada ou editada: avisa o responsável e quem foi marcado */
function notifTarefa(t,k,antes){if(k.resp!==antes?.resp)notificar(k.resp,'tarefa_atribuida',`${me()} atribuiu a você: ${k.titulo}`,t);
  (k.marcados||[]).filter(u=>!(antes?.marcados||[]).includes(u)&&u!==k.resp).forEach(u=>notificar(u,'tarefa_marcado',`${me()} marcou você na tarefa: ${k.titulo}`,t))}
const minhasNotifs=()=>S.notifs.filter(x=>x.para===me());
let sinoAberto=false;
const IC_SINO='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg>';
function renderSino(){const el=document.getElementById('sino');if(!el)return;const L=minhasNotifs(),nl=L.filter(x=>!x.lida).length;
  el.innerHTML=`<button class="sino-btn" data-a="sino" aria-haspopup="true" aria-expanded="${sinoAberto}" aria-label="Notificações${nl?`, ${nl} não lidas`:''}" title="Notificações">${IC_SINO}${nl?`<span class="sino-n">${nl>9?'9+':nl}</span>`:''}</button>`+
  (sinoAberto?`<div class="sino-menu" role="dialog" aria-label="Notificações"><div class="sino-h"><span>Notificações</span>${nl?'<button class="linkbtn" data-a="notif-lidas">Marcar todas como lidas</button>':''}</div>
  <div class="sino-l">${L.slice(0,30).map(x=>{const t=x.tid?T(x.tid):null;return `<button class="sino-i ${x.lida?'':'nova'}" data-a="notif" data-v="${x.id}"><span class="sino-d"></span><span class="sino-c"><span class="sino-t">${esc(x.txt)}</span><span class="sino-s">${t?esc(t.codigo+' · '+t.nome)+' · ':''}${fd(x.em.slice(0,10))}${x.autor?' · '+esc(x.autor):''}</span></span></button>`}).join('')||'<div class="empty" style="padding:24px 16px">Nada por aqui.</div>'}</div>
  ${ehAdmin(me())?'<div class="sino-f"><button class="linkbtn" data-a="nav" data-r="config" data-cfg="notif">Configurar notificações</button></div>':''}</div>`:'')}

/* ---------- desenho: chip, linha do tempo, quadro de avanço ---------- */
function chipNeg(t){
  if(!t.neg)return '<span class="chip">Sem negociação</span>';
  const n=t.neg;
  if(n.status==='perdido')return `<span class="chip crit"><span class="d"></span>Perdido</span>`;
  if(n.status==='descartado')return `<span class="chip"><span class="d"></span>Descartado</span>`;
  if(n.status==='stand_by')return '<span class="chip warn"><span class="d"></span>Stand By</span>';
  if(n.status==='comprado')return '<span class="chip good"><span class="d"></span>Comprado</span>';
  return `<span class="chip fase">${SN(n.etapa)}</span>${n.sub?`<span class="chip sub ${subAtrasada(n)?'warn':''}">${esc(subN(n.sub))}</span>`:''}${n.pedido?'<span class="chip blue">Aguardando aprovação</span>':''}`}
/* entrada de cada etapa: última passagem para ela na trilha */
const entrouEm=(n,e)=>{const x=(n.trilha||[]).filter(v=>v.paraEtapa===e&&v.deEtapa!==e).pop();return x?x.em.slice(0,10):n.etapa===e?n.desde:null};
function linhaEtapas(t){const n=t.neg;if(!n)return '';const idx=SIDX(n.etapa),fim=n.status==='comprado';
  return `<nav class="tl-topo" aria-label="Etapas da negociação"><ol class="stepper">${STAGES.map((s,i)=>{const st=i<idx||fim?'done':i===idx?'cur':'fut',em=i<=idx?entrouEm(n,s[0]):null;
    return `<li class="step ${st}" ${i===idx&&!fim?'aria-current="step"':''}><span class="dot">${st==='done'?ic('check',14):i+1}</span><span class="sl-w"><span class="sl" title="${esc(s[1])}">${esc(s[1])}</span>${em?`<span class="sd">${st==='cur'&&n.sub?esc(subN(n.sub))+' · ':''}${fd(em)}</span>`:''}</span></li>`}).join('')}${fim?`<li class="step done"><span class="dot">${ic('check',14)}</span><span class="sl-w"><span class="sl">Comprado</span><span class="sd">${fd(n.encerradoEm)}</span></span></li>`:''}</ol></nav>`}
/* trilha com datas: tempo em cada etapa e subetapa (no banco: v_periodos_processo, v_tempo_subetapas) */
function trilhaHtml(t){const n=t.neg;if(!n)return '';const ev=(n.trilha||[]).slice().sort((a,b)=>a.em.localeCompare(b.em));
  const per=[];ev.forEach((x,i)=>{const fim=ev[i+1]?ev[i+1].em.slice(0,10):n.status==='ativo'?HOJE:null;if(x.status!=='ativo')return;per.push({e:x.paraEtapa,s:x.paraSub,ini:x.em.slice(0,10),fim,user:x.user,ev:x.ev})});
  const porEtapa=STAGES.map(([k,l])=>{const ps=per.filter(p=>p.e===k);if(!ps.length)return '';const dias=ps.reduce((a,p)=>a+(p.fim?diff(p.ini,p.fim):0),0),c=etapaCfg(k);
    return `<li class="tr-e"><div class="tr-eh"><b>${esc(l)}</b><span class="faint">${fd(ps[0].ini)} · ${dias} d${c?.sla?` de ${c.sla}`:''}</span>${c?.sla&&dias>c.sla?'<span class="chip warn">acima do SLA</span>':''}</div><ul>${ps.map(p=>`<li><span>${esc(subN(p.s)||'—')}</span><span class="faint">${fd(p.ini)}${p.fim?' → '+fd(p.fim):''} · ${p.fim?diff(p.ini,p.fim)+' d':''} · ${esc(p.user||'')}</span></li>`).join('')}</ul></li>`}).join('');
  const enc=n.status!=='ativo'?`<li class="tr-e"><div class="tr-eh"><b>${STATUS_N[n.status]}</b><span class="faint">${fd(n.encerradoEm)}</span></div></li>`:'';
  return `<section class="sec"><div class="sec-h"><h2>Linha do tempo</h2><span class="faint" style="font-size:13px">Tempo em cada etapa e subetapa</span></div><div class="sec-b"><ol class="trilha">${porEtapa}${enc}</ol></div></section>`}

/* ---------- relato com formatação (Comprado) ---------- */
function limpaHtml(h){const tpl=document.createElement('template');tpl.innerHTML=String(h||'');const OK=['B','STRONG','I','EM','U','UL','OL','LI','BR','P','DIV'];
  const limpa=no=>{[...no.childNodes].forEach(c=>{if(c.nodeType===1){if(!OK.includes(c.tagName)){limpa(c);c.replaceWith(...c.childNodes);return}[...c.attributes].forEach(a=>c.removeAttribute(a.name));limpa(c)}else if(c.nodeType!==3)c.remove()})};
  limpa(tpl.content);return tpl.innerHTML}
const textoDe=h=>{const d=document.createElement('div');d.innerHTML=limpaHtml(h);return d.textContent.trim()};

function soltar(id,col){if(col.startsWith('fe:')){soltarProc(id,col.slice(3));return}const t=T(id);if(!t||!t.neg||UI.role==='Leitura')return;const n=t.neg;
  if(col==='stand_by'){if(n.status==='ativo'){UI.alvo=id;UI.modal='suspender';renderModal()}return}
  if(col.startsWith('sub:')){const k=col.slice(4);if(!k||n.status!=='ativo'||n.sub===k)return;tentar(t,'subetapa',k);return}
  if(n.status==='stand_by'){retomar(t);if(n.etapa===col){save();render();toast('Negociação retomada.');return}}
  if(n.status!=='ativo'||n.etapa===col){save();render();return}
  if(SIDX(col)<SIDX(n.etapa)){save();render();UI.alvo=id;UI.alvoEtapa=col;UI.modal='retornar';renderModal();return}
  const res=levarAte(t,col);save();render();
  if(res.ok){toast(`${t.nome}: ${SN(col)}.`);return}
  if(res.pedido){toast(res.msg);return}
  if(res.bloq){UI.acao={tid:id,tipo:'etapa',dest:col,pend:res.pend.map(x=>x.txt),items:res.pend};UI.alvo=id;UI.modal=res.podeForcar?'forcar':'adv-bloq';renderModal();return}
  toast(res.erro,true)}
/* tenta a passagem; bloqueada abre a justificativa (gestor/diretor) ou a lista do que falta */
function tentar(t,tipo,dest,dados){const r=moverPara(t,tipo,dest,{dados});save();render();
  if(r.ok){toast(`${t.nome}: ${destinoNome(tipo,dest)}.`);return r}
  if(r.pedido){toast(r.msg);return r}
  if(r.bloq){UI.acao={tid:t.id,tipo,dest,dados,pend:r.pend.map(x=>x.txt),items:r.pend};UI.alvo=t.id;UI.modal=r.podeForcar?'forcar':'adv-bloq';renderModal();return r}
  toast(r.erro,true);return r}

function setPath(o,p,v){const k=p.split('.');let x=o;k.slice(0,-1).forEach(c=>{x=x[c]});x[k[k.length-1]]=v}
/* pré-requisito: sem ciclo, sem exigir subetapa de etapa posterior, subetapa inicial não exige irmã */
function validaPre(alvoTipo,alvo,req){const C=cfg(),rs=subCfg(req);if(!rs)return 'Subetapa inválida.';
  const eAlvo=alvoTipo==='etapa'?alvo:subCfg(alvo)?.etapa;
  if(alvoTipo==='subetapa'&&alvo===req)return 'Uma subetapa não pode exigir ela mesma.';
  if(SIDX(rs.etapa)>SIDX(eAlvo)||(alvoTipo==='etapa'&&rs.etapa===alvo))return `${rs.nome} fica depois (ou dentro) de ${destinoNome(alvoTipo,alvo)}.`;
  if(alvoTipo==='subetapa'&&rs.etapa===eAlvo&&subInicial(eAlvo)===alvo)return `${subN(alvo)} é a subetapa inicial: o card entra nela direto.`;
  if(C.prereq.some(p=>p.alvoTipo===alvoTipo&&p.alvo===alvo&&p.req===req))return 'Essa regra já existe.';
  const exige=(s,vis=new Set())=>{if(vis.has(s))return false;vis.add(s);return C.prereq.filter(p=>p.alvoTipo==='subetapa'&&p.alvo===s).some(p=>p.req===alvo||exige(p.req,vis))};
  if(alvoTipo==='subetapa'&&exige(req))return 'Criaria um ciclo de pré-requisitos.';
  return null}
function validaEquipe(){const M=S.membros;if(!M.some(m=>m.admin))return 'A empresa precisa de pelo menos um administrador.';
  for(const m of M){if(m.sup){const s=M.find(x=>x.nome===m.sup);if(!s||NIVEL[s.papel]!==NIVEL[m.papel]+1)return `${m.nome}: o superior precisa estar um nível acima.`}}return null}

function funilChange(el){
