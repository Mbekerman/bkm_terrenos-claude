[project]
name = "coletar"
version = "0.1.0"
description = "Coletor do monitor de mercado da BKM"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "openpyxl>=3.1"]

[project.optional-dependencies]
teste = ["pytest>=8", "psycopg[binary]>=3.2"]

[project.scripts]
coletar = "coletar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coletar*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
